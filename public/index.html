  );
}

// ─── Local Keywords (Focus/Tracked list + history scrubber) ───
// trackedKeywords entries: {id, keyword, category:'focus'|'tracked', gridSize, radiusMiles, device, addedAt}
// Auto-migrated once from distinct client.rankMaps keywords (category defaults to 'focus') the
// first time this section mounts for a client that predates this feature.
function parsePct(s){if(s===undefined||s===null)return null;const n=parseFloat(String(s).replace('%',''));return isNaN(n)?null:n}

function AddKeywordModal({open,onClose,onAdd}){
  const [keyword,setKeyword]=useState('');
  const [category,setCategory]=useState('focus');
  const [gridSize,setGridSize]=useState(5);
  const [radiusMiles,setRadiusMiles]=useState('2');
  const [device,setDevice]=useState('mobile');
  const submit=()=>{
    if(!keyword.trim())return;
    onAdd({id:uid(),keyword:keyword.trim(),category,gridSize,radiusMiles:Number(radiusMiles)||2,device,addedAt:Date.now()});
    setKeyword('');setCategory('focus');
    onClose();
  };
  return(
    <Modal open={open} onClose={onClose} title="Add Keyword to Track">
      <div className="space-y-3 font-manrope">
        <div>
          <label className="text-xs text-muted-stone">Keyword</label>
          <input value={keyword} onChange={e=>setKeyword(e.target.value)} placeholder="e.g. tree removal prosper tx" className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none"/>
        </div>
        <div>
          <label className="text-xs text-muted-stone">Category</label>
          <div className="flex gap-2 mt-1">
            <button type="button" onClick={()=>setCategory('focus')} className={`touch-target flex-1 px-3 py-2 rounded-xl text-sm font-medium border ${category==='focus'?'bg-brand text-white border-brand':'border-glass-border text-muted-stone'}`}>Focus</button>
            <button type="button" onClick={()=>setCategory('tracked')} className={`touch-target flex-1 px-3 py-2 rounded-xl text-sm font-medium border ${category==='tracked'?'bg-brand text-white border-brand':'border-glass-border text-muted-stone'}`}>Tracked</button>
          </div>
        </div>
        <div className="grid grid-cols-3 gap-3">
          <div>
            <label className="text-xs text-muted-stone">Grid size</label>
            <select value={gridSize} onChange={e=>setGridSize(Number(e.target.value))} className="touch-target w-full mt-1 px-2 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none">
              {[3,5,7,9,11,13].map(n=><option key={n} value={n}>{n}×{n}</option>)}
            </select>
          </div>
          <div>
            <label className="text-xs text-muted-stone">Radius (mi)</label>
            <input type="number" min="0.25" step="0.25" value={radiusMiles} onChange={e=>setRadiusMiles(e.target.value)} className="touch-target w-full mt-1 px-2 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none"/>
          </div>
          <div>
            <label className="text-xs text-muted-stone">Device</label>
            <select value={device} onChange={e=>setDevice(e.target.value)} className="touch-target w-full mt-1 px-2 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none">
              <option value="mobile">Mobile</option>
              <option value="desktop">Desktop</option>
            </select>
          </div>
        </div>
        <p className="text-[11px] text-muted-stone">Adding a keyword doesn't run a scan or spend anything — it just starts tracking. Run a scan from the keyword's history panel whenever you're ready.</p>
        <button onClick={submit} disabled={!keyword.trim()} className="touch-target w-full py-2.5 bg-brand text-white rounded-xl hover:bg-brand-hover font-medium shadow-lg shadow-brand/20 disabled:opacity-50">Add Keyword</button>
      </div>
    </Modal>
  );
}

function KeywordHistoryPanel({client,setData,kw,snapshots}){
  const [running,setRunning]=useState(false);
  const [runError,setRunError]=useState('');
  const [selectedId,setSelectedId]=useState(snapshots[0]?.id||null);
  const scrollRef=useRef(null);
  const cardRefs=useRef({});
  const selected=snapshots.find(s=>s.id===selectedId)||snapshots[0];
  const selectedIndex=Math.max(0,snapshots.findIndex(s=>s.id===selectedId));

  const runNow=async()=>{
    if(!client.placeId||!client.geo){setRunError('Look up the business location first (above).');return}
    setRunning(true);setRunError('');
    const res=await generateLiveHeatMap({client,setData,keyword:kw.keyword,gridSize:kw.gridSize||5,radiusMiles:kw.radiusMiles||2,device:kw.device||'mobile'});
    if(!res.ok)setRunError(res.error);
    setRunning(false);
  };

  const scrubTo=(idx)=>{
    const s=snapshots[idx];
    if(!s)return;
    setSelectedId(s.id);
    const el=cardRefs.current[s.id];
    if(el&&scrollRef.current)el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  };

  return(
    <div className="mt-3 pt-3 border-t border-glass-border space-y-3">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <h5 className="text-[11px] font-semibold text-muted-stone uppercase tracking-widest">History</h5>
        <div className="flex items-center gap-2">
          <button onClick={runNow} disabled={running} className="touch-target px-3 py-1.5 bg-brand text-white rounded-lg text-xs font-medium hover:bg-brand-hover disabled:opacity-50">{running?'Submitting...':'Run Now'}</button>
        </div>
      </div>
      {runError&&<div className="bg-red-50 text-red-700 rounded-xl p-2 text-xs">{runError}</div>}

      {snapshots.length===0?(
        <p className="text-xs text-muted-stone">No scans yet for this keyword. Click Run Now to generate the first one.</p>
      ):(
        <>
          <div ref={scrollRef} className="flex gap-2 overflow-x-auto pb-2 -mx-1 px-1">
            {snapshots.map((s,i)=>(
              <button key={s.id} ref={el=>cardRefs.current[s.id]=el} onClick={()=>setSelectedId(s.id)} className={`flex-shrink-0 w-32 rounded-xl p-2 text-left border transition-colors ${selectedId===s.id?'border-brand bg-brand/5':'border-glass-border hover:border-brand/40'}`}>
                <div className="flex items-center justify-between mb-1">
                  <span className="text-[10px] text-muted-stone">{fmt(s.snapshotDate)}</span>
                  {i===0&&<span className="text-[9px] font-bold text-brand bg-brand/10 px-1 rounded">LATEST</span>}
                </div>
                <div className="flex items-center justify-center py-1"><MiniHeatDots grid={s.grid} size={36}/></div>
                <div className="flex items-center justify-between text-[10px]">
                  <span className="font-bold text-brand-dark">{s.solv||'—'}</span>
                  <span className="text-muted-stone">Avg {s.avgRank||'—'}</span>
                </div>
              </button>
            ))}
          </div>
          {snapshots.length>1&&(
            <input type="range" min="0" max={snapshots.length-1} value={selectedIndex} onChange={e=>scrubTo(Number(e.target.value))} className="w-full accent-[var(--color-primary,#b45309)]"/>
          )}
          {selected&&selected.status==='complete'&&(
            <RankMapDetail snapshot={selected} client={client}/>
          )}
        </>
      )}
    </div>
  );
}

function KeywordRow({client,setData,kw,snapshots,onMove,onRemove,expanded,onToggleExpand,dragHandlers}){
  const latest=snapshots[0];
  const prev=snapshots[1];
  const [menuOpen,setMenuOpen]=useState(false);
  const latestSolv=parsePct(latest?.solv);
  const prevSolv=parsePct(prev?.solv);
  const solvChange=(latestSolv!==null&&prevSolv!==null)?parseFloat((latestSolv-prevSolv).toFixed(1)):null;
  const rankChange=(latest?.avgRank&&prev?.avgRank)?parseFloat((prev.avgRank-latest.avgRank).toFixed(1)):null; // positive = rank improved (lower number)

  // no overflow-hidden on the card below — it was clipping the absolutely-
  // positioned 3-dot dropdown menu, making it look glitched/half-invisible
  return(
    <div className="stitch-glass-card rounded-[18px]" draggable onDragStart={e=>dragHandlers.onDragStart(e,kw.id)}>
      <div className="flex items-center gap-3 p-3 cursor-move">
        <MiniHeatDots grid={latest?.grid} size={36}/>
        <div className="flex-1 min-w-0 cursor-pointer" onClick={onToggleExpand}>
          <div className="flex items-center gap-2">
            <p className="text-sm font-bold text-brand-dark truncate">{kw.keyword}</p>
            <span className={`text-[9px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded-full flex-shrink-0 ${kw.category==='focus'?'bg-brand/15 text-brand-dark':'bg-black/5 text-muted-stone'}`}>{kw.category}</span>
          </div>
          <p className="text-[11px] text-muted-stone mt-0.5">{latest?`Last scan: ${fmt(latest.snapshotDate)}`:'Last scan: never'}</p>
        </div>
        <div className="flex items-center gap-3 flex-shrink-0 text-right">
          <div>
            <p className="text-sm font-bold text-brand-dark">{latest?.solv||'—'}</p>
            {solvChange!==null&&solvChange!==0&&<p className={`text-[10px] font-bold ${solvChange>0?'text-green-600':'text-red-600'}`}>{solvChange>0?'↑':'↓'}{Math.abs(solvChange)}%</p>}
            <p className="text-[9px] text-muted-stone uppercase tracking-wide">Vis</p>
          </div>
          <div>
            <p className="text-sm font-bold text-brand-dark">{latest?.avgRank||'—'}</p>
            {rankChange!==null&&rankChange!==0&&<p className={`text-[10px] font-bold ${rankChange>0?'text-green-600':'text-red-600'}`}>{rankChange>0?'↑':'↓'}{Math.abs(rankChange)}</p>}
            <p className="text-[9px] text-muted-stone uppercase tracking-wide">Rank</p>
          </div>
          <div className="relative">
            <button onClick={()=>setMenuOpen(o=>!o)} className="touch-target flex items-center justify-center w-8 h-8 rounded-full hover:bg-black/5 text-muted-stone"><span className="material-symbols-outlined text-[18px]">more_vert</span></button>
            {menuOpen&&(
              <div className="absolute right-0 top-9 z-10 bg-white rounded-xl shadow-lg border border-glass-border py-1 w-44 text-sm">
                <button onClick={()=>{onMove(kw.category==='focus'?'tracked':'focus');setMenuOpen(false)}} className="w-full text-left px-3 py-2 hover:bg-black/5">Move to {kw.category==='focus'?'Tracked':'Focus'}</button>
                <button onClick={()=>{if(confirm('Stop tracking this keyword? Past scan history is kept.'))onRemove();setMenuOpen(false)}} className="w-full text-left px-3 py-2 hover:bg-black/5 text-red-500">Remove from tracking</button>
              </div>
            )}
          </div>
          <button onClick={onToggleExpand} className="touch-target flex items-center justify-center w-8 h-8 rounded-full hover:bg-black/5 text-muted-stone"><span className={`material-symbols-outlined text-[18px] transition-transform ${expanded?'rotate-180':''}`}>expand_more</span></button>
        </div>
      </div>
    </div>
  );
}

function KeywordDropZone({title,items,client,setData,keywordSnapshots,expandedId,setExpandedId,onMove,onRemove,dragHandlers,isOver,onDragOver,onDragLeave,onDrop}){
  return(
    <div onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={onDrop} className={`rounded-[20px] p-1 transition-colors ${isOver?'bg-brand/5 ring-2 ring-brand/30':''}`}>
      <h5 className="text-[11px] font-semibold text-muted-stone uppercase tracking-widest px-2 mb-2">{title} ({items.length})</h5>
      {items.length===0?(
        <div className="text-xs text-muted-stone px-2 py-4 text-center border border-dashed border-glass-border rounded-xl">Drag keywords here</div>
      ):(
        <div className="space-y-2">
          {items.map(kw=>(
            <KeywordRow key={kw.id} client={client} setData={setData} kw={kw} snapshots={keywordSnapshots(kw)}
              onMove={cat=>onMove(kw.id,cat)} onRemove={()=>onRemove(kw.id)}
              expanded={expandedId===kw.id} onToggleExpand={()=>setExpandedId(expandedId===kw.id?null:kw.id)}
              dragHandlers={dragHandlers}/>
          ))}
        </div>
      )}
    </div>
  );
}

function LocalKeywordsSection({client,setData}){
  const rankMaps=client.rankMaps||[];
  const [addOpen,setAddOpen]=useState(false);
  const [expandedId,setExpandedId]=useState(null);
  const [draggedId,setDraggedId]=useState(null);
  const [dragOverZone,setDragOverZone]=useState(null);

  useEffect(()=>{
    if(client.trackedKeywords)return;
    const seen=new Set();
    const initial=[];
    rankMaps.forEach(m=>{
      const kw=m.keyword?.trim();
      if(!kw||kw.toLowerCase()==='unknown')return;
      const key=kw.toLowerCase();
      if(seen.has(key))return;
      seen.add(key);
      initial.push({id:uid(),keyword:kw,category:'focus',gridSize:m.gridSize||5,radiusMiles:m.radiusMiles||2,device:m.device||'mobile',addedAt:Date.now()});
    });
    setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>c.id===client.id?{...c,trackedKeywords:initial}:c)};saveData(nd);return nd});
  },[client.id]); // eslint-disable-line

  const tracked=client.trackedKeywords;
  if(!tracked)return null; // migration effect hasn't written yet — avoids a one-frame empty flash

  const keywordSnapshots=(kw)=>{
    const key=kw.keyword.toLowerCase();
    return rankMaps.filter(m=>m.keyword?.toLowerCase().trim()===key&&m.status!=='pending')
      .sort((a,b)=>(b.snapshotDate||b.uploadedAt||'').localeCompare(a.snapshotDate||a.uploadedAt||''));
  };

  const updateTracked=(next)=>{
    setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>c.id===client.id?{...c,trackedKeywords:next}:c)};saveData(nd);return nd});
  };
  const moveCategory=(id,category)=>updateTracked(tracked.map(k=>k.id===id?{...k,category}:k));
  const removeKeyword=(id)=>updateTracked(tracked.filter(k=>k.id!==id));
  const addKeyword=(entry)=>updateTracked([entry,...tracked]);

  const dragHandlers={
    onDragStart:(e,id)=>{setDraggedId(id);e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',id)}catch(err){}},
  };
  const zoneHandlers=(zoneKey,category)=>({
    isOver:dragOverZone===zoneKey,
    onDragOver:e=>{e.preventDefault();e.dataTransfer.dropEffect='move';if(dragOverZone!==zoneKey)setDragOverZone(zoneKey)},
    onDragLeave:()=>setDragOverZone(null),
    onDrop:e=>{
      e.preventDefault();
      const id=draggedId||e.dataTransfer.getData('text/plain');
      if(id)moveCategory(id,category);
      setDraggedId(null);setDragOverZone(null);
    },
  });

  const focusItems=tracked.filter(k=>k.category==='focus');
  const trackedItems=tracked.filter(k=>k.category==='tracked');
  const expandedKw=expandedId?tracked.find(k=>k.id===expandedId):null;

  return(
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <div>
          <h3 className="text-xl font-bold text-brand-dark mb-1">Local Keywords</h3>
          <p className="text-sm text-muted-stone">Real Google local-pack rankings, tracked over time</p>
        </div>
        <button onClick={()=>setAddOpen(true)} className="touch-target px-4 py-2 bg-brand text-white rounded-xl text-sm font-medium hover:bg-brand-hover shadow-lg shadow-brand/20 flex items-center gap-1.5"><span className="material-symbols-outlined text-[18px]">add</span>Add Keyword</button>
      </div>

      {tracked.length===0?(
        <div className="stitch-glass-card rounded-[24px] p-8 text-center">
          <span className="material-symbols-outlined text-4xl text-brand mb-2">trending_up</span>
          <h4 className="font-bold text-brand-dark">No keywords tracked yet</h4>
          <p className="text-sm text-muted-stone mt-1">Add a keyword to start tracking real local-pack rankings</p>
        </div>
      ):(
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <KeywordDropZone title="Focus Keywords" items={focusItems} client={client} setData={setData} keywordSnapshots={keywordSnapshots}
            expandedId={expandedId} setExpandedId={setExpandedId} onMove={moveCategory} onRemove={removeKeyword}
            dragHandlers={dragHandlers} {...zoneHandlers('focus','focus')}/>
          <KeywordDropZone title="Tracked Keywords" items={trackedItems} client={client} setData={setData} keywordSnapshots={keywordSnapshots}
            expandedId={expandedId} setExpandedId={setExpandedId} onMove={moveCategory} onRemove={removeKeyword}
            dragHandlers={dragHandlers} {...zoneHandlers('tracked','tracked')}/>
        </div>
      )}

      {/* Rendered full-width BELOW the two-column Focus/Tracked grid (not
      inline inside whichever column the row lives in) — a keyword's map +
      competitor panel needs the whole page's width to be usable; squeezed
      into a single ~50%-width column it was too small to read. */}
      {expandedKw&&(
        <div className="stitch-glass-card rounded-[20px] p-4">
          <div className="flex items-center justify-between mb-3">
            <div>
              <h4 className="font-bold text-brand-dark">{expandedKw.keyword}</h4>
              <span className={`text-[9px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded-full ${expandedKw.category==='focus'?'bg-brand/15 text-brand-dark':'bg-black/5 text-muted-stone'}`}>{expandedKw.category}</span>
            </div>
            <button onClick={()=>setExpandedId(null)} className="touch-target flex items-center justify-center w-8 h-8 rounded-full hover:bg-black/5 text-muted-stone" title="Close"><span className="material-symbols-outlined text-[18px]">close</span></button>
          </div>
          <KeywordHistoryPanel client={client} setData={setData} kw={expandedKw} snapshots={keywordSnapshots(expandedKw)}/>
        </div>
      )}

      <AddKeywordModal open={addOpen} onClose={()=>setAddOpen(false)} onAdd={addKeyword}/>
    </div>
  );
}

// ─── Rankings Tab ───
function RankingsTab({client,setData}){
  const rankColor=(r)=>{if(!r||r<=0)return'text-gray-400';if(r<=3)return'text-green-600';if(r<=7)return'text-yellow-600';if(r<=12)return'text-orange-600';return'text-red-600'};

  // Legacy manual rankData that predates rank maps entirely — kept as its own
  // read-only strip since it has no grid/history to plug into the new list.
  const trackedKws=new Set((client.trackedKeywords||[]).map(k=>k.keyword.toLowerCase()));
  const manualRanks=(client.rankData||[]).filter(r=>!trackedKws.has(r.keyword.toLowerCase()));

  return(
    <div className="fade-in space-y-6">
      <LocalKeywordsSection client={client} setData={setData}/>

      {/* Legacy manual rankings — same horizontal-bar-per-row pattern used
      elsewhere in the app for at-a-glance progress (task completion, GBP
      completeness, etc.) instead of the old grid of separate number cards. */}
      {manualRanks.length>0&&(
        <div>
          <h4 className="text-[11px] font-semibold text-muted-stone uppercase tracking-widest mb-2">Manual Rankings (legacy)</h4>
          <div className="stitch-glass-card rounded-[20px] p-4 space-y-4">
            {manualRanks.map(r=>{
              const pct=Math.max(4,Math.min(100,Math.round((21-Math.min(r.avgRank,20))/20*100)));
              const barColor=r.avgRank<=3?'#16a34a':r.avgRank<=7?'#ca8a04':r.avgRank<=12?'#ea580c':'#dc2626';
              return(
                <div key={r.id}>
                  <div className="flex items-center justify-between mb-1 gap-2">
                    <p className="text-sm font-medium text-deep-obsidian/85 truncate">{r.keyword} <span className="text-xs text-muted-stone font-normal">(manual)</span></p>
                    <span className={`text-sm font-bold flex-shrink-0 ${rankColor(r.avgRank)}`}>#{r.avgRank}</span>
                  </div>
                  <div className="w-full h-3 bg-black/5 rounded-full overflow-hidden"><div className="h-full rounded-full transition-all duration-500" style={{width:pct+'%',background:barColor}}/></div>
                  <div className="flex items-center justify-between mt-1 flex-wrap gap-x-3">
                    <span className="text-[11px] text-muted-stone">Range {r.range} · Volume {r.solv}</span>
                    <span className="text-[11px] text-muted-stone">Updated {fmt(r.date)}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Divider */}
      <div className="border-t border-glass-border pt-6">
        <RankMapsSection client={client} setData={setData}/>
      </div>
    </div>
  );
}

// ─── Settings Tab ───
function SettingsTab({client,setData}){
  const [indexingLoading,setIndexingLoading]=useState(false);
  const [indexingResult,setIndexingResult]=useState(null);
  const [indexingError,setIndexingError]=useState('');
  const [connStatus,setConnStatus]=useState(null); // null=checking/unknown, else the /api/indexing-status response
  const [connChecking,setConnChecking]=useState(false);
  const [local,setLocal]=useState(()=>({name:client.name||'',website:client.website||'',gbpUrl:client.gbpUrl||'',phone:client.phone||'',primaryCategory:client.primaryCategory||'',address:client.address||'',city:client.city||'',state:client.state||'',notes:client.notes||'',ghlLocationId:client.ghlLocationId||'',ghlPrivateToken:client.ghlPrivateToken||''}));
  const [localScores,setLocalScores]=useState(()=>JSON.parse(JSON.stringify(client.scores||{gbpHealth:{current:0,projected:0},landingPage:{current:0},core30:{current:0,total:0}})));
  const [localPub,setLocalPub]=useState(()=>({repo:client.publishing?.repo||'',branch:client.publishing?.branch||'',pagesDir:client.publishing?.pagesDir||'src/pages',buildHook:client.publishing?.buildHook||''}));
  const prevId=useRef(client.id);
  useEffect(()=>{if(prevId.current!==client.id){setLocal({name:client.name||'',website:client.website||'',gbpUrl:client.gbpUrl||'',phone:client.phone||'',primaryCategory:client.primaryCategory||'',address:client.address||'',city:client.city||'',state:client.state||'',notes:client.notes||'',ghlLocationId:client.ghlLocationId||'',ghlPrivateToken:client.ghlPrivateToken||''});setLocalScores(JSON.parse(JSON.stringify(client.scores||{})));setLocalPub({repo:client.publishing?.repo||'',branch:client.publishing?.branch||'',pagesDir:client.publishing?.pagesDir||'src/pages',buildHook:client.publishing?.buildHook||''});prevId.current=client.id}},[client.id]);
  const debRef=useRef(null);
  const update=(field,value)=>{
    setLocal(prev=>({...prev,[field]:value}));
    if(debRef.current)clearTimeout(debRef.current);
    debRef.current=setTimeout(()=>{
      setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>c.id===client.id?{...c,[field]:value}:c)};saveData(nd);return nd});
    },800);
  };
  const scoreDebRef=useRef(null);
  const updateScore=(path,value)=>{
    const parts=path.split('.');
    setLocalScores(prev=>{const ns=JSON.parse(JSON.stringify(prev));if(parts.length===2)ns[parts[0]][parts[1]]=Number(value)||0;return ns});
    if(scoreDebRef.current)clearTimeout(scoreDebRef.current);
    scoreDebRef.current=setTimeout(()=>{
      setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>{if(c.id!==client.id)return c;const scores=JSON.parse(JSON.stringify(c.scores));if(parts.length===2)scores[parts[0]][parts[1]]=Number(value)||0;return{...c,scores}})};saveData(nd);return nd});
    },800);
  };
  const pubDebRef=useRef(null);
  const updatePublishing=(field,value)=>{
    setLocalPub(prev=>({...prev,[field]:value}));
    if(pubDebRef.current)clearTimeout(pubDebRef.current);
    pubDebRef.current=setTimeout(()=>{
      setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>c.id===client.id?{...c,publishing:{...(c.publishing||{}),[field]:value}}:c)};saveData(nd);return nd});
    },800);
  };
  const checkConnection=async(repo,branch)=>{
    if(!repo){setConnStatus(null);return}
    setConnChecking(true);
    try{
      const r=await fetch(`/api/indexing-status?repo=${encodeURIComponent(repo)}&branch=${encodeURIComponent(branch||'main')}`,{headers:await authHeaders()});
      const j=await r.json();
      setConnStatus(r.ok?j:{connected:false,reason:j.error||'Check failed'});
    }catch(e){setConnStatus({connected:false,reason:'Network error checking connection.'})}
    setConnChecking(false);
  };
  // Check connection status for the SAVED repo (not every keystroke) whenever we land on a client.
  useEffect(()=>{checkConnection(client.publishing?.repo,client.publishing?.branch)},[client.id,client.publishing?.repo,client.publishing?.branch]);

  const enableIndexing=async()=>{
    if(!localPub.repo){setIndexingError('Fill in the GitHub repo field first.');return}
    setIndexingLoading(true);setIndexingError('');setIndexingResult(null);
    try{
      const r=await fetch('/api/enable-indexing-automation',{method:'POST',headers:await authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({repo:localPub.repo,branch:localPub.branch||'main'})});
      const j=await r.json();
      if(!r.ok||j.error)setIndexingError(j.error||'Request failed');
      else{setIndexingResult(j);checkConnection(localPub.repo,localPub.branch)}
    }catch(e){setIndexingError('Network error enabling auto-indexing.')}
    setIndexingLoading(false);
  };
  const exportClient=()=>{const blob=new Blob([JSON.stringify(client,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${client.name.replace(/\s+/g,'-').toLowerCase()}-export.json`;a.click()};
  const deleteClient=()=>{if(!confirm(`Delete ${client.name}? This cannot be undone.`))return;setData(prev=>{const nd={...prev,clients:prev.clients.filter(c=>c.id!==client.id)};saveData(nd);return nd})};
  return(
    <div className="fade-in font-manrope">
      <h3 className="text-xl font-bold text-brand-dark mb-4">Client Settings</h3>
      <div className="stitch-glass-card rounded-[24px] p-6 mb-4"><h4 className="text-lg font-semibold text-brand-dark mb-3">Client Info</h4><div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div><label className="text-sm font-medium text-deep-obsidian/70">Name</label><input value={local.name||''} onChange={e=>update('name',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/></div>
        <div><label className="text-sm font-medium text-deep-obsidian/70">Website</label><input value={local.website||''} onChange={e=>update('website',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/></div>
        <div><label className="text-sm font-medium text-deep-obsidian/70">GBP URL</label><input value={local.gbpUrl||''} onChange={e=>update('gbpUrl',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/></div>
        <div><label className="text-sm font-medium text-deep-obsidian/70">Phone</label><input value={local.phone||''} onChange={e=>update('phone',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/></div>
        <div><label className="text-sm font-medium text-deep-obsidian/70">Primary Category</label><input value={local.primaryCategory||''} onChange={e=>update('primaryCategory',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/></div>
        <div><label className="text-sm font-medium text-deep-obsidian/70">Address</label><input value={local.address||''} onChange={e=>update('address',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/></div>
        <div><label className="text-sm font-medium text-deep-obsidian/70">City</label><input value={local.city||''} onChange={e=>update('city',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/></div>
        <div><label className="text-sm font-medium text-deep-obsidian/70">State</label><input value={local.state||''} onChange={e=>update('state',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/></div>
        <div><label className="text-sm font-medium text-deep-obsidian/70">GHL Location ID</label><input value={local.ghlLocationId||''} onChange={e=>update('ghlLocationId',e.target.value)} placeholder="This client's GoHighLevel sub-account ID" className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/></div>
        <div><label className="text-sm font-medium text-deep-obsidian/70">GHL Private Integration Token</label><input type="password" value={local.ghlPrivateToken||''} onChange={e=>update('ghlPrivateToken',e.target.value)} placeholder="Token generated inside THIS client's own GHL sub-account" className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/><p className="text-[11px] text-muted-stone mt-1">Both fields enable the Website Leads card. The token must come from inside this client's own sub-account (Settings → Private Integrations there, not the Agency view) with the "Forms" scope checked — GHL's forms.readonly scope only exists at the sub-account level.</p></div>
      </div><div className="mt-3"><label className="text-sm font-medium text-deep-obsidian/70">Notes</label><textarea value={local.notes||''} onChange={e=>update('notes',e.target.value)} className="w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" rows="3"/></div></div>
      <div className="stitch-glass-card rounded-[24px] p-6 mb-4"><h4 className="text-lg font-semibold text-brand-dark mb-3">Scores</h4><div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3"><div><label className="text-xs text-muted-stone">GBP Current</label><input type="number" value={localScores.gbpHealth?.current||0} onChange={e=>updateScore('gbpHealth.current',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/></div><div><label className="text-xs text-muted-stone">GBP Projected</label><input type="number" value={localScores.gbpHealth?.projected||0} onChange={e=>updateScore('gbpHealth.projected',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/></div><div><label className="text-xs text-muted-stone">Landing Page</label><input type="number" value={localScores.landingPage?.current||0} onChange={e=>updateScore('landingPage.current',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/></div><div><label className="text-xs text-muted-stone">Core 30 Current</label><input type="number" value={localScores.core30?.current||0} onChange={e=>updateScore('core30.current',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/></div><div><label className="text-xs text-muted-stone">Core 30 Total</label><input type="number" value={localScores.core30?.total||0} onChange={e=>updateScore('core30.total',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/></div></div></div>
      <div className="stitch-glass-card rounded-[24px] p-6 mb-4">
        <div className="flex items-center justify-between flex-wrap gap-2 mb-1">
          <h4 className="text-lg font-semibold text-brand-dark">Publishing (Auto-Publisher)</h4>
          {connChecking?(
            <span className="text-xs px-2 py-1 rounded-full font-medium bg-black/5 text-muted-stone">Checking connection...</span>
          ):connStatus===null?(
            <span className="text-xs px-2 py-1 rounded-full font-medium bg-black/5 text-muted-stone">No repo set</span>
          ):connStatus.connected?(
            <span className="text-xs px-2 py-1 rounded-full font-medium bg-green-100 text-green-700">✓ Connected to GitHub</span>
          ):(
            <span className="text-xs px-2 py-1 rounded-full font-medium bg-red-100 text-red-700" title={connStatus.reason}>✕ Not connected</span>
          )}
        </div>
        {connStatus&&!connStatus.connected&&connStatus.reason&&<p className="text-xs text-red-600 mb-2">{connStatus.reason}</p>}
        <p className="text-xs text-muted-stone mb-3">Tells the Scheduled Pages auto-publisher where this client's pages live. Fill this in once per client.</p>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label className="text-sm font-medium text-deep-obsidian/70">GitHub repo</label>
            <input value={localPub.repo} onChange={e=>updatePublishing('repo',e.target.value)} placeholder="owner/repo-name" className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/>
            <p className="text-[11px] text-muted-stone mt-1">e.g. anthonykmartinez01/arbor-care-astro</p>
          </div>
          <div>
            <label className="text-sm font-medium text-deep-obsidian/70">Branch</label>
            <input value={localPub.branch} onChange={e=>updatePublishing('branch',e.target.value)} placeholder="main" className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/>
            <p className="text-[11px] text-muted-stone mt-1">Usually “main” (some sites use “master”).</p>
          </div>
          <div>
            <label className="text-sm font-medium text-deep-obsidian/70">Live pages folder</label>
            <input value={localPub.pagesDir} onChange={e=>updatePublishing('pagesDir',e.target.value)} placeholder="src/pages" className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/>
            <p className="text-[11px] text-muted-stone mt-1">Where published pages are committed.</p>
          </div>
        </div>
        <div className="mt-3">
          <label className="text-sm font-medium text-deep-obsidian/70">Build Hook URL <span className="font-normal text-muted-stone">(optional)</span></label>
          <input value={localPub.buildHook} onChange={e=>updatePublishing('buildHook',e.target.value)} placeholder="https://api.netlify.com/build_hooks/…" className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/>
          <p className="text-[11px] text-muted-stone mt-1">Only needed if the site rebuilds via a Netlify build hook (e.g. Inside Prosper). Leave blank for sites that auto-build on push. Netlify → site → Build &amp; deploy → Build hooks → Add build hook → copy the URL.</p>
        </div>
        <div className="mt-4 pt-4 border-t border-glass-border">
          <button onClick={enableIndexing} disabled={indexingLoading||!localPub.repo} className="touch-target px-4 py-2 bg-brand text-white rounded-xl hover:bg-brand-hover text-sm font-medium disabled:opacity-50 shadow-lg shadow-brand/20">{indexingLoading?'Setting up...':'Enable Auto-Indexing'}</button>
          <p className="text-[11px] text-muted-stone mt-1">One-click setup: adds the indexing script + workflow step + secret to this repo, so newly-published pages auto-submit to Google + PrimeIndexer. Safe to click again — re-running just confirms everything's still in place.</p>
          {indexingError&&<div className="bg-red-50 text-red-700 rounded-xl p-3 text-sm mt-2">{indexingError}</div>}
          {indexingResult&&(
            <div className="flex flex-wrap gap-2 items-center mt-2">
              <span className="text-[11px] text-muted-stone w-full">Just ran:</span>
              {['script','workflow','secret'].map(k=>{
                const v=indexingResult.result?.[k];
                const ok=v&&!['error','no-workflow-found'].includes(v);
                return <span key={k} className={"text-xs px-2 py-1 rounded-full font-medium "+(ok?'bg-green-100 text-green-700':'bg-red-100 text-red-700')}>{k}: {v}</span>;
              })}
            </div>
          )}
          {connStatus?.connected&&connStatus.automation&&(
            <div className="flex flex-wrap gap-2 items-center mt-2">
              <span className="text-[11px] text-muted-stone w-full">Current state:</span>
              {[
                ['scriptInstalled','script'],
                ['workflowStepInstalled','workflow step'],
                ['secretSet','secret'],
              ].map(([key,label])=>{
                const ok=connStatus.automation[key];
                return <span key={key} className={"text-xs px-2 py-1 rounded-full font-medium "+(ok?'bg-green-100 text-green-700':'bg-black/5 text-muted-stone')}>{ok?'✓':'—'} {label}</span>;
              })}
              {connStatus.automation.workflowFound===false&&<span className="text-xs text-red-600 w-full">No scheduled-publish.yml found in this repo — the workflow step can't be added until that file exists.</span>}
            </div>
          )}
        </div>
      </div>
      <div className="flex flex-wrap gap-2"><button onClick={exportClient} className="touch-target px-4 py-2 bg-brand text-white rounded-xl hover:bg-brand-hover text-sm shadow-lg shadow-brand/20">Export Client Data</button><button onClick={deleteClient} className="touch-target px-4 py-2 bg-red-500 text-white rounded-xl hover:bg-red-600 text-sm">Delete Client</button></div>
    </div>
  );
}

// ─── Reports Tab ───
// Small CSS-only monthly bar chart — same "no charting library, height as a
// fraction of the max" approach as the existing DailyChart (GSC clicks),
// just monthly buckets with the value labeled above each bar (matching the
// reference GBP-style card) instead of a hover tooltip.
function MonthlyBarChart({data,valueKey,color}){
  if(!data||data.length===0)return null;
  const max=Math.max(...data.map(d=>d[valueKey]),1);
  return(
    <div className="flex items-end justify-between gap-2" style={{height:110}}>
      {data.map((d,i)=>{
        const v=d[valueKey]||0;
        const h=Math.max((v/max)*72,v>0?6:2);
        const isCurrent=i===data.length-1;
        const monthLabel=new Date(d.month+'-02T00:00:00').toLocaleDateString('en-US',{month:'short'});
        return(
          <div key={d.month} className="flex-1 flex flex-col items-center gap-1 min-w-0">
            <span className="text-xs font-semibold text-deep-obsidian/70">{v}</span>
            <div className="w-full rounded-t-md transition-all duration-500" style={{height:h,background:isCurrent?color:`${color}40`}}/>
            <span className="text-[11px] text-muted-stone">{monthLabel}</span>
          </div>
        );
      })}
    </div>
  );
}

// Reusable client-facing metric card matching the reference design: icon +
// title header, a "Total"/"New this period" stat pair with trend, and a
// monthly bar chart below. When `connected` is false (no data source wired
// up yet for that metric — see PerformanceMetricsSection), shows an honest
// "not connected" state instead of fabricated numbers.
function ReportStatCard({icon,title,connected,placeholderText,totalLabel,totalValue,totalBadge,periodLabel,periodValue,changePct,changeVsLabel,chartData,chartKey,loading}){
  return(
    <div className="stitch-glass-card rounded-[24px] p-6">
      <div className="flex items-center gap-2 mb-4">
        <span className="material-symbols-outlined text-brand text-[22px]">{icon}</span>
        <h4 className="font-bold text-brand-dark text-base">{title}</h4>
      </div>
      {!connected?(
        <div className="text-center py-8">
          <span className="material-symbols-outlined text-3xl text-muted-stone/40 mb-2 block">link_off</span>
          <p className="text-sm text-muted-stone">{placeholderText}</p>
        </div>
      ):loading?(
        <div className="text-center py-8"><div className="inline-block w-6 h-6 border-4 border-brand border-t-transparent rounded-full animate-spin"/></div>
      ):(
        <>
          <div className="grid grid-cols-2 gap-4 pb-4 mb-4 border-b border-glass-border">
            <div>
              <p className="text-xs text-muted-stone mb-1">{totalLabel}</p>
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-3xl font-bold text-deep-obsidian">{totalValue}</span>
                {totalBadge}
              </div>
            </div>
            <div>
              <p className="text-xs text-muted-stone mb-1">{periodLabel}</p>
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-3xl font-bold text-brand">{periodValue}</span>
                {changePct!=null&&changePct!==0&&(
                  <span className={`text-xs font-bold flex items-center gap-0.5 ${changePct>0?'text-green-600':'text-red-600'}`}>
                    <span className="material-symbols-outlined text-[14px]">{changePct>0?'arrow_upward':'arrow_downward'}</span>{Math.abs(changePct)}%
                  </span>
                )}
              </div>
              {changeVsLabel&&<p className="text-[10px] text-muted-stone mt-0.5">{changeVsLabel}</p>}
            </div>
          </div>
          <MonthlyBarChart data={chartData} valueKey={chartKey} color="#C45A30"/>
        </>
      )}
    </div>
  );
}

// The 4-card client-facing performance section (Reviews, Calls, Website
// Leads, GBP Impressions) modeled on a reference rank-tracking tool's GBP
// card design, rebuilt in the app's own Stitch branding. Website Leads is
// the only one wired to a real data source today (GoHighLevel form
// submissions, per-client) — Reviews/Calls/Impressions each need their own
// Google Business Profile / call-tracking integration that doesn't exist
// yet, so they show an honest "not connected" state rather than fake data.
function PerformanceMetricsSection({client}){
  const [leadsState,setLeadsState]=useState('idle'); // idle|loading|loaded|error
  const [leadsData,setLeadsData]=useState(null);
  const fetchedForRef=useRef(null);
  const ghlReady=!!(client.ghlLocationId&&client.ghlPrivateToken);

  useEffect(()=>{
    if(!ghlReady){setLeadsData(null);setLeadsState('idle');return}
    if(fetchedForRef.current===client.id)return;
    fetchedForRef.current=client.id;
    setLeadsState('loading');
    (async()=>{
      try{
        const headers=await authHeaders({'Content-Type':'application/json'});
        const r=await fetch('/api/ghl-leads',{method:'POST',headers,body:JSON.stringify({locationId:client.ghlLocationId,token:client.ghlPrivateToken,months:4})});
        const j=await r.json();
        if(!r.ok||j.error){setLeadsState('error');return}
        setLeadsData(j);setLeadsState('loaded');
      }catch(e){setLeadsState('error')}
    })();
  },[client.id,client.ghlLocationId,client.ghlPrivateToken]); // eslint-disable-line

  const monthVsLabel=(monthly)=>{
    if(!monthly||monthly.length<2)return null;
    const prevMonth=new Date(monthly[monthly.length-2].month+'-02T00:00:00').toLocaleDateString('en-US',{month:'long'});
    return `vs ${prevMonth}`;
  };

  return(
    <div>
      <h3 className="text-xl font-bold text-brand-dark mb-1">Performance Metrics</h3>
      <p className="text-sm text-muted-stone mb-4">Reviews, calls, website leads, and Google Business Profile engagement</p>
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <ReportStatCard icon="chat_bubble" title="Reviews" connected={false}
          placeholderText="Connect Google Business Profile to track reviews, ratings, and monthly review growth here."/>
        <ReportStatCard icon="call" title="Calls" connected={false}
          placeholderText="Connect call tracking to see call volume and trends for this client here."/>
        <ReportStatCard icon="person_add" title="Website Leads" connected={ghlReady} loading={leadsState==='loading'&&!leadsData}
          placeholderText={client.ghlLocationId?"No GHL Private Integration token set for this client — add one in Settings.":"Connect GoHighLevel in Settings to track website form leads here."}
          totalLabel="Total leads" totalValue={leadsData?leadsData.monthly.reduce((a,m)=>a+m.count,0):'—'}
          periodLabel="New this period" periodValue={leadsData?.currentMonthCount??'—'}
          changePct={leadsData?.changePct} changeVsLabel={leadsData?monthVsLabel(leadsData.monthly):null}
          chartData={leadsData?.monthly} chartKey="count"/>
        <ReportStatCard icon="trending_up" title="GBP Impressions" connected={false}
          placeholderText="Connect Google Business Profile to track how often your listing appears in Search and Maps here."/>
      </div>
    </div>
  );
}

// Normalizes a website/hostname for matching: strips protocol, "www.", path, trailing slash, lowercases.
const normalizeHost=(s)=>{
  if(!s)return'';
  return s.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/.*$/,'').replace(/\/$/,'');
};

// ─── Indexing Dashboard — cross-client scheduled pages + submission log ───
function IndexingDashboard({data,setData}){
  const [schedule,setSchedule]=useState(null); // null=loading, else array of results
  const [scheduleError,setScheduleError]=useState('');
  const [log,setLog]=useState(null);
  const [logError,setLogError]=useState('');

  const clientsWithRepo=useMemo(()=>(data.clients||[]).filter(c=>c.publishing?.repo).map(c=>({name:c.name,repo:c.publishing.repo,branch:c.publishing.branch||'main'})),[data.clients]);

  const loadSchedule=async()=>{
    if(clientsWithRepo.length===0){setSchedule([]);return}
    setScheduleError('');
    try{
      const r=await fetch('/api/scheduled-pages-status',{method:'POST',headers:await authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({repos:clientsWithRepo})});
      const j=await r.json();
      if(!r.ok||j.error)setScheduleError(j.error||'Failed to load scheduled pages');
      else setSchedule(j.results||[]);
    }catch(e){setScheduleError('Network error loading scheduled pages.')}
  };
  const loadLog=async()=>{
    setLogError('');
    try{
      const r=await fetch('/api/indexing-log',{headers:await authHeaders()});
      const j=await r.json();
      if(!r.ok||j.error)setLogError(j.error||'Failed to load indexing activity');
      else setLog(j.entries||[]);
    }catch(e){setLogError('Network error loading indexing activity.')}
  };
  useEffect(()=>{loadSchedule();loadLog()},[]); // eslint-disable-line

  // Reconcile: any successfully-indexed URL that matches a client's website and
  // isn't already logged in their activity feed gets one added automatically, so
  // "this page is indexed" shows up in that client's Monthly SEO Report without
  // any manual entry. Matches by hostname, dedupes by URL already present in an
  // existing autoGenerated activity's text. Runs whenever the log or client list
  // changes; a no-op once everything's already reconciled.
  useEffect(()=>{
    if(!log||!data.clients||!setData)return;
    const indexed=log.filter(e=>e.google?.ok||e.primeIndexer?.ok);
    if(indexed.length===0)return;
    let changed=false;
    const nextClients=data.clients.map(c=>{
      const host=normalizeHost(c.website);
      if(!host)return c;
      const toAdd=[];
      indexed.forEach(e=>{
        let eHost='';
        try{eHost=normalizeHost(new URL(e.url).hostname)}catch(err){return}
        if(eHost!==host)return;
        const already=(c.activities||[]).some(a=>a.autoGenerated&&a.text.includes(e.url));
        if(already)return;
        const g=e.google?.ok?'✓':'✗';const p=e.primeIndexer?.ok?'✓':'✗';
        toAdd.push({id:uid(),taskId:'',date:new Date(e.at).toISOString(),text:`New page indexed: ${e.url} (Google ${g}, PrimeIndexer ${p})`,autoGenerated:true,createdAt:new Date(e.at).toISOString()});
      });
      if(toAdd.length===0)return c;
      changed=true;
      return{...c,activities:[...(c.activities||[]),...toAdd]};
    });
    if(changed){setData(prev=>{const nd={...prev,clients:nextClients};saveData(nd);return nd})}
  },[log,data.clients,setData]);

  const today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago'}).format(new Date());
  const allPages=useMemo(()=>{
    if(!schedule)return[];
    const rows=[];
    schedule.forEach(r=>{(r.pages||[]).forEach(p=>rows.push({client:r.client,repo:r.repo,...p}))});
    return rows.sort((a,b)=>a.date<b.date?-1:1);
  },[schedule]);
  // Every scheduled page — past and future — shows in one always-visible list.
  // (Previously: future pages showed by default and past pages were tucked into
  // a collapsed <details>. That silently made "did I schedule this?" checks miss
  // pages whose date had already passed, reading as "missing" when they weren't.
  // Never hide a scheduled page by default again — status pill instead.)
  const pageStatus=(date)=>date===today?{label:'Publishing today',cls:'bg-blue-100 text-blue-700'}:date>today?{label:'Upcoming',cls:'bg-gray-100 text-gray-500'}:{label:'Published',cls:'bg-green-100 text-green-700'};

  const SourcePill=({source})=>(
    <span className={"text-[10px] px-1.5 py-0.5 rounded-full font-medium "+(source==='automation'?'bg-blue-100 text-blue-700':'bg-gray-100 text-gray-500')}>{source}</span>
  );
  const StatusPill=({ok,label})=>(
    <span className={"text-xs px-2 py-1 rounded-full font-medium "+(ok?'bg-green-100 text-green-700':'bg-red-100 text-red-700')}>{label}</span>
  );

  return(
    <div className="fade-in font-manrope space-y-6">
      <h3 className="text-xl font-bold text-brand-dark">Indexing</h3>

      <div className="stitch-glass-card rounded-[24px] p-6">
        <div className="flex items-center justify-between mb-3">
          <h4 className="text-lg font-semibold text-brand-dark">Upcoming Scheduled Pages</h4>
          <button onClick={loadSchedule} className="text-xs text-muted-stone hover:text-brand-dark">Refresh</button>
        </div>
        {clientsWithRepo.length===0&&<p className="text-sm text-muted-stone">No clients have a GitHub repo set (Settings → Publishing) yet.</p>}
        {scheduleError&&<div className="bg-red-50 text-red-700 rounded-xl p-3 text-sm mb-2">{scheduleError}</div>}
        {schedule===null&&clientsWithRepo.length>0&&<p className="text-sm text-muted-stone">Loading...</p>}
        {schedule&&schedule.filter(r=>r.error).map(r=>(
          <div key={r.repo} className="bg-yellow-50 text-yellow-700 rounded-xl p-2 text-xs mb-2">{r.client} ({r.repo}): {r.error}</div>
        ))}
        {schedule&&allPages.length===0&&clientsWithRepo.length>0&&<p className="text-sm text-muted-stone mb-2">No entries found in schedule.ts for any connected repo.</p>}
        {allPages.length>0&&(
          <div className="space-y-1">
            {allPages.map((p,i)=>{const st=pageStatus(p.date);return(
              <div key={i} className="flex items-center justify-between py-1.5 border-b border-glass-border last:border-0 text-sm">
                <div><span className="font-medium text-brand-dark">{p.client}</span><span className="text-muted-stone ml-2">{p.path}</span></div>
                <div className="flex items-center gap-2"><span className="text-muted-stone text-xs">{p.date}</span><span className={"text-[10px] px-1.5 py-0.5 rounded-full font-medium "+st.cls}>{st.label}</span></div>
              </div>
            )})}
          </div>
        )}
        <p className="text-[11px] text-muted-stone mt-3">Reflects what's currently pushed to each repo's branch on GitHub — a page scheduled locally but not yet pushed (git push) won't show here until it is.</p>
      </div>

      <div className="stitch-glass-card rounded-[24px] p-6">
        <div className="flex items-center justify-between mb-3">
          <h4 className="text-lg font-semibold text-brand-dark">Recent Indexing Activity</h4>
          <button onClick={loadLog} className="text-xs text-muted-stone hover:text-brand-dark">Refresh</button>
        </div>
        {logError&&<div className="bg-red-50 text-red-700 rounded-xl p-3 text-sm mb-2">{logError}</div>}
        {log===null&&<p className="text-sm text-muted-stone">Loading...</p>}
        {log&&log.length===0&&<p className="text-sm text-muted-stone">No indexing submissions yet — either the manual "Submit for Indexing" box or a client's daily auto-publish workflow will populate this.</p>}
        {log&&log.length>0&&(
          <div className="space-y-2">
            {log.map((e,i)=>(
              <div key={i} className="border-b border-glass-border last:border-0 pb-2">
                <div className="flex items-center gap-2 flex-wrap mb-1">
                  <span className="text-xs text-muted-stone">{new Date(e.at).toLocaleString()}</span>
                  <SourcePill source={e.source}/>
                  <span className="text-sm font-medium text-brand-dark">{e.label}</span>
                </div>
                <div className="text-xs text-muted-stone mb-1 break-all">{e.url}</div>
                <div className="flex gap-2 flex-wrap">
                  <StatusPill ok={e.google?.ok} label={'Google: '+(e.google?.detail||'—')}/>
                  <StatusPill ok={e.primeIndexer?.ok} label={'PrimeIndexer: '+(e.primeIndexer?.detail||'—')}/>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

        </div>

        <div className="stitch-glass-card rounded-[24px] p-6">
          <h5 className="text-[11px] font-semibold text-muted-stone uppercase tracking-widest mb-4">Recent Activity</h5>
          <div className="space-y-5">
            {recentActivity.length===0&&<p className="text-sm text-muted-stone">No activity logged yet.</p>}
            {recentActivity.map(a=>(
              <div key={a.id} className="flex gap-3">
                <div className="w-1.5 h-1.5 mt-2 rounded-full bg-brand flex-shrink-0"/>
                <div className="min-w-0">
                  <p className="text-sm text-brand-dark"><strong>{a.clientName}</strong> — {a.text}</p>
                  <p className="text-[11px] text-muted-stone mt-0.5">{fmt(a.date||a.createdAt)}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// FEATURE 1: Client Onboarding Form (Shareable)

function ClientOnboardForm(){
  const [submitted,setSubmitted]=useState(false);
  const [errors,setErrors]=useState({});
  const [form,setForm]=useState({fullName:'',phone:'',email:'',website:'',businessName:'',ein:'',address:'',city:'',state:'',zip:'',serviceAreas:'',niche:'',services:[],customServices:'',top4:[],contactName:'',reviewCount:'',avgResponseTime:'',freeEstimates:'',tripFee:'',availability:'',yearsServing:'',guarantees:'',licenses:'',locallyOwned:'',uniqueDifferentiator:''});

  const nicheServices=NICHE_SERVICES[form.niche]||[];
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));

  const toggleSvc=(s)=>{
    setForm(p=>{
      const has=p.services.includes(s);
      const newSvcs=has?p.services.filter(x=>x!==s):[...p.services,s];
      const newTop4=has?p.top4.filter(x=>x!==s):p.top4;
      return{...p,services:newSvcs,top4:newTop4};
    });
  };
  const toggleTop4=(s)=>{
    setForm(p=>{
      if(p.top4.includes(s))return{...p,top4:p.top4.filter(x=>x!==s)};
      if(p.top4.length>=4)return p;
      return{...p,top4:[...p.top4,s]};
    });
  };

  useEffect(()=>{
    if(form.city&&form.state){
      const own=form.city.trim();
      const current=form.serviceAreas;
      if(!current||current===own){set('serviceAreas',own)}
    }
  },[form.city,form.state]);

  const validate=()=>{
    const e={};
    if(!form.fullName.trim())e.fullName='Required';
    if(!form.phone.trim())e.phone='Required';
    if(!form.email.trim())e.email='Required';
    if(!form.businessName.trim())e.businessName='Required';
    if(!form.ein.trim())e.ein='Required';
    if(!form.address.trim())e.address='Required';
    if(!form.city.trim())e.city='Required';
    if(!form.state.trim())e.state='Required';
    if(!form.zip.trim())e.zip='Required';
    if(!form.niche)e.niche='Required';
    if(form.top4.length<4&&form.services.length>=4)e.top4='Please select your top 4 priority services';
    setErrors(e);return Object.keys(e).length===0;
  };

  const handleSubmit=()=>{
    if(!validate())return;
    // Store in localStorage for Anthony to pick up
    const pending=JSON.parse(localStorage.getItem(STORAGE_KEY+'_pendingOnboards')||'[]');
    pending.push({...form,submittedAt:new Date().toISOString(),id:uid()});
    localStorage.setItem(STORAGE_KEY+'_pendingOnboards',JSON.stringify(pending));
    setSubmitted(true);
  };

  if(submitted){
    return(
      <div className="min-h-screen bg-warm-sand font-manrope flex items-center justify-center p-6">
        <div className="max-w-md text-center fade-in">
          <div className="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4"><svg width="32" height="32" fill="none" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke="#059669" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/></svg></div>
          <h1 className="text-2xl font-bold text-brand-dark mb-2">Thank You!</h1>
          <p className="text-deep-obsidian/70 mb-2">Your information has been submitted to KailenFlow.</p>
          <p className="text-sm text-muted-stone">Anthony will be in touch within 24 hours with your custom SEO plan and next steps.</p>
          <div className="mt-6 px-4 py-3 bg-brand-light rounded-xl"><p className="text-sm text-brand font-medium">KailenFlow Local SEO</p></div>
        </div>
      </div>
    );
  }

  const Req=()=><span className="text-red-500 ml-0.5">*</span>;
  const Err=({f})=>errors[f]?<p className="text-red-500 text-xs mt-0.5">{errors[f]}</p>:null;

  return(
    <div className="min-h-screen bg-warm-sand font-manrope">
      <div className="bg-brand-dark text-white p-6 text-center">
        <h1 className="text-2xl font-bold text-brand">KailenFlow</h1>
        <p className="text-sm text-white/70 mt-1">Client Onboarding Form</p>
      </div>
      <div className="max-w-2xl mx-auto p-4 sm:p-6">
        <div className="bg-brand-light rounded-xl p-4 mb-6">
          <p className="text-sm text-brand-dark">Welcome! Please fill out the information below so we can get started on your local SEO strategy. All fields marked with <span className="text-red-500">*</span> are required.</p>
        </div>

        {/* Contact Info */}
        <div className="stitch-glass-card rounded-[24px] p-5 mb-6">
          <h2 className="text-lg font-bold text-brand-dark mb-3 pb-2 border-b border-glass-border">Contact Information</h2>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><label className="text-sm font-medium text-deep-obsidian/70">Full Name<Req/></label><input value={form.fullName} onChange={e=>set('fullName',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="John Smith"/><Err f="fullName"/></div>
            <div><label className="text-sm font-medium text-deep-obsidian/70">Phone<Req/></label><input value={form.phone} onChange={e=>set('phone',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="(555) 123-4567" type="tel"/><Err f="phone"/></div>
            <div><label className="text-sm font-medium text-deep-obsidian/70">Email<Req/></label><input value={form.email} onChange={e=>set('email',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="john@business.com" type="email"/><Err f="email"/></div>
            <div><label className="text-sm font-medium text-deep-obsidian/70">Website URL</label><input value={form.website} onChange={e=>set('website',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="www.mybusiness.com"/></div>

        </div>

        {/* Business Identity */}

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div className="sm:col-span-2"><label className="text-sm font-medium text-deep-obsidian/70">Business Name (as displayed online)<Req/></label><input value={form.businessName} onChange={e=>set('businessName',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/><Err f="businessName"/></div>
            <div><label className="text-sm font-medium text-deep-obsidian/70">EIN<Req/></label><input value={form.ein} onChange={e=>set('ein',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="XX-XXXXXXX"/><Err f="ein"/></div>
            <div><label className="text-sm font-medium text-deep-obsidian/70">Address<Req/></label><input value={form.address} onChange={e=>set('address',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/><Err f="address"/></div>
            <div><label className="text-sm font-medium text-deep-obsidian/70">City<Req/></label><input value={form.city} onChange={e=>set('city',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/><Err f="city"/></div>

              <div><label className="text-sm font-medium text-deep-obsidian/70">Zip<Req/></label><input value={form.zip} onChange={e=>set('zip',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="76648"/><Err f="zip"/></div>
            </div>
          </div>
        </div>

        {/* Service Areas */}
        <div className="stitch-glass-card rounded-[24px] p-5 mb-6">
          <h2 className="text-lg font-bold text-brand-dark mb-3 pb-2 border-b border-glass-border">Service Areas</h2>
          <p className="text-xs text-muted-stone mb-2">List the cities you serve (your city is included automatically). Separate with commas. Cities only — not towns or neighborhoods.</p>
          <textarea value={form.serviceAreas} onChange={e=>set('serviceAreas',e.target.value)} className="w-full px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" rows="3" placeholder="e.g. Houston, Katy, Sugar Land, Pearland, Missouri City"/>
        </div>

        {/* Services */}
        <div className="stitch-glass-card rounded-[24px] p-5 mb-6">
          <h2 className="text-lg font-bold text-brand-dark mb-3 pb-2 border-b border-glass-border">Services</h2>
          <div className="mb-3"><label className="text-sm font-medium text-deep-obsidian/70">Industry / Niche<Req/></label>
            <select value={form.niche} onChange={e=>{set('niche',e.target.value);set('services',[]);set('top4',[])}} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"><option value="">Select your industry...</option>{NICHE_LIST.map(n=><option key={n}>{n}</option>)}</select><Err f="niche"/>
          </div>

          {form.niche==='Other'&&(
            <div className="mb-3"><label className="text-sm font-medium text-deep-obsidian/70">Describe your services</label><textarea value={form.customServices} onChange={e=>set('customServices',e.target.value)} className="w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" rows="3" placeholder="List the services you offer..."/></div>

                  <label key={s} className="touch-target flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-brand-light/50 cursor-pointer">
                    <input type="checkbox" checked={form.services.includes(s)} onChange={()=>toggleSvc(s)} className="w-4 h-4 accent-brand"/>

            <div className="sm:col-span-2"><label className="text-sm font-medium text-deep-obsidian/70">Licenses, certifications, or insurance?</label><input value={form.licenses} onChange={e=>set('licenses',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="e.g. Licensed & insured, EPA certified, USDOT #1234567"/></div>
            <div><label className="text-sm font-medium text-deep-obsidian/70">Are you locally/family owned?</label>
              <select value={form.locallyOwned} onChange={e=>set('locallyOwned',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"><option value="">Select...</option><option value="Yes, locally owned">Yes, locally owned</option><option value="Yes, family-owned and operated">Yes, family-owned and operated</option><option value="No">No</option></select>
            </div>
            <div><label className="text-sm font-medium text-deep-obsidian/70">What makes you different from competitors?</label><input value={form.uniqueDifferentiator} onChange={e=>set('uniqueDifferentiator',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="e.g. We specialize in rural areas"/></div>
          </div>
        </div>

        <button onClick={handleSubmit} className="touch-target w-full py-3 bg-brand text-white rounded-xl hover:bg-brand-hover font-bold text-lg shadow-lg shadow-brand/20">Submit Onboarding Form</button>
        <p className="text-xs text-muted-stone text-center mt-3">Your information is securely stored and only accessible to your KailenFlow team.</p>
      </div>
    </div>
  );
}

// ─── Onboarding Form Management (Anthony's view) ───
function OnboardFormManager({data,setData,setView,goToGenerator,embedded}){
  const [copyMsg,setCopyMsg]=useState('');
  const formUrl=window.location.href.split('?')[0].split('#')[0]+'?onboard=true';
  const copyUrl=()=>{navigator.clipboard.writeText(formUrl).then(()=>{setCopyMsg('Copied!');setTimeout(()=>setCopyMsg(''),2000)})};

  // Check for pending submissions
  const pendingRaw=JSON.parse(localStorage.getItem(STORAGE_KEY+'_pendingOnboards')||'[]');

  const importClient=(sub)=>{
    const nc={
      id:uid(),name:sub.businessName||sub.fullName,website:sub.website||'',gbpUrl:'',
      phone:sub.phone,address:sub.address,city:sub.city,state:sub.state,
      primaryCategory:sub.niche||'',notes:`Contact: ${sub.fullName} (${sub.email})\nEIN: ${sub.ein}\nZip: ${sub.zip}\nService Areas: ${sub.serviceAreas}\nServices: ${sub.services.join(', ')}\nTop 4: ${sub.top4.join(', ')}\n${sub.customServices?'Custom: '+sub.customServices:''}`,
      createdAt:new Date().toISOString(),
      scores:{gbpHealth:{current:0,projected:0},landingPage:{current:0},core30:{current:0,total:0}},
      rankData:[],activities:[{id:uid(),taskId:'',date:new Date().toISOString(),text:`Client onboarded via intake form`,autoGenerated:true,createdAt:new Date().toISOString()}],
      tasks:[],onboarding:{},setupChecklist:{},
      contentConfig:{
        serviceAreas:sub.serviceAreas||'',
        servicesOffered:sub.services?sub.services.join(', '):'',
        differentiators:{
          reviewCount:sub.reviewCount||'',
          avgResponseTime:sub.avgResponseTime||'',
          freeEstimates:sub.freeEstimates||'',
          tripFee:sub.tripFee||'',
          availability:sub.availability||'',
          yearsServing:sub.yearsServing||'',
          guarantees:sub.guarantees||'',
          licenses:sub.licenses||'',
          locallyOwned:sub.locallyOwned||'',
          uniqueDifferentiator:sub.uniqueDifferentiator||''
        }
      }
    };
    // Remove from pending
    const updated=pendingRaw.filter(p=>p.id!==sub.id);
    localStorage.setItem(STORAGE_KEY+'_pendingOnboards',JSON.stringify(updated));
    setData(prev=>{const nd={...prev,clients:[...prev.clients,nc]};saveData(nd);return nd});
  };

  const deleteSubmission=(sub)=>{
    if(!confirm(`Delete submission from "${sub.businessName||sub.fullName}"? This cannot be undone.`))return;
    const updated=pendingRaw.filter(p=>p.id!==sub.id);
    localStorage.setItem(STORAGE_KEY+'_pendingOnboards',JSON.stringify(updated));
    setData(prev=>({...prev})); // force re-render
  };

  return(
    <div className={embedded?"space-y-6 font-manrope":"fade-in font-manrope space-y-6"}>
      {!embedded&&<h2 className="text-2xl font-bold text-brand-dark">Onboarding Form</h2>}

      {/* Share button */}
      <div className="stitch-glass-card rounded-[24px] p-6">
        <h3 className="text-lg font-bold text-brand-dark mb-2">Share Client Intake Form</h3>
        <p className="text-sm text-deep-obsidian/60 mb-3">Send this link to new clients so they can fill out their onboarding information.</p>
        <div className="flex gap-2">
          <input value={formUrl} readOnly className="flex-1 px-3 py-2 border border-glass-border rounded-xl text-sm bg-black/[0.03] truncate"/>
          <button onClick={copyUrl} className="touch-target px-4 py-2 bg-brand text-white rounded-xl hover:bg-brand-hover text-sm whitespace-nowrap shadow-lg shadow-brand/20">{copyMsg||'Copy Link'}</button>
        </div>
      </div>

      {/* Pending onboards */}
      {pendingRaw.length>0&&(
        <div className="stitch-glass-card rounded-[24px] p-6 border-2 border-brand">
          <h3 className="font-bold text-brand mb-3 flex items-center gap-2">
            <span className="bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center">{pendingRaw.length}</span>
            New Client Submissions
          </h3>
          {pendingRaw.map(sub=>(
            <div key={sub.id} className="bg-white rounded-xl p-4 mb-3 last:mb-0 border border-glass-border">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-2">
                <div>
                  <h4 className="font-bold text-brand-dark">{sub.businessName}</h4>
                  <p className="text-sm text-muted-stone">{sub.fullName} — {sub.niche} — {sub.city}, {sub.state}</p>
                </div>
                <div className="flex flex-col gap-2">
                  <button onClick={()=>importClient(sub)} className="touch-target px-4 py-2 bg-brand text-white rounded-xl hover:bg-brand-hover text-sm whitespace-nowrap shadow-lg shadow-brand/20">Import Client</button>
                  <button onClick={()=>deleteSubmission(sub)} className="touch-target px-4 py-2 bg-red-500 text-white rounded-xl hover:bg-red-600 text-sm whitespace-nowrap">Delete</button>
                </div>
              </div>
              <div className="text-xs text-muted-stone space-y-0.5">
                <p>📧 {sub.email} — 📞 {sub.phone}</p>
                <p>Services: {sub.services.join(', ')||sub.customServices||'None selected'}</p>
                {sub.top4.length>0&&<p>Top 4: <strong>{sub.top4.join(', ')}</strong></p>}
                <p>Submitted: {fmt(sub.submittedAt)}</p>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Setup checklists for recent clients */}
      {data.clients.filter(c=>{const sc=c.setupChecklist||{};return SETUP_CHECKLIST_ITEMS.some(i=>!sc[i])}).slice(0,5).map(c=>{
        const sc=c.setupChecklist||{};
        const done=SETUP_CHECKLIST_ITEMS.filter(i=>sc[i]).length;
        const total=SETUP_CHECKLIST_ITEMS.length;
        return(
          <div key={c.id} className="stitch-glass-card rounded-[24px] p-6">
            <div className="flex items-center justify-between mb-2">
              <h3 className="text-lg font-bold text-brand-dark">Finish Setup — {c.name}</h3>
              <span className="text-xs text-muted-stone">{done}/{total}</span>
            </div>
            <div className="w-full h-2 bg-black/5 rounded-full overflow-hidden mb-3"><div className="h-full bg-brand rounded-full transition-all" style={{width:`${total?Math.round(done/total*100):0}%`}}/></div>
            {SETUP_CHECKLIST_ITEMS.map(item=>{
              const checked=!!sc[item];
