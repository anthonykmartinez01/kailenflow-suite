function CalendarView({data,setData}){
  const [viewMode,setViewMode]=useState('month');
  const [currentDate,setCurrentDate]=useState(new Date());
  const [showIcsModal,setShowIcsModal]=useState(false);
  const [icsUrl,setIcsUrl]=useState(data.calendarUrl||'');
  const [addEventModal,setAddEventModal]=useState(false);
  const [evForm,setEvForm]=useState({title:'',date:today(),time:'09:00',endTime:'10:00',notes:''});
  const events=data.calendarEvents||[];

  const saveCalUrl=(url)=>{setData(prev=>{const nd={...prev,calendarUrl:url};saveData(nd);return nd})};
  const addEvent=()=>{
    if(!evForm.title.trim())return;
    const ev={id:uid(),title:evForm.title,date:evForm.date,time:evForm.time,endTime:evForm.endTime,notes:evForm.notes};
    setData(prev=>{const nd={...prev,calendarEvents:[...(prev.calendarEvents||[]),ev]};saveData(nd);return nd});
    setAddEventModal(false);setEvForm({title:'',date:today(),time:'09:00',endTime:'10:00',notes:''});
  };
  const deleteEvent=(id)=>{setData(prev=>{const nd={...prev,calendarEvents:(prev.calendarEvents||[]).filter(e=>e.id!==id)};saveData(nd);return nd})};

  const parseICS=(text)=>{
    // Helper: parse an ICS datetime string into a local JS Date object
    const parseICSDateTime=(raw)=>{
      if(!raw||raw.length<8)return null;
      const y=raw.slice(0,4),m=raw.slice(4,6),d=raw.slice(6,8);
      if(raw.includes('T')&&raw.length>=13){
        const hh=raw.slice(9,11),mm=raw.slice(11,13),ss=raw.length>=15?raw.slice(13,15):'00';
        if(raw.endsWith('Z')){
          // UTC time — convert to local via Date
          return new Date(Date.UTC(Number(y),Number(m)-1,Number(d),Number(hh),Number(mm),Number(ss)));
        }else{
          // Already local time (TZID was specified or floating)
          return new Date(Number(y),Number(m)-1,Number(d),Number(hh),Number(mm),Number(ss));
        }
      }
      // Date only, no time
      return new Date(Number(y),Number(m)-1,Number(d));
    };
    const evs=[];const blocks=text.split('BEGIN:VEVENT');
    blocks.forEach(block=>{
      const summary=(block.match(/SUMMARY:(.*)/)||[])[1]||'';
      const dtstart=(block.match(/DTSTART[^:]*:(.*)/)||[])[1]||'';
      if(!summary||!dtstart)return;
      const startDate=parseICSDateTime(dtstart.trim());
      if(!startDate)return;
      const date=isoDate(startDate);
      let time='';
      if(dtstart.includes('T')&&dtstart.trim().length>=13){
        time=String(startDate.getHours()).padStart(2,'0')+':'+String(startDate.getMinutes()).padStart(2,'0');
      }
      const dtend=(block.match(/DTEND[^:]*:(.*)/)||[])[1]||'';
      let endTime='';
      if(dtend&&dtend.includes('T')&&dtend.trim().length>=13){
        const endDate=parseICSDateTime(dtend.trim());
        if(endDate)endTime=String(endDate.getHours()).padStart(2,'0')+':'+String(endDate.getMinutes()).padStart(2,'0');
      }
      evs.push({id:uid(),title:summary.trim(),date,time,endTime,notes:'',imported:true});
    });
    return evs;
  };

  const [syncing,setSyncing]=useState(false);
  const [lastSync,setLastSync]=useState(null);
  const doSync=async(url,silent)=>{
    if(!url||!url.trim())return false;
    if(!silent)setSyncing(true);
    let text=null;
    try{
      const resp=await fetch('/.netlify/functions/calendar-proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
      if(resp.ok){text=await resp.text();if(!text.includes('BEGIN:VCALENDAR'))text=null;}
    }catch(e){/* function failed */}
    if(!text){
      if(!silent){setSyncing(false);alert('Could not fetch your calendar. Make sure you copied the full "Secret address in iCal format" URL from Google Calendar settings. It should look like:\nhttps://calendar.google.com/calendar/ical/your-email/private-xxxxx/basic.ics');}
      return false;
    }
    const imported=parseICS(text);
    setData(prev=>{
      const existing=(prev.calendarEvents||[]).filter(e=>!e.imported);
      const nd={...prev,calendarEvents:[...existing,...imported],calendarUrl:url};
      saveData(nd);return nd;
    });
    setLastSync(new Date());
    if(!silent)setSyncing(false);
    return true;
  };
  const syncICS=async()=>{
    saveCalUrl(icsUrl);
    const ok=await doSync(icsUrl,false);
    if(ok)setShowIcsModal(false);
  };
  // Auto-sync on mount if URL is already saved, then every 15 minutes
  const autoSyncRef=React.useRef(false);
  React.useEffect(()=>{
    const savedUrl=data.calendarUrl;
    if(savedUrl&&!autoSyncRef.current){autoSyncRef.current=true;doSync(savedUrl,true);}
    const interval=setInterval(()=>{const u=data.calendarUrl;if(u)doSync(u,true)},15*60*1000);
    return()=>clearInterval(interval);
  },[]);

  // Calendar grid helpers
  const year=currentDate.getFullYear();const month=currentDate.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const todayStr=today();
  const monthName=currentDate.toLocaleDateString('en-US',{month:'long',year:'numeric'});

  const prevMonth=()=>setCurrentDate(new Date(year,month-1,1));
  const nextMonth=()=>setCurrentDate(new Date(year,month+1,1));
  const prevWeek=()=>setCurrentDate(new Date(currentDate.getTime()-7*86400000));
  const nextWeek=()=>setCurrentDate(new Date(currentDate.getTime()+7*86400000));

  const getEventsForDate=(d)=>events.filter(e=>e.date===d).sort((a,b)=>(a.time||'').localeCompare(b.time||''));

  // Week view: get 7 days starting from Sunday of current week
  const weekStart=new Date(currentDate);weekStart.setDate(weekStart.getDate()-weekStart.getDay());
  const weekDays=Array.from({length:7},(_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return d});

  // Today's events
  const todayEvents=getEventsForDate(todayStr);

  return(
    <div className="fade-in font-manrope">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
        <h2 className="text-2xl font-bold text-brand-dark">Calendar</h2>
        <div className="flex items-center gap-2 flex-wrap">
          {['day','week','month'].map(m=>(
            <button key={m} onClick={()=>setViewMode(m)} className={`touch-target px-3 py-1.5 rounded-full text-sm font-medium transition-all ${viewMode===m?'bg-brand text-white shadow-lg shadow-brand/20':'stitch-glass-card text-deep-obsidian/70 hover:bg-black/5'}`}>{m.charAt(0).toUpperCase()+m.slice(1)}</button>
          ))}
          <button onClick={()=>setAddEventModal(true)} className="touch-target px-3 py-1.5 bg-brand text-white rounded-full hover:bg-brand-hover text-sm shadow-lg shadow-brand/20">+ Event</button>
          {data.calendarUrl&&lastSync&&<span className="text-xs text-green-600 hidden sm:inline">✓ Auto-synced {lastSync.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</span>}
          <button onClick={()=>{if(data.calendarUrl){doSync(data.calendarUrl,false)}else{setShowIcsModal(true)}}} className="touch-target px-3 py-1.5 stitch-glass-card text-deep-obsidian/70 hover:bg-black/5 rounded-full text-sm">{data.calendarUrl?'↻ Refresh':'Sync Google Cal'}</button>
          {data.calendarUrl&&<button onClick={()=>setShowIcsModal(true)} className="touch-target px-3 py-1.5 stitch-glass-card text-muted-stone hover:bg-black/5 rounded-full text-xs">⚙</button>}
        </div>
      </div>

      {/* Today's events quick view */}
      {todayEvents.length>0&&(
        <div className="stitch-glass-card rounded-[24px] p-6 mb-4">
          <h3 className="font-bold text-brand-dark mb-2 text-sm">Today's Schedule</h3>
          {todayEvents.map(ev=>(
            <div key={ev.id} className="flex items-center gap-3 py-1.5">
              <span className="text-xs font-mono text-brand font-bold w-16">{ev.time?fmt12(ev.time):'All day'}</span>
              <span className="text-sm flex-1">{ev.title}</span>
              <button onClick={()=>deleteEvent(ev.id)} className="text-red-400 hover:text-red-600 text-xs">✕</button>
            </div>
          ))}
        </div>
      )}

      {/* MONTH VIEW */}
      {viewMode==='month'&&(
        <div className="stitch-glass-card rounded-[24px] p-6 overflow-x-auto">
          <div className="flex items-center justify-between mb-4">
            <button onClick={prevMonth} className="touch-target w-10 h-10 rounded-xl bg-white shadow hover:shadow-md flex items-center justify-center">←</button>
            <h3 className="font-bold text-brand-dark text-lg">{monthName}</h3>
            <button onClick={nextMonth} className="touch-target w-10 h-10 rounded-xl bg-white shadow hover:shadow-md flex items-center justify-center">→</button>
          </div>
          <div className="grid grid-cols-7 gap-px min-w-[320px]">
            {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=><div key={d} className="text-center text-xs font-semibold text-muted-stone py-2">{d}</div>)}
            {Array.from({length:firstDay}).map((_,i)=><div key={`e${i}`} className="p-1 min-h-[60px] sm:min-h-[80px]"/>)}
            {Array.from({length:daysInMonth}).map((_,i)=>{
              const day=i+1;const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
              const dayEvents=getEventsForDate(dateStr);const isToday=dateStr===todayStr;
              return(
                <div key={day} className={`cal-day p-1 min-h-[60px] sm:min-h-[80px] border-t border-glass-border`} onClick={()=>{setEvForm(p=>({...p,date:dateStr}));setAddEventModal(true)}}>
                  <span className={`text-xs font-medium inline-block w-6 h-6 flex items-center justify-center rounded-full ${isToday?'cal-today':''}`}>{day}</span>
                  {dayEvents.slice(0,2).map(ev=><div key={ev.id} className="cal-event" title={ev.title}>{ev.time&&<span className="font-bold mr-1">{fmt12(ev.time)}</span>}{ev.title}</div>)}
                  {dayEvents.length>2&&<div className="text-[10px] text-muted-stone pl-1">+{dayEvents.length-2} more</div>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* WEEK VIEW */}
      {viewMode==='week'&&(
        <div className="stitch-glass-card rounded-[24px] p-6 overflow-x-auto">
          <div className="flex items-center justify-between mb-4">
            <button onClick={prevWeek} className="touch-target w-10 h-10 rounded-xl bg-white shadow hover:shadow-md flex items-center justify-center">←</button>
            <h3 className="font-bold text-brand-dark">{weekDays[0].toLocaleDateString('en-US',{month:'short',day:'numeric'})} — {weekDays[6].toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</h3>
            <button onClick={nextWeek} className="touch-target w-10 h-10 rounded-xl bg-white shadow hover:shadow-md flex items-center justify-center">→</button>
          </div>
          <div className="grid grid-cols-7 gap-2 min-w-[500px]">
            {weekDays.map(d=>{
              const ds=isoDate(d);const dayEvs=getEventsForDate(ds);const isToday=ds===todayStr;
              return(
                <div key={ds} className={`border rounded-xl p-2 min-h-[200px] ${isToday?'border-brand bg-brand-light/30':'border-glass-border'}`}>
                  <div className="text-center mb-2">
                    <span className="text-[10px] text-muted-stone block">{d.toLocaleDateString('en-US',{weekday:'short'})}</span>
                    <span className={`text-sm font-bold ${isToday?'text-brand':'text-brand-dark'}`}>{d.getDate()}</span>
                  </div>
                  {dayEvs.map(ev=>(
                    <div key={ev.id} className="cal-event mb-1 text-[10px]" onClick={()=>deleteEvent(ev.id)}>
                      {ev.time&&<span className="font-bold">{fmt12(ev.time)} </span>}{ev.title}
                    </div>
                  ))}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* DAY VIEW */}
      {viewMode==='day'&&(
        <div className="stitch-glass-card rounded-[24px] p-6">
          <div className="flex items-center justify-between mb-4">
            <button onClick={()=>setCurrentDate(new Date(currentDate.getTime()-86400000))} className="touch-target w-10 h-10 rounded-xl bg-white shadow hover:shadow-md flex items-center justify-center">←</button>
            <h3 className="font-bold text-brand-dark">{currentDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</h3>
            <button onClick={()=>setCurrentDate(new Date(currentDate.getTime()+86400000))} className="touch-target w-10 h-10 rounded-xl bg-white shadow hover:shadow-md flex items-center justify-center">→</button>
          </div>
          {Array.from({length:14},(_,i)=>i+6).map(hour=>{
            const hourStr=`${String(hour).padStart(2,'0')}:00`;
            const hourEvents=getEventsForDate(isoDate(currentDate)).filter(ev=>ev.time&&ev.time.startsWith(String(hour).padStart(2,'0')));
            return(
              <div key={hour} className="flex border-t border-glass-border py-2 min-h-[48px]">
                <span className="text-xs text-muted-stone w-14 flex-shrink-0 pt-1">{hour>12?hour-12:hour}{hour>=12?'pm':'am'}</span>
                <div className="flex-1">
                  {hourEvents.map(ev=>(
                    <div key={ev.id} className="bg-brand text-white rounded-xl px-3 py-1.5 mb-1 text-sm flex items-center justify-between">
                      <span>{ev.title}{ev.endTime&&<span className="text-xs opacity-75 ml-2">{fmt12(ev.time)}–{fmt12(ev.endTime)}</span>}</span>
                      <button onClick={()=>deleteEvent(ev.id)} className="text-white/70 hover:text-white ml-2">✕</button>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Add Event Modal */}
      <Modal open={addEventModal} onClose={()=>setAddEventModal(false)} title="Add Event">
        <div className="space-y-3">
          <div><label className="text-sm font-medium text-deep-obsidian/70">Title</label><input value={evForm.title} onChange={e=>setEvForm(p=>({...p,title:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="Meeting with client..."/></div>
          <div><label className="text-sm font-medium text-deep-obsidian/70">Date</label><input type="date" value={evForm.date} onChange={e=>setEvForm(p=>({...p,date:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/></div>
          <div className="grid grid-cols-2 gap-3"><div><label className="text-sm font-medium text-deep-obsidian/70">Start Time</label><input type="time" value={evForm.time} onChange={e=>setEvForm(p=>({...p,time:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/></div><div><label className="text-sm font-medium text-deep-obsidian/70">End Time</label><input type="time" value={evForm.endTime} onChange={e=>setEvForm(p=>({...p,endTime:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/></div></div>
          <div><label className="text-sm font-medium text-deep-obsidian/70">Notes</label><textarea value={evForm.notes} onChange={e=>setEvForm(p=>({...p,notes:e.target.value}))} className="w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" rows="2"/></div>
          <button onClick={addEvent} className="touch-target w-full py-2.5 bg-brand text-white rounded-xl hover:bg-brand-hover font-medium shadow-lg shadow-brand/20">Add Event</button>
        </div>
      </Modal>

      {/* ICS Sync Modal */}
      <Modal open={showIcsModal} onClose={()=>setShowIcsModal(false)} title="Sync Google Calendar">
        <div className="space-y-4">
          <div className="bg-brand-light rounded-xl p-3">
            <p className="text-sm text-brand-dark font-medium mb-1">How to get your ICS URL:</p>
            <ol className="text-xs text-deep-obsidian/60 space-y-1 list-decimal list-inside">
              <li>Open Google Calendar on desktop</li>
              <li>Click the ⚙ gear icon → Settings</li>
              <li>Click your calendar under "Settings for my calendars"</li>
              <li>Scroll to "Integrate calendar"</li>
              <li>Copy the "Secret address in iCal format" URL</li>
            </ol>
          </div>
          <div><label className="text-sm font-medium text-deep-obsidian/70">Google Calendar ICS URL</label><input value={icsUrl} onChange={e=>setIcsUrl(e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="https://calendar.google.com/calendar/ical/..."/></div>
          <button onClick={syncICS} disabled={syncing} className={`touch-target w-full py-2.5 text-white rounded-xl font-medium ${syncing?'bg-gray-400 cursor-wait':'bg-brand hover:bg-brand-hover shadow-lg shadow-brand/20'}`}>{syncing?'Syncing...':'Sync Calendar'}</button>
          {data.calendarUrl&&<p className="text-xs text-green-600">✓ Connected — calendar auto-syncs every 15 minutes and on every page load.</p>}
          {data.calendarUrl&&<button onClick={()=>{setData(prev=>{const nd={...prev,calendarUrl:'',calendarEvents:(prev.calendarEvents||[]).filter(e=>!e.imported)};saveData(nd);return nd});setIcsUrl('');setShowIcsModal(false)}} className="text-xs text-red-500 hover:text-red-700 underline">Disconnect calendar</button>}
        </div>
      </Modal>
    </div>
  );
}

// FEATURE 3: Prospecting Tracker
// ═══════════════════════════════════════════
const CHANNELS = [
  {key:'sms', label:'Cold SMS', icon:'💬', color:'#6366f1'},
  {key:'call', label:'Cold Calling', icon:'📞', color:'#059669'},
  {key:'email', label:'Email', icon:'📧', color:'#d97706'},
  {key:'inperson', label:'In-Person', icon:'🤝', color:'#dc2626'},
  {key:'facebook', label:'Facebook', icon:'📘', color:'#2563eb'}
];

const PROSPECT_STAGES=[
  {key:'new',label:'New Lead',color:'#6b7280',bg:'bg-gray-100 text-gray-700'},
  {key:'contacted',label:'Contacted',color:'#6366f1',bg:'bg-indigo-100 text-indigo-700'},
  {key:'no_show',label:'No Show',color:'#b91c1c',bg:'bg-red-200 text-red-800'},
  {key:'sent_calendar',label:'Sent Calendar',color:'#d97706',bg:'bg-amber-100 text-amber-700'},
  {key:'inbound_ad',label:'Inbound Lead (Ads)',color:'#e11d48',bg:'bg-rose-100 text-rose-700'},
  {key:'follow_up',label:'Needs Follow-up',color:'#dc2626',bg:'bg-red-100 text-red-700'},
  {key:'booked',label:'Booked Appointment',color:'#059669',bg:'bg-green-100 text-green-700'},
  {key:'referral',label:'Referral/Recommended',color:'#7c3aed',bg:'bg-purple-100 text-purple-700'},
  {key:'closed',label:'Closed (Won)',color:'#16a34a',bg:'bg-emerald-100 text-emerald-800'},
  {key:'lost',label:'Lost/Not Interested',color:'#9ca3af',bg:'bg-gray-100 text-gray-500'}
];

function ProspectPipeline({data,setData}){
  const prospects=data.prospects||[];
  const [showAdd,setShowAdd]=useState(false);
  const [editId,setEditId]=useState(null);
  const [filter,setFilter]=useState('active');
  const [search,setSearch]=useState('');
  const [form,setForm]=useState({name:'',business:'',channel:'sms',stage:'new',phone:'',email:'',facebookUrl:'',notes:'',followUpDate:'',source:''});

  const resetForm=()=>setForm({name:'',business:'',channel:'sms',stage:'new',phone:'',email:'',facebookUrl:'',notes:'',followUpDate:'',source:''});

  // Auto-log a prospecting activity entry from pipeline actions
  const autoLog=(nd,channel,metrics,note)=>{
    const entry={id:uid(),date:today(),channel,outreaches:metrics.outreaches||0,followups:metrics.followups||0,responses:metrics.responses||0,meetings:metrics.meetings||0,notes:'Auto: '+note,autoFromPipeline:true,createdAt:new Date().toISOString()};
    nd.prospecting=[...(nd.prospecting||[]),entry];
    return nd;
  };

  const saveProspect=()=>{
    if(!form.name.trim()&&!form.business.trim())return;
    const displayName=form.name.trim()||form.business.trim();
    setData(prev=>{
      let ps=[...(prev.prospects||[])];
      let nd;
      if(editId){
        // Editing existing — check if stage changed
        const old=ps.find(p=>p.id===editId);
        const stageChanged=old&&old.stage!==form.stage;
        ps=ps.map(p=>p.id===editId?{...p,...form,updatedAt:new Date().toISOString(),history:[...(p.history||[]),...(stageChanged?[{stage:form.stage,date:new Date().toISOString(),note:'Stage changed to '+PROSPECT_STAGES.find(s=>s.key===form.stage)?.label}]:[])]}:p);
        nd={...prev,prospects:ps};
        if(stageChanged){
          if(form.stage==='contacted')nd=autoLog(nd,form.channel,{outreaches:1},displayName+' moved to Contacted');
          if(form.stage==='no_show')nd=autoLog(nd,form.channel,{followups:1},displayName+' - no show, needs reschedule');
          if(form.stage==='sent_calendar')nd=autoLog(nd,form.channel,{followups:1},displayName+' - sent calendar');
          if(form.stage==='inbound_ad')nd=autoLog(nd,form.channel,{responses:1},displayName+' - inbound lead from ads');
          if(form.stage==='booked')nd=autoLog(nd,form.channel,{meetings:1},displayName+' booked appointment');
          if(form.stage==='referral')nd=autoLog(nd,form.channel,{responses:1},displayName+' - referral/recommended');
        }
      }else{
        // New prospect
        ps.push({id:uid(),...form,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),history:[{stage:form.stage,date:new Date().toISOString(),note:'Lead created'}]});
        nd={...prev,prospects:ps};
        // Auto-log if they're already past "new" stage
        if(form.stage==='contacted')nd=autoLog(nd,form.channel,{outreaches:1},'New prospect: '+displayName);
        if(form.stage==='no_show')nd=autoLog(nd,form.channel,{followups:1},'No show: '+displayName+' - needs reschedule');
        if(form.stage==='sent_calendar'){nd=autoLog(nd,form.channel,{outreaches:1},'New prospect: '+displayName);nd=autoLog(nd,form.channel,{followups:1},displayName+' - sent calendar');}
        if(form.stage==='inbound_ad')nd=autoLog(nd,form.channel,{responses:1},'Inbound ad lead: '+displayName);
        if(form.stage==='booked'){nd=autoLog(nd,form.channel,{outreaches:1},'New prospect: '+displayName);nd=autoLog(nd,form.channel,{meetings:1},displayName+' booked appointment');}
        if(form.stage==='referral')nd=autoLog(nd,form.channel,{responses:1},'Referral: '+displayName);
      }
      saveData(nd);return nd;
    });
    setShowAdd(false);setEditId(null);resetForm();
  };

  const updateStage=(id,newStage)=>{
    setData(prev=>{
      const prospect=(prev.prospects||[]).find(p=>p.id===id);
      if(!prospect)return prev;
      const ps=(prev.prospects||[]).map(p=>{
        if(p.id!==id)return p;
        const hist=[...(p.history||[]),{stage:newStage,date:new Date().toISOString(),note:'Stage changed to '+PROSPECT_STAGES.find(s=>s.key===newStage)?.label}];
        return{...p,stage:newStage,updatedAt:new Date().toISOString(),history:hist};
      });
      let nd={...prev,prospects:ps};
      const pName=prospect.name||prospect.business||'Unknown';
      // Auto-log based on new stage
      if(newStage==='contacted')nd=autoLog(nd,prospect.channel,{outreaches:1},pName+' moved to Contacted');
      if(newStage==='no_show')nd=autoLog(nd,prospect.channel,{followups:1},pName+' - no show, needs reschedule');
      if(newStage==='sent_calendar')nd=autoLog(nd,prospect.channel,{followups:1},pName+' - sent calendar');
      if(newStage==='inbound_ad')nd=autoLog(nd,prospect.channel,{responses:1},pName+' - inbound lead from ads');
      if(newStage==='booked')nd=autoLog(nd,prospect.channel,{meetings:1},pName+' booked appointment');
      if(newStage==='referral')nd=autoLog(nd,prospect.channel,{responses:1},pName+' - referral/recommended');
      saveData(nd);return nd;
    });
  };

  const deleteProspect=(id)=>{
    if(!confirm('Delete this prospect?'))return;
    setData(prev=>{const nd={...prev,prospects:(prev.prospects||[]).filter(p=>p.id!==id)};saveData(nd);return nd});
  };

  const startEdit=(p)=>{
    setForm({name:p.name||'',business:p.business||'',channel:p.channel||'sms',stage:p.stage||'new',phone:p.phone||'',email:p.email||'',facebookUrl:p.facebookUrl||'',notes:p.notes||'',followUpDate:p.followUpDate||'',source:p.source||''});
    setEditId(p.id);setShowAdd(true);
  };

  const getStageInfo=(key)=>PROSPECT_STAGES.find(s=>s.key===key)||PROSPECT_STAGES[0];
  const getChannelInfo=(key)=>CHANNELS.find(c=>c.key===key)||{icon:'?',label:key,color:'#888'};

  // Drag-and-drop state
  const [draggedId,setDraggedId]=useState(null);
  const [dragOverStage,setDragOverStage]=useState(null);

  const handleDragStart=(e,id)=>{
    setDraggedId(id);
    e.dataTransfer.effectAllowed='move';
    try{e.dataTransfer.setData('text/plain',id)}catch(err){}
  };
  const handleDragOver=(e,stageKey)=>{
    e.preventDefault();
    e.dataTransfer.dropEffect='move';
    if(dragOverStage!==stageKey)setDragOverStage(stageKey);
  };
  const handleDragLeave=()=>setDragOverStage(null);
  const handleDrop=(e,stageKey)=>{
    e.preventDefault();
    const id=draggedId||e.dataTransfer.getData('text/plain');
    if(id){
      const p=prospects.find(pp=>pp.id===id);
      if(p&&p.stage!==stageKey)updateStage(id,stageKey);
    }
    setDraggedId(null);setDragOverStage(null);
  };

  // Filter
  const activeStages=['new','contacted','no_show','sent_calendar','inbound_ad','follow_up','booked','referral'];
  const filtered=prospects.filter(p=>{
    if(filter==='active'&&!activeStages.includes(p.stage))return false;
    if(filter==='follow_up'){
      if(p.stage==='closed'||p.stage==='lost')return false;
      if(!p.followUpDate)return false;
      if(p.followUpDate>today())return false;
    }
    if(filter==='booked'&&p.stage!=='booked')return false;
    if(filter==='closed'&&p.stage!=='closed')return false;
    if(filter==='lost'&&p.stage!=='lost')return false;
    if(search.trim()){
      const q=search.toLowerCase();
      if(!(p.name||'').toLowerCase().includes(q)&&!(p.business||'').toLowerCase().includes(q)&&!(p.notes||'').toLowerCase().includes(q)&&!(p.source||'').toLowerCase().includes(q))return false;
    }
    return true;
  }).sort((a,b)=>{
    // Priority order: sent_calendar (highest) > follow_up > contacted > referral > new > booked > closed > lost
    const priorityMap={no_show:1,sent_calendar:2,inbound_ad:3,follow_up:4,contacted:5,referral:6,new:7,booked:8,closed:9,lost:10};
    const pa=priorityMap[a.stage]||5;
    const pb=priorityMap[b.stage]||5;
    if(pa!==pb)return pa-pb;
    // Within same priority, overdue follow-ups first
    const aOverdue=a.followUpDate&&a.followUpDate<=today()?1:0;
    const bOverdue=b.followUpDate&&b.followUpDate<=today()?1:0;
    if(aOverdue!==bOverdue)return bOverdue-aOverdue;
    // Then by follow-up date soonest
    if(a.followUpDate&&b.followUpDate)return a.followUpDate.localeCompare(b.followUpDate);
    if(a.followUpDate&&!b.followUpDate)return -1;
    if(!a.followUpDate&&b.followUpDate)return 1;
    return (b.updatedAt||'').localeCompare(a.updatedAt||'');
  });

  // Stats
  const needsFollowUp=prospects.filter(p=>p.followUpDate&&p.followUpDate<=today()&&activeStages.includes(p.stage)).length;
  const sentCalendar=prospects.filter(p=>p.stage==='sent_calendar').length;
  const bookedCount=prospects.filter(p=>p.stage==='booked').length;
  const closedCount=prospects.filter(p=>p.stage==='closed').length;

  // Group prospects by stage for kanban (search-only filter)
  const matchesProspectSearch=(p)=>{
    if(!search.trim())return true;
    const q=search.toLowerCase();
    return (p.name||'').toLowerCase().includes(q)||(p.business||'').toLowerCase().includes(q)||(p.notes||'').toLowerCase().includes(q)||(p.source||'').toLowerCase().includes(q);
  };
  const stageColumns=PROSPECT_STAGES.map(stage=>({
    ...stage,
    items:prospects.filter(p=>p.stage===stage.key&&matchesProspectSearch(p))
                   .sort((a,b)=>{
                     // Overdue follow-ups first
                     const aOverdue=a.followUpDate&&a.followUpDate<=today()?1:0;
                     const bOverdue=b.followUpDate&&b.followUpDate<=today()?1:0;
                     if(aOverdue!==bOverdue)return bOverdue-aOverdue;
                     return (b.updatedAt||'').localeCompare(a.updatedAt||'');
                   })
  }));

  return(
    <div className="space-y-4 font-manrope">
      {/* Search + Add */}
      <div className="flex flex-col sm:flex-row gap-2">
        <input value={search} onChange={e=>setSearch(e.target.value)}
          placeholder="Search by name, business, notes, or source..."
          className="touch-target flex-1 px-4 py-2.5 border border-glass-border rounded-xl bg-white shadow-sm focus:ring-1 focus:ring-brand focus:outline-none"/>
        <button onClick={()=>{resetForm();setEditId(null);setShowAdd(true)}}
          className="touch-target px-5 py-2.5 bg-brand text-white rounded-xl text-sm font-medium hover:bg-brand-hover whitespace-nowrap shadow-lg shadow-brand/20">
          + Add Prospect
        </button>
      </div>

      {/* Add/Edit Form */}
      {showAdd&&(
        <div className="stitch-glass-card rounded-[24px] p-5">
          <h4 className="text-lg font-bold text-brand-dark mb-3">{editId?'Edit Prospect':'Add New Prospect'}</h4>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
            <div><label className="text-xs text-muted-stone">Contact Name</label><input value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="Optional if business name is filled"/></div>
            <div><label className="text-xs text-muted-stone">Business Name</label><input value={form.business} onChange={e=>setForm(p=>({...p,business:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="Their business"/></div>
            <div><label className="text-xs text-muted-stone">Phone</label><input value={form.phone} onChange={e=>setForm(p=>({...p,phone:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="(555) 555-5555"/></div>
            <div><label className="text-xs text-muted-stone">Email</label><input value={form.email} onChange={e=>setForm(p=>({...p,email:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="email@example.com"/></div>
            <div><label className="text-xs text-muted-stone">Channel</label>
              <select value={form.channel} onChange={e=>setForm(p=>({...p,channel:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none">
                {CHANNELS.map(ch=><option key={ch.key} value={ch.key}>{ch.icon} {ch.label}</option>)}
              </select>
            </div>
            <div><label className="text-xs text-muted-stone">Stage</label>
              <select value={form.stage} onChange={e=>setForm(p=>({...p,stage:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none">
                {PROSPECT_STAGES.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}
              </select>
            </div>
            <div><label className="text-xs text-muted-stone">Facebook Profile URL</label><input value={form.facebookUrl} onChange={e=>setForm(p=>({...p,facebookUrl:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="https://facebook.com/their.profile"/></div>
            <div><label className="text-xs text-muted-stone">Source / Referred By</label><input value={form.source} onChange={e=>setForm(p=>({...p,source:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="e.g. Referral from John, Facebook ad"/></div>
            <div><label className="text-xs text-muted-stone">Follow-up Date</label><input type="date" value={form.followUpDate} onChange={e=>setForm(p=>({...p,followUpDate:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/></div>
          </div>
          <div className="mb-3"><label className="text-xs text-muted-stone">Notes</label><textarea value={form.notes} onChange={e=>setForm(p=>({...p,notes:e.target.value}))} rows="2" className="w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="Any notes - what was discussed, next steps..."/></div>
          <div className="flex gap-2">
            <button onClick={saveProspect} disabled={!form.name.trim()&&!form.business.trim()} className={`touch-target px-5 py-2 rounded-xl text-sm font-medium ${(form.name.trim()||form.business.trim())?'bg-brand text-white hover:bg-brand-hover shadow-lg shadow-brand/20':'bg-gray-200 text-gray-400 cursor-not-allowed'}`}>{editId?'Save Changes':'Add Prospect'}</button>
            <button onClick={()=>{setShowAdd(false);setEditId(null);resetForm()}} className="touch-target px-5 py-2 bg-black/5 text-deep-obsidian/70 rounded-xl text-sm hover:bg-black/10">Cancel</button>
          </div>
        </div>
      )}

      {/* Empty state */}
      {prospects.length===0&&!showAdd&&(
        <div className="stitch-glass-card rounded-[24px] p-12 text-center">
          <span className="material-symbols-outlined text-4xl text-brand mb-3">target</span>
          <p className="text-deep-obsidian/70 mb-1">No prospects yet</p>
          <p className="text-sm text-muted-stone">Add your first lead to start tracking through the pipeline.</p>
        </div>
      )}

      {/* KANBAN BOARD — drag cards left to right through stages */}
      {prospects.length>0&&(
        <div className="-mx-4 px-4 sm:mx-0 sm:px-0 overflow-x-auto pb-4">
          <div className="flex gap-2 min-w-max">
            {stageColumns.map((col,idx)=>(
              <div key={col.key}
                onDragOver={e=>handleDragOver(e,col.key)}
                onDragLeave={handleDragLeave}
                onDrop={e=>handleDrop(e,col.key)}
                className={`flex-shrink-0 w-52 rounded-[20px] transition-colors ${dragOverStage===col.key?'bg-brand/10 ring-2 ring-brand':'bg-black/[0.03]'}`}>
                <div className="px-2 py-2 rounded-t-[20px] border-b" style={{borderColor:col.color+'40',backgroundColor:col.color+'15'}}>
                  <div className="flex items-center justify-between gap-1">
                    <div className="flex items-center gap-1.5 min-w-0">
                      <span className="text-[9px] font-bold px-1 py-0.5 rounded-full text-white flex-shrink-0" style={{backgroundColor:col.color}}>{idx+1}</span>
                      <h4 className="font-semibold text-xs truncate" style={{color:col.color}}>{col.label}</h4>
                    </div>
                    <span className="text-[10px] font-bold text-deep-obsidian/60 bg-white px-1.5 py-0.5 rounded-full flex-shrink-0">{col.items.length}</span>
                  </div>
                </div>
                <div className="p-1.5 space-y-1.5 min-h-[120px]">
                  {col.items.length===0&&(
                    <div className="text-center text-[10px] text-muted-stone py-4 border border-dashed border-glass-border rounded-xl">
                      Drop here
                    </div>
                  )}
                  {col.items.map(p=>{
                    const ch=getChannelInfo(p.channel);
                    const isOverdue=p.followUpDate&&p.followUpDate<=today()&&activeStages.includes(p.stage);
                    const primary=p.business||p.name||'Untitled';
                    const secondary=p.business&&p.name?p.name:'';
                    return(
                      <div key={p.id}
                        draggable
                        onDragStart={e=>handleDragStart(e,p.id)}
                        onDragEnd={()=>{setDraggedId(null);setDragOverStage(null)}}
                        className={`stitch-glass-card !bg-white rounded-xl p-2 cursor-grab active:cursor-grabbing hover:shadow-md transition-all ${draggedId===p.id?'opacity-40':''} ${isOverdue?'ring-1 ring-red-300':''}`}>
                        <div className="flex items-start justify-between gap-1">
                          <div className="flex-1 min-w-0">
                            <h5 className="font-bold text-sm text-brand-dark truncate leading-tight">{primary}</h5>
                            {secondary&&<p className="text-[10px] text-muted-stone truncate mt-0.5">{secondary}</p>}
                          </div>
                          <div className="flex gap-0 flex-shrink-0" onMouseDown={e=>e.stopPropagation()}>
                            <button onClick={()=>startEdit(p)} className="w-5 h-5 flex items-center justify-center rounded hover:bg-black/5 text-[10px]" title="Edit">✏</button>
                            <button onClick={()=>deleteProspect(p.id)} className="w-5 h-5 flex items-center justify-center rounded hover:bg-red-50 text-[10px] text-red-500" title="Delete">✕</button>
                          </div>
                        </div>
                        <div className="space-y-0.5 mt-1 text-[10px] text-muted-stone">
                          <div className="truncate" style={{color:ch.color}}>{ch.icon} {ch.label}</div>
                          {p.phone&&<a href={'tel:'+p.phone.replace(/\D/g,'')} onClick={e=>e.stopPropagation()} className="block hover:text-brand truncate">📱 {p.phone}</a>}
                          {p.email&&<a href={'mailto:'+p.email} onClick={e=>e.stopPropagation()} className="block hover:text-brand truncate">📧 {p.email}</a>}
                          {p.facebookUrl&&<a href={p.facebookUrl} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()} className="block hover:text-blue-600 text-blue-500 truncate">📘 Facebook</a>}
                          {p.source&&<div className="truncate">Source: {p.source}</div>}
                          {p.followUpDate&&<div className={isOverdue?'text-red-600 font-semibold truncate':'truncate'}>{isOverdue?'⚠ FOLLOW UP TODAY':'📅 '+fmt(p.followUpDate)}</div>}
                        </div>
                        {p.notes&&<p className="text-[10px] text-deep-obsidian/60 mt-1 line-clamp-2 whitespace-pre-wrap">{p.notes}</p>}
                        {/* Mobile-friendly stage selector */}
                        <div className="mt-1.5 pt-1.5 border-t border-glass-border sm:hidden">
                          <select value={p.stage} onChange={e=>updateStage(p.id,e.target.value)}
                            className="w-full text-[10px] px-1.5 py-1 border border-glass-border rounded-lg bg-white">
                            {PROSPECT_STAGES.map(st=><option key={st.key} value={st.key}>Move to: {st.label}</option>)}
                          </select>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// SCHEDULED PAGES
// A queue of finished web pages waiting to go live on a future date.
//
// WHAT THIS SCREEN DOES TODAY:
//   • Add / edit / delete pages in the queue
//   • Saves each page to the cloud via saveData() — same as everything else
//   • Shows status: "scheduled" (waiting, amber) or "published" (live, green)
//
// Each saved page record looks like:
//   { id, title, clientId, website,
//     contentType:'paste'|'link',  // 'paste' = full page in `content`; 'link' = just `sourceUrl`
//     content, sourceUrl, goLiveDate,
//     status:'scheduled'|'published', clientNotified:true|false, createdAt }
// status defaults to 'scheduled' so nothing is ever live by accident.
//
// ┌─────────────────────────────────────────────────────────────┐
// │ 🔧 FUTURE STEP 1 — AUTO-PUBLISH ROBOT  (NOT BUILT YET)       │
// │ Logic that, on each page's goLiveDate, publishes the page to │
// │ the client's website and flips status 'scheduled'→'published'│
// │ Likely a scheduled Netlify Function (cron) that:            │
// │   1. Reads scheduledPages from Firestore                     │
// │   2. Finds pages where goLiveDate <= today & status=scheduled│
// │   3. Deploys page.content to page.website                    │
// │   4. Sets status='published'                                 │
// │   5. Triggers FUTURE STEP 2 below                            │
// │ // function publishDuePages(){ /* TODO: next step */ }       │
// │                                                             │
// │ 🔧 FUTURE STEP 2 — TEXT THE CLIENT  (NOT BUILT YET)         │
// │ After a page publishes, send the client an SMS so it feels  │
// │ like steady work is happening, then set clientNotified=true.│
// │ Likely a Netlify Function calling an SMS provider (Twilio). │
// │ // function notifyClientBySms(page){ /* TODO: next step */ } │
// └─────────────────────────────────────────────────────────────┘
const SCHEDULED_PAGE_STATUS={
  scheduled:{label:'Scheduled',text:'#92400e',bg:'#fef3c7',border:'#d97706'},
  published:{label:'Published',text:'#065f46',bg:'#d1fae5',border:'#059669'}
};

function ScheduledPages({data,setData}){
  const clients=data.clients||[];
  const pages=data.scheduledPages||[];
  const [modalOpen,setModalOpen]=useState(false);
  const [editingId,setEditingId]=useState(null);
  const [form,setForm]=useState({title:'',clientId:'',website:'',contentType:'paste',content:'',sourceUrl:'',fileName:'',goLiveDate:today()});

  // Turn a title into a safe file name, e.g. "Tree Removal in Aurora CO" -> "tree-removal-in-aurora-co.astro"
  const slugify=(s)=>(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  const suggestFileName=(title)=>title?slugify(title)+'.astro':'';

  const clientName=(id)=>{const c=clients.find(c=>c.id===id);return c?c.name:'(client removed)'};
  const fmtDate=(iso)=>{try{return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}catch(e){return iso}};

  // Sort soonest-first so the next page to go live is on top
  const sortedPages=[...pages].sort((a,b)=>(a.goLiveDate||'').localeCompare(b.goLiveDate||''));

  // When you pick a client, auto-fill the website box with that client's site
  // (you can still type a different one if a client has more than one website).
  const pickClient=(id)=>{
    const c=clients.find(c=>c.id===id);
    setForm(s=>({...s,clientId:id,website:c&&c.website?c.website:s.website}));
  };

  // Read a finished page file (.astro/.html/etc.) into the content box.
  // Shared by the "Load from file" button AND drag-and-drop.
  const readFileIntoForm=(f)=>{
    if(!f)return;
    const r=new FileReader();
    r.onload=()=>setForm(s=>({...s,contentType:'paste',content:String(r.result),title:s.title||f.name.replace(/\.[^.]+$/,''),fileName:s.fileName||f.name}));
    r.readAsText(f);
  };
  const loadFile=(e)=>{
    readFileIntoForm(e.target.files&&e.target.files[0]);
    e.target.value=''; // allow re-selecting the same file later
  };
  // Drag-and-drop a file straight onto the content area
  const [dragOver,setDragOver]=useState(false);
  const onDropFile=(e)=>{
    e.preventDefault();
    setDragOver(false);
    const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(f)readFileIntoForm(f);
  };

  const openAdd=()=>{
    setEditingId(null);
    const first=clients[0];
    setForm({title:'',clientId:first?first.id:'',website:first&&first.website?first.website:'',contentType:'paste',content:'',sourceUrl:'',fileName:'',goLiveDate:today()});
    setModalOpen(true);
  };
  const openEdit=(p)=>{
    setEditingId(p.id);
    setForm({title:p.title||'',clientId:p.clientId||'',website:p.website||'',contentType:p.contentType||'paste',content:p.content||'',sourceUrl:p.sourceUrl||'',fileName:p.fileName||'',goLiveDate:p.goLiveDate||today()});
    setModalOpen(true);
  };

  const save=()=>{
    if(!form.title.trim()||!form.clientId||!form.goLiveDate)return; // require the essentials
    // Only keep the field for the chosen type — link mode stores just the URL (no big page in the DB)
    const isLink=form.contentType==='link';
    const contentVal=isLink?'':form.content;
    const sourceUrlVal=isLink?form.sourceUrl.trim():'';
    // File name the auto-publisher will commit (fall back to a slug of the title)
    const fileNameVal=(form.fileName.trim()||suggestFileName(form.title));
    setData(prev=>{
      let sp=prev.scheduledPages||[];
      if(editingId){
        // Editing keeps the existing status & clientNotified flag untouched
        sp=sp.map(p=>p.id===editingId?{...p,title:form.title.trim(),clientId:form.clientId,website:form.website.trim(),contentType:form.contentType,content:contentVal,sourceUrl:sourceUrlVal,fileName:fileNameVal,goLiveDate:form.goLiveDate}:p);
      }else{
        const newPage={
          id:uid(),
          title:form.title.trim(),
          clientId:form.clientId,
          website:form.website.trim(),
          contentType:form.contentType, // 'paste' (full page) or 'link' (just a URL)
          content:contentVal,
          sourceUrl:sourceUrlVal,
          fileName:fileNameVal, // e.g. "tree-removal-aurora.astro" — committed into the client's pages folder
          goLiveDate:form.goLiveDate,
          status:'scheduled',     // default — nothing is ever live by accident
          clientNotified:false,   // future step flips this to true after the SMS sends
          createdAt:new Date().toISOString()
        };
        sp=[...sp,newPage];
      }
      const nd={...prev,scheduledPages:sp};
      saveData(nd);return nd;
    });
    setModalOpen(false);setEditingId(null);
  };

  const remove=(id)=>{
    if(!confirm('Delete this scheduled page? This cannot be undone.'))return;
    setData(prev=>{const nd={...prev,scheduledPages:(prev.scheduledPages||[]).filter(p=>p.id!==id)};saveData(nd);return nd});
  };

  // TEMPORARY manual status toggle — lets you preview the two visual states
  // before the auto-publish robot (FUTURE STEP 1) is built. Safe to remove later.
  const toggleStatus=(id)=>{
    setData(prev=>{
      const nd={...prev,scheduledPages:(prev.scheduledPages||[]).map(p=>p.id===id?{...p,status:p.status==='published'?'scheduled':'published'}:p)};
      saveData(nd);return nd;
    });
  };

  const scheduledCount=pages.filter(p=>p.status!=='published').length;
  const publishedCount=pages.filter(p=>p.status==='published').length;

  return(
    <div className="fade-in font-manrope space-y-6">
      {/* Header */}
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h2 className="text-2xl font-bold text-brand-dark">Scheduled Pages</h2>
          <p className="text-sm text-muted-stone mt-0.5">{scheduledCount} waiting · {publishedCount} published</p>
        </div>
        <button onClick={openAdd} disabled={clients.length===0}
          className="touch-target px-4 py-2 bg-brand text-white rounded-xl text-sm font-medium hover:bg-brand-hover disabled:opacity-50 disabled:cursor-not-allowed shadow-lg shadow-brand/20">
          + Add Page
        </button>
      </div>

      {clients.length===0&&(
        <div className="stitch-glass-card rounded-[24px] p-6 text-center text-sm text-muted-stone">
          Add a client first — then you can queue pages for them.
        </div>
      )}

      {/* Empty state */}
      {clients.length>0&&sortedPages.length===0&&(
        <div className="stitch-glass-card rounded-[24px] p-10 text-center">
          <span className="material-symbols-outlined text-4xl text-brand mb-3">event_repeat</span>
          <p className="text-deep-obsidian/80 font-medium">No scheduled pages yet</p>
          <p className="text-sm text-muted-stone mt-1">Click "Add Page" to queue a finished page for a future go-live date.</p>
        </div>
      )}

      {/* List */}
      <div className="space-y-3">
        {sortedPages.map(p=>{
          const st=SCHEDULED_PAGE_STATUS[p.status]||SCHEDULED_PAGE_STATUS.scheduled;
          return(
            <div key={p.id} className="stitch-glass-card stitch-hover-lift rounded-[20px] border-l-4 p-4 flex flex-col sm:flex-row sm:items-center gap-3"
              style={{borderLeftColor:st.border}}>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 flex-wrap">
                  <h3 className="font-bold text-brand-dark truncate">{p.title}</h3>
                  <span className="inline-block px-2 py-0.5 rounded-full text-xs font-semibold whitespace-nowrap"
                    style={{color:st.text,backgroundColor:st.bg}}>{st.label}</span>
                </div>
                <p className="text-sm text-deep-obsidian/70 mt-1">
                  <span className="font-medium">{clientName(p.clientId)}</span>
                  {p.website&&<span className="text-muted-stone"> · {p.website}</span>}
                </p>
                <p className="text-xs text-muted-stone mt-0.5">Goes live: <span className="font-medium text-deep-obsidian/70">{fmtDate(p.goLiveDate)}</span></p>
                {p.contentType==='link'&&p.sourceUrl?(
                  <p className="text-xs mt-0.5">🔗 <a href={p.sourceUrl} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()} className="text-brand hover:underline break-all">{p.sourceUrl}</a></p>
                ):(p.content&&p.content.trim()?(
                  <p className="text-xs text-muted-stone mt-0.5">📄 Content pasted ({p.content.trim().length.toLocaleString()} chars)</p>
                ):null)}
              </div>
              <div className="flex items-center gap-2 flex-shrink-0">
                {/* Temporary preview toggle — remove once the auto-publish robot exists */}
                <button onClick={()=>toggleStatus(p.id)} title="Preview the other status (temporary)"
                  className="touch-target px-2 py-1.5 text-xs rounded-xl bg-black/5 hover:bg-black/10 text-deep-obsidian/70">↺</button>
                <button onClick={()=>openEdit(p)}
                  className="touch-target px-3 py-1.5 text-xs rounded-xl bg-black/5 hover:bg-black/10 text-deep-obsidian/70 font-medium">Edit</button>
                <button onClick={()=>remove(p.id)}
                  className="touch-target px-3 py-1.5 text-xs rounded-xl bg-red-50 hover:bg-red-100 text-red-600 font-medium">Delete</button>
              </div>
            </div>
          );
        })}
      </div>

      {/* Add / Edit form */}
      <Modal open={modalOpen} onClose={()=>setModalOpen(false)} title={editingId?'Edit Scheduled Page':'Add Scheduled Page'} wide>
        <div className="space-y-4">
          <div>
            <label className="block text-sm font-medium text-deep-obsidian/80 mb-1">Page title</label>
            <input value={form.title} onChange={e=>{const v=e.target.value;setForm(s=>({...s,title:v,fileName:(!s.fileName||s.fileName===suggestFileName(s.title))?suggestFileName(v):s.fileName}))}}
              placeholder="e.g. Emergency Tree Removal in Aurora CO" autoFocus
              className="touch-target w-full px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/>
          </div>

          <div className="grid sm:grid-cols-2 gap-4">
            <div>
              <label className="block text-sm font-medium text-deep-obsidian/80 mb-1">Client</label>
              <select value={form.clientId} onChange={e=>pickClient(e.target.value)}
                className="touch-target w-full px-3 py-2 border border-glass-border rounded-xl bg-white focus:ring-1 focus:ring-brand focus:outline-none">
                {clients.map(c=>(<option key={c.id} value={c.id}>{c.name}</option>))}
              </select>
            </div>
            <div>
              <label className="block text-sm font-medium text-deep-obsidian/80 mb-1">Target website</label>
              <input value={form.website} onChange={e=>setForm(s=>({...s,website:e.target.value}))}
                placeholder="example.com"
                className="touch-target w-full px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/>
              <p className="text-[11px] text-muted-stone mt-1">Auto-filled from the client — change it if they have more than one site.</p>
            </div>
          </div>

          <div className="grid sm:grid-cols-2 gap-4">
            <div>
              <label className="block text-sm font-medium text-deep-obsidian/80 mb-1">File name</label>
              <input value={form.fileName} onChange={e=>setForm(s=>({...s,fileName:e.target.value}))}
                placeholder="auto-filled from title"
                className="touch-target w-full px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/>
              <p className="text-[11px] text-muted-stone mt-1">The file saved into the client's pages folder on go-live.</p>
            </div>
            <div>
              <label className="block text-sm font-medium text-deep-obsidian/80 mb-1">Go-live date</label>
              <input type="date" value={form.goLiveDate} onChange={e=>setForm(s=>({...s,goLiveDate:e.target.value}))}
                className="touch-target w-full px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/>
            </div>
          </div>

          <div>
            <div className="flex items-center justify-between mb-2 gap-2 flex-wrap">
              <label className="block text-sm font-medium text-deep-obsidian/80">Page content</label>
              {/* Per-page choice: paste the whole page, or just store a link to it */}
              <div className="flex gap-1 bg-black/5 rounded-full p-0.5">
                <button type="button" onClick={()=>setForm(s=>({...s,contentType:'paste'}))}
                  className={`px-3 py-1 text-xs rounded-full font-medium transition-all ${form.contentType!=='link'?'bg-white shadow text-brand-dark':'text-muted-stone'}`}>Paste content</button>
                <button type="button" onClick={()=>setForm(s=>({...s,contentType:'link'}))}
                  className={`px-3 py-1 text-xs rounded-full font-medium transition-all ${form.contentType==='link'?'bg-white shadow text-brand-dark':'text-muted-stone'}`}>Link to page</button>
              </div>
            </div>
            {form.contentType==='link'?(
              <div>
                <input type="url" value={form.sourceUrl} onChange={e=>setForm(s=>({...s,sourceUrl:e.target.value}))}
                  placeholder="https://link-to-your-finished-page.com/page"
                  className="touch-target w-full px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/>
                <p className="text-[11px] text-muted-stone mt-1">Stores just the link — keeps large pages out of the database.</p>
              </div>
            ):(
              <div onDragOver={e=>{e.preventDefault();setDragOver(true)}} onDragLeave={()=>setDragOver(false)} onDrop={onDropFile}
                className={`rounded-xl transition-colors ${dragOver?'ring-2 ring-brand bg-brand-light p-1':''}`}>
                <div className="flex items-center justify-between mb-1 gap-2">
                  <span className="text-[11px] text-muted-stone">Drag &amp; drop your .astro file here, paste below, or →</span>
                  <label className="text-xs text-brand hover:underline cursor-pointer whitespace-nowrap">
                    Load from file
                    <input type="file" accept=".astro,.html,.htm,.txt,.md,.mdx,.jsx,.tsx" onChange={loadFile} className="hidden"/>
                  </label>
                </div>
                <textarea value={form.content} onChange={e=>setForm(s=>({...s,content:e.target.value}))}
                  placeholder={dragOver?'Drop your .astro file to load it…':'Drag & drop your .astro file here, or paste the finished page.'}
                  rows={8} className="w-full px-3 py-2 border border-glass-border rounded-xl font-mono text-xs focus:ring-1 focus:ring-brand focus:outline-none"/>
              </div>
            )}
          </div>

          <div className="flex gap-2 pt-1">
            <button onClick={save} disabled={!form.title.trim()||!form.clientId||!form.goLiveDate}
              className="touch-target flex-1 py-2.5 bg-brand text-white rounded-xl hover:bg-brand-hover font-medium disabled:opacity-50 disabled:cursor-not-allowed shadow-lg shadow-brand/20">
              {editingId?'Save Changes':'Add to Queue'}
            </button>
            <button onClick={()=>setModalOpen(false)}
              className="touch-target px-4 py-2.5 bg-black/5 text-deep-obsidian/70 rounded-xl hover:bg-black/10 font-medium">Cancel</button>
          </div>
        </div>
      </Modal>
    </div>
  );
}

function ProspectingTracker({data,setData}){
  const [date,setDate]=useState(today());
  const [period,setPeriod]=useState('week');
  const [selChannel,setSelChannel]=useState('sms');
  const [form,setForm]=useState({outreaches:'',followups:'',responses:'',meetings:'',notes:''});
  const [activeSection,setActiveSection]=useState('pipeline');

  const shiftDate=(days)=>{const d=new Date(date+'T00:00:00');d.setDate(d.getDate()+days);setDate(isoDate(d))};
  const prospecting=data.prospecting||[];
  const goal=data.prospectingGoal||1;

  const dayEntries=prospecting.filter(p=>p.date===date);
  const dayOutreaches=dayEntries.reduce((s,e)=>s+(Number(e.outreaches)||0),0);
  const dayFollowups=dayEntries.reduce((s,e)=>s+(Number(e.followups)||0),0);
  const dayResponses=dayEntries.reduce((s,e)=>s+(Number(e.responses)||0),0);
  const dayMeetings=dayEntries.reduce((s,e)=>s+(Number(e.meetings)||0),0);
  const dayTotal=dayOutreaches+dayFollowups;
  const dayRespRate=dayTotal>0?(dayResponses/dayTotal*100):0;
  const dayBookRate=dayTotal>0?(dayMeetings/dayTotal*100):0;

  const rateColor=(val,greenAbove,yellowAbove)=>val>greenAbove?'text-green-600':val>yellowAbove?'text-yellow-600':'text-red-600';

  // Goal progress (based on meetings booked)
  const goalPct=Math.min(goal>0?(dayMeetings/goal*100):0,100);

  // Streak calculation (consecutive days booking at least 1 meeting)
  const streak=useMemo(()=>{
    let count=0;
    const d=new Date(date+'T00:00:00');
    d.setDate(d.getDate()-1);
    while(true){
      const ds=isoDate(d);
      const entries=prospecting.filter(p=>p.date===ds);
      const meetings=entries.reduce((s,e)=>s+(Number(e.meetings)||0),0);
      if(meetings>=goal){count++;d.setDate(d.getDate()-1)}else{break}
    }
    return count;
  },[prospecting,date,goal]);

  // Period calculations
  const getPeriodEntries=()=>{
    const now=new Date(date+'T00:00:00');
    if(period==='week'){
      const day=now.getDay();
      const mon=new Date(now);mon.setDate(mon.getDate()-((day+6)%7));
      const sun=new Date(mon);sun.setDate(sun.getDate()+6);
      return prospecting.filter(p=>p.date>=isoDate(mon)&&p.date<=isoDate(sun));
    }else if(period==='month'){
      const ym=date.slice(0,7);
      return prospecting.filter(p=>p.date.slice(0,7)===ym);
    }else{
      return prospecting;
    }
  };
  const periodEntries=getPeriodEntries();
  const pOutreaches=periodEntries.reduce((s,e)=>s+(Number(e.outreaches)||0),0);
  const pFollowups=periodEntries.reduce((s,e)=>s+(Number(e.followups)||0),0);
  const pResponses=periodEntries.reduce((s,e)=>s+(Number(e.responses)||0),0);
  const pMeetings=periodEntries.reduce((s,e)=>s+(Number(e.meetings)||0),0);
  const pTotal=pOutreaches+pFollowups;
  const pRespRate=pTotal>0?(pResponses/pTotal*100):0;
  const pBookRate=pTotal>0?(pMeetings/pTotal*100):0;

  // Channel breakdown (all time)
  const channelStats=useMemo(()=>{
    const map={};
    CHANNELS.forEach(ch=>{map[ch.key]={outreaches:0,followups:0,responses:0,meetings:0}});
    prospecting.forEach(e=>{
      if(!map[e.channel])map[e.channel]={outreaches:0,followups:0,responses:0,meetings:0};
      map[e.channel].outreaches+=(Number(e.outreaches)||0);
      map[e.channel].followups+=(Number(e.followups)||0);
      map[e.channel].responses+=(Number(e.responses)||0);
      map[e.channel].meetings+=(Number(e.meetings)||0);
    });
    return CHANNELS.map(ch=>({...ch,...map[ch.key]})).sort((a,b)=>(b.outreaches+b.followups)-(a.outreaches+a.followups));
  },[prospecting]);

  const logActivity=()=>{
    if(!form.outreaches&&!form.followups&&!form.responses&&!form.meetings)return;
    const entry={id:uid(),date,channel:selChannel,outreaches:Number(form.outreaches)||0,followups:Number(form.followups)||0,responses:Number(form.responses)||0,meetings:Number(form.meetings)||0,notes:form.notes,createdAt:new Date().toISOString()};
    setData(prev=>{const nd={...prev,prospecting:[...(prev.prospecting||[]),entry]};saveData(nd);return nd});
    setForm({outreaches:'',followups:'',responses:'',meetings:'',notes:''});
  };

  const deleteEntry=(id)=>{
    setData(prev=>{const nd={...prev,prospecting:(prev.prospecting||[]).filter(e=>e.id!==id)};saveData(nd);return nd});
  };

  const updateGoal=(val)=>{
    setData(prev=>{const nd={...prev,prospectingGoal:Number(val)||1};saveData(nd);return nd});
  };

  const getChannelInfo=(key)=>CHANNELS.find(c=>c.key===key)||{icon:'?',label:key,color:'#888'};

  return(
    <div className="fade-in font-manrope space-y-6">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <h2 className="text-2xl font-bold text-brand-dark">Prospecting</h2>
        <div className="flex gap-1">
          <button onClick={()=>setActiveSection('pipeline')} className={`touch-target px-4 py-2 rounded-full text-sm font-medium transition-all ${activeSection==='pipeline'?'bg-brand text-white shadow-lg shadow-brand/20':'stitch-glass-card text-deep-obsidian/70 hover:bg-black/5'}`}>Pipeline</button>
          <button onClick={()=>setActiveSection('activity')} className={`touch-target px-4 py-2 rounded-full text-sm font-medium transition-all ${activeSection==='activity'?'bg-brand text-white shadow-lg shadow-brand/20':'stitch-glass-card text-deep-obsidian/70 hover:bg-black/5'}`}>Activity Log</button>
        </div>
      </div>

      {activeSection==='pipeline'&&<ProspectPipeline data={data} setData={setData}/>}

      {activeSection==='activity'&&<>
      {/* Date Navigator */}
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div className="flex items-center gap-2">
          <button onClick={()=>shiftDate(-1)} className="touch-target w-10 h-10 rounded-xl stitch-glass-card hover:bg-black/5 flex items-center justify-center text-lg">←</button>
          <input type="date" value={date} onChange={e=>setDate(e.target.value)} className="touch-target px-3 py-2 rounded-xl border border-glass-border bg-white text-sm focus:ring-1 focus:ring-brand focus:outline-none"/>
          <button onClick={()=>shiftDate(1)} className="touch-target w-10 h-10 rounded-xl stitch-glass-card hover:bg-black/5 flex items-center justify-center text-lg">→</button>
          <button onClick={()=>setDate(today())} className="touch-target px-3 py-2 bg-brand text-white rounded-xl text-sm hover:bg-brand-hover shadow-lg shadow-brand/20">Today</button>
        </div>
      </div>

      {/* Daily Stats Cards */}
      <div className="grid grid-cols-2 lg:grid-cols-5 gap-3">
        <div className="stitch-glass-card stitch-hover-lift rounded-[20px] p-5 text-center">
          <p className="text-xs text-muted-stone mb-1">New Outreaches</p>
          <p className="text-3xl font-bold text-brand-dark">{dayOutreaches}</p>
        </div>
        <div className="stitch-glass-card stitch-hover-lift rounded-[20px] p-5 text-center">
          <p className="text-xs text-muted-stone mb-1">Follow-ups</p>
          <p className="text-3xl font-bold text-indigo-600">{dayFollowups}</p>
        </div>
        <div className="stitch-glass-card stitch-hover-lift rounded-[20px] p-5 text-center">
          <p className="text-xs text-muted-stone mb-1">Response Rate</p>
          <p className={`text-3xl font-bold ${rateColor(dayRespRate,15,5)}`}>{dayRespRate.toFixed(1)}%</p>
        </div>
        <div className="stitch-glass-card stitch-hover-lift rounded-[20px] p-5 text-center">
          <p className="text-xs text-muted-stone mb-1">Meetings Booked</p>
          <p className="text-3xl font-bold text-brand-dark">{dayMeetings}</p>
        </div>
        <div className="stitch-glass-card stitch-hover-lift rounded-[20px] p-5 text-center">
          <p className="text-xs text-muted-stone mb-1">Booking Rate</p>
          <p className={`text-3xl font-bold ${rateColor(dayBookRate,5,2)}`}>{dayBookRate.toFixed(1)}%</p>
        </div>
      </div>

      {/* Goal Tracker — Meetings */}
      <div className="stitch-glass-card rounded-[24px] p-6">
        <div className="flex items-center justify-between mb-3">
          <h3 className="text-lg font-bold text-brand-dark">📅 Daily Meeting Goal</h3>
          <div className="flex items-center gap-2">
            <label className="text-xs text-muted-stone">Meetings/day:</label>
            <input type="number" value={goal} onChange={e=>updateGoal(e.target.value)} className="touch-target w-16 px-2 py-1 border border-glass-border rounded-xl text-sm text-center focus:ring-1 focus:ring-brand focus:outline-none" min="1"/>
          </div>
        </div>
        <div className="w-full h-8 bg-black/5 rounded-full overflow-hidden relative mb-2">
          <div className={`h-full rounded-full transition-all duration-500 flex items-center justify-end pr-2 ${dayMeetings>=goal?'bg-green-500':'bg-brand'}`} style={{width:`${Math.max(goalPct,2)}%`}}>
            {goalPct>20&&<span className="text-xs font-bold text-white">{dayMeetings} / {goal}</span>}
          </div>
          {goalPct<=20&&<span className="absolute inset-0 flex items-center justify-center text-xs font-bold text-deep-obsidian/60">{dayMeetings} / {goal}</span>}
        </div>
        <div className="flex items-center justify-between text-sm">
          <span className="text-muted-stone">{dayMeetings>=goal?'✅ Goal hit!':'Keep pushing — book that meeting!'}</span>
          {streak>0&&<span className="text-lg font-bold">🔥 {streak} day streak</span>}
          {streak===0&&<span className="text-muted-stone text-xs">No streak yet — book a meeting to start!</span>}
        </div>
      </div>

      {/* Quick Logger Form */}
      <div className="stitch-glass-card rounded-[24px] p-6">
        <h3 className="text-lg font-bold text-brand-dark mb-3">Log Activity</h3>
        <div className="flex flex-wrap gap-2 mb-4">
          {CHANNELS.map(ch=>(
            <button key={ch.key} onClick={()=>setSelChannel(ch.key)}
              className={`touch-target flex items-center gap-1.5 px-3 py-2 rounded-full text-sm font-medium transition-all ${selChannel===ch.key?'text-white':'stitch-glass-card text-deep-obsidian/70 hover:bg-black/5'}`}
              style={selChannel===ch.key?{backgroundColor:ch.color}:{}}>
              <span>{ch.icon}</span>{ch.label}
            </button>
          ))}
        </div>
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-3">
          <div><label className="text-xs text-muted-stone">New Outreaches</label><input type="number" value={form.outreaches} onChange={e=>setForm(p=>({...p,outreaches:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="0"/></div>
          <div><label className="text-xs text-muted-stone">Follow-ups</label><input type="number" value={form.followups} onChange={e=>setForm(p=>({...p,followups:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-indigo-200 rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="0"/></div>
          <div><label className="text-xs text-muted-stone">Responses</label><input type="number" value={form.responses} onChange={e=>setForm(p=>({...p,responses:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="0"/></div>
          <div><label className="text-xs text-muted-stone">Meetings</label><input type="number" value={form.meetings} onChange={e=>setForm(p=>({...p,meetings:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="0"/></div>
        </div>
        <div className="mb-3"><label className="text-xs text-muted-stone">Notes</label><input value={form.notes} onChange={e=>setForm(p=>({...p,notes:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="Optional notes..."/></div>
        <button onClick={logActivity} className="touch-target w-full py-2.5 bg-brand text-white rounded-xl hover:bg-brand-hover font-medium shadow-lg shadow-brand/20">Log Activity</button>
      </div>

      {/* Today's Activity Feed */}
      <div className="stitch-glass-card rounded-[24px] p-6">
        <h3 className="text-lg font-bold text-brand-dark mb-3">Activity Feed — {new Date(date+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</h3>
        {dayEntries.length===0&&<p className="text-sm text-muted-stone text-center py-4">No prospecting activity logged for this date.</p>}
        {dayEntries.map(e=>{
          const ch=getChannelInfo(e.channel);
          return(
            <div key={e.id} className={`flex items-center gap-3 py-2 border-b border-glass-border last:border-0 ${e.autoFromPipeline?'bg-blue-50/50 rounded-xl px-2 -mx-2':''}`}>
              <span className="text-lg">{ch.icon}</span>
              <div className="w-2 h-2 rounded-full flex-shrink-0" style={{backgroundColor:ch.color}}/>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="text-sm font-medium">{ch.label}</span>
                  {e.autoFromPipeline&&<span className="text-[10px] px-1.5 py-0.5 bg-blue-100 text-blue-600 rounded-full font-medium">Pipeline</span>}
                  <span className="text-xs text-muted-stone">{e.outreaches?e.outreaches+' new':''}{e.followups?' / '+e.followups+' f/u':''}{e.responses?' / '+e.responses+' resp':''}{e.meetings?' / '+e.meetings+' mtg':''}</span>
                </div>
                {e.notes&&<p className="text-xs text-muted-stone truncate">{e.notes}</p>}
              </div>
              <span className="text-[10px] text-muted-stone flex-shrink-0">{new Date(e.createdAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</span>
              <button onClick={()=>deleteEntry(e.id)} className="touch-target w-8 h-8 flex items-center justify-center text-red-400 hover:text-red-600 hover:bg-red-50 rounded-xl flex-shrink-0">✕</button>
            </div>
          );
        })}
      </div>

      {/* Period Stats */}
      <div className="stitch-glass-card rounded-[24px] p-6">
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg font-bold text-brand-dark">Period Stats</h3>
          <div className="flex gap-1">
            {[{k:'week',l:'This Week'},{k:'month',l:'This Month'},{k:'all',l:'All Time'}].map(p=>(
              <button key={p.k} onClick={()=>setPeriod(p.k)} className={`touch-target px-3 py-1.5 rounded-full text-xs font-medium transition-all ${period===p.k?'bg-brand text-white shadow-lg shadow-brand/20':'stitch-glass-card text-deep-obsidian/70 hover:bg-black/5'}`}>{p.l}</button>
            ))}
          </div>
        </div>
        <div className="grid grid-cols-2 lg:grid-cols-5 gap-3">
          <div className="bg-black/[0.03] rounded-xl p-3 text-center">
            <p className="text-xs text-muted-stone mb-1">New Outreaches</p>
            <p className="text-2xl font-bold text-brand-dark">{pOutreaches}</p>
          </div>
          <div className="bg-black/[0.03] rounded-xl p-3 text-center">
            <p className="text-xs text-muted-stone mb-1">Follow-ups</p>
            <p className="text-2xl font-bold text-indigo-600">{pFollowups}</p>
          </div>
          <div className="bg-black/[0.03] rounded-xl p-3 text-center">
            <p className="text-xs text-muted-stone mb-1">Response Rate</p>
            <p className={`text-2xl font-bold ${rateColor(pRespRate,15,5)}`}>{pRespRate.toFixed(1)}%</p>
          </div>
          <div className="bg-black/[0.03] rounded-xl p-3 text-center">
            <p className="text-xs text-muted-stone mb-1">Meetings</p>
            <p className="text-2xl font-bold text-brand-dark">{pMeetings}</p>
          </div>
          <div className="bg-black/[0.03] rounded-xl p-3 text-center">
            <p className="text-xs text-muted-stone mb-1">Booking Rate</p>
            <p className={`text-2xl font-bold ${rateColor(pBookRate,5,2)}`}>{pBookRate.toFixed(1)}%</p>
          </div>
        </div>
      </div>

      {/* Channel Breakdown Table */}
      <div className="stitch-glass-card rounded-[24px] p-6 overflow-x-auto">
        <h3 className="text-lg font-bold text-brand-dark mb-3">Channel Breakdown (All Time)</h3>
        <table className="w-full text-sm">
          <thead><tr className="border-b border-glass-border"><th className="text-left py-2">Channel</th><th className="text-right py-2">New</th><th className="text-right py-2">Follow-ups</th><th className="text-right py-2">Responses</th><th className="text-right py-2">Resp Rate</th><th className="text-right py-2">Meetings</th><th className="text-right py-2">Book Rate</th></tr></thead>
          <tbody>
            {channelStats.map(ch=>{
              const chTotal=ch.outreaches+ch.followups;
              const rr=chTotal>0?(ch.responses/chTotal*100):0;
              const br=chTotal>0?(ch.meetings/chTotal*100):0;
              return(
                <tr key={ch.key} className="border-b border-glass-border">
                  <td className="py-2 font-medium" style={{color:ch.color}}><span className="mr-1">{ch.icon}</span>{ch.label}</td>
                  <td className="text-right">{ch.outreaches}</td>
                  <td className="text-right text-indigo-600">{ch.followups}</td>
                  <td className="text-right">{ch.responses}</td>
                  <td className={`text-right font-medium ${rateColor(rr,15,5)}`}>{rr.toFixed(1)}%</td>
                  <td className="text-right">{ch.meetings}</td>
                  <td className={`text-right font-medium ${rateColor(br,5,2)}`}>{br.toFixed(1)}%</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      </>}
    </div>
  );
}

// Indexing Section Component — submits a URL to Google's Indexing API
// and PrimeIndexer at once (see submit-indexing Netlify function).
// ═══════════════════════════════════════════
function IndexingSection({client}){
  const [url,setUrl]=useState(client.website?(client.website.startsWith('http')?client.website:'https://'+client.website):'');
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null);
  const [error,setError]=useState('');

  const submit=async()=>{
    if(!url)return;
    setLoading(true);setError('');setResult(null);
    try{
      const r=await fetch('/api/submit-indexing',{method:'POST',headers:await authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({url,label:client.name})});
      const j=await r.json();
      if(!r.ok||j.error)setError(j.error||'Request failed');
      else setResult(j);
    }catch(e){setError('Network error submitting for indexing.')}
    setLoading(false);
  };

  const StatusPill=({ok,label})=>(
    <span className={"text-xs px-2 py-1 rounded-full font-medium "+(ok?'bg-green-100 text-green-700':'bg-red-100 text-red-700')}>{label}</span>
  );

  return(
    <div className="stitch-glass-card rounded-[24px] p-6 fade-in font-manrope">
      <h4 className="text-lg font-bold text-brand-dark mb-2">Submit for Indexing</h4>
      <p className="text-sm text-muted-stone mb-3">Pushes a URL to Google's Indexing API and PrimeIndexer at the same time.</p>
      <div className="flex flex-col sm:flex-row gap-2 mb-3">
        <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://example.com/page" className="touch-target flex-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none"/>
        <button onClick={submit} disabled={loading||!url} className="touch-target px-4 py-2 bg-brand text-white rounded-xl text-sm font-medium hover:bg-brand-hover transition-all disabled:opacity-50 shadow-lg shadow-brand/20">{loading?'Submitting...':'Submit'}</button>
      </div>
      {error&&<div className="bg-red-50 text-red-700 rounded-xl p-3 text-sm">{error}</div>}
      {result&&(
        <div className="flex flex-wrap gap-2 items-center">
          <StatusPill ok={result.google.ok} label={'Google: '+result.google.detail}/>
          <StatusPill ok={result.primeIndexer.ok} label={'PrimeIndexer: '+result.primeIndexer.detail}/>
        </div>
      )}
    </div>
  );
}
