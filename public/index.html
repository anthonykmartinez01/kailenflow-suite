function fmt12(t){if(!t)return'';const[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';const h12=h%12||12;return m?`${h12}:${String(m).padStart(2,'0')} ${ap}`:`${h12} ${ap}`}

// Timezone-aware "next run" math for recurring heat maps — mirrors
// netlify/shared/schedule.mts exactly. Duplicated here (not imported) since
// this app has no bundler; if you change the algorithm, update both.
function zonedParts(ms,timeZone){
  const dtf=new Intl.DateTimeFormat('en-US',{timeZone,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short'});
  const parts={};for(const p of dtf.formatToParts(new Date(ms)))parts[p.type]=p.value;
  const weekdayMap={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  return{y:+parts.year,mo:+parts.month,d:+parts.day,h:+parts.hour,mi:+parts.minute,s:+parts.second,dow:weekdayMap[parts.weekday]};
}
function zonedWallTimeToUtcMs(y,mo,d,h,mi,timeZone){
  const guess=Date.UTC(y,mo-1,d,h,mi,0);
  const p=zonedParts(guess,timeZone);
  const asIfUtc=Date.UTC(p.y,p.mo-1,p.d,p.h,p.mi,p.s);
  return guess-(asIfUtc-guess);
}
function addDaysToYmd(y,mo,d,days){
  const dt=new Date(Date.UTC(y,mo-1,d));dt.setUTCDate(dt.getUTCDate()+days);
  return{y:dt.getUTCFullYear(),mo:dt.getUTCMonth()+1,d:dt.getUTCDate()};
}
function computeOnceRunAt(dateStr,timeOfDay,timezone){
  const[y,mo,d]=dateStr.split('-').map(Number);
  const[hh,mm]=timeOfDay.split(':').map(Number);
  return zonedWallTimeToUtcMs(y,mo,d,hh,mm,timezone);
}
function computeInitialNextRunAt(nowMs,sched){
  const[hh,mm]=sched.timeOfDay.split(':').map(Number);
  const now=zonedParts(nowMs,sched.timezone);
  if(sched.frequency==='monthly'){
    let candidate=zonedWallTimeToUtcMs(now.y,now.mo,now.d,hh,mm,sched.timezone);
    if(candidate<=nowMs){let mo=now.mo+1,y=now.y;if(mo>12){mo=1;y++;}candidate=zonedWallTimeToUtcMs(y,mo,now.d,hh,mm,sched.timezone);}
    return candidate;
  }
  const targetDow=sched.dayOfWeek??now.dow;
  const delta=(targetDow-now.dow+7)%7;
  let next=addDaysToYmd(now.y,now.mo,now.d,delta);
  let candidate=zonedWallTimeToUtcMs(next.y,next.mo,next.d,hh,mm,sched.timezone);
  if(candidate<=nowMs){next=addDaysToYmd(now.y,now.mo,now.d,delta+7);candidate=zonedWallTimeToUtcMs(next.y,next.mo,next.d,hh,mm,sched.timezone);}
  return candidate;
}

const FIRESTORE_DOC = db.collection('appData').doc('main');
let _onFirestoreData = null;

// Enable Firestore OFFLINE PERSISTENCE — this means:
// - Firestore caches all data locally in IndexedDB (browser database, NOT localStorage)
// - Reads are instant (from cache) even without internet
// - Writes are queued and sent when connection is restored
// - The app works fully offline
// - Data survives page closes, browser restarts, etc.
db.enablePersistence({synchronizeTabs:true}).catch(err=>{
  if(err.code==='failed-precondition'){
    console.warn('Firestore persistence: multiple tabs open, only one can enable persistence');
  }else if(err.code==='unimplemented'){
    console.warn('Firestore persistence: not supported in this browser');
  }
});

function migrateData(p){
  if(!p.pendingOnboards)p.pendingOnboards=[];
  if(!p.calendarUrl)p.calendarUrl='';
  if(!p.calendarEvents)p.calendarEvents=[];
  if(!p.prospecting)p.prospecting=[];
  if(!p.prospectingGoal)p.prospectingGoal=50;
  if(!p.scheduledPages)p.scheduledPages=[]; // queue of finished pages waiting to go live
  if(!p.transcripts)p.transcripts=[];
  if(!p.personalTasks)p.personalTasks=[];
  if(!p.prospects)p.prospects=[];
  if(!p.spotlights)p.spotlights=[];
  if(!p.calendlyConfig)p.calendlyConfig={connected:false};
  if(p.clients)p.clients.forEach(c=>{
    if(!c.onboarding)c.onboarding={};
    if(!c.setupChecklist)c.setupChecklist={};
    if(!c.contentConfig)c.contentConfig={industry:'',stateAbbrev:'',zipCode:'',email:'',secondaryCategories:'',servicesOffered:'',serviceAreas:'',differentiators:{reviewCount:'',avgResponseTime:'',freeEstimates:'',tripFee:'',availability:'',yearsServing:'',guarantees:'',licenses:'',locallyOwned:'',uniqueDifferentiator:''}};
    if(!c.contentConfig.differentiators)c.contentConfig.differentiators={reviewCount:'',avgResponseTime:'',freeEstimates:'',tripFee:'',availability:'',yearsServing:'',guarantees:'',licenses:'',locallyOwned:'',uniqueDifferentiator:''};
    if(c.architecture===undefined)c.architecture=null;
    if(!c.generatedPages)c.generatedPages=[];
    // Publishing config — tells the auto-publisher which GitHub repo/folder a client's pages go into.
    // repo = "owner/name" (e.g. "anthonykmartinez01/arbor-care-astro"); pagesDir = live pages folder.
    // buildHook = optional Netlify build-hook URL; if set, the auto-publisher pings it after committing
    // so sites that rebuild via a hook (e.g. Inside Prosper) go live within minutes.
    if(!c.publishing)c.publishing={repo:'',branch:'',pagesDir:'src/pages',buildHook:''};
    if(c.publishing.buildHook===undefined)c.publishing.buildHook='';
  });
  return p;
}

function loadData(){
  // Read from localStorage cache for fast initial render
  // The REAL data will come from Firestore via onSnapshot momentarily
  try{
    const d=localStorage.getItem(STORAGE_KEY);
    if(!d) return defaultData();
    const p=JSON.parse(d);
    return migrateData(p);
  }catch(e){return defaultData()}
}

// ═══════════════════════════════════════════════════════════════
// DATA SYNC ENGINE v4 — CLOUD-FIRST
//
// FIRESTORE IS THE SOURCE OF TRUTH. Period.
//
// How it works:
// 1. Every save writes to Firestore IMMEDIATELY
// 2. Firestore's offline persistence (IndexedDB) ensures writes
//    survive page close, browser restart, and offline usage
// 3. onSnapshot listener keeps the UI updated in real-time
//    from ALL sources (this device + other devices)
// 4. localStorage is just a fast cache for initial page render
// 5. Data CANNOT be lost because Firestore persists it both
//    in the cloud AND in IndexedDB locally
// ═══════════════════════════════════════════════════════════════

// Track all write IDs we've issued so the snapshot listener can reliably skip echoes
// (prevents the bug where rapid saves cause earlier echoes to be accepted as "new" data)
const _ourWriteIds=new Set();
// Track the most recent data we have so we can detect attempts to overwrite with less
let _currentDataSnapshot=null;

// Count data items to detect data loss attempts
function countDataItems(d){
  if(!d)return 0;
  let c=0;
  c+=(d.prospects||[]).length*10;
  c+=(d.transcripts||[]).length*10;
  c+=(d.personalTasks||[]).length*5;
  c+=(d.prospecting||[]).length*3;
  c+=(d.calendarEvents||[]).length*2;
  if(d.clients)d.clients.forEach(cl=>{
    c+=(cl.tasks||[]).length*3;
    c+=(cl.activities||[]).length*2;
    c+=(cl.rankData||[]).length*2;
  });
  return c;
}

function saveData(d){
  // Generate a unique write ID so the snapshot listener can identify our own echoes
  const writeId='w_'+Date.now()+'_'+Math.random().toString(36).slice(2,10);
  _ourWriteIds.add(writeId);
  // Clean up old write IDs after 60 seconds (Firestore echoes should arrive well before this)
  setTimeout(()=>_ourWriteIds.delete(writeId),60000);

  // Update our in-memory snapshot so we can reject overwrites
  _currentDataSnapshot=d;

  const json=JSON.stringify(d);
  const payload={
    json:json,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
    savedAt:new Date().toISOString(),
    writeId:writeId
  };
  FIRESTORE_DOC.set(payload).then(()=>{
    console.log('Saved to cloud (writeId:'+writeId+')');
  }).catch(err=>{
    console.warn('Firestore write queued (will retry):',err);
  });

  // Cache in localStorage for fast initial render
  try{
    localStorage.setItem(STORAGE_KEY,json);
    localStorage.setItem(STORAGE_KEY+'_lastSaved',new Date().toISOString());
  }catch(e){}
}

// Real-time listener — keeps UI in sync with Firestore
// Echoes of our own writes are identified by writeId and skipped
// Writes from other devices (different writeId) are accepted
// Snapshots that would lose significant data are BLOCKED as a safety net
FIRESTORE_DOC.onSnapshot(snap=>{
  if(!snap.exists)return;
  const snapData=snap.data();
  const rawJson=snapData.json;
  const writeId=snapData.writeId;
  if(!rawJson)return;

  // If this is our own write echo, skip — we already have this data
  if(writeId&&_ourWriteIds.has(writeId)){
    console.log('Skipping own write echo (writeId:'+writeId+')');
    return;
  }

  // Parse the incoming cloud data
  let d;
  try{d=migrateData(JSON.parse(rawJson))}catch(e){console.error('Failed to parse cloud data:',e);return}

  // ── SAFETY NET: Block snapshots that would lose significant data ──
  // If our current data has much more content than the incoming snapshot, reject it
  if(_currentDataSnapshot){
    const currentCount=countDataItems(_currentDataSnapshot);
    const incomingCount=countDataItems(d);
    if(currentCount>20&&incomingCount<currentCount*0.7){
      console.error('SAFETY: Blocking snapshot that would lose data. Current items:'+currentCount+' Incoming items:'+incomingCount);
      // Re-push our current data to the cloud to restore it
      saveData(_currentDataSnapshot);
      return;
    }
  }

  // Accept this snapshot — it's either initial load or legitimate update from another device
  _currentDataSnapshot=d;
  try{localStorage.setItem(STORAGE_KEY,rawJson);localStorage.setItem(STORAGE_KEY+'_lastSaved',new Date().toISOString())}catch(e){}
  if(_onFirestoreData)_onFirestoreData(d);
  console.log('Accepted cloud update (source:'+(snap.metadata.fromCache?'cache':'server')+', writeId:'+(writeId||'none')+')');
});

// ─── ScoreRing ───
function ScoreRing({value,max=100,size=100,label,subtitle}){
  const pct=max>0?Math.min(value/max*100,100):0;
  const r=40,c=2*Math.PI*r;
  const offset=c-(pct/100)*c;
  const color=pct>70?'#059669':pct>40?'#d97706':'#dc2626';
  const sz=size;
  return(
    <div className="flex flex-col items-center">
      <svg width={sz} height={sz} viewBox="0 0 100 100" className="transform -rotate-90">
        <circle cx="50" cy="50" r={r} fill="none" stroke="#e5e7eb" strokeWidth="8"/>
        <circle cx="50" cy="50" r={r} fill="none" stroke={color} strokeWidth="8" strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={offset} style={{'--target':offset}} className="ring-animate transition-all duration-700"/>
      </svg>
      <div className="absolute flex flex-col items-center justify-center" style={{width:sz,height:sz}}>
        <span className="text-xl font-bold" style={{color}}>{Math.round(pct)}%</span>
      </div>
      {label&&<span className="text-xs font-semibold text-deep-obsidian/70 mt-1">{label}</span>}
      {subtitle&&<span className="text-xs text-muted-stone">{subtitle}</span>}
    </div>
  );
}

function TodaysTasks({data,setData}){
  const [date,setDate]=useState(today());
  const [showAddPersonal,setShowAddPersonal]=useState(false);
  const [newTask,setNewTask]=useState('');
  const [newTaskDate,setNewTaskDate]=useState(today());
  const shiftDate=(days)=>{const d=new Date(date+'T00:00:00');d.setDate(d.getDate()+days);setDate(isoDate(d))};

  // Client tasks
  const clientTasks=useMemo(()=>data.clients.map(c=>{const tasks=c.tasks.filter(t=>t.date===date);const overdue=c.tasks.filter(t=>t.date<date&&t.status!=='Completed');return{client:c,tasks,overdue}}).filter(ct=>ct.tasks.length>0||ct.overdue.length>0),[data,date]);

  // Personal tasks
  const personalTasks=(data.personalTasks||[]).filter(t=>t.date===date);
  const personalOverdue=(data.personalTasks||[]).filter(t=>t.date<date&&t.status!=='Completed');

  // Combined progress
  const allClientTasks=clientTasks.flatMap(ct=>[...ct.tasks,...(date===today()?ct.overdue:[])]);
  const allPersonal=[...personalTasks,...(date===today()?personalOverdue:[])];
  const allTasks=[...allClientTasks,...allPersonal];
  const done=allTasks.filter(t=>t.status==='Completed').length;const total=allTasks.length;const pct=total?Math.round(done/total*100):0;

  const toggleTask=(clientId,taskId)=>{setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>{if(c.id!==clientId)return c;const tasks=c.tasks.map(t=>{if(t.id!==taskId)return t;const ns=t.status==='Completed'?'Pending':'Completed';return{...t,status:ns,completedAt:ns==='Completed'?new Date().toISOString():null}});const task=tasks.find(t=>t.id===taskId);let activities=[...c.activities];if(task.status==='Completed'){activities.push({id:uid(),taskId:task.id,date:new Date().toISOString(),text:`Completed: ${task.title}`,autoGenerated:true,createdAt:new Date().toISOString()})}return{...c,tasks,activities}})};saveData(nd);return nd})};

  const togglePersonalTask=(taskId)=>{setData(prev=>{const pts=(prev.personalTasks||[]).map(t=>{if(t.id!==taskId)return t;const ns=t.status==='Completed'?'Pending':'Completed';return{...t,status:ns,completedAt:ns==='Completed'?new Date().toISOString():null}});const nd={...prev,personalTasks:pts};saveData(nd);return nd})};

  const addPersonalTask=()=>{
    if(!newTask.trim())return;
    const task={id:uid(),title:newTask.trim(),date:newTaskDate,status:'Pending',completedAt:null,createdAt:new Date().toISOString()};
    setData(prev=>{const nd={...prev,personalTasks:[...(prev.personalTasks||[]),task]};saveData(nd);return nd});
    setNewTask('');setNewTaskDate(date);setShowAddPersonal(false);
  };

  const deletePersonalTask=(taskId)=>{setData(prev=>{const nd={...prev,personalTasks:(prev.personalTasks||[]).filter(t=>t.id!==taskId)};saveData(nd);return nd})};

  const hasPersonalForDate=personalTasks.length>0||(date===today()&&personalOverdue.length>0);
  const hasAnything=clientTasks.length>0||hasPersonalForDate;

  return(
    <div className="fade-in font-manrope">

        </div>
      </div>
      <div className="stitch-glass-card rounded-[24px] p-6 mb-6">
        <div className="flex items-center justify-between mb-2"><span className="text-sm font-medium text-deep-obsidian/70">Daily Progress</span><span className="text-sm font-bold text-brand">{done}/{total} tasks</span></div>
        <div className="w-full h-3 bg-black/5 rounded-full overflow-hidden"><div className="h-full bg-brand rounded-full transition-all duration-500" style={{width:`${pct}%`}}/></div>
      </div>

      {/* Personal Tasks Section */}
      <div className="stitch-glass-card rounded-[24px] p-6 mb-4">
        <div className="flex items-center justify-between mb-3">
          <h3 className="text-lg font-bold text-brand-dark flex items-center gap-2">
            <div className="w-8 h-8 rounded-full bg-purple-100 flex items-center justify-center text-purple-600 font-bold text-sm">P</div>

        </div>

        {showAddPersonal&&(
          <div className="bg-purple-50 rounded-xl p-3 mb-3">
            <div className="flex flex-col sm:flex-row gap-2">
              <input value={newTask} onChange={e=>setNewTask(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addPersonalTask()}

              <input type="date" value={newTaskDate} onChange={e=>setNewTaskDate(e.target.value)} className="touch-target px-3 py-2 border border-glass-border rounded-xl text-sm w-auto focus:ring-1 focus:ring-brand focus:outline-none"/>

                <div className="flex-1 min-w-0">
                  <span className={`text-sm ${t.status==='Completed'?'line-through text-muted-stone':'text-red-700'}`}>{t.title}</span>
                  <span className="text-xs text-red-400 ml-2">Due {fmt(t.date)}</span>
                </div>
                <button onClick={()=>deletePersonalTask(t.id)} className="touch-target w-7 h-7 flex items-center justify-center rounded-lg text-muted-stone hover:text-red-500 hover:bg-red-50 opacity-0 group-hover:opacity-100 transition-opacity text-xs">✕</button>
              </div>
            ))}
          </div>
        )}

        {personalTasks.length>0?personalTasks.map(t=>(
          <div key={t.id} className="touch-target flex items-center gap-3 py-2 px-3 rounded-xl hover:bg-purple-50 mb-1 group">

          </div>

      </div>

      {/* Client tasks */}
      {clientTasks.map(({client:c,tasks,overdue})=>(
        <div key={c.id} className="stitch-glass-card rounded-[24px] p-6 mb-4">
          <h3 className="text-lg font-bold text-brand-dark mb-3 flex items-center gap-2"><div className="w-8 h-8 rounded-full bg-brand/20 flex items-center justify-center text-brand font-bold text-sm">{c.name.charAt(0)}</div>{c.name}</h3>
          {date===today()&&overdue.length>0&&(<div className="mb-3"><p className="text-xs font-semibold text-red-600 mb-1">Overdue</p>{overdue.map(t=>(<label key={t.id} className="touch-target flex items-center gap-3 py-2 px-3 rounded-xl hover:bg-red-50 cursor-pointer border-l-2 border-red-400 mb-1"><input type="checkbox" checked={t.status==='Completed'} onChange={()=>toggleTask(c.id,t.id)} className="w-5 h-5 accent-brand flex-shrink-0"/><div className="flex-1 min-w-0"><span className={`text-sm ${t.status==='Completed'?'line-through text-muted-stone':'text-red-700'}`}>{t.title}</span><span className="text-xs text-red-400 ml-2">Due {fmt(t.date)}</span></div><PhaseBadge phase={t.phase}/></label>))}</div>)}
          {tasks.map(t=>(<label key={t.id} className="touch-target flex items-center gap-3 py-2 px-3 rounded-xl hover:bg-brand-light/50 cursor-pointer mb-1"><input type="checkbox" checked={t.status==='Completed'} onChange={()=>toggleTask(c.id,t.id)} className="w-5 h-5 accent-brand flex-shrink-0"/><span className={`flex-1 text-sm ${t.status==='Completed'?'line-through text-muted-stone':''}`}>{t.title}</span><PhaseBadge phase={t.phase}/></label>))}
        </div>

  );

// ─── Website Leads (GoHighLevel forms) ───
// Auto-fetches on mount whenever this client has a ghlLocationId set
// (Settings tab) — no OAuth involved, just our own agency-wide GHL token
// reading that one sub-account's form submissions. Caches the result onto
// the client the same way GSCSection/GA4Section cache their summaries, so
// re-opening the Dashboard doesn't always trigger a fresh network call.
function GHLLeadsCard({client,setData,setTab}){
  const [state,setState]=useState('idle'); // idle|loading|loaded|error
  const [error,setError]=useState('');
  const [errorDetail,setErrorDetail]=useState('');
  // Local state is the source of truth for what's rendered — caching to
  // client.ghlSummary via setData is a nice-to-have for OTHER tabs/next
  // visits, but this component must never depend on that round-trip
  // actually flowing back down through props to show its own fresh result.
  const [leadsData,setLeadsData]=useState(client.ghlSummary||null);
  const fetchedForRef=useRef(null);

  const ready=!!(client.ghlLocationId&&client.ghlPrivateToken);

  const fetchLeads=async()=>{
    if(!ready)return;
    setState('loading');setError('');setErrorDetail('');
    try{
      const r=await fetch('/api/ghl-leads',{method:'POST',headers:await authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({locationId:client.ghlLocationId,token:client.ghlPrivateToken,days:28})});
      const j=await r.json();
      if(!r.ok||j.error){setState('error');setError(j.error||'Failed to load leads');setErrorDetail(j.detail||'');return}
      const summary={totalLeads:j.totalLeads,windowDays:j.windowDays,fetchedAt:Date.now()};
      setLeadsData(summary);
      setState('loaded');
      if(setData){
        setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>c.id===client.id?{...c,ghlSummary:summary}:c)};saveData(nd);return nd});
      }
    }catch(e){setState('error');setError('Network error reaching GoHighLevel.')}
  };

  useEffect(()=>{
    if(fetchedForRef.current===client.id)return;
    fetchedForRef.current=client.id;
    setLeadsData(client.ghlSummary||null);
    if(ready)fetchLeads();
  },[client.id,client.ghlLocationId,client.ghlPrivateToken]);

  return(
    <div className="stitch-glass-card rounded-[24px] p-6">
      <div className="flex items-center justify-between mb-4">
        <h3 className="text-lg font-bold text-brand-dark">Website Leads</h3>
        {ready&&<button onClick={fetchLeads} disabled={state==='loading'} className="text-xs text-brand hover:underline disabled:opacity-50">Refresh</button>}
      </div>
      {!ready&&(
        <div className="text-center py-6">
          <p className="text-sm text-muted-stone mb-2">{client.ghlLocationId?'No GHL Private Integration token set for this client':'No GHL location connected'}</p>
          {setTab&&<button onClick={()=>setTab('settings')} className="text-xs text-brand hover:underline">Set up in Settings</button>}
        </div>
      )}
      {ready&&state==='loading'&&!leadsData&&(
        <div className="text-center py-6"><div className="inline-block w-6 h-6 border-4 border-brand border-t-transparent rounded-full animate-spin"/></div>
      )}
      {ready&&state==='error'&&(
        <div className="text-center py-4">
          <p className="text-xs text-red-600 mb-2">{error}</p>
          {errorDetail&&<p className="text-[10px] text-red-400 mb-2 font-mono break-all">{errorDetail}</p>}
          <button onClick={fetchLeads} className="text-xs text-brand hover:underline">Try Again</button>
        </div>
      )}
      {ready&&leadsData&&(
        <>
          <p className="text-3xl font-bold text-brand-dark">{leadsData.totalLeads.toLocaleString()}</p>
          <p className="text-[11px] text-muted-stone mt-1">Form submissions · last {leadsData.windowDays} days · as of {fmt(leadsData.fetchedAt)}</p>
        </>
      )}
    </div>
  );
}

// ─── Client Dashboard ───
function ClientDashboard({client,data,setData,setTab}){
  const c=client;
  const parseSolv=(s)=>{if(s==null)return null;const n=parseFloat(String(s).replace('%',''));return isNaN(n)?null:n};

  // Same keyword-grouping logic as RankingsTab, so this rolls up into
  // consistent numbers with what that tab shows per-keyword.
  const keywordGroups=useMemo(()=>{
    const groups={};
    (c.rankMaps||[]).forEach(m=>{
      const kw=m.keyword?.toLowerCase().trim();
      if(!kw||kw==='unknown')return;
      if(!groups[kw])groups[kw]={keyword:m.keyword,snapshots:[]};
      groups[kw].snapshots.push(m);
    });
    Object.values(groups).forEach(g=>g.snapshots.sort((a,b)=>(b.snapshotDate||b.completedAt||'').toString().localeCompare((a.snapshotDate||a.completedAt||'').toString())));
    return Object.values(groups);
  },[c.rankMaps]);

  const latestByKeyword=keywordGroups.map(g=>g.snapshots[0]).filter(Boolean);
  const solvValues=latestByKeyword.map(m=>typeof m.solv==='number'?m.solv:parseSolv(m.solv)).filter(v=>v!=null);
  const avgSolv=solvValues.length?solvValues.reduce((a,b)=>a+b,0)/solvValues.length:null;
  const rankValues=latestByKeyword.map(m=>m.avgRank).filter(v=>v!=null&&v>0);
  const avgLocalRank=rankValues.length?rankValues.reduce((a,b)=>a+b,0)/rankValues.length:null;

  const prevByKeyword=keywordGroups.map(g=>g.snapshots[1]).filter(Boolean);
  const prevSolvValues=prevByKeyword.map(m=>typeof m.solv==='number'?m.solv:parseSolv(m.solv)).filter(v=>v!=null);
  const prevAvgSolv=prevSolvValues.length?prevSolvValues.reduce((a,b)=>a+b,0)/prevSolvValues.length:null;
  const solvChangePct=(avgSolv!=null&&prevAvgSolv!=null&&prevAvgSolv>0)?((avgSolv-prevAvgSolv)/prevAvgSolv*100):null;

  const genPages=c.generatedPages||[];
  const locationPagesGenerated=genPages.filter(p=>p.type==='location').length;
  const locationPagesTotal=(c.architecture&&c.architecture.locationPages)?c.architecture.locationPages.length:0;
  const lastCrawl=(c.contentGap||{}).lastCrawl;
  const pageSpeedScore=c.pageSpeed?.mobile?.score;

  const latestLiveMap=(c.rankMaps||[]).filter(m=>m.generatedBy==='live'&&m.status==='complete').sort((a,b)=>(b.completedAt||0)-(a.completedAt||0))[0];
  const avatarLetter=(c.name||'?').charAt(0).toUpperCase();

  // Pull the client's website hero image (its own og:image) and cache it.
  // A failed check (site has no og:image, blocked our fetch, timed out,
  // etc.) used to be cached as '' FOREVER with no way to retry — a site
  // that failed once (transient block, slow load) or has since added an
  // og:image would just stay blank indefinitely. Now a failed check is
  // only "sticky" for 7 days, and there's a manual retry link either way.
  const HERO_RECHECK_MS=7*24*60*60*1000;
  const [heroImage,setHeroImage]=useState(c.heroImage||null);
  const [heroChecking,setHeroChecking]=useState(false);
  const heroFetchedForRef=useRef(null);

  const checkHeroImage=async()=>{
    if(!c.website)return;
    setHeroChecking(true);
    try{
      const r=await fetch('/api/fetch-hero-image',{method:'POST',headers:await authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({website:c.website})});
      const j=await r.json();
      const found=j.image||'';
      setHeroImage(found||null); // always update — clears a stale/bad cached image if this recheck comes up empty
      if(!found)console.warn(`[hero image] ${c.name}: ${j.reason||'no image found'}`);
      if(setData){
        setData(prev=>{const nd={...prev,clients:prev.clients.map(cl=>cl.id===c.id?{...cl,heroImage:found,heroImageCheckedAt:Date.now()}:cl)};saveData(nd);return nd});
      }
    }catch(e){/* silent — heroImageCheckedAt never gets set, so it retries next visit */}
    setHeroChecking(false);
  };

  useEffect(()=>{
    if(heroFetchedForRef.current===c.id)return;
    heroFetchedForRef.current=c.id;
    setHeroImage(c.heroImage||null);
    const staleEnough=!c.heroImageCheckedAt||(Date.now()-c.heroImageCheckedAt>HERO_RECHECK_MS);
    if(!c.heroImage&&staleEnough)checkHeroImage();
  },[c.id,c.website]);

  return(
    <div className="fade-in font-manrope space-y-4">
      {/* Header: identity + latest heat map */}

        {heroImage&&<div className="absolute inset-0" style={{background:'linear-gradient(to right, rgba(242,236,228,0.97) 0%, rgba(242,236,228,0.92) 30%, rgba(242,236,228,0.6) 60%, rgba(242,236,228,0.3) 100%)'}}/>}
        <div className="grid grid-cols-1 lg:grid-cols-[1fr_380px] relative">
          <div className="p-5">
            <div className="flex items-start gap-3">
              <div className="w-14 h-14 rounded-full bg-brand/15 text-brand flex items-center justify-center font-bold text-xl flex-shrink-0">{avatarLetter}</div>
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2 flex-wrap">
                  <h2 className="text-xl font-bold text-brand-dark truncate">{c.name}</h2>
                  <span className="text-xs px-2 py-0.5 rounded-full bg-green-100 text-green-700 font-medium">Active</span>
                </div>
                {c.primaryCategory&&<p className="text-sm text-brand font-medium mt-0.5">{c.primaryCategory}</p>}
              </div>
            </div>
            <div className="mt-3 space-y-1.5 text-sm">
              {(c.address||c.city)&&(
                <div className="flex items-center gap-2 text-deep-obsidian/70">
                  <span className="material-symbols-outlined text-[18px] text-muted-stone">location_on</span>
                  <span>{[c.address,c.city,c.state].filter(Boolean).join(', ')}</span>
                </div>
              )}
              {c.website&&(
                <div className="flex items-center gap-2">
                  <span className="material-symbols-outlined text-[18px] text-muted-stone">language</span>

                </div>

              {c.phone&&(

                </div>
              )}
            </div>
            <div className="flex items-center gap-3 mt-3 flex-wrap">
              {setTab&&<button onClick={()=>setTab('settings')} className="touch-target px-4 py-2 bg-brand text-white rounded-xl text-sm font-medium hover:bg-brand-hover shadow-lg shadow-brand/20">Business Settings</button>}
              {c.website&&(
                <button onClick={checkHeroImage} disabled={heroChecking} className="text-xs text-brand hover:underline disabled:opacity-50">{heroChecking?'Checking...':heroImage?'Re-check background image':'Retry background image'}</button>

            </div>
          </div>
          <div className="lg:border-l border-glass-border min-h-[260px]">
            {latestLiveMap?(

            ):(
              <div className="h-full min-h-[260px] flex flex-col items-center justify-center text-center p-6 bg-warm-sand/90">
                <span className="material-symbols-outlined text-3xl text-muted-stone mb-2">map</span>
                <p className="text-sm text-muted-stone">No rank map yet</p>
                {setTab&&<button onClick={()=>setTab('rankings')} className="text-xs text-brand hover:underline mt-1">Generate one in Rankings</button>}
              </div>
            )}
          </div>
        </div>
      </div>

      {/* Top-line stats — same icon-chip bento pattern + brand-accent hero
          card as AllClientsOverview's stat row, for visual consistency
          across the two dashboards. */}
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div className="bg-brand stitch-hover-lift p-6 rounded-[24px] flex flex-col justify-between min-h-[150px] text-white shadow-xl shadow-brand/20">
          <div className="bg-white/20 p-3 rounded-xl w-fit"><span className="material-symbols-outlined text-white">visibility</span></div>
          <div className="mt-4">
            <p className="text-[11px] font-semibold opacity-80 uppercase tracking-widest mb-1">Market Visibility</p>
            {avgSolv!=null?(
              <div className="flex items-center gap-2 flex-wrap">
                <h3 className="text-3xl font-bold">{avgSolv.toFixed(1)}%</h3>
                {solvChangePct!=null&&Math.abs(solvChangePct)>=0.1&&(
                  <span className="text-xs font-bold flex items-center gap-0.5 bg-white/20 px-1.5 py-0.5 rounded-full">
                    <span className="material-symbols-outlined text-[14px]">{solvChangePct>0?'arrow_upward':'arrow_downward'}</span>{Math.abs(solvChangePct).toFixed(1)}%

            ):<h3 className="text-3xl font-bold opacity-60">—</h3>}

          </div>
        </div>
        <div className="stitch-glass-card stitch-hover-lift p-6 rounded-[24px] flex flex-col justify-between min-h-[150px]">
          <div className="bg-brand/10 p-3 rounded-xl w-fit"><span className="material-symbols-outlined text-brand">social_leaderboard</span></div>
          <div className="mt-4">
            <p className="text-[11px] font-semibold text-muted-stone uppercase tracking-widest mb-1">Avg. Rank</p>
            <h3 className="text-3xl font-bold text-brand-dark">{avgLocalRank!=null?avgLocalRank.toFixed(1):'—'}</h3>
            <p className="text-[11px] text-muted-stone mt-1">Average local pack position</p>

        </div>
        <div className="stitch-glass-card stitch-hover-lift p-6 rounded-[24px] flex flex-col justify-between min-h-[150px]">
          <div className="bg-brand/10 p-3 rounded-xl w-fit"><span className="material-symbols-outlined text-brand">search</span></div>
          <div className="mt-4">
            <p className="text-[11px] font-semibold text-muted-stone uppercase tracking-widest mb-1">Organic Rankings</p>
            {c.gscSummary?(

                <h3 className="text-3xl font-bold text-brand-dark">#{c.gscSummary.avgPosition.toFixed(1)}</h3>

              <a href={c.website.startsWith('http')?c.website:'https://'+c.website} target="_blank" rel="noopener noreferrer" className="text-sm font-medium text-brand-dark hover:underline truncate">{c.website}</a>
            </div>

          <div className="grid grid-cols-2 gap-3">
            <div className="bg-black/[0.03] rounded-xl p-4 flex items-center gap-3 relative">

                <>
                  <ScoreRing value={pageSpeedScore} size={56} label=""/>
                  <div>
                    <p className="text-xs text-muted-stone">PageSpeed (Mobile)</p>
                    {c.pageSpeed?.lastRun&&<p className="text-[11px] text-muted-stone">Last run {fmt(c.pageSpeed.lastRun)}</p>}
                  </div>

                  <p className="text-xs text-muted-stone mb-1">PageSpeed</p>
                  {setTab&&<button onClick={()=>setTab('analytics')} className="text-xs text-brand hover:underline">Run a test</button>}
                </div>

            <div className="bg-black/[0.03] rounded-xl p-4">
              <p className="text-xs text-muted-stone mb-1">Last Crawl</p>
              <p className="text-sm font-medium text-deep-obsidian/80">{lastCrawl?fmt(lastCrawl):'Not crawled yet'}</p>

// ─── Tasks Tab ───
function TasksTab({client,setData}){
  const [subTab,setSubTab]=useState('list'); // 'list' | 'activity'
  const [filter,setFilter]=useState('All');const [phaseFilter,setPhaseFilter]=useState('All');const [modalOpen,setModalOpen]=useState(false);const [editTask,setEditTask]=useState(null);const [form,setForm]=useState({title:'',description:'',phase:'Pre-work',date:today(),status:'Pending'});
  const tasks=useMemo(()=>{let t=[...client.tasks];if(filter!=='All')t=t.filter(x=>x.status===filter);if(phaseFilter!=='All')t=t.filter(x=>x.phase===phaseFilter);return t.sort((a,b)=>a.date.localeCompare(b.date))},[client.tasks,filter,phaseFilter]);
  const openAdd=()=>{setEditTask(null);setForm({title:'',description:'',phase:'Pre-work',date:today(),status:'Pending'});setModalOpen(true)};
  const openEdit=(t)=>{setEditTask(t);setForm({title:t.title,description:t.description||'',phase:t.phase,date:t.date,status:t.status});setModalOpen(true)};
  const saveTask=()=>{if(!form.title.trim())return;setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>{if(c.id!==client.id)return c;let tasks,activities=[...c.activities];if(editTask){tasks=c.tasks.map(t=>t.id===editTask.id?{...t,...form,completedAt:form.status==='Completed'&&!t.completedAt?new Date().toISOString():t.completedAt}:t)}else{const newT={id:Date.now(),date:form.date,title:form.title,description:form.description,phase:form.phase,status:form.status,createdAt:new Date().toISOString(),completedAt:null};tasks=[...c.tasks,newT];activities.push({id:uid(),taskId:newT.id,date:new Date().toISOString(),text:`Task added: ${newT.title}`,autoGenerated:true,createdAt:new Date().toISOString()})}return{...c,tasks,activities}})};saveData(nd);return nd});setModalOpen(false)};
  const toggleTask=(taskId)=>{setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>{if(c.id!==client.id)return c;const tasks=c.tasks.map(t=>{if(t.id!==taskId)return t;const ns=t.status==='Completed'?'Pending':'Completed';return{...t,status:ns,completedAt:ns==='Completed'?new Date().toISOString():null}});const task=tasks.find(t=>t.id===taskId);let activities=[...c.activities];if(task.status==='Completed'){activities.push({id:uid(),taskId:task.id,date:new Date().toISOString(),text:`Completed: ${task.title}`,autoGenerated:true,createdAt:new Date().toISOString()})}return{...c,tasks,activities}})};saveData(nd);return nd})};
  const deleteTask=(taskId)=>{if(!confirm('Delete this task?'))return;setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>{if(c.id!==client.id)return c;return{...c,tasks:c.tasks.filter(t=>t.id!==taskId)}})};saveData(nd);return nd})};

  const [activityText,setActivityText]=useState('');
  const activities=useMemo(()=>[...client.activities].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)),[client.activities]);
  const addEntry=()=>{if(!activityText.trim())return;setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>{if(c.id!==client.id)return c;return{...c,activities:[...c.activities,{id:uid(),taskId:'',date:new Date().toISOString(),text:activityText.trim(),autoGenerated:false,createdAt:new Date().toISOString()}]}})};saveData(nd);return nd});setActivityText('')};

  return(
    <div className="fade-in font-manrope">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <h3 className="text-xl font-bold text-brand-dark">Tasks & Activity</h3>
        {subTab==='list'&&<button onClick={openAdd} className="touch-target px-4 py-2 bg-brand text-white rounded-xl hover:bg-brand-hover text-sm font-medium shadow-lg shadow-brand/20">+ Add Task</button>}
      </div>
      <div className="flex flex-wrap gap-2 mb-4">
        <button onClick={()=>setSubTab('list')} className={`touch-target px-4 py-2 rounded-full text-sm font-medium transition-all flex items-center gap-1.5 ${subTab==='list'?'bg-brand text-white shadow-lg shadow-brand/20':'stitch-glass-card text-deep-obsidian/70 hover:bg-black/5'}`}><span className="material-symbols-outlined text-[16px]">task_alt</span>Task List</button>

            {tasks.length===0&&<div className="stitch-glass-card rounded-[24px] p-8 text-center text-muted-stone">No tasks match your filters.</div>}
          </div>
        </>

      {subTab==='activity'&&(
        <>
          <div className="flex gap-2 mb-4"><input value={activityText} onChange={e=>setActivityText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addEntry()} placeholder="Add a manual entry..." className="touch-target flex-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/><button onClick={addEntry} className="touch-target px-4 py-2 bg-brand text-white rounded-xl hover:bg-brand-hover text-sm shadow-lg shadow-brand/20">Add</button></div>
          <div className="space-y-2">
            {activities.map(a=>(<div key={a.id} className="stitch-glass-card rounded-[16px] p-3 flex items-start gap-3"><div className={`w-2 h-2 rounded-full mt-1.5 flex-shrink-0 ${a.autoGenerated?'bg-blue-400':'bg-brand'}`}/><div className="flex-1"><p className="text-sm">{a.text}</p><div className="flex items-center gap-2 mt-1"><span className="text-xs text-muted-stone">{fmt(a.createdAt)}</span>{a.autoGenerated&&<span className="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded-full">Auto-logged</span>}</div></div></div>))}
            {activities.length===0&&<div className="stitch-glass-card rounded-[24px] p-8 text-center text-muted-stone">No activity recorded yet.</div>}

        <div className="space-y-3">
          <div><label className="text-sm font-medium text-deep-obsidian/70">Title</label><input value={form.title} onChange={e=>setForm(p=>({...p,title:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" placeholder="Task title"/></div>
          <div><label className="text-sm font-medium text-deep-obsidian/70">Description</label><textarea value={form.description} onChange={e=>setForm(p=>({...p,description:e.target.value}))} className="w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none" rows="2"/></div>
          <div className="grid grid-cols-2 gap-3"><div><label className="text-sm font-medium text-deep-obsidian/70">Phase</label><select value={form.phase} onChange={e=>setForm(p=>({...p,phase:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none">{PHASES.map(p=><option key={p}>{p}</option>)}</select></div><div><label className="text-sm font-medium text-deep-obsidian/70">Date</label><input type="date" value={form.date} onChange={e=>setForm(p=>({...p,date:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"/></div></div>
          <div><label className="text-sm font-medium text-deep-obsidian/70">Status</label><select value={form.status} onChange={e=>setForm(p=>({...p,status:e.target.value}))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:outline-none"><option>Pending</option><option>In Progress</option><option>Completed</option></select></div>
          <button onClick={saveTask} className="touch-target w-full py-2.5 bg-brand text-white rounded-xl hover:bg-brand-hover font-medium shadow-lg shadow-brand/20">{editTask?'Update Task':'Add Task'}</button>
        </div>
      </Modal>
