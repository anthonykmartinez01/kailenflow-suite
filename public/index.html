        }
        setArchError('');
        return;
      }

      if(!hasCategories&&!hasServiceAreas){
        setArchError('Could not find any categories, services, or service areas in the pasted text. Make sure you\'re pasting from GBP "Edit Services" or "Service areas".');
        return;
      }

      // Full hierarchy parse — add trust signals and local issues
      if(trustSignals.trim()){
        parsed.basicInfo.trustSignals=trustSignals.split(',').map(s=>s.trim()).filter(Boolean);
      }
      if(localIssues.trim()){
        parsed.basicInfo.localIssues=localIssues.split(',').map(s=>s.trim()).filter(Boolean);
      }
      const catCount=parsed.secondaryCategories.length;
      const serviceCount=parsed.secondaryCategories.reduce((sum,c)=>sum+(c.coreServices||[]).length,0);
      setParsedSummary(`Found ${catCount} categor${catCount===1?'y':'ies'} with ${serviceCount} total services${hasServiceAreas?' + '+ext.serviceAreas.length+' service areas':''}`);
      setArchText(JSON.stringify(parsed,null,2));
      updateClient('architecture',parsed);

      // Auto-fill ALL Content Setup fields from parsed data

      // Build flat services list from all categories + their children
      const allServices=[];
      parsed.secondaryCategories.forEach(cat=>{
        (cat.coreServices||[]).forEach(svc=>{allServices.push(svc.name)});
      });
      const servicesStr=allServices.join(', ');
      if(servicesStr)updateCC('servicesOffered',servicesStr);

      // Auto-fill secondary GBP categories (non-primary ones) — always overwrite
      const secondaryCatNames=(ext.secondaryCategories||[]).join(', ');
      updateCC('secondaryCategories',secondaryCatNames);

      // Auto-fill primary category on the client record
      if(ext.primaryCategory){updateClient('primaryCategory',ext.primaryCategory)}

      // Auto-fill industry from primary category if not already set
      if(ext.primaryCategory&&!(localCC.industry||'').trim()){
        updateCC('industry',ext.primaryCategory);
      }

      // Auto-fill service areas if extracted from GBP paste
      if(hasServiceAreas){
        const areasStr=ext.serviceAreas.join(', ');
        updateCC('serviceAreas',areasStr);
      }
    }catch(e){setArchError('Error parsing hierarchy: '+e.message)}
  };

  const saveArchitecture=()=>{
    try{
      const parsed=JSON.parse(archText);
      updateClient('architecture',parsed);
      setArchError('');
      setParsedSummary('Architecture saved successfully');
    }catch(e){setArchError('Invalid JSON. Fix the syntax and try again.')}
  };

  const updateTrustAndIssues=()=>{
    if(!client.architecture)return;
    const arch={...client.architecture};
    if(!arch.basicInfo)arch.basicInfo={targetKeyword:'',trustSignals:[],localIssues:[]};
    arch.basicInfo.trustSignals=trustSignals.split(',').map(s=>s.trim()).filter(Boolean);
    arch.basicInfo.localIssues=localIssues.split(',').map(s=>s.trim()).filter(Boolean);
    setArchText(JSON.stringify(arch,null,2));
    updateClient('architecture',arch);
  };

  // Build page metadata header for generated content
  const buildPageMeta=(pType,pName,selectedOpt)=>{
    const arch=client.architecture||{};
    const cc=client.contentConfig||{};
    const city=client.city||'';
    const st=cc.stateAbbrev||'';
    const biz=client.name||'';
    const typeLabel=CONTENT_PAGE_TYPES.find(t=>t.value===pType)?.label||pType;
    let slug='/',parentPath='',parentName='',childList='',structureNotes='';

    if(pType==='homepage'){
      slug='/';
      structureNotes='This is the top-level page. It should link down to all secondary category pages.';
    }else if(pType==='secondaryCategory'){
      const cat=(arch.secondaryCategories||[]).find(c=>c.name===pName);
      slug=cat?cat.slug:nameToSlug(pName);
      parentPath='/';parentName='Homepage';
      const services=(cat?.coreServices||[]).map(s=>s.name).join(', ');
      childList=services?`\nChild Pages: ${services}`:'';
      structureNotes=`This is a category hub page. It sits directly below the Homepage.\nIt should link UP to the Homepage and DOWN to each of its service pages.`;
    }else if(pType==='coreService'){
      const parentCat=selectedOpt.parentCategory||'';
      const cat=(arch.secondaryCategories||[]).find(c=>c.name===parentCat);
      const svc=cat?(cat.coreServices||[]).find(s=>s.name===pName):null;
      slug=svc?svc.slug:nameToSlug(pName);
      parentPath=cat?cat.slug:'/';parentName=parentCat||'Parent Category';
      const children=(svc?.childServices||[]).map(s=>s.name).join(', ');
      childList=children?`\nChild Pages: ${children}`:'';
      structureNotes=`This is a core service page under the "${parentCat}" category.\nIt should link UP to "${parentCat}" (${parentPath}) and DOWN to its child service pages.\nAlso link to the Homepage and Contact page.`;
    }else if(pType==='childService'){
      const parentCat=selectedOpt.parentCategory||'';
      const parentSvc=selectedOpt.parentService||'';
      const cat=(arch.secondaryCategories||[]).find(c=>c.name===parentCat);
      const core=cat?(cat.coreServices||[]).find(s=>s.name===parentSvc):null;
      const child=core?(core.childServices||[]).find(s=>s.name===pName):null;
      slug=child?child.slug:nameToSlug(pName);
      parentPath=core?core.slug:'/';parentName=parentSvc||'Parent Service';
      structureNotes=`This is a child service page under "${parentSvc}" → "${parentCat}".\nIt should link UP to "${parentSvc}" (${parentPath}) and to the category page.\nAlso link to the Homepage and Contact page.`;
    }else if(pType==='location'){
      const lp=(arch.locationPages||[]).find(l=>(l.city||l.title)===pName);
      slug=lp?lp.slug:'/service-areas/'+nameToSlug(pName).replace('/','');
      parentPath='/';parentName='Homepage';
      structureNotes=`This is a location/service area page.\nIt should link to the Homepage, relevant service pages, and the Contact page.`;
    }else if(pType==='about'){
      slug='/about';parentPath='/';parentName='Homepage';
      structureNotes='Support page. Link to Homepage, Contact, and key service pages.';
    }else if(pType==='contact'){
      slug='/contact';parentPath='/';parentName='Homepage';
      structureNotes='Support page. Link to Homepage and include NAP (name, address, phone).';
    }

    return`════════════════════════════════════════════════════
PAGE BUILD INSTRUCTIONS
════════════════════════════════════════════════════
Page Type: ${typeLabel}
Page Name: ${pName||typeLabel}
URL Slug: ${slug}
Parent Page: ${parentName} (${parentPath})${childList}
Business: ${biz} — ${city}, ${st}

SITE STRUCTURE:
${structureNotes}

INSTRUCTIONS FOR BUILDING THIS PAGE:
Create a new page at "${slug}" in the website.
Use the content below as the copy for this page.
Follow the heading structure (H1, H2, H3) exactly as written.
Ensure all internal links point to the correct URL slugs.
Add the appropriate schema markup (${pType==='homepage'?'LocalBusiness + Organization':pType.includes('Service')||pType==='secondaryCategory'?'Service':'Organization'}).
════════════════════════════════════════════════════

`;
  };

  // Generate page content
  const generatePage=async()=>{
    if(!apiKey){setPageError('Set your API key above first.');return}
    if(!pageName&&pageType!=='homepage'&&pageType!=='about'&&pageType!=='contact'){setPageError('Select a page from the dropdown.');return}
    setPageLoading(true);setPageError('');setPageOutput('');
    try{
      const pair=getPromptPair(pageType);
      if(!pair){setPageError('Unknown page type.');setPageLoading(false);return}
      // Build substitution with content-specific vars
      let userPrompt=substituteVars(pair.user,client);
      const selectedOpt=pageOptions.find(o=>o.value===pageName)||{};
      userPrompt=userPrompt.split('{content.pageName}').join(pageName||'');
      userPrompt=userPrompt.split('{content.parentCategory}').join(selectedOpt.parentCategory||pageParent||'');
      userPrompt=userPrompt.split('{content.parentService}').join(selectedOpt.parentService||'');
      userPrompt=userPrompt.split('{content.childServices}').join(selectedOpt.childServices||pageChildServices||'');
      const sysPrompt=substituteVars(pair.system,client);
      const result=await callContentAPI(sysPrompt,userPrompt,apiKey);
      // Prepend page build instructions header
      const meta=buildPageMeta(pageType,pageName||pageType,selectedOpt);
      const fullOutput=meta+result;
      setPageOutput(fullOutput);
      // Save to generatedPages
      const newPage={id:uid(),type:pageType,name:pageName||pageType,content:fullOutput,date:today()};
      setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>{
        if(c.id!==client.id)return c;
        return{...c,generatedPages:[...(c.generatedPages||[]),newPage]};
      })};saveData(nd);return nd});
    }catch(e){setPageError(e.message)}
    setPageLoading(false);
  };

  const copyToClipboard=(text)=>{navigator.clipboard.writeText(text).then(()=>{setCopyMsg('Copied!');setTimeout(()=>setCopyMsg(''),2000)})};

  const deleteGeneratedPage=(pageId)=>{
    if(!confirm('Delete this generated page?'))return;
    setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>{
      if(c.id!==client.id)return c;
      return{...c,generatedPages:(c.generatedPages||[]).filter(p=>p.id!==pageId)};
    })};saveData(nd);return nd});
  };

  // ─── SEO Checker ───
  const runSeoCheck=async()=>{
    if(!seoInput.trim()){return}
    setSeoLoading(true);setSeoResults(null);
    try{
      let html=seoInput.trim();
      // If it looks like a URL, fetch it
      if(html.startsWith('http')){
        try{
          const resp=await fetch('/.netlify/functions/fetch-page',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:html})});
          const result=await resp.json();
          if(result.error){setSeoResults({error:'Could not fetch URL: '+result.error});setSeoLoading(false);return;}
          html=result.html;
        }catch(e){
          setSeoResults({error:'Could not fetch URL. Paste the HTML directly instead.'});
          setSeoLoading(false);return;
        }
      }
      const parser=new DOMParser();
      const doc=parser.parseFromString(html,'text/html');
      const checks=[];
      const rawHtml=html; // Keep raw HTML for fallback searches

      // Extract ALL text including schema JSON for comprehensive search
      const bodyText=doc.body?doc.body.textContent:'';
      const fullText=rawHtml; // Search raw HTML when DOM text is thin

      // Detect JS-rendered sites (very little visible text in raw HTML body)
      const isJSRendered=bodyText.replace(/\s/g,'').length<200&&(rawHtml.includes('__NEXT_DATA__')||rawHtml.includes('window.__')||rawHtml.includes('react-root')||rawHtml.includes('app-root')||rawHtml.includes('wix-')||rawHtml.includes('sqs-')||rawHtml.includes('squarespace')||rawHtml.includes('webflow')||rawHtml.length>5000);

      // Extract schema data for smarter checks
      let schemaText='';
      const schemas=[...doc.querySelectorAll('script[type="application/ld+json"]')];
      schemas.forEach(s=>{try{schemaText+=s.textContent+' '}catch(e){}});

      // Also look for schema in raw HTML (some sites inject it dynamically)
      const schemaMatches=rawHtml.match(/<script[^>]*type="application\/ld\+json"[^>]*>([\s\S]*?)<\/script>/gi)||[];
      if(schemaMatches.length>schemas.length){
        schemaMatches.forEach(m=>{const inner=m.replace(/<script[^>]*>/i,'').replace(/<\/script>/i,'');schemaText+=inner+' '});
      }
      const schemaCount=Math.max(schemas.length,schemaMatches.length);

      // Combined text for searching (body text + schema text + raw HTML)
      const searchText=bodyText+' '+schemaText+' '+rawHtml;

      // JS-rendered warning
      if(isJSRendered){
        checks.push({category:'⚠️ JavaScript-Rendered Site',status:'warning',detail:'This site loads content via JavaScript. Some checks may be incomplete because the server-side HTML is mostly empty.',recommendation:'For the most accurate results, paste the full rendered HTML instead (right-click → View Page Source in browser, or use Ctrl+U)'});
      }

      // Title tag
      const title=doc.querySelector('title');
      checks.push({category:'Title Tag',status:title&&title.textContent.trim().length>0?'pass':'fail',detail:title?`"${title.textContent.trim()}" (${title.textContent.trim().length} chars)`:'Missing title tag',recommendation:!title?'Add a title tag with primary keyword + city + business name':title.textContent.trim().length>60?'Title is over 60 characters — consider shortening':title.textContent.trim().length<30?'Title is very short — add more keyword context':''});
      // Meta description
      const metaDesc=doc.querySelector('meta[name="description"]');
      checks.push({category:'Meta Description',status:metaDesc&&metaDesc.content.trim().length>0?'pass':'fail',detail:metaDesc?`"${metaDesc.content.trim().slice(0,80)}..." (${metaDesc.content.trim().length} chars)`:'Missing meta description',recommendation:!metaDesc?'Add a meta description with primary keyword + city + CTA':metaDesc.content.trim().length>155?'Meta description over 155 characters':''});
      // H1 — also check raw HTML for <h1> tags
      let h1s=doc.querySelectorAll('h1');
      let h1Count=h1s.length;
      let h1Text=h1s.length>0?h1s[0].textContent.trim():'';
      if(h1Count===0){
        const h1Regex=/<h1[^>]*>([\s\S]*?)<\/h1>/gi;
        const h1Matches=rawHtml.match(h1Regex);
        if(h1Matches){h1Count=h1Matches.length;h1Text=h1Matches[0].replace(/<[^>]+>/g,'').trim()}
      }
      checks.push({category:'H1 Tag',status:h1Count===1?'pass':h1Count===0?(isJSRendered?'warning':'fail'):'warning',detail:h1Count===0?(isJSRendered?'No H1 found in server HTML (may load via JS)':'No H1 found'):h1Count>1?`${h1Count} H1 tags found (should be 1)`:`"${h1Text.slice(0,60)}"`,recommendation:h1Count===0?'Add exactly one H1 with service + city':h1Count>1?'Use only one H1 per page':''});
      // Heading hierarchy — also check raw HTML
      let headings=[...doc.querySelectorAll('h1,h2,h3,h4,h5,h6')];
      if(headings.length===0){
        const hMatches=rawHtml.match(/<h[1-6][^>]*>/gi);
        if(hMatches){headings=hMatches.map(m=>({tagName:'H'+m.match(/h([1-6])/i)[1]}))}
      }
      let hierOk=true;
      for(let i=1;i<headings.length;i++){const prev=parseInt(headings[i-1].tagName[1]);const curr=parseInt(headings[i].tagName[1]);if(curr>prev+1){hierOk=false;break}}
      checks.push({category:'Heading Hierarchy',status:headings.length===0?(isJSRendered?'warning':'warning'):(hierOk?'pass':'warning'),detail:headings.length===0?(isJSRendered?'No headings found in server HTML (may load via JS)':'No headings found — add H1-H6 tags'):`${headings.length} headings with ${hierOk?'proper':'broken'} hierarchy`,recommendation:headings.length===0?'Add proper heading structure (H1, H2, H3...)':(!hierOk?'Fix heading hierarchy — do not skip levels':'')});
      // Images — also check raw HTML
      let imgs=doc.querySelectorAll('img');
      let imgCount=imgs.length;
      let imgsNoAltCount=[...imgs].filter(i=>!i.alt||i.alt.trim()==='').length;
      if(imgCount===0){
        const imgMatches=rawHtml.match(/<img[^>]*>/gi);
        if(imgMatches){imgCount=imgMatches.length;imgsNoAltCount=imgMatches.filter(m=>!m.includes('alt=')||m.includes('alt=""')||m.includes("alt=''")).length}
      }
      checks.push({category:'Images',status:imgsNoAltCount===0&&imgCount>0?'pass':imgCount===0?'warning':'fail',detail:imgCount===0?(isJSRendered?'No images in server HTML (may load via JS)':'No images found'):`${imgCount} images, ${imgsNoAltCount} missing alt text`,recommendation:imgsNoAltCount>0?'Add descriptive alt text to all images':imgCount===0?'Consider adding relevant images':''});
      // Internal links — also check raw HTML
      const links=[...doc.querySelectorAll('a[href]')];
      const clientDomain=(client.website||'').replace(/^https?:\/\//,'').replace(/\/$/,'');
      let internalLinks=links.filter(l=>{const h=l.getAttribute('href')||'';return h.startsWith('/')||h.includes(clientDomain)});
      let totalLinks=links.length;
      if(totalLinks===0){
        const hrefMatches=rawHtml.match(/href="([^"]+)"/gi)||[];
        totalLinks=hrefMatches.length;
        internalLinks=hrefMatches.filter(m=>{const h=m.replace(/href="/i,'').replace('"','');return h.startsWith('/')||h.includes(clientDomain)});
      }
      const intLinkCount=Array.isArray(internalLinks)?internalLinks.length:0;
      checks.push({category:'Internal Links',status:intLinkCount>=3?'pass':intLinkCount>0?'warning':(isJSRendered?'warning':'fail'),detail:`${intLinkCount} internal links, ${totalLinks} total links${isJSRendered&&totalLinks===0?' (may load via JS)':''}`,recommendation:intLinkCount<3?'Add more internal links to related service and category pages':''});
      // NAP check — search body text, schema text, AND raw HTML
      const phoneDigits=(client.phone||'').replace(/[^0-9]/g,'');
      const hasPhone=client.phone&&(searchText.includes(client.phone)||(phoneDigits.length>=7&&searchText.replace(/[^0-9]/g,'').includes(phoneDigits)));
      const cityLower=(client.city||'').toLowerCase();
      const hasCity=cityLower&&(searchText.toLowerCase().includes(cityLower));
      checks.push({category:'NAP (Name/Address/Phone)',status:hasPhone&&hasCity?'pass':hasPhone||hasCity?'warning':'fail',detail:`Phone: ${hasPhone?'Found':'Missing'}, City: ${hasCity?'Found':'Missing'}${(hasPhone||hasCity)&&isJSRendered?' (found in schema/HTML)':''}`,recommendation:(!hasPhone?'Add phone number to page. ':'')+(hasCity?'':'Add city name to page content.')});
      // Schema
      checks.push({category:'Schema Markup',status:schemaCount>0?'pass':'fail',detail:schemaCount>0?`${schemaCount} schema block(s) found`:'No structured data found',recommendation:schemaCount===0?'Add LocalBusiness and/or Service schema markup':''});
      // Tel links — also check raw HTML
      let telLinkCount=doc.querySelectorAll('a[href^="tel:"]').length;
      if(telLinkCount===0){const telMatches=rawHtml.match(/href="tel:/gi);if(telMatches)telLinkCount=telMatches.length}
      checks.push({category:'Click-to-Call',status:telLinkCount>0?'pass':'warning',detail:telLinkCount>0?`${telLinkCount} tel: link(s)`:'No clickable phone links',recommendation:telLinkCount===0?'Wrap phone numbers in tel: links for mobile users':''});
      // Canonical
      const canonical=doc.querySelector('link[rel="canonical"]');
      let canonicalHref=canonical?canonical.getAttribute('href'):'';
      if(!canonicalHref){const canMatch=rawHtml.match(/rel="canonical"[^>]*href="([^"]+)"/i)||rawHtml.match(/href="([^"]+)"[^>]*rel="canonical"/i);if(canMatch)canonicalHref=canMatch[1]}
      checks.push({category:'Canonical Tag',status:canonicalHref?'pass':'warning',detail:canonicalHref?canonicalHref:'No canonical tag found',recommendation:!canonicalHref?'Add a canonical tag to prevent duplicate content issues':''});
      // Score — exclude the JS-rendered warning from score calculation
      const scorableChecks=checks.filter(c=>!c.category.includes('JavaScript-Rendered'));
      const passed=scorableChecks.filter(c=>c.status==='pass').length;
      const total=scorableChecks.length;
      const score=Math.round(passed/total*100);

      // AI content check if API key exists
      let aiChecks=null;
      const aiText=bodyText.length>100?bodyText:(schemaText.length>50?schemaText:'');
      if(apiKey&&aiText.length>50){
        try{
          const aiResult=await callContentAPI(
            'You are an SEO content quality auditor. Analyze the provided page content and return a JSON array of checks. Each check: {"category":"...","status":"pass"|"warning"|"fail","detail":"...","recommendation":"..."}. Check for: keyword usage, content depth (word count), readability, local relevance, call-to-action presence, unique value proposition. If the content seems very thin or mostly schema/metadata with little visible text, flag that as a major issue. Return ONLY the JSON array.',
            `Page type: ${seoPageType}\nBusiness: ${client.name} in ${client.city}, ${client.state}\nPrimary service: ${client.primaryCategory}\n\nPage content:\n${aiText.slice(0,4000)}${schemaText?'\n\nSchema markup data:\n'+schemaText.slice(0,1000):''}`,
            apiKey
          );
          try{
            const jsonMatch=aiResult.match(/\[[\s\S]*\]/);
            aiChecks=JSON.parse(jsonMatch?jsonMatch[0]:aiResult);
          }catch(e){aiChecks=null}
        }catch(e){/* AI check optional */}
      }

      setSeoResults({checks,score,aiChecks});
    }catch(e){setSeoResults({error:e.message})}
    setSeoLoading(false);
  };

  // ─── Utils: Sitemap & Robots ───
  const generateSitemap=()=>{
    const arch=client.architecture;
    if(!arch)return'<!-- Generate architecture first -->';
    const baseUrl=client.website?(client.website.startsWith('http')?client.website:'https://'+client.website):'https://example.com';
    let urls=[{loc:baseUrl+'/',priority:'1.0',changefreq:'weekly'}];
    (arch.secondaryCategories||[]).forEach(sc=>{
      urls.push({loc:baseUrl+sc.slug,priority:'0.9',changefreq:'monthly'});
      (sc.coreServices||[]).forEach(cs=>{
        urls.push({loc:baseUrl+cs.slug,priority:'0.8',changefreq:'monthly'});
        (cs.childServices||[]).forEach(ch=>{
          urls.push({loc:baseUrl+ch.slug,priority:'0.7',changefreq:'monthly'});
        });
      });
    });
    (arch.locationPages||[]).forEach(lp=>{urls.push({loc:baseUrl+lp.slug,priority:'0.7',changefreq:'monthly'})});
    (arch.supportPages||[]).forEach(sp=>{urls.push({loc:baseUrl+sp.slug,priority:'0.6',changefreq:'monthly'})});
    return`<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${urls.map(u=>`  <url>\n    <loc>${u.loc}</loc>\n    <changefreq>${u.changefreq}</changefreq>\n    <priority>${u.priority}</priority>\n  </url>`).join('\n')}\n</urlset>`;
  };

  const generateRobots=()=>{
    const baseUrl=client.website?(client.website.startsWith('http')?client.website:'https://'+client.website):'https://example.com';
    return`User-agent: *\nAllow: /\n\nSitemap: ${baseUrl}/sitemap.xml`;
  };

  // ─── Render ───
  return(
    <div className="fade-in font-manrope space-y-4">
      <h3 className="text-xl font-bold text-brand-dark">Content Generator</h3>

      {/* API Key - auto-connected, hidden unless needed */}
      {apiKey?(
        <div className="flex items-center gap-2 text-sm text-green-600">
          <span>✓ Claude Opus 4.6 connected</span>
        </div>
      ):(
        <div className="stitch-glass-card rounded-[20px] p-3">
          <div className="flex items-center gap-2">
            <label className="text-sm font-medium text-deep-obsidian/70 whitespace-nowrap">API Key:</label>
            <div className="flex-1 relative">
              <input type={showKey?'text':'password'} value={apiKey} onChange={e=>saveApiKey(e.target.value)}
                placeholder="sk-ant-..." className="touch-target w-full px-3 py-2 border border-glass-border rounded-xl text-sm pr-16 font-mono focus:ring-1 focus:ring-brand focus:outline-none"/>
              <button onClick={()=>setShowKey(!showKey)} className="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-muted-stone hover:text-brand px-2 py-1">{showKey?'Hide':'Show'}</button>
            </div>
          </div>
        </div>
      )}

      {/* Sub-tabs */}
      <div className="flex gap-1 overflow-x-auto pb-1">
        {[{key:'generator',label:'Content Generator'},{key:'gap',label:'Content Gap'},{key:'seo',label:'SEO Checker'},{key:'utils',label:'Utils'}].map(st=>(
          <button key={st.key} onClick={()=>setSubTab(st.key)}
            className={`touch-target px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all ${subTab===st.key?'bg-brand text-white shadow-lg shadow-brand/20':'stitch-glass-card text-deep-obsidian/70 hover:bg-black/5'}`}>{st.label}</button>
        ))}
      </div>

      {/* ═══ Content Generator Sub-tab ═══ */}
      {subTab==='generator'&&(
        <div className="space-y-4">

          {/* Content Setup */}
          <div className="stitch-glass-card rounded-[24px] overflow-hidden">
            <button onClick={()=>setSetupOpen(!setupOpen)} className="touch-target w-full flex items-center justify-between p-4 text-left">
              <div className="flex items-center gap-2">
                <h4 className="text-lg font-bold text-brand-dark">Content Setup</h4>
                {setupComplete&&<span className="text-green-600 font-bold">&#10003; Complete</span>}
              </div>
              <span className="text-muted-stone">{setupOpen?'▲':'▼'}</span>
            </button>
            {setupOpen&&(
              <div className="px-4 pb-4 space-y-3">
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                  <div><label className="text-xs font-medium text-deep-obsidian/60">Industry</label><input value={localCC.industry||''} onChange={e=>updateCC('industry',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="e.g., Plumbing"/></div>
                  <div><label className="text-xs font-medium text-deep-obsidian/60">State Abbreviation</label><input value={localCC.stateAbbrev||''} onChange={e=>updateCC('stateAbbrev',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="e.g., TX" maxLength="2"/></div>
                  <div><label className="text-xs font-medium text-deep-obsidian/60">ZIP Code</label><input value={localCC.zipCode||''} onChange={e=>updateCC('zipCode',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="e.g., 75951"/></div>
                  <div><label className="text-xs font-medium text-deep-obsidian/60">Email</label><input value={localCC.email||''} onChange={e=>updateCC('email',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="business@email.com"/></div>
                  <div className="sm:col-span-2"><label className="text-xs font-medium text-deep-obsidian/60">Secondary GBP Categories</label><input value={localCC.secondaryCategories||''} onChange={e=>updateCC('secondaryCategories',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="Comma-separated categories"/></div>
                </div>
                <div><label className="text-xs font-medium text-deep-obsidian/60">Service Areas (Cities)</label><textarea value={localCC.serviceAreas||''} onChange={e=>updateCC('serviceAreas',e.target.value)} className="w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" rows="2" placeholder="Comma-separated list of cities served"/></div>
                {localCC.servicesOffered&&<div className="bg-black/[0.03] rounded-xl p-2"><label className="text-xs font-medium text-muted-stone block mb-1">Services (auto-filled from Site Architecture)</label><p className="text-xs text-muted-stone">{localCC.servicesOffered}</p></div>}

                <h5 className="font-semibold text-brand-dark text-sm pt-2">Differentiators</h5>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div><label className="text-xs font-medium text-deep-obsidian/60">Google Review Count</label><input value={localDiff.reviewCount||''} onChange={e=>updateCC('differentiators.reviewCount',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="e.g., 87 five-star reviews"/></div>
                  <div><label className="text-xs font-medium text-deep-obsidian/60">Average Response Time</label><input value={localDiff.avgResponseTime||''} onChange={e=>updateCC('differentiators.avgResponseTime',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="e.g., 45 minutes"/></div>
                  <div><label className="text-xs font-medium text-deep-obsidian/60">Free Estimates?</label><input value={localDiff.freeEstimates||''} onChange={e=>updateCC('differentiators.freeEstimates',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="e.g., Yes, always free"/></div>
                  <div><label className="text-xs font-medium text-deep-obsidian/60">Trip Fee?</label><input value={localDiff.tripFee||''} onChange={e=>updateCC('differentiators.tripFee',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="e.g., No trip fee"/></div>
                  <div><label className="text-xs font-medium text-deep-obsidian/60">Availability</label><input value={localDiff.availability||''} onChange={e=>updateCC('differentiators.availability',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="e.g., 24/7, same-day"/></div>
                  <div><label className="text-xs font-medium text-deep-obsidian/60">Years Serving Area</label><input value={localDiff.yearsServing||''} onChange={e=>updateCC('differentiators.yearsServing',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="e.g., 15 years"/></div>
                  <div><label className="text-xs font-medium text-deep-obsidian/60">Guarantees</label><input value={localDiff.guarantees||''} onChange={e=>updateCC('differentiators.guarantees',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="e.g., 100% satisfaction guarantee"/></div>
                  <div><label className="text-xs font-medium text-deep-obsidian/60">Licenses/Certifications</label><input value={localDiff.licenses||''} onChange={e=>updateCC('differentiators.licenses',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="e.g., Licensed & insured, EPA certified"/></div>
                  <div><label className="text-xs font-medium text-deep-obsidian/60">Locally Owned?</label><input value={localDiff.locallyOwned||''} onChange={e=>updateCC('differentiators.locallyOwned',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="e.g., Family-owned since 2010"/></div>
                  <div><label className="text-xs font-medium text-deep-obsidian/60">Unique Differentiator</label><input value={localDiff.uniqueDifferentiator||''} onChange={e=>updateCC('differentiators.uniqueDifferentiator',e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="What makes you truly different?"/></div>
                </div>
              </div>
            )}
          </div>

          {/* Site Architecture — Paste-In */}
          <div className="stitch-glass-card rounded-[24px] p-6">
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2">
                <h4 className="text-lg font-bold text-brand-dark">Site Architecture</h4>
                {client.architecture?<span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-medium">Saved ✓</span>:<span className="text-xs bg-black/5 text-muted-stone px-2 py-0.5 rounded-full font-medium">Not Yet Built</span>}
              </div>
            </div>

            {/* Paste hierarchy input */}
            <div className="mb-3">
              <label className="text-xs font-medium text-deep-obsidian/60 block mb-1">Paste from Google Business Profile</label>
              <p className="text-xs text-muted-stone mb-2">Copy everything from your GBP "Edit Services" page and paste it here. The parser will find your primary category, secondary categories, services, and service areas automatically.</p>
              <textarea value={hierarchyInput} onChange={e=>setHierarchyInput(e.target.value)}
                className="w-full px-3 py-2 border border-glass-border rounded-xl text-sm font-mono bg-white focus:ring-1 focus:ring-brand focus:outline-none" rows="10" spellCheck="false"
                placeholder={"Tree Service\n  - Tree Removal\n  - Emergency Tree Removal\n  - Hazardous Tree Removal\n\nArborist Service\n  - Tree Risk Assessment\n  - Tree Health & Maintenance\n  - Tree Pruning\n\nFirewood Supplier\n  - Firewood Delivery\n  - Firewood Sales"}/>
            </div>

            {/* Trust Signals & Local Issues — optional */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
              <div>
                <label className="text-xs font-medium text-deep-obsidian/60">Trust Signals <span className="text-muted-stone">(optional, comma-separated)</span></label>
                <input value={trustSignals} onChange={e=>handleTrustSignals(e.target.value)}
                  className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="e.g., Licensed & Insured, ISA-Certified, 24/7 Emergency"/>
              </div>
              <div>
                <label className="text-xs font-medium text-deep-obsidian/60">Local Issues <span className="text-muted-stone">(optional, comma-separated)</span></label>
                <input value={localIssues} onChange={e=>handleLocalIssues(e.target.value)}
                  className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="e.g., Colorado clay soil, Front Range storm damage"/>
              </div>
            </div>

            {/* Parse button */}
            <div className="flex items-center gap-3 mb-3">
              <button onClick={parseAndBuildArch}
                className="touch-target px-5 py-2 rounded-xl text-sm font-medium bg-brand text-white hover:bg-brand-hover transition-all shadow-lg shadow-brand/20">
                Parse Hierarchy
              </button>
              {parsedSummary&&<span className="text-sm text-green-600 font-medium">{parsedSummary}</span>}
            </div>

            {archError&&<div className="bg-red-50 text-red-700 rounded-xl p-3 text-sm mb-3">{archError}</div>}

            {/* Parsed result — visual summary with edit/delete */}
            {client.architecture&&client.architecture.secondaryCategories&&(()=>{
              const deleteCategory=(ci)=>{
                const arch={...client.architecture};
                arch.secondaryCategories=[...arch.secondaryCategories];
                arch.secondaryCategories.splice(ci,1);
                setArchText(JSON.stringify(arch,null,2));
                updateClient('architecture',arch);
              };
              const deleteService=(ci,si)=>{
                const arch={...client.architecture};
                arch.secondaryCategories=arch.secondaryCategories.map((c,i)=>i===ci?{...c,coreServices:[...c.coreServices].filter((_,j)=>j!==si)}:c);
                setArchText(JSON.stringify(arch,null,2));
                updateClient('architecture',arch);
              };
              const deleteLocation=(li)=>{
                const arch={...client.architecture};
                arch.locationPages=[...arch.locationPages];
                arch.locationPages.splice(li,1);
                setArchText(JSON.stringify(arch,null,2));
                updateClient('architecture',arch);
              };
              const renameItem=(type,ci,si,newName)=>{
                const arch={...client.architecture};
                arch.secondaryCategories=arch.secondaryCategories.map((c,i)=>{
                  if(type==='category'&&i===ci)return{...c,name:newName,slug:nameToSlug(newName)};
                  if(type==='service'&&i===ci)return{...c,coreServices:c.coreServices.map((s,j)=>j===si?{...s,name:newName,slug:nameToSlug(newName)}:s)};
                  return c;
                });
                setArchText(JSON.stringify(arch,null,2));
                updateClient('architecture',arch);
              };
              return(
              <div className="mb-3">
                <h5 className="text-xs font-semibold text-muted-stone uppercase tracking-wide mb-2">Parsed Structure</h5>
                <div className="space-y-2">
                  {client.architecture.secondaryCategories.map((cat,ci)=>(
                    <div key={ci} className="bg-white rounded-xl border border-glass-border p-3">
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2 flex-1 min-w-0">
                          <span className="font-medium text-sm text-brand-dark">{cat.name}</span>
                          {cat.isPrimary?<span className="text-xs bg-brand/10 text-brand px-1.5 py-0.5 rounded-full font-medium">Primary</span>:<span className="text-xs bg-black/5 text-muted-stone px-1.5 py-0.5 rounded-full font-medium">Secondary</span>}
                          <span className="text-xs text-muted-stone font-mono hidden sm:inline">{cat.slug}</span>
                        </div>
                        <div className="flex items-center gap-1 flex-shrink-0">
                          <button onClick={()=>{const n=prompt('Rename category:',cat.name);if(n&&n.trim())renameItem('category',ci,null,n.trim())}} className="text-xs text-blue-500 hover:text-blue-700 px-1.5 py-0.5">Edit</button>
                          <button onClick={()=>{if(confirm('Delete "'+cat.name+'" and all its services?'))deleteCategory(ci)}} className="text-xs text-red-400 hover:text-red-600 px-1.5 py-0.5">Delete</button>
                        </div>
                      </div>
                      {cat.coreServices&&cat.coreServices.length>0&&(
                        <div className="mt-2 pl-4 space-y-1">
                          {cat.coreServices.map((svc,si)=>(
                            <div key={si} className="flex items-center justify-between text-sm group">
                              <div className="flex items-center gap-2 flex-1 min-w-0">
                                <span className="text-deep-obsidian/70">- {svc.name}</span>
                                <span className="text-xs text-muted-stone font-mono hidden sm:inline">{svc.slug}</span>
                              </div>
                              <div className="flex items-center gap-1 flex-shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onClick={()=>{const n=prompt('Rename service:',svc.name);if(n&&n.trim())renameItem('service',ci,si,n.trim())}} className="text-xs text-blue-500 hover:text-blue-700 px-1">Edit</button>
                                <button onClick={()=>deleteService(ci,si)} className="text-xs text-red-400 hover:text-red-600 px-1">Delete</button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
                {client.architecture.locationPages&&client.architecture.locationPages.length>0&&(
                  <div className="mt-3">
                    <h5 className="text-xs font-semibold text-muted-stone uppercase tracking-wide mb-1">Location Pages</h5>
                    <div className="flex flex-wrap gap-1">
                      {client.architecture.locationPages.map((lp,li)=>(
                        <span key={li} className="text-xs bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full inline-flex items-center gap-1">
                          {lp.city}
                          <button onClick={()=>deleteLocation(li)} className="text-blue-400 hover:text-red-500 font-bold ml-0.5">&times;</button>
                        </span>
                      ))}
                    </div>
                  </div>
                )}
              </div>
              );
            })()}

            {/* Advanced: Show/edit raw JSON */}
            {client.architecture&&(
              <div>
                <button onClick={()=>setShowArchJson(!showArchJson)} className="text-xs text-muted-stone hover:text-deep-obsidian/70 underline mb-2">
                  {showArchJson?'Hide':'Show'} raw JSON
                </button>
                {showArchJson&&(
                  <div>
                    <textarea value={archText} onChange={e=>setArchText(e.target.value)} className="w-full px-3 py-2 border border-glass-border rounded-xl text-xs font-mono bg-black/[0.03] focus:ring-1 focus:ring-brand focus:outline-none" rows="12" spellCheck="false"/>
                    <div className="flex gap-2 mt-2">
                      <button onClick={saveArchitecture} className="touch-target px-4 py-2 bg-green-600 text-white rounded-xl text-sm hover:bg-green-700">Save JSON Changes</button>
                      <button onClick={()=>copyToClipboard(archText)} className="touch-target px-4 py-2 bg-white border border-glass-border text-deep-obsidian/70 rounded-xl text-sm hover:bg-black/5">Copy JSON</button>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* Page Writer */}
          {client.architecture&&(
            <div className="stitch-glass-card rounded-[24px] p-6">
              <h4 className="text-lg font-bold text-brand-dark mb-3">Page Writer</h4>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
                <div>
                  <label className="text-xs font-medium text-deep-obsidian/60">Page Type</label>
                  <select value={pageType} onChange={e=>{setPageType(e.target.value);setPageName('');setPageParent('');setPageChildServices('')}}
                    className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none">
                    {CONTENT_PAGE_TYPES.map(pt=><option key={pt.value} value={pt.value}>{pt.label}</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-xs font-medium text-deep-obsidian/60">Select Page</label>
                  <select value={pageName} onChange={e=>{
                    setPageName(e.target.value);
                    const opt=pageOptions.find(o=>o.value===e.target.value);
                    if(opt){setPageParent(opt.parentCategory||'');setPageChildServices(opt.childServices||'')}
                  }} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none">
                    <option value="">— Select —</option>
                    {pageOptions.map((po,i)=><option key={i} value={po.value}>{po.label}</option>)}
                  </select>
                </div>
              </div>
              <button onClick={generatePage} disabled={pageLoading}
                className={`touch-target px-6 py-2.5 rounded-xl text-sm font-medium transition-all ${pageLoading?'bg-gray-300 text-gray-500 cursor-wait':'bg-brand text-white hover:bg-brand-hover shadow-lg shadow-brand/20'}`}>
                {pageLoading?'Generating Content...':'Generate Content'}
              </button>
              {pageError&&<div className="bg-red-50 text-red-700 rounded-xl p-3 text-sm mt-3">{pageError}</div>}
              {pageLoading&&<div className="text-center py-6 mt-3"><div className="inline-block w-8 h-8 border-4 border-brand border-t-transparent rounded-full animate-spin mb-2"/><p className="text-sm text-muted-stone">Writing content with AI... this may take a minute.</p></div>}
              {pageOutput&&!pageLoading&&(
                <div className="mt-3">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-sm font-medium text-deep-obsidian/70">Generated Content</span>
                    <button onClick={()=>copyToClipboard(pageOutput)} className="touch-target px-3 py-1.5 bg-white border border-glass-border text-deep-obsidian/70 rounded-xl text-xs hover:bg-black/5">
                      {copyMsg||'Copy to Clipboard'}
                    </button>
                  </div>
                  <div className="bg-black/[0.03] rounded-xl p-4 max-h-96 overflow-y-auto">
                    <pre className="text-sm font-mono whitespace-pre-wrap break-words">{pageOutput}</pre>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Generated Pages History */}
          {(client.generatedPages||[]).length>0&&(
            <div className="stitch-glass-card rounded-[24px] p-6">
              <h4 className="text-lg font-bold text-brand-dark mb-3">Generated Pages ({(client.generatedPages||[]).length})</h4>
              <div className="space-y-2">
                {(client.generatedPages||[]).slice().reverse().map(gp=>(
                  <div key={gp.id} className="border border-glass-border rounded-xl overflow-hidden">
                    <div className="flex items-center justify-between p-3 bg-white">
                      <div className="flex items-center gap-2 flex-1 min-w-0">
                        <span className="text-xs bg-brand-light text-brand px-2 py-0.5 rounded-full font-medium whitespace-nowrap">{CONTENT_PAGE_TYPES.find(pt=>pt.value===gp.type)?.label||gp.type}</span>
                        <span className="text-sm font-medium truncate">{gp.name}</span>
                        <span className="text-xs text-muted-stone">{fmt(gp.date)}</span>
                      </div>
                      <div className="flex items-center gap-1 flex-shrink-0">
                        <button onClick={()=>setExpandedPage(expandedPage===gp.id?null:gp.id)} className="touch-target px-2 py-1 text-xs text-brand hover:bg-brand-light rounded-lg">{expandedPage===gp.id?'Hide':'View'}</button>
                        <button onClick={()=>copyToClipboard(gp.content)} className="touch-target px-2 py-1 text-xs text-muted-stone hover:bg-black/5 rounded-lg">Copy</button>
                        <button onClick={()=>deleteGeneratedPage(gp.id)} className="touch-target px-2 py-1 text-xs text-red-500 hover:bg-red-50 rounded-lg">Delete</button>
                      </div>
                    </div>
                    {expandedPage===gp.id&&(
                      <div className="bg-black/[0.03] p-4 max-h-80 overflow-y-auto border-t border-glass-border">
                        <pre className="text-xs font-mono whitespace-pre-wrap break-words">{gp.content}</pre>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}

      {/* ═══ SEO Checker Sub-tab ═══ */}
      {subTab==='seo'&&(
        <div className="space-y-4">
          <div className="stitch-glass-card rounded-[24px] p-6">
            <h4 className="text-lg font-bold text-brand-dark mb-3">SEO Page Checker</h4>
            <div className="space-y-3">
              <div>
                <label className="text-xs font-medium text-deep-obsidian/60">URL or Paste HTML</label>
                <textarea value={seoInput} onChange={e=>setSeoInput(e.target.value)} className="w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm font-mono focus:ring-1 focus:ring-brand focus:outline-none" rows="4" placeholder="https://example.com or paste full HTML here"/>
              </div>
              <div className="flex items-end gap-3">
                <div>
                  <label className="text-xs font-medium text-deep-obsidian/60">Page Type</label>
                  <select value={seoPageType} onChange={e=>setSeoPageType(e.target.value)} className="touch-target mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none">
                    {CONTENT_PAGE_TYPES.map(pt=><option key={pt.value} value={pt.value}>{pt.label}</option>)}
                  </select>
                </div>
                <button onClick={runSeoCheck} disabled={seoLoading}
                  className={`touch-target px-6 py-2.5 rounded-xl text-sm font-medium transition-all ${seoLoading?'bg-gray-300 text-gray-500 cursor-wait':'bg-brand text-white hover:bg-brand-hover shadow-lg shadow-brand/20'}`}>
                  {seoLoading?'Checking...':'Run SEO Check'}
                </button>
              </div>
            </div>
          </div>

          {seoLoading&&<div className="stitch-glass-card rounded-[24px] p-6 text-center"><div className="inline-block w-8 h-8 border-4 border-brand border-t-transparent rounded-full animate-spin mb-2"/><p className="text-sm text-muted-stone">Analyzing page...</p></div>}

          {seoResults&&!seoLoading&&(
            <div className="space-y-4">
              {seoResults.error&&<div className="bg-red-50 text-red-700 rounded-xl p-4 text-sm">{seoResults.error}</div>}
              {seoResults.score!==undefined&&(
                <>
                  <div className="stitch-glass-card rounded-[24px] p-6">
                    <div className="flex items-center gap-4 mb-4">
                      <div className="relative"><ScoreRing value={seoResults.score} size={80} label="SEO Score"/></div>
                      <div>
                        <p className="text-sm text-deep-obsidian/70">{seoResults.checks.filter(c=>c.status==='pass').length} of {seoResults.checks.length} checks passed</p>
                        {seoResults.aiChecks&&<p className="text-xs text-muted-stone mt-1">+ AI content analysis included</p>}
                      </div>
                    </div>
                    <div className="space-y-2">
                      {seoResults.checks.map((c,i)=>(
                        <div key={i} className={`flex items-start gap-2 p-2 rounded-xl ${c.status==='pass'?'bg-green-50':c.status==='warning'?'bg-yellow-50':'bg-red-50'}`}>
                          <span className="text-lg mt-0.5">{c.status==='pass'?'✅':c.status==='warning'?'⚠️':'❌'}</span>
                          <div className="flex-1 min-w-0">
                            <p className="text-sm font-medium">{c.category}</p>
                            <p className="text-xs text-deep-obsidian/70">{c.detail}</p>
                            {c.recommendation&&<p className="text-xs text-muted-stone mt-0.5 italic">{c.recommendation}</p>}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                  {seoResults.aiChecks&&(
                    <div className="stitch-glass-card rounded-[24px] p-6">
                      <h4 className="text-lg font-bold text-brand-dark mb-3">AI Content Analysis</h4>
                      <div className="space-y-2">
                        {seoResults.aiChecks.map((c,i)=>(
                          <div key={i} className={`flex items-start gap-2 p-2 rounded-xl ${c.status==='pass'?'bg-green-50':c.status==='warning'?'bg-yellow-50':'bg-red-50'}`}>
                            <span className="text-lg mt-0.5">{c.status==='pass'?'✅':c.status==='warning'?'⚠️':'❌'}</span>
                            <div className="flex-1 min-w-0">
                              <p className="text-sm font-medium">{c.category}</p>
                              <p className="text-xs text-deep-obsidian/70">{c.detail}</p>
                              {c.recommendation&&<p className="text-xs text-muted-stone mt-0.5 italic">{c.recommendation}</p>}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </>
              )}
            </div>
          )}
        </div>
      )}

      {/* ═══ Content Gap Sub-tab ═══ */}
      {subTab==='gap'&&(
        <div className="space-y-4">
          {!client.architecture?(
            <div className="stitch-glass-card rounded-[24px] p-6 text-center">
              <p className="text-muted-stone">Parse your GBP service hierarchy in the Content Generator tab first.</p>
            </div>
          ):(
            <React.Fragment>
              {/* Crawl Controls */}
              <div className="stitch-glass-card rounded-[24px] p-6">
                <h4 className="text-lg font-bold text-brand-dark mb-3">Content Gap Auditor</h4>
                <div className="flex flex-wrap items-center gap-3 mb-3">
                  <span className="text-sm text-deep-obsidian/70">Website: <strong>{client.website||'Not set'}</strong></span>
                  <button onClick={crawlWebsite} disabled={gapCrawling||!client.website}
                    className={`touch-target px-4 py-2 rounded-xl text-sm font-medium transition-all ${gapCrawling?'bg-gray-300 text-gray-500 cursor-wait':'bg-brand text-white hover:bg-brand-hover shadow-lg shadow-brand/20'}`}>
                    {gapCrawling?'Crawling...':gapPages.length>0?'Re-Crawl':'Crawl Website'}
                  </button>
                  <label className="touch-target px-4 py-2 bg-white border border-glass-border text-deep-obsidian/70 rounded-xl text-sm hover:bg-black/5 cursor-pointer">
                    Upload CSV
                    <input type="file" accept=".csv" className="hidden" onChange={e=>{
                      const f=e.target.files[0];if(!f)return;
                      const reader=new FileReader();
                      reader.onload=ev=>{setGapError('');setGapProgress('');parseCSV(ev.target.result)};
                      reader.readAsText(f);e.target.value='';
                    }}/>
                  </label>
                </div>
                {/* Manual URL input */}
                <details className="mb-3">
                  <summary className="text-xs text-muted-stone cursor-pointer hover:text-deep-obsidian/70">Or paste URLs manually</summary>
                  <div className="mt-2">
                    <textarea value={gapManualUrls} onChange={e=>setGapManualUrls(e.target.value)} className="w-full px-3 py-2 border border-glass-border rounded-xl text-sm font-mono focus:ring-1 focus:ring-brand focus:outline-none" rows="4" placeholder={"https://example.com/\nhttps://example.com/tree-removal\nhttps://example.com/about"}/>
                    <button onClick={parseManualUrls} className="touch-target mt-2 px-4 py-2 bg-brand text-white rounded-xl text-sm hover:bg-brand-hover shadow-lg shadow-brand/20">Parse URLs</button>
                  </div>
                </details>
                {gapProgress&&<p className="text-sm text-green-600 font-medium">{gapProgress}</p>}
                {gapError&&<div className="bg-red-50 text-red-700 rounded-xl p-3 text-sm">{gapError}</div>}
                {gapLastCrawl&&<p className="text-xs text-muted-stone">Last crawl: {new Date(gapLastCrawl).toLocaleDateString()} via {gapMethod}</p>}
              </div>

              {/* Results - only show if we have pages */}
              {gapPages.length>0&&(()=>{
                const expected=buildExpectedPages();
                const locations=buildExpectedLocations();
                const found=expected.filter(e=>gapMatches[e.name]&&gapMatches[e.name]!==null);
                const missing=expected.filter(e=>!gapMatches[e.name]||gapMatches[e.name]===null);
                const matchedUrls=new Set(found.map(e=>gapMatches[e.name]?.url).filter(Boolean));
                const extras=gapPages.filter(p=>!matchedUrls.has(p.url));
                const totalWords=gapPages.reduce((s,p)=>s+p.wordCount,0);
                const avgWords=gapPages.length>0?Math.round(totalWords/gapPages.length):0;
                const schemaCount=gapPages.filter(p=>p.hasSchema).length;
                const missingH1=gapPages.filter(p=>!p.h1).length;
                const totalLinks=gapPages.reduce((s,p)=>s+p.internalLinks,0);
                const pct=expected.length>0?Math.round(found.length/expected.length*100):0;

                // Location matching
                const locationMatches={};
                locations.forEach(loc=>{
                  const cityLower=loc.name.toLowerCase().replace(/\s+/g,'');
                  const match=gapPages.find(p=>{
                    const urlNorm=p.url.toLowerCase().replace(/[-_/]/g,'');
                    return urlNorm.includes(cityLower);
                  });
                  locationMatches[loc.name]=match?match.url:null;
                });

                return(
                  <React.Fragment>
                    {/* Summary Stats */}
                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                      {[
                        {label:'Total Pages',value:gapPages.length},
                        {label:'Avg Words',value:avgWords.toLocaleString()},
                        {label:'With Schema',value:schemaCount},
                        {label:'Missing H1',value:missingH1},
                        {label:'Internal Links',value:totalLinks.toLocaleString()}
                      ].map((s,i)=>(
                        <div key={i} className="stitch-glass-card stitch-hover-lift rounded-[20px] p-4 text-center">
                          <div className="text-lg font-bold text-brand-dark">{s.value}</div>
                          <div className="text-xs text-muted-stone">{s.label}</div>
                        </div>
                      ))}
                    </div>

                    {/* Gap Summary Bar */}
                    <div className="stitch-glass-card rounded-[24px] p-6">
                      <div className="flex items-center justify-between mb-2">
                        <h5 className="font-bold text-brand-dark text-sm">Gap Summary</h5>
                        <span className="text-sm font-medium text-deep-obsidian/70">{found.length} of {expected.length} pages found ({pct}%)</span>
                      </div>
                      <div className="w-full bg-black/5 rounded-full h-4 mb-2">
                        <div className="h-4 rounded-full transition-all" style={{width:pct+'%',background:pct>=80?'#16a34a':pct>=50?'#ca8a04':'#dc2626'}}/>
                      </div>
                      <div className="flex flex-wrap gap-4 text-sm">
                        <span className="text-green-600 font-medium">{found.length} found</span>
                        <span className="text-red-600 font-medium">{missing.length} missing</span>
                        {(()=>{const thinCount=found.filter(e=>{const p=gapPages.find(pg=>pg.url===gapMatches[e.name]?.url);return p&&((e.type==='secondaryCategory'&&p.wordCount<800)||(e.type!=='secondaryCategory'&&p.wordCount>0&&p.wordCount<500))}).length;return thinCount>0?<span className="text-amber-600 font-medium">{thinCount} need more content</span>:null})()}
                        <span className="text-muted-stone">{extras.length} extra pages</span>
                      </div>
                    </div>

                    {/* Missing Pages */}
                    {missing.length>0&&(
                      <div className="stitch-glass-card rounded-[24px] p-6">
                        <h5 className="font-bold text-red-600 text-sm mb-3">Missing Pages ({missing.length})</h5>
                        <div className="space-y-2">
                          {missing.map((m,i)=>(
                            <div key={i} className="flex items-center justify-between bg-red-50 rounded-xl p-3">
                              <div>
                                <span className="font-medium text-sm text-deep-obsidian">{m.name}</span>
                                <span className="text-xs text-muted-stone font-mono ml-2">{m.slug}</span>
                                {m.category&&<span className="text-xs text-muted-stone ml-2">under {m.category}</span>}
                              </div>
                              <button onClick={()=>{
                                setSubTab('generator');
                                const typeMap={secondaryCategory:'secondaryCategory',coreService:'coreService',childService:'childService',location:'location',about:'about',contact:'contact',homepage:'homepage'};
                                setPageType(typeMap[m.type]||'coreService');
                                setPageName(m.name);
                              }} className="touch-target px-3 py-1.5 bg-brand text-white rounded-xl text-xs hover:bg-brand-hover whitespace-nowrap shadow-lg shadow-brand/20">
                                Generate Content
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Found Pages */}
                    {found.length>0&&(
                      <div className="stitch-glass-card rounded-[24px] p-6">
                        <h5 className="font-bold text-green-600 text-sm mb-3">Found Pages ({found.length})</h5>
                        <div className="space-y-1">
                          {found.map((f,i)=>{
                            const match=gapMatches[f.name];
                            const page=gapPages.find(p=>p.url===match?.url);
                            const thin=page&&((f.type==='secondaryCategory'&&page.wordCount<800)||(f.type!=='secondaryCategory'&&page.wordCount>0&&page.wordCount<500));
                            return(
                              <div key={i} className={`flex items-center justify-between rounded-xl p-2.5 ${thin?'bg-amber-50':'bg-green-50'}`}>
                                <div className="flex-1 min-w-0">
                                  <span className="font-medium text-sm text-deep-obsidian">{f.name}</span>
                                  <span className="text-xs text-muted-stone font-mono ml-2 truncate">{match?.url}</span>
                                  {match?.confidence&&<span className={`ml-2 text-xs px-1.5 py-0.5 rounded-full ${match.confidence==='high'?'bg-green-100 text-green-700':match.confidence==='manual'?'bg-blue-100 text-blue-700':'bg-amber-100 text-amber-700'}`}>{match.confidence}</span>}
                                </div>
                                <div className="flex items-center gap-2 text-xs text-muted-stone flex-shrink-0">
                                  {page&&<span>{page.wordCount.toLocaleString()} words</span>}
                                  {thin&&<span className="text-amber-600 font-medium">Thin</span>}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}

                    {/* Crawl Results Table */}
                    <div className="stitch-glass-card rounded-[24px] p-6">
                      <h5 className="font-bold text-brand-dark text-sm mb-3">All Crawled Pages ({gapPages.length})</h5>
                      <div className="overflow-x-auto">
                        <table className="w-full text-sm">
                          <thead>
                            <tr className="border-b border-glass-border text-left text-xs text-muted-stone">
                              <th className="pb-2 pr-2">URL</th>
                              <th className="pb-2 pr-2">Title</th>
                              <th className="pb-2 pr-2 text-right">Words</th>
                              <th className="pb-2 pr-2 text-right">Links</th>
                              <th className="pb-2">Matched To</th>
                            </tr>
                          </thead>
                          <tbody>
                            {gapPages.map((p,i)=>{
                              const matchedService=Object.keys(gapMatches).find(k=>gapMatches[k]&&gapMatches[k].url===p.url);
                              return(
                                <tr key={i} className="border-b border-glass-border">
                                  <td className="py-2 pr-2 font-mono text-xs text-deep-obsidian/70 max-w-48 truncate">{p.url}</td>
                                  <td className="py-2 pr-2 text-xs text-deep-obsidian/70 max-w-48 truncate">{p.title||'—'}</td>
                                  <td className="py-2 pr-2 text-xs text-right text-muted-stone">{p.wordCount||'—'}</td>
                                  <td className="py-2 pr-2 text-xs text-right text-muted-stone">{p.internalLinks||'—'}</td>
                                  <td className="py-2">
                                    <select value={matchedService||'__none__'} onChange={e=>{
                                      const newVal=e.target.value;
                                      // Clear old match pointing to this URL
                                      const newMatches={...gapMatches};
                                      Object.keys(newMatches).forEach(k=>{if(newMatches[k]&&newMatches[k].url===p.url)newMatches[k]=null});
                                      // Set new match
                                      if(newVal!=='__none__')newMatches[newVal]={url:p.url,confidence:'manual'};
                                      setGapMatches(newMatches);
                                      saveGapData(gapPages,newMatches,gapMethod);
                                    }} className="text-xs border border-glass-border rounded-lg px-1.5 py-1 max-w-36">
                                      <option value="__none__">None</option>
                                      {expected.map((ex,j)=><option key={j} value={ex.name}>{ex.name}</option>)}
                                    </select>
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    {/* Location Pages */}
                    {locations.length>0&&(
                      <div className="stitch-glass-card rounded-[24px] p-6">
                        <h5 className="font-bold text-brand-dark text-sm mb-3">Location Pages (Optional)</h5>
                        <div className="flex flex-wrap gap-2">
                          {locations.map((loc,i)=>(
                            <span key={i} className={`text-xs px-2.5 py-1 rounded-full font-medium ${locationMatches[loc.name]?'bg-green-100 text-green-700':'bg-red-100 text-red-600'}`}>
                              {locationMatches[loc.name]?'✓':'✗'} {loc.name}
                            </span>
                          ))}
                        </div>
                      </div>
                    )}
                  </React.Fragment>
                );
              })()}
            </React.Fragment>
          )}
        </div>
      )}

      {/* ═══ Utils Sub-tab ═══ */}
      {subTab==='utils'&&(
        <div className="space-y-4">
          <div className="stitch-glass-card rounded-[24px] p-6">
            <div className="flex items-center justify-between mb-3">
              <h4 className="font-bold text-brand-dark">Sitemap XML</h4>
              <button onClick={()=>copyToClipboard(generateSitemap())} className="touch-target px-4 py-2 bg-brand text-white rounded-xl text-sm hover:bg-brand-hover shadow-lg shadow-brand/20">Copy Sitemap</button>
            </div>
            {!client.architecture&&<p className="text-sm text-muted-stone">Generate a site architecture first to build the sitemap.</p>}
            {client.architecture&&<pre className="bg-black/[0.03] rounded-xl p-3 text-xs font-mono overflow-x-auto max-h-64 overflow-y-auto">{generateSitemap()}</pre>}
          </div>
          <div className="stitch-glass-card rounded-[24px] p-6">
            <div className="flex items-center justify-between mb-3">
              <h4 className="font-bold text-brand-dark">Robots.txt</h4>
              <button onClick={()=>copyToClipboard(generateRobots())} className="touch-target px-4 py-2 bg-brand text-white rounded-xl text-sm hover:bg-brand-hover shadow-lg shadow-brand/20">Copy Robots.txt</button>
            </div>
            <pre className="bg-black/[0.03] rounded-xl p-3 text-xs font-mono">{generateRobots()}</pre>
          </div>
        </div>
      )}
    </div>
  );
}

// FEATURE 4: Analytics Tab (per client)
// ═══════════════════════════════════════════
function AnalyticsTab({client,setData,data}){
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState('');
  const [mobileResult,setMobileResult]=useState(null);
  const [desktopResult,setDesktopResult]=useState(null);

  // Load previous results if available
  const prevData=client.pageSpeed||null;

  const getScoreColor=(score)=>score>89?'#059669':score>49?'#d97706':'#dc2626';
  const getCwvColor=(val,green,yellow)=>val<green?'#059669':val<yellow?'#d97706':'#dc2626';

  const runTest=async()=>{
    if(!client.website){setError('Add a website URL in client settings to run speed tests.');return}
    setLoading(true);setError('');setMobileResult(null);setDesktopResult(null);
    let url=client.website;
    if(!url.startsWith('http'))url='https://'+url;

    try{
      const psiFetch=async(strategy)=>{
        const r=await fetch('/api/pagespeed',{method:'POST',headers:await authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({url,strategy})});
        return r.json();
      };
      const [mRes,dRes]=await Promise.all([psiFetch('mobile'),psiFetch('desktop')]);

      if(mRes.error||dRes.error){setError((mRes.error||dRes.error)||'API error');setLoading(false);return}

      const extract=(r)=>{
        const lr=r.lighthouseResult;
        const score=Math.round((lr.categories?.performance?.score||0)*100);
        const lcp=(lr.audits['largest-contentful-paint']?.numericValue||0)/1000;
        const tbt=lr.audits['total-blocking-time']?.numericValue||0;
        const cls=lr.audits['cumulative-layout-shift']?.numericValue||0;
        const opps=Object.values(lr.audits).filter(a=>a.details?.type==='opportunity'&&a.score!==null&&a.score<1).map(a=>({title:a.title,displayValue:a.displayValue}));
        return{score,lcp,tbt,cls,opportunities:opps};
      };

      const m=extract(mRes);const d=extract(dRes);
      setMobileResult(m);setDesktopResult(d);

      // Save to client data
      setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>{
        if(c.id!==client.id)return c;
        return{...c,pageSpeed:{mobile:{score:m.score,lcp:m.lcp,tbt:m.tbt,cls:m.cls},desktop:{score:d.score,lcp:d.lcp,tbt:d.tbt,cls:d.cls},lastRun:new Date().toISOString()}};
      })};saveData(nd);return nd});
    }catch(e){setError('Failed to fetch PageSpeed data. Check the URL and try again.')}
    setLoading(false);
  };

  const ScoreCircle=({score,label})=>{
    const color=getScoreColor(score);
    const r=40;const c=2*Math.PI*r;const offset=c-(score/100)*c;
    return(
      <div className="flex flex-col items-center">
        <svg width="100" height="100" viewBox="0 0 100 100" className="transform -rotate-90">
          <circle cx="50" cy="50" r={r} fill="none" stroke="#e5e7eb" strokeWidth="8"/>
          <circle cx="50" cy="50" r={r} fill="none" stroke={color} strokeWidth="8" strokeLinecap="round"
            strokeDasharray={c} strokeDashoffset={offset} className="ring-animate transition-all duration-700"/>
        </svg>
        <div className="absolute flex flex-col items-center justify-center" style={{width:100,height:100}}>
          <span className="text-2xl font-bold" style={{color}}>{score}</span>
        </div>
        <span className="text-xs font-semibold text-deep-obsidian/70 mt-1">{label}</span>
      </div>
    );
  };

  const CwvCard=({label,value,unit,greenThresh,yellowThresh,lowerIsBetter=true})=>{
    const color=lowerIsBetter?getCwvColor(value,greenThresh,yellowThresh):getScoreColor(value);
    return(
      <div className="bg-black/[0.03] rounded-xl p-4 text-center">
        <p className="text-xs text-muted-stone mb-1">{label}</p>
        <p className="text-2xl font-bold" style={{color}}>{typeof value==='number'?value.toFixed(value<10?2:0):value}{unit}</p>
      </div>
    );
  };

  // Determine which data to display
  const showMobile=mobileResult||(prevData?.mobile?{...prevData.mobile,opportunities:[]}:null);
  const showDesktop=desktopResult||(prevData?.desktop?{...prevData.desktop,opportunities:[]}:null);
  const showOpps=mobileResult?.opportunities||[];

  return(
    <div className="fade-in font-manrope space-y-6">
      <h3 className="text-xl font-bold text-brand-dark">Analytics</h3>

      {/* PageSpeed Insights */}
      <div className="stitch-glass-card rounded-[24px] p-6">
        <div className="flex items-center justify-between mb-4">
          <h4 className="text-lg font-bold text-brand-dark">PageSpeed Insights</h4>
          <button onClick={runTest} disabled={loading} className={`touch-target px-4 py-2 rounded-xl text-sm font-medium transition-all ${loading?'bg-gray-300 text-gray-500 cursor-wait':'bg-brand text-white hover:bg-brand-hover shadow-lg shadow-brand/20'}`}>
            {loading?'Testing...':'Run Speed Test'}
          </button>
        </div>
        {prevData?.lastRun&&!mobileResult&&<p className="text-xs text-muted-stone mb-3">Last tested: {fmt(prevData.lastRun)}</p>}
        {error&&<div className="bg-red-50 text-red-700 rounded-xl p-3 text-sm mb-3">{error}</div>}
        {loading&&<div className="text-center py-8"><div className="inline-block w-8 h-8 border-4 border-brand border-t-transparent rounded-full animate-spin mb-2"/><p className="text-sm text-muted-stone">Running speed tests for mobile & desktop...</p></div>}

        {!client.website&&!error&&<p className="text-sm text-muted-stone text-center py-4">Add a website URL in client settings to run speed tests.</p>}

        {showMobile&&showDesktop&&!loading&&(
          <>
            <div className="flex justify-center gap-8 mb-6">
              <div className="relative"><ScoreCircle score={showMobile.score} label="Mobile"/></div>
              <div className="relative"><ScoreCircle score={showDesktop.score} label="Desktop"/></div>
            </div>
            <h5 className="font-semibold text-brand-dark text-sm mb-3">Core Web Vitals (Mobile)</h5>
            <div className="grid grid-cols-3 gap-3 mb-4">
              <CwvCard label="LCP" value={showMobile.lcp} unit="s" greenThresh={2.5} yellowThresh={4}/>
              <CwvCard label="TBT" value={showMobile.tbt} unit="ms" greenThresh={200} yellowThresh={500}/>
              <CwvCard label="CLS" value={showMobile.cls} unit="" greenThresh={0.1} yellowThresh={0.25}/>
            </div>
            {showOpps.length>0&&(
              <div>
                <h5 className="font-semibold text-brand-dark text-sm mb-2">Opportunities</h5>
                <div className="space-y-1">
                  {showOpps.map((o,i)=>(
                    <div key={i} className="flex items-center justify-between py-1.5 border-b border-glass-border last:border-0">
                      <span className="text-sm text-deep-obsidian/70">{o.title}</span>
                      <span className="text-xs text-muted-stone ml-2 whitespace-nowrap">{o.displayValue}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </>
        )}
      </div>

      {/* Google Search Console */}
      <GSCSection client={client} setData={setData} data={data} key={'gsc-'+client.id}/>

      {/* Google Analytics */}
      <GA4Section client={client} setData={setData} data={data} key={'ga4-'+client.id}/>

      {/* Submit for Indexing */}
      <IndexingSection client={client} key={'indexing-'+client.id}/>
    </div>
  );
}
