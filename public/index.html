// GSC Section Component
// ═══════════════════════════════════════════
function GSCSection({client,setData,data}){
  const GSC_CLIENT_ID='612120587213-tr29nkokkjj3eijo455dhr82emstphtn.apps.googleusercontent.com';
  const GSC_SCOPE='https://www.googleapis.com/auth/webmasters.readonly';

  const GSC_TOKEN_KEY='kailenflow_gsc_token';
  const [gscState,setGscState]=useState('disconnected'); // disconnected|connecting|loading|loaded|error|nodata|expired
  const [gscToken,setGscToken]=useState(null);
  const [gscEmail,setGscEmail]=useState('');
  const [gscError,setGscError]=useState('');
  const [gscSites,setGscSites]=useState([]);
  const [gscSelectedSite,setGscSelectedSite]=useState('');
  const [gscData,setGscData]=useState(null);
  const tokenClientRef=useRef(null);
  const hasRestoredRef=useRef(false);

  // Save token to localStorage when received
  const saveGscToken=(token,expiresIn,email)=>{
    const expiresAt=Date.now()+(expiresIn||3600)*1000;
    localStorage.setItem(GSC_TOKEN_KEY,JSON.stringify({token,expiresAt,email:email||''}));
  };
  const clearGscToken=()=>{localStorage.removeItem(GSC_TOKEN_KEY)};

  // Handle a successful token (from OAuth or restore)
  const handleToken=(accessToken,email)=>{
    setGscToken(accessToken);
    setGscState('loading');
    if(email)setGscEmail(email);
    else fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{'Authorization':'Bearer '+accessToken}})
      .then(r=>r.json()).then(d=>{
        if(d.email){setGscEmail(d.email);
          // Update saved token with email
          const saved=JSON.parse(localStorage.getItem(GSC_TOKEN_KEY)||'{}');
          if(saved.token)localStorage.setItem(GSC_TOKEN_KEY,JSON.stringify({...saved,email:d.email}));
        }
      }).catch(()=>{});
    fetchGscSites(accessToken);
  };

  // Restore saved token on mount (runs fresh per client due to key={client.id})
  useEffect(()=>{
    if(hasRestoredRef.current)return;
    hasRestoredRef.current=true;
    try{
      const saved=JSON.parse(localStorage.getItem(GSC_TOKEN_KEY)||'null');
      if(!saved||!saved.token)return;
      if(saved.expiresAt>Date.now()+60000){
        // Token still valid — use it
        setGscToken(saved.token);
        if(saved.email)setGscEmail(saved.email);
        setGscState('loading');
        fetchGscSites(saved.token);
      }else{
        // Token expired — try silent re-auth
        if(saved.email)setGscEmail(saved.email);
        setGscState('connecting');
        // Wait for tokenClient to be ready, then request silently
        const trysilent=()=>{
          if(tokenClientRef.current){
            tokenClientRef.current.requestAccessToken({prompt:''});
          }else{
            setTimeout(trysilent,500);
          }
        };
        setTimeout(trysilent,300);
      }
    }catch(e){}
  },[]);

  // Initialize token client once
  useEffect(()=>{
    if(typeof google==='undefined'||!google.accounts)return;
    tokenClientRef.current=google.accounts.oauth2.initTokenClient({
      client_id:GSC_CLIENT_ID,
      scope:GSC_SCOPE,
      callback:(resp)=>{
        if(resp.error){
          setGscState('error');
          setGscError('Authorization failed: '+(resp.error_description||resp.error));
          return;
        }
        saveGscToken(resp.access_token,resp.expires_in,'');
        handleToken(resp.access_token,null);
      }
    });
  },[]);

  const gscApiFetch=async(url,token,options={})=>{
    const res=await fetch(url,{...options,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json',...(options.headers||{})}});
    if(res.status===401){clearGscToken();setGscState('expired');setGscError('Session expired. Please reconnect.');throw new Error('token_expired');}
    if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err.error?.message||'API error '+res.status);}
    return res.json();
  };

  // Get properties already assigned to OTHER clients
  const usedProperties=useMemo(()=>{
    if(!data||!data.clients)return[];
    return data.clients.filter(c=>c.id!==client.id&&c.gscProperty).map(c=>c.gscProperty);
  },[data,client.id]);

  const fetchGscSites=async(token)=>{
    try{
      const apiData=await gscApiFetch('https://www.googleapis.com/webmasters/v3/sites',token);
      const allSites=(apiData.siteEntry||[]).map(s=>s.siteUrl);
      setGscSites(allSites);

      // 1. If client has a saved property and it exists in the list, use it
      if(client.gscProperty&&allSites.includes(client.gscProperty)){
        setGscSelectedSite(client.gscProperty);
        fetchGscData(token,client.gscProperty);
        return;
      }

      // Filter out properties used by other clients
      const available=allSites.filter(s=>!usedProperties.includes(s));

      // 2. Try auto-matching client.website against available sites
      let match='';
      if(client.website){
        let cw=client.website.replace(/\/$/,'').toLowerCase();
        if(!cw.startsWith('http'))cw='https://'+cw;
        match=available.find(s=>{
          const sl=s.toLowerCase().replace(/\/$/,'');
          return sl===cw||sl===cw+'/'||sl==='sc-domain:'+cw.replace(/^https?:\/\//,'');
        })||'';
      }
      if(match){
        savePropertyToClient(match);
        setGscSelectedSite(match);fetchGscData(token,match);
      }
      else if(available.length===1){
        savePropertyToClient(available[0]);
        setGscSelectedSite(available[0]);fetchGscData(token,available[0]);
      }
      else if(available.length>1){setGscState('loaded');setGscData(null)}
      else{setGscState('nodata');setGscError('No available properties found. All properties may already be assigned to other clients.')}
    }catch(e){
      if(e.message!=='token_expired'){setGscState('error');setGscError('Failed to load GSC sites: '+e.message)}
    }
  };

  // Save selected GSC property to client data
  const savePropertyToClient=(siteUrl)=>{
    if(setData){
      setData(prev=>{
        const nd={...prev,clients:prev.clients.map(c=>c.id===client.id?{...c,gscProperty:siteUrl}:c)};
        saveData(nd);return nd;
      });
    }
  };

  const fetchGscData=async(token,siteUrl)=>{
    setGscState('loading');
    const end=new Date();end.setDate(end.getDate()-1);
    const start=new Date();start.setDate(start.getDate()-29);
    const fmt=d=>d.toISOString().split('T')[0];
    const startDate=fmt(start);const endDate=fmt(end);
    const encodedSite=encodeURIComponent(siteUrl);
    const baseUrl=`https://www.googleapis.com/webmasters/v3/sites/${encodedSite}/searchAnalytics/query`;

    try{
      const [summary,queries,pages,daily,devices]=await Promise.all([
        gscApiFetch(baseUrl,token,{method:'POST',body:JSON.stringify({startDate,endDate,dimensions:[],type:'web'})}),
        gscApiFetch(baseUrl,token,{method:'POST',body:JSON.stringify({startDate,endDate,dimensions:['query'],rowLimit:10,type:'web'})}),
        gscApiFetch(baseUrl,token,{method:'POST',body:JSON.stringify({startDate,endDate,dimensions:['page'],rowLimit:10,type:'web'})}),
        gscApiFetch(baseUrl,token,{method:'POST',body:JSON.stringify({startDate,endDate,dimensions:['date'],type:'web'})}),
        gscApiFetch(baseUrl,token,{method:'POST',body:JSON.stringify({startDate,endDate,dimensions:['device'],type:'web'})})
      ]);

      const s=summary.rows?.[0]||{clicks:0,impressions:0,ctr:0,position:0};
      const noRows=!summary.rows||summary.rows.length===0;
      if(noRows&&(!queries.rows||queries.rows.length===0)){setGscState('nodata');setGscError('No search data available for this property in the last 28 days.');return}

      const queryRows=(queries.rows||[]).map(r=>({query:r.keys[0],clicks:r.clicks,impressions:r.impressions,ctr:(r.ctr*100),position:r.position}));
      setGscData({
        totalClicks:s.clicks||0,
        totalImpressions:s.impressions||0,
        avgCtr:(s.ctr||0)*100,
        avgPosition:s.position||0,
        queries:queryRows,
        pages:(pages.rows||[]).map(r=>({page:r.keys[0],clicks:r.clicks,impressions:r.impressions,ctr:(r.ctr*100),position:r.position})),
        daily:(daily.rows||[]).map(r=>({date:r.keys[0],clicks:r.clicks,impressions:r.impressions})),
        devices:(devices.rows||[]).map(r=>({device:r.keys[0],clicks:r.clicks,impressions:r.impressions}))
      });
      setGscState('loaded');

      // Cache a lightweight summary onto the client so other tabs (e.g. the
      // Dashboard) can show real GSC numbers without forcing their own
      // OAuth reconnect — this data otherwise lives only in this
      // component's state and disappears when you leave the tab.
      if(setData){
        const summary={totalClicks:s.clicks||0,totalImpressions:s.impressions||0,avgCtr:(s.ctr||0)*100,avgPosition:s.position||0,topQueries:queryRows.slice(0,5),fetchedAt:Date.now()};
        setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>c.id===client.id?{...c,gscSummary:summary}:c)};saveData(nd);return nd});
      }
    }catch(e){
      if(e.message!=='token_expired'){setGscState('error');setGscError('Failed to load GSC data: '+e.message)}
    }
  };

  const connectGsc=()=>{
    if(!tokenClientRef.current){setGscError('Google Identity Services not loaded. Please refresh.');setGscState('error');return}
    setGscState('connecting');setGscError('');
    tokenClientRef.current.requestAccessToken();
  };

  const handleSiteChange=(site)=>{
    setGscSelectedSite(site);
    savePropertyToClient(site);
    if(gscToken)fetchGscData(gscToken,site);
  };

  const ctrColor=(v)=>v>5?'#059669':v>2?'#d97706':'#dc2626';
  const posColor=(v)=>v<10?'#059669':v<20?'#d97706':'#dc2626';

  // Chart helpers — reskinned to the Stitch "Portfolio Pulse" bento look
  // (2026-07-12); same data prop, same maxClicks/height/date-label math as
  // before, only the visual wrapper and hover interaction changed.
  const DailyChart=({data})=>{
    if(!data||data.length===0)return null;
    const maxClicks=Math.max(...data.map(d=>d.clicks),1);
    const barW=Math.max(Math.floor(600/data.length)-2,4);
    return(
      <div className="stitch-glass-card rounded-[32px] p-8 fade-in">
        <div className="mb-6">
          <h4 className="text-lg font-bold text-brand-dark">Clicks Over Time</h4>
          <p className="text-sm text-muted-stone">Real Search Console data — last 28 days</p>
        </div>
        <div className="overflow-x-auto">
          <div className="flex items-end gap-0.5" style={{minWidth:data.length*12,height:160}}>
            {data.map((d,i)=>{
              const h=Math.max((d.clicks/maxClicks)*140,2);
              const dateLabel=d.date.slice(5);
              return(
                <div key={i} className="flex flex-col items-center flex-shrink-0" style={{width:barW+4}}>
                  <div className="relative group rounded-t bg-brand/40 hover:bg-brand transition-all duration-500 cursor-help" style={{width:barW,height:h}}>
                    <div className="absolute -top-9 left-1/2 -translate-x-1/2 bg-brand-dark text-white px-2 py-1 rounded text-[10px] opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap z-10">{d.date}: {d.clicks} clicks</div>
                  </div>
                  {i%Math.ceil(data.length/7)===0&&<span className="text-[9px] text-muted-stone mt-1 whitespace-nowrap">{dateLabel}</span>}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  };

  // Disconnected state
  if(gscState==='disconnected'){
    return(
      <div className="stitch-glass-card rounded-[24px] p-6 fade-in font-manrope">
        <div className="flex items-center justify-between mb-3">
          <h4 className="text-lg font-bold text-brand-dark">Search Console Analytics</h4>
        </div>
        <p className="text-sm text-muted-stone mb-4">Connect your Google Search Console to see clicks, impressions, CTR, positions, top pages, and top queries.</p>
        <button onClick={connectGsc} className="touch-target px-4 py-2 bg-brand text-white rounded-xl text-sm font-medium hover:bg-brand-hover transition-all shadow-lg shadow-brand/20">Connect GSC Account</button>
      </div>
    );
  }

  // Connecting state
  if(gscState==='connecting'){
    return(
      <div className="stitch-glass-card rounded-[24px] p-6 fade-in font-manrope">
        <div className="flex items-center justify-between mb-3">
          <h4 className="text-lg font-bold text-brand-dark">Search Console Analytics</h4>
        </div>
        <div className="text-center py-8">
          <div className="inline-block w-8 h-8 border-4 border-brand border-t-transparent rounded-full animate-spin mb-2"/>
          <p className="text-sm text-muted-stone">Connecting to Google...</p>
        </div>
      </div>
    );
  }

  // Loading state
  if(gscState==='loading'){
    return(
      <div className="stitch-glass-card rounded-[24px] p-6 fade-in font-manrope">
        <div className="flex items-center justify-between mb-3">
          <h4 className="text-lg font-bold text-brand-dark">Search Console Analytics</h4>
          <span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-medium">Connected</span>
        </div>
        <div className="text-center py-8">
          <div className="inline-block w-8 h-8 border-4 border-brand border-t-transparent rounded-full animate-spin mb-2"/>
          <p className="text-sm text-muted-stone">Loading GSC data...</p>
        </div>
      </div>
    );
  }

  // Error state
  if(gscState==='error'||gscState==='expired'){
    return(
      <div className="stitch-glass-card rounded-[24px] p-6 fade-in font-manrope">
        <div className="flex items-center justify-between mb-3">
          <h4 className="text-lg font-bold text-brand-dark">Search Console Analytics</h4>
        </div>
        <div className="bg-red-50 text-red-700 rounded-xl p-3 text-sm mb-3">{gscError}</div>
        <button onClick={()=>{clearGscToken();setGscState('disconnected');setGscError('');setGscToken(null);setGscEmail('');setGscSites([]);setGscSelectedSite('');setGscData(null)}} className="touch-target px-4 py-2 bg-brand text-white rounded-xl text-sm font-medium hover:bg-brand-hover transition-all shadow-lg shadow-brand/20">{gscState==='expired'?'Reconnect':'Try Again'}</button>
      </div>
    );
  }

  // No data state
  if(gscState==='nodata'){
    return(
      <div className="stitch-glass-card rounded-[24px] p-6 fade-in font-manrope">
        <div className="flex items-center justify-between mb-3">
          <h4 className="text-lg font-bold text-brand-dark">Search Console Analytics</h4>
          <span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-medium">Connected</span>
        </div>
        {gscEmail&&<p className="text-xs text-muted-stone mb-2">{gscEmail}</p>}
        <div className="bg-yellow-50 text-yellow-700 rounded-xl p-3 text-sm mb-3">{gscError||'No data available for this property.'}</div>
        {gscSites.length>1&&(
          <div className="mb-3">
            <label className="text-xs text-muted-stone block mb-1">Switch property:</label>
            <select value={gscSelectedSite} onChange={e=>handleSiteChange(e.target.value)} className="touch-target w-full px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none">
              {gscSites.filter(s=>!usedProperties.includes(s)||s===gscSelectedSite).map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          </div>
        )}
        <button onClick={()=>{clearGscToken();setGscState('disconnected');setGscToken(null);setGscEmail('');setGscSites([]);setGscSelectedSite('');setGscData(null);setGscError('')}} className="touch-target px-4 py-2 bg-black/5 text-deep-obsidian/70 rounded-xl text-sm font-medium hover:bg-black/10 transition-colors">Disconnect</button>
      </div>
    );
  }

  // Loaded state — full dashboard
  const totalDeviceClicks=gscData?.devices?.reduce((a,d)=>a+d.clicks,0)||1;

  return(
    <div className="space-y-4 fade-in font-manrope">
      {/* Header */}
      <div className="stitch-glass-card rounded-[24px] p-6">
        <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
          <div className="flex items-center gap-3">
            <h4 className="text-lg font-bold text-brand-dark">Search Console Analytics</h4>
            <span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-medium">Connected</span>
          </div>
          <button onClick={()=>{clearGscToken();setGscState('disconnected');setGscToken(null);setGscEmail('');setGscSites([]);setGscSelectedSite('');setGscData(null);setGscError('')}} className="text-xs text-muted-stone hover:text-brand-dark transition-colors">Disconnect</button>
        </div>
        {gscEmail&&<p className="text-xs text-muted-stone mb-2">{gscEmail}</p>}
        {gscSites.length>1&&(
          <div>
            <label className="text-xs text-muted-stone block mb-1">Property:</label>
            <select value={gscSelectedSite} onChange={e=>handleSiteChange(e.target.value)} className="touch-target w-full px-3 py-2 border border-glass-border rounded-xl text-sm bg-white focus:ring-1 focus:ring-brand focus:outline-none">
              {gscSites.filter(s=>!usedProperties.includes(s)||s===gscSelectedSite).map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          </div>
        )}
        {gscSites.length<=1&&gscSelectedSite&&<p className="text-xs text-muted-stone">{gscSelectedSite}</p>}
      </div>

      {gscData&&(
        <>
          {/* 4 Big Stat Cards */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <div className="stitch-glass-card stitch-hover-lift rounded-[20px] p-5 text-center">
              <p className="text-xs text-muted-stone mb-1">Total Clicks</p>
              <p className="text-2xl font-bold text-brand-dark">{gscData.totalClicks.toLocaleString()}</p>
            </div>
            <div className="stitch-glass-card stitch-hover-lift rounded-[20px] p-5 text-center">
              <p className="text-xs text-muted-stone mb-1">Total Impressions</p>
              <p className="text-2xl font-bold text-brand-dark">{gscData.totalImpressions.toLocaleString()}</p>
            </div>
            <div className="stitch-glass-card stitch-hover-lift rounded-[20px] p-5 text-center">
              <p className="text-xs text-muted-stone mb-1">Avg CTR</p>
              <p className="text-2xl font-bold" style={{color:ctrColor(gscData.avgCtr)}}>{gscData.avgCtr.toFixed(1)}%</p>
            </div>
            <div className="stitch-glass-card stitch-hover-lift rounded-[20px] p-5 text-center">
              <p className="text-xs text-muted-stone mb-1">Avg Position</p>
              <p className="text-2xl font-bold" style={{color:posColor(gscData.avgPosition)}}>{gscData.avgPosition.toFixed(1)}</p>
            </div>
          </div>

          {/* Clicks Chart */}
          <DailyChart data={gscData.daily}/>

          {/* Top Queries Table */}
          {gscData.queries.length>0&&(
            <div className="stitch-glass-card rounded-[24px] p-6">
              <h5 className="font-semibold text-brand-dark text-sm mb-3">Top Queries</h5>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead><tr className="text-left text-xs text-muted-stone border-b border-glass-border">
                    <th className="pb-2 pr-2">Query</th><th className="pb-2 pr-2 text-right">Clicks</th><th className="pb-2 pr-2 text-right">Impr</th><th className="pb-2 pr-2 text-right">CTR</th><th className="pb-2 text-right">Pos</th>
                  </tr></thead>
                  <tbody>
                    {gscData.queries.map((q,i)=>(
                      <tr key={i} className="border-b border-glass-border last:border-0">
                        <td className="py-2 pr-2 text-deep-obsidian/70 max-w-[200px] truncate">{q.query}</td>
                        <td className="py-2 pr-2 text-right font-medium">{q.clicks}</td>
                        <td className="py-2 pr-2 text-right text-muted-stone">{q.impressions}</td>
                        <td className="py-2 pr-2 text-right font-medium" style={{color:ctrColor(q.ctr)}}>{q.ctr.toFixed(1)}%</td>
                        <td className="py-2 text-right font-medium" style={{color:posColor(q.position)}}>{q.position.toFixed(1)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* Top Pages Table */}
          {gscData.pages.length>0&&(
            <div className="stitch-glass-card rounded-[24px] p-6">
              <h5 className="font-semibold text-brand-dark text-sm mb-3">Top Pages</h5>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead><tr className="text-left text-xs text-muted-stone border-b border-glass-border">
                    <th className="pb-2 pr-2">Page</th><th className="pb-2 pr-2 text-right">Clicks</th><th className="pb-2 pr-2 text-right">Impr</th><th className="pb-2 pr-2 text-right">CTR</th><th className="pb-2 text-right">Pos</th>
                  </tr></thead>
                  <tbody>
                    {gscData.pages.map((p,i)=>{
                      let displayUrl=p.page;
                      try{displayUrl=new URL(p.page).pathname||p.page}catch(e){}
                      if(displayUrl.length>40)displayUrl=displayUrl.slice(0,37)+'...';
                      return(
                        <tr key={i} className="border-b border-glass-border last:border-0">
                          <td className="py-2 pr-2 text-deep-obsidian/70 max-w-[200px] truncate" title={p.page}>{displayUrl}</td>
                          <td className="py-2 pr-2 text-right font-medium">{p.clicks}</td>
                          <td className="py-2 pr-2 text-right text-muted-stone">{p.impressions}</td>
                          <td className="py-2 pr-2 text-right font-medium" style={{color:ctrColor(p.ctr)}}>{p.ctr.toFixed(1)}%</td>
                          <td className="py-2 text-right font-medium" style={{color:posColor(p.position)}}>{p.position.toFixed(1)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* Device Breakdown */}
          {gscData.devices.length>0&&(
            <div>
              <h5 className="font-semibold text-brand-dark text-sm mb-3">Device Breakdown</h5>
              <div className="grid grid-cols-3 gap-3">
                {['DESKTOP','MOBILE','TABLET'].map(type=>{
                  const d=gscData.devices.find(x=>x.device.toUpperCase()===type);
                  const clicks=d?d.clicks:0;
                  const pct=((clicks/totalDeviceClicks)*100).toFixed(1);
                  const icons={DESKTOP:'computer',MOBILE:'smartphone',TABLET:'tablet_mac'};
                  return(
                    <div key={type} className="stitch-glass-card stitch-hover-lift rounded-[20px] p-5 text-center">
                      <span className="material-symbols-outlined text-2xl text-brand mb-1">{icons[type]||'devices'}</span>
                      <p className="text-xs text-muted-stone mb-1">{type.charAt(0)+type.slice(1).toLowerCase()}</p>
                      <p className="text-xl font-bold text-brand-dark">{clicks.toLocaleString()}</p>
                      <p className="text-xs text-muted-stone">{pct}% of clicks</p>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ─── Google Analytics (GA4) ───
// Mirrors GSCSection's exact OAuth/state-machine pattern (same Google
// Identity Services token client, same restore/reconnect flow) — just a
// different scope and Google API. Uses the SAME OAuth client ID as Search
// Console since it's one Google Cloud project; only the requested scope
// differs. No restricted-access application needed for this one, unlike
// Business Profile — analytics.readonly is a standard self-service scope.
function GA4Section({client,setData,data}){
  const GA_CLIENT_ID='612120587213-tr29nkokkjj3eijo455dhr82emstphtn.apps.googleusercontent.com'; // same OAuth client as Search Console, different scope
  const GA_SCOPE='https://www.googleapis.com/auth/analytics.readonly';

  const GA_TOKEN_KEY='kailenflow_ga4_token';
  const [gaState,setGaState]=useState('disconnected'); // disconnected|connecting|loading|loaded|error|nodata|expired
  const [gaToken,setGaToken]=useState(null);
  const [gaEmail,setGaEmail]=useState('');
  const [gaError,setGaError]=useState('');
  const [gaProperties,setGaProperties]=useState([]);
  const [gaSelectedProperty,setGaSelectedProperty]=useState('');
  const [gaData,setGaData]=useState(null);
  const tokenClientRef=useRef(null);
  const hasRestoredRef=useRef(false);

  const saveGaToken=(token,expiresIn,email)=>{
    const expiresAt=Date.now()+(expiresIn||3600)*1000;
    localStorage.setItem(GA_TOKEN_KEY,JSON.stringify({token,expiresAt,email:email||''}));
  };
  const clearGaToken=()=>{localStorage.removeItem(GA_TOKEN_KEY)};

  const handleToken=(accessToken,email)=>{
    setGaToken(accessToken);
    setGaState('loading');
    if(email)setGaEmail(email);
    else fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{'Authorization':'Bearer '+accessToken}})
      .then(r=>r.json()).then(d=>{
        if(d.email){setGaEmail(d.email);
          const saved=JSON.parse(localStorage.getItem(GA_TOKEN_KEY)||'{}');
          if(saved.token)localStorage.setItem(GA_TOKEN_KEY,JSON.stringify({...saved,email:d.email}));
        }
      }).catch(()=>{});
    fetchGaProperties(accessToken);
  };

  useEffect(()=>{
    if(hasRestoredRef.current)return;
    hasRestoredRef.current=true;
    try{
      const saved=JSON.parse(localStorage.getItem(GA_TOKEN_KEY)||'null');
      if(!saved||!saved.token)return;
      if(saved.expiresAt>Date.now()+60000){
        setGaToken(saved.token);
        if(saved.email)setGaEmail(saved.email);
        setGaState('loading');
        fetchGaProperties(saved.token);
      }else{
        if(saved.email)setGaEmail(saved.email);
        setGaState('connecting');
        const trysilent=()=>{
          if(tokenClientRef.current){tokenClientRef.current.requestAccessToken({prompt:''})}
          else{setTimeout(trysilent,500)}
        };
        setTimeout(trysilent,300);
      }
    }catch(e){}
  },[]);

  useEffect(()=>{
    if(typeof google==='undefined'||!google.accounts)return;
    tokenClientRef.current=google.accounts.oauth2.initTokenClient({
      client_id:GA_CLIENT_ID,
      scope:GA_SCOPE,
      callback:(resp)=>{
        if(resp.error){setGaState('error');setGaError('Authorization failed: '+(resp.error_description||resp.error));return}
        saveGaToken(resp.access_token,resp.expires_in,'');
        handleToken(resp.access_token,null);
      }
    });
  },[]);

  const gaApiFetch=async(url,token,options={})=>{
    const res=await fetch(url,{...options,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json',...(options.headers||{})}});
    if(res.status===401){clearGaToken();setGaState('expired');setGaError('Session expired. Please reconnect.');throw new Error('token_expired')}
    if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err.error?.message||'API error '+res.status)}
    return res.json();
  };

  // Get properties already assigned to OTHER clients
  const usedProperties=useMemo(()=>{
    if(!data||!data.clients)return[];
    return data.clients.filter(c=>c.id!==client.id&&c.ga4Property).map(c=>c.ga4Property);
  },[data,client.id]);

  const fetchGaProperties=async(token)=>{
    try{
      const apiData=await gaApiFetch('https://analyticsadmin.googleapis.com/v1beta/accountSummaries?pageSize=200',token);
      const allProps=(apiData.accountSummaries||[]).flatMap(a=>(a.propertySummaries||[]).map(p=>({property:p.property,displayName:p.displayName||p.property})));
      setGaProperties(allProps);

      // 1. If client has a saved property and it exists in the list, use it
      if(client.ga4Property&&allProps.some(p=>p.property===client.ga4Property)){
        setGaSelectedProperty(client.ga4Property);
        fetchGaData(token,client.ga4Property);
        return;
      }

      // Filter out properties used by other clients
      const available=allProps.filter(p=>!usedProperties.includes(p.property));

      // 2. Try auto-matching client name/website against property display names
      const cw=(client.website||'').replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/$/,'').toLowerCase();
      const cn=(client.name||'').toLowerCase();
      const match=(cw||cn)?available.find(p=>{
        const dn=p.displayName.toLowerCase();
        return(cw&&dn.includes(cw))||(cn&&dn.includes(cn));
      }):null;

      if(match){
        savePropertyToClient(match.property);
        setGaSelectedProperty(match.property);fetchGaData(token,match.property);
      }
      else if(available.length===1){
        savePropertyToClient(available[0].property);
        setGaSelectedProperty(available[0].property);fetchGaData(token,available[0].property);
      }
      else if(available.length>1){setGaState('loaded');setGaData(null)}
      else{setGaState('nodata');setGaError('No available GA4 properties found. All properties may already be assigned to other clients.')}
    }catch(e){
      if(e.message!=='token_expired'){setGaState('error');setGaError('Failed to load GA4 properties: '+e.message)}
    }
  };

  // Save selected GA4 property to client data
  const savePropertyToClient=(propertyId)=>{
    if(setData){
      setData(prev=>{
        const nd={...prev,clients:prev.clients.map(c=>c.id===client.id?{...c,ga4Property:propertyId}:c)};
        saveData(nd);return nd;
      });
    }
  };

  const fetchGaData=async(token,propertyId)=>{
    setGaState('loading');
    const end=new Date();end.setDate(end.getDate()-1);
    const start=new Date();start.setDate(start.getDate()-29);
    const fmtDate=d=>d.toISOString().split('T')[0];
    const dateRanges=[{startDate:fmtDate(start),endDate:fmtDate(end)}];
    const baseUrl=`https://analyticsdata.googleapis.com/v1beta/${propertyId}:runReport`;

    try{
      const [summary,daily,pages,channels]=await Promise.all([
        gaApiFetch(baseUrl,token,{method:'POST',body:JSON.stringify({dateRanges,metrics:[{name:'activeUsers'},{name:'sessions'},{name:'conversions'},{name:'engagementRate'}]})}),
        gaApiFetch(baseUrl,token,{method:'POST',body:JSON.stringify({dateRanges,dimensions:[{name:'date'}],metrics:[{name:'sessions'},{name:'activeUsers'}],orderBys:[{dimension:{dimensionName:'date'}}]})}),
        gaApiFetch(baseUrl,token,{method:'POST',body:JSON.stringify({dateRanges,dimensions:[{name:'pagePath'}],metrics:[{name:'screenPageViews'},{name:'sessions'}],orderBys:[{metric:{metricName:'screenPageViews'},desc:true}],limit:10})}),
        gaApiFetch(baseUrl,token,{method:'POST',body:JSON.stringify({dateRanges,dimensions:[{name:'sessionDefaultChannelGroup'}],metrics:[{name:'sessions'}],orderBys:[{metric:{metricName:'sessions'},desc:true}]})})
      ]);

      const sRow=summary.rows?.[0];
      if(!sRow){setGaState('nodata');setGaError('No analytics data available for this property in the last 28 days.');return}

      const mv=(row,i)=>parseFloat(row.metricValues?.[i]?.value||0);
      const totals={totalUsers:mv(sRow,0),totalSessions:mv(sRow,1),totalConversions:mv(sRow,2),avgEngagementRate:mv(sRow,3)*100};
      setGaData({
        ...totals,
        daily:(daily.rows||[]).map(r=>({date:r.dimensionValues[0].value,sessions:parseFloat(r.metricValues[0].value||0),users:parseFloat(r.metricValues[1].value||0)})),
        pages:(pages.rows||[]).map(r=>({page:r.dimensionValues[0].value,views:parseFloat(r.metricValues[0].value||0),sessions:parseFloat(r.metricValues[1].value||0)})),
        channels:(channels.rows||[]).map(r=>({channel:r.dimensionValues[0].value,sessions:parseFloat(r.metricValues[0].value||0)}))
      });
      setGaState('loaded');

      // Cache a lightweight summary onto the client, same reasoning as
      // GSCSection's gscSummary — lets the Dashboard show real numbers
      // without its own OAuth reconnect.
      if(setData){
        const summary={...totals,fetchedAt:Date.now()};
        setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>c.id===client.id?{...c,ga4Summary:summary}:c)};saveData(nd);return nd});
      }
    }catch(e){
      if(e.message!=='token_expired'){setGaState('error');setGaError('Failed to load GA4 data: '+e.message)}
    }
  };

  const connectGa=()=>{
    if(!tokenClientRef.current){setGaError('Google Identity Services not loaded. Please refresh.');setGaState('error');return}
    setGaState('connecting');setGaError('');
    tokenClientRef.current.requestAccessToken();
  };

  const handlePropertyChange=(propertyId)=>{
    setGaSelectedProperty(propertyId);
    savePropertyToClient(propertyId);
    if(gaToken)fetchGaData(gaToken,propertyId);
  };

  // GA4's date dimension comes back as "YYYYMMDD" with no separators
  const fmtGaDate=(s)=>s&&s.length===8?`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`:s;
  const engColor=(v)=>v>60?'#059669':v>40?'#d97706':'#dc2626';

  const GaDailyChart=({dailyData})=>{
    if(!dailyData||dailyData.length===0)return null;
    const maxSessions=Math.max(...dailyData.map(d=>d.sessions),1);
    const barW=Math.max(Math.floor(600/dailyData.length)-2,4);
    return(
      <div className="stitch-glass-card rounded-[32px] p-8 fade-in">
        <div className="mb-6">
          <h4 className="text-lg font-bold text-brand-dark">Sessions Over Time</h4>
          <p className="text-sm text-muted-stone">Real Google Analytics data — last 28 days</p>
        </div>
        <div className="overflow-x-auto">
          <div className="flex items-end gap-0.5" style={{minWidth:dailyData.length*12,height:160}}>
            {dailyData.map((d,i)=>{
              const dateLabel=fmtGaDate(d.date).slice(5);
              const h=Math.max((d.sessions/maxSessions)*140,2);
              return(
                <div key={i} className="flex flex-col items-center flex-shrink-0" style={{width:barW+4}}>
                  <div className="relative group rounded-t bg-brand/40 hover:bg-brand transition-all duration-500 cursor-help" style={{width:barW,height:h}}>
                    <div className="absolute -top-9 left-1/2 -translate-x-1/2 bg-brand-dark text-white px-2 py-1 rounded text-[10px] opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap z-10">{fmtGaDate(d.date)}: {d.sessions} sessions</div>
                  </div>
                  {i%Math.ceil(dailyData.length/7)===0&&<span className="text-[9px] text-muted-stone mt-1 whitespace-nowrap">{dateLabel}</span>}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  };

  // Disconnected state
  if(gaState==='disconnected'){
    return(
      <div className="stitch-glass-card rounded-[24px] p-6 fade-in font-manrope">
        <div className="flex items-center justify-between mb-3">
          <h4 className="text-lg font-bold text-brand-dark">Google Analytics</h4>
        </div>
        <p className="text-sm text-muted-stone mb-4">Connect Google Analytics (GA4) to see sessions, users, conversions, top pages, and traffic channels.</p>
        <button onClick={connectGa} className="touch-target px-4 py-2 bg-brand text-white rounded-xl text-sm font-medium hover:bg-brand-hover transition-all shadow-lg shadow-brand/20">Connect Google Analytics</button>
      </div>
    );
  }

  // Connecting state
  if(gaState==='connecting'){
    return(
      <div className="stitch-glass-card rounded-[24px] p-6 fade-in font-manrope">
        <div className="flex items-center justify-between mb-3">
          <h4 className="text-lg font-bold text-brand-dark">Google Analytics</h4>
        </div>
        <div className="text-center py-8">
          <div className="inline-block w-8 h-8 border-4 border-brand border-t-transparent rounded-full animate-spin mb-2"/>
          <p className="text-sm text-muted-stone">Connecting to Google...</p>
        </div>
      </div>
    );
  }

  // Loading state
  if(gaState==='loading'){
    return(
      <div className="stitch-glass-card rounded-[24px] p-6 fade-in font-manrope">
        <div className="flex items-center justify-between mb-3">
          <h4 className="text-lg font-bold text-brand-dark">Google Analytics</h4>
          <span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-medium">Connected</span>
        </div>
        <div className="text-center py-8">
          <div className="inline-block w-8 h-8 border-4 border-brand border-t-transparent rounded-full animate-spin mb-2"/>
          <p className="text-sm text-muted-stone">Loading Analytics data...</p>
        </div>
      </div>
    );
  }

  // Error state
  if(gaState==='error'||gaState==='expired'){
    return(
      <div className="stitch-glass-card rounded-[24px] p-6 fade-in font-manrope">
        <div className="flex items-center justify-between mb-3">
          <h4 className="text-lg font-bold text-brand-dark">Google Analytics</h4>
        </div>
        <div className="bg-red-50 text-red-700 rounded-xl p-3 text-sm mb-3">{gaError}</div>
        <button onClick={()=>{clearGaToken();setGaState('disconnected');setGaError('');setGaToken(null);setGaEmail('');setGaProperties([]);setGaSelectedProperty('');setGaData(null)}} className="touch-target px-4 py-2 bg-brand text-white rounded-xl text-sm font-medium hover:bg-brand-hover transition-all shadow-lg shadow-brand/20">{gaState==='expired'?'Reconnect':'Try Again'}</button>
      </div>
    );
  }

  // No data state
  if(gaState==='nodata'){
    return(
      <div className="stitch-glass-card rounded-[24px] p-6 fade-in font-manrope">
        <div className="flex items-center justify-between mb-3">
          <h4 className="text-lg font-bold text-brand-dark">Google Analytics</h4>
          <span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-medium">Connected</span>
        </div>
        {gaEmail&&<p className="text-xs text-muted-stone mb-2">{gaEmail}</p>}
        <div className="bg-yellow-50 text-yellow-700 rounded-xl p-3 text-sm mb-3">{gaError||'No data available for this property.'}</div>
        {gaProperties.length>1&&(
          <div className="mb-3">
            <label className="text-xs text-muted-stone block mb-1">Switch property:</label>
            <select value={gaSelectedProperty} onChange={e=>handlePropertyChange(e.target.value)} className="touch-target w-full px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none">
              {gaProperties.filter(p=>!usedProperties.includes(p.property)||p.property===gaSelectedProperty).map(p=><option key={p.property} value={p.property}>{p.displayName}</option>)}
            </select>
          </div>
        )}
        <button onClick={()=>{clearGaToken();setGaState('disconnected');setGaToken(null);setGaEmail('');setGaProperties([]);setGaSelectedProperty('');setGaData(null);setGaError('')}} className="touch-target px-4 py-2 bg-black/5 text-deep-obsidian/70 rounded-xl text-sm font-medium hover:bg-black/10 transition-colors">Disconnect</button>
      </div>
    );
  }

  // Loaded state — full dashboard
  const totalChannelSessions=gaData?.channels?.reduce((a,c)=>a+c.sessions,0)||1;

  return(
    <div className="space-y-4 fade-in font-manrope">
      {/* Header */}
      <div className="stitch-glass-card rounded-[24px] p-6">
        <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
          <div className="flex items-center gap-3">
            <h4 className="text-lg font-bold text-brand-dark">Google Analytics</h4>
            <span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-medium">Connected</span>
          </div>
          <button onClick={()=>{clearGaToken();setGaState('disconnected');setGaToken(null);setGaEmail('');setGaProperties([]);setGaSelectedProperty('');setGaData(null);setGaError('')}} className="text-xs text-muted-stone hover:text-brand-dark transition-colors">Disconnect</button>
        </div>
        {gaEmail&&<p className="text-xs text-muted-stone mb-2">{gaEmail}</p>}
        {gaProperties.length>1&&(
          <div>
            <label className="text-xs text-muted-stone block mb-1">Property:</label>
            <select value={gaSelectedProperty} onChange={e=>handlePropertyChange(e.target.value)} className="touch-target w-full px-3 py-2 border border-glass-border rounded-xl text-sm bg-white focus:ring-1 focus:ring-brand focus:outline-none">
              {gaProperties.filter(p=>!usedProperties.includes(p.property)||p.property===gaSelectedProperty).map(p=><option key={p.property} value={p.property}>{p.displayName}</option>)}
            </select>
          </div>
        )}
        {gaProperties.length<=1&&gaSelectedProperty&&<p className="text-xs text-muted-stone">{(gaProperties.find(p=>p.property===gaSelectedProperty)||{}).displayName||gaSelectedProperty}</p>}
      </div>

      {gaData&&(
        <>
          {/* 4 Big Stat Cards */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <div className="stitch-glass-card stitch-hover-lift rounded-[20px] p-5 text-center">
              <p className="text-xs text-muted-stone mb-1">Users</p>
              <p className="text-2xl font-bold text-brand-dark">{gaData.totalUsers.toLocaleString()}</p>
            </div>
            <div className="stitch-glass-card stitch-hover-lift rounded-[20px] p-5 text-center">
              <p className="text-xs text-muted-stone mb-1">Sessions</p>
              <p className="text-2xl font-bold text-brand-dark">{gaData.totalSessions.toLocaleString()}</p>
            </div>
            <div className="stitch-glass-card stitch-hover-lift rounded-[20px] p-5 text-center">
              <p className="text-xs text-muted-stone mb-1">Conversions</p>
              <p className="text-2xl font-bold text-brand-dark">{gaData.totalConversions.toLocaleString()}</p>
            </div>
            <div className="stitch-glass-card stitch-hover-lift rounded-[20px] p-5 text-center">
              <p className="text-xs text-muted-stone mb-1">Engagement Rate</p>
              <p className="text-2xl font-bold" style={{color:engColor(gaData.avgEngagementRate)}}>{gaData.avgEngagementRate.toFixed(1)}%</p>
            </div>
          </div>

          {/* Sessions Chart */}
          <GaDailyChart dailyData={gaData.daily}/>

          {/* Top Pages Table */}
          {gaData.pages.length>0&&(
            <div className="stitch-glass-card rounded-[24px] p-6">
              <h5 className="font-semibold text-brand-dark text-sm mb-3">Top Pages</h5>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead><tr className="text-left text-xs text-muted-stone border-b border-glass-border">
                    <th className="pb-2 pr-2">Page</th><th className="pb-2 pr-2 text-right">Views</th><th className="pb-2 text-right">Sessions</th>
                  </tr></thead>
                  <tbody>
                    {gaData.pages.map((p,i)=>{
                      let displayUrl=p.page;
                      if(displayUrl.length>40)displayUrl=displayUrl.slice(0,37)+'...';
                      return(
                        <tr key={i} className="border-b border-glass-border last:border-0">
                          <td className="py-2 pr-2 text-deep-obsidian/70 max-w-[200px] truncate" title={p.page}>{displayUrl}</td>
                          <td className="py-2 pr-2 text-right font-medium">{p.views.toLocaleString()}</td>
                          <td className="py-2 text-right text-muted-stone">{p.sessions.toLocaleString()}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* Channel Breakdown */}
          {gaData.channels.length>0&&(
            <div>
              <h5 className="font-semibold text-brand-dark text-sm mb-3">Traffic Channels</h5>
              <div className="space-y-2">
                {gaData.channels.map((c,i)=>{
                  const pct=((c.sessions/totalChannelSessions)*100).toFixed(1);
                  return(
                    <div key={i} className="stitch-glass-card rounded-[16px] p-3 flex items-center justify-between">
                      <span className="text-sm font-medium text-deep-obsidian/80">{c.channel}</span>
                      <div className="flex items-center gap-2">
                        <span className="text-xs text-muted-stone">{pct}%</span>
                        <span className="text-sm font-bold text-brand-dark">{c.sessions.toLocaleString()}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════
// FEATURE: Rank Maps Tab (per client) — AI-powered heat map analysis
// ═══════════════════════════════════════════
// ─── Live Heat Map Generator — real grid searches via DataForSEO, matched by
// Google Place ID, rendered on a free Leaflet map. Distinct from the
// screenshot-upload flow below (which reads someone else's tool's image). ───
// Rank -> color. Deliberately sharp cutoff at #3->#4 (green->yellow) so it's
// unambiguous at a glance whether a point is actually IN the visible pack.
// Gray is reserved specifically for "not found at all" — kept visually
// distinct from red ("found, but ranking badly") since those mean different
// things for strategy: gray = not on the radar, red = close but not close enough.
const heatRankColor=(rank)=>{
  if(!rank)return'#6b7280';       // not found in top 20 at all
  if(rank<=3)return'#22c55e';     // in the visible pack
  if(rank===4)return'#facc15';    // the cutoff — just missed it (lighter yellow)
  if(rank<=10)return'#fb923c';    // more true-orange, less muddy red-orange
  return'#ef4444';                // 11-20 — found, but far
};
const heatIntensity=(rank)=>rank?Math.max(0.15,1-((rank-1)/20)):0.02;
// Mirrors buildGrid()'s circular clip (netlify/shared/heatmap.mts) so the
// point count/cost shown before generating matches what actually gets
// submitted — the ratio of surviving points is purely a function of
// gridSize (radiusMiles cancels out of the circle-vs-square math), so this
// doesn't need to know the radius at all.
const circularGridCount=(n)=>{
  if(n<=1)return n;
  let count=0;
  const step=2/(n-1);
  for(let row=0;row<n;row++)for(let col=0;col<n;col++){
    const mLat=row*step-1,mLng=col*step-1;
    if(Math.hypot(mLat,mLng)<=1+1e-9)count++;
  }
  return count;
};

// Shared, parameterized so both LiveHeatMapGenerator's form AND the
// Local Keywords list's "Run Now" can trigger a real generation without
// duplicating the fetch/response-handling logic. Same behavior as the
// original component-local version, just not closed over component state.
async function generateLiveHeatMap({client,setData,keyword,gridSize,radiusMiles,device}){
  if(!client.placeId||!client.geo)return{ok:false,error:'Look up the business location first.'};
  if(!keyword||!keyword.trim())return{ok:false,error:'Enter a keyword to track.'};
  if(!radiusMiles||Number(radiusMiles)<=0)return{ok:false,error:'Enter a radius in miles.'};
  try{
    const r=await fetch('/api/generate-heatmap',{method:'POST',headers:await authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({keyword:keyword.trim(),placeId:client.placeId,mapsCid:client.mapsCid,businessName:client.name,centerLat:client.geo.lat,centerLng:client.geo.lng,gridSize,radiusMiles:Number(radiusMiles),device})});
    const j=await r.json();
    if(!r.ok||j.error)return{ok:false,error:j.error||'Failed to generate heat map'};
    const entry={id:uid(),generatedBy:'live',...j,snapshotDate:today(),businessName:client.name};
    setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>c.id===client.id?{...c,rankMaps:[entry,...(c.rankMaps||[])]}:c)};saveData(nd);return nd});
    return{ok:true,entry};
  }catch(e){
    return{ok:false,error:'Network error generating heat map.'};
  }
}

const HEATMAP_STUCK_TIMEOUT_MS=20*60*1000; // DataForSEO occasionally never resolves a handful of grid tasks (silently, no error) — without a cutoff those maps poll forever. 20min is well past the ~5min standard-queue turnaround.

// Shared with generateLiveHeatMap above, same reasoning — one real
// implementation, callable from anywhere a pending live map needs polling.
async function checkLiveHeatMapStatus({client,setData,entry}){
  const taskIds=(entry.grid||[]).map(p=>p.taskId).filter(Boolean);
  if(taskIds.length===0)return;
  const updateClient=(fields)=>{setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>c.id===client.id?{...c,...fields}:c)};saveData(nd);return nd})};
  const updateRankMap=(id,fields)=>{setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>{
    if(c.id!==client.id)return c;
    return{...c,rankMaps:(c.rankMaps||[]).map(m=>m.id===id?{...m,...fields}:m)};
  })};saveData(nd);return nd})};
  try{
    const r=await fetch('/api/heatmap-status',{method:'POST',headers:await authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({taskIds,mapsCid:client.mapsCid||entry.mapsCid,businessName:entry.businessName,businessPhone:client.phone,businessWebsite:client.website})});
    const j=await r.json();
    if(!r.ok||j.error)return;
    if(j.discoveredCid&&!client.mapsCid)updateClient({mapsCid:j.discoveredCid,mapsCidCandidates:null});
    else if(j.unconfirmedCandidates?.length&&!client.mapsCid)updateClient({mapsCidCandidates:j.unconfirmedCandidates});
    const rankByTask={};(j.results||[]).forEach(res=>{rankByTask[res.taskId]=res.rank});
    const grid=(entry.grid||[]).map(p=>p.taskId in rankByTask?{...p,rank:rankByTask[p.taskId],resolved:true}:p);
    const stuck=Date.now()-(entry.submittedAt||Date.now())>HEATMAP_STUCK_TIMEOUT_MS;
    if(j.pendingCount===0||stuck){
      const found=grid.filter(p=>p.rank);
      const total=grid.length;
      const top3=grid.filter(p=>p.rank&&p.rank<=3).length;
      const top4to10=grid.filter(p=>p.rank&&p.rank>3&&p.rank<=10).length;
      const top11to20=grid.filter(p=>p.rank&&p.rank>10).length;
      const top21plus=total-found.length;
      const solv=total?Math.round((top3/total)*1000)/10:0;
      const avgRank=found.length?Math.round((found.reduce((a,p)=>a+p.rank,0)/found.length)*10)/10:0;
      updateRankMap(entry.id,{grid,status:'complete',mapsCid:j.discoveredCid||entry.mapsCid,totalPoints:total,top3,top4to10,top11to20,top21plus,avgRank,solv,completedAt:Date.now(),incomplete:stuck&&j.pendingCount>0,competitors:j.competitors||entry.competitors});
    }else{
      updateRankMap(entry.id,{grid});
    }
  }catch(e){/* silent — user can just check again */}
}

// Tiny non-interactive preview of a grid's rank distribution for list
// rows — deliberately NOT a real Leaflet map (dozens of these could be
// visible in a scrolling list at once; real map instances would be far
// too heavy). Just colored dots positioned by each point's row/col.
function MiniHeatDots({grid,size=40}){
  if(!grid||grid.length===0){
    return<div className="flex items-center justify-center" style={{width:size,height:size}}><span className="material-symbols-outlined text-muted-stone" style={{fontSize:size*0.5}}>grid_on</span></div>;
  }
  const rows=grid.map(p=>p.row), cols=grid.map(p=>p.col);
  const minR=Math.min(...rows),maxR=Math.max(...rows),minC=Math.min(...cols),maxC=Math.max(...cols);
  const spanR=Math.max(1,maxR-minR),spanC=Math.max(1,maxC-minC);
  const dotR=Math.max(1.2,size/(Math.max(spanR,spanC)+1)/2.6);
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {grid.map((p,i)=>{
        const cx=((p.col-minC)/spanC)*(size-dotR*2)+dotR;
        const cy=((p.row-minR)/spanR)*(size-dotR*2)+dotR;
        const stuck=!!p.taskId&&!p.rank&&!p.resolved;
        return<circle key={i} cx={cx} cy={cy} r={dotR} fill={stuck?'#9ca3af':heatRankColor(p.rank)} opacity={stuck?0.5:0.9}/>;
      })}
    </svg>
  );
}

function LeafletHeatMap({points,centerLat,centerLng,businessName,address,keyword,gridSize,radiusMiles,mapHeight=440}){
  const containerRef=useRef(null);
  const mapRef=useRef(null);
  const wrapperRef=useRef(null);
  const [isFullscreen,setIsFullscreen]=useState(false);
  const found=points.filter(p=>p.rank);
  const solv=points.length?Math.round((points.filter(p=>p.rank&&p.rank<=3).length/points.length)*1000)/10:0;

  useEffect(()=>{
    const onFsChange=()=>{
      setIsFullscreen(document.fullscreenElement===wrapperRef.current);
    };
    document.addEventListener('fullscreenchange',onFsChange);
    return()=>document.removeEventListener('fullscreenchange',onFsChange);
  },[]);
  const toggleFullscreen=()=>{
    if(document.fullscreenElement){document.exitFullscreen?.()}
    else{wrapperRef.current?.requestFullscreen?.()}
  };

  useEffect(()=>{
    if(!containerRef.current||typeof L==='undefined'||points.length===0)return;
    if(mapRef.current){mapRef.current.remove();mapRef.current=null}
    // map.remove() only tears down Leaflet's own panes, not the lighten
    // overlay div we append manually below — without this, rebuilding the
    // map (e.g. on every fullscreen toggle) stacks a fresh overlay on top
    // of the leftover one each time, compounding the lighten effect.
    containerRef.current.innerHTML='';
    // Rebuilding the whole map (rather than just calling invalidateSize())
    // on every fullscreen toggle guarantees the tile layer requests tiles
    // for the ACTUAL final container size — invalidateSize() alone left the
    // tile layer still sized/positioned for the small pre-fullscreen
    // viewport, which rendered as a solid navy fill (our own lighten
    // overlay showing through with no tiles loaded behind it) once
    // stretched across the whole screen.
    // zoomAnimation/markerZoomAnimation off: with 100+ DOM marker icons
    // (each with a blurred box-shadow) plus the full-container mix-blend-mode
    // overlay below, Leaflet's animated zoom was repositioning/repainting
    // all of that every frame of the transition, which is what read as
    // stuttery. Snapping to the new zoom instantly is far smoother in
    // practice than animating something this heavy.
    const map=L.map(containerRef.current,{zoomControl:true,zoomAnimation:false,markerZoomAnimation:false,fadeAnimation:false});
    mapRef.current=map;
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',maxZoom:20,subdomains:'abcd'}).addTo(map);

    // No API key for the exact tile provider a reference screenshot used
    // (looks like a custom Mapbox dark style, not free CARTO tiles) — can't
    // be a literal pixel match. Closest approximation: tint CARTO's
    // blue-black dark_all tiles toward teal.
    //
    // REVERTED: an earlier attempt stacked a mix-blend-mode:'color' pass
    // UNDER this one to re-hue every pixel while preserving its luminosity.
    // That's only correct in theory — 'color' blend derives its result from
    // SetLum(overlayHue, backdropLuminosity), and dark_all's backdrop
    // luminosity is already near-zero almost everywhere, so the "recolored"
    // result was ALSO near-zero-luminosity — i.e. still just black, with no
    // visible teal at all. It only made the map render as broken/near-blank
    // (reported live: "map still not fully loading"). A single additive
    // screen-blend overlay (proven reliable for months before that change)
    // is the whole fix — screen blending doesn't depend on backdrop
    // luminosity to inject color, so it reliably lifts near-black pixels to
    // a visible teal regardless of how dark the source tile is.
    // Pushed noticeably more saturated/opaque than the first attempt at
    // this (rgba(45,120,120,0.6)) — that read as barely-there on top of
    // near-black tiles instead of a clear, unmistakable teal shift.
    const lightenOverlay=document.createElement('div');
    lightenOverlay.style.cssText='position:absolute;inset:0;background:rgba(10,170,150,0.75);mix-blend-mode:screen;pointer-events:none;z-index:250;';
    containerRef.current.appendChild(lightenOverlay);

    // Fit to the grid's real extent instead of a fixed zoom level — a tight
    // 1mi-radius grid and a wide 5mi one both used to render at the same
    // zoom, so the tight one always looked like a cramped, overlapping mess
    // no matter how the glow itself was tuned.
    // Zoom to the TOP-3 ("green") points specifically, not the whole grid —
    // those are the only points that actually matter (the visible 3-pack),
    // so the map opens already zoomed as tight as possible on them instead
    // of the old zoomed-way-out view of the entire search radius. Falls
    // back to the full grid if nothing ranked top-3 anywhere.
    const greenPoints=points.filter(p=>p.rank&&p.rank<=3);
    const boundsPoints=greenPoints.length>0?greenPoints:points;
    const bounds=L.latLngBounds(boundsPoints.map(p=>[p.lat,p.lng]));
    const refit=()=>{
      map.invalidateSize();
      // animate:false is required, not cosmetic — fitBounds' default
      // animated pan/zoom silently fails to complete when called right
      // after a resize (confirmed: the animated version gets stuck at the
      // pre-resize center/zoom, while the same call with animate:false
      // lands on the exact correct one every time).
      // Padding must be sized relative to the CONTAINER, not a flat 70px —
      // a flat value that's generous on a normal-sized map (the rank tab's
      // 640px view) eats up a huge chunk of a small one (the 260px
      // dashboard header preview), leaving too little room for fitBounds to
      // satisfy both "fit these points" AND "keep 70px clear on every
      // side" — which is what was cutting the grid off at the container's
      // left/right edges. Capping padding at 12% of the container's own
      // (smaller) dimension means it can never demand more room than the
      // container actually has, on any container size.
      const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
      // How far apart the grid points land on screen, measured across the
      // FULL grid's bounds (not the possibly-tighter top-3-only `bounds`
      // used for the zoom fit) — dividing a smaller bounds' pixel width by
      // the full gridSize-1 step count would underestimate real spacing.
      const measureSpacing=()=>{
        let sp=60;
        if(points.length>1&&gridSize>1){
          const fullBounds=L.latLngBounds(points.map(p=>[p.lat,p.lng]));
          const nw=map.latLngToContainerPoint(fullBounds.getNorthWest());
          const ne=map.latLngToContainerPoint(fullBounds.getNorthEast());
          sp=Math.hypot(ne.x-nw.x,ne.y-nw.y)/(gridSize-1);
        }
        return sp;
      };
      if(boundsPoints.length>1){
        // Cap how much tighter the green-only fit is allowed to zoom beyond
        // what it takes to fit the WHOLE grid. Without this, a small
        // clustered handful of top-3 points (e.g. 9 green out of ~97 at a
        // low SoLV) could zoom in so hard that ~85% of the grid — and
        // almost the entire competitor picture — gets cropped out of view
        // entirely, and the heat glow's radius (which scales with zoom)
        // blows up into one dominant blob covering the whole map. Each
        // Leaflet zoom level roughly DOUBLES resolution (so +1 zoom shows
        // 1/4 the area, +3 would show ~1/64) — +1 still reads as
        // meaningfully "zoomed in on the good part" without throwing away
        // most of the map's context the way a bigger cap did.
        const fullBounds=points.length>1?L.latLngBounds(points.map(p=>[p.lat,p.lng])):bounds;
        map.fitBounds(fullBounds,{animate:false,padding:[20,20]});
        const fullFitZoom=map.getZoom();
        const zoomCap=Math.min(17,fullFitZoom+1);
        // Two-pass fit: a dot's actual on-screen size (radius + glow blur)
        // depends on the zoom level fitBounds picks, but the padding
        // fitBounds needs to AVOID cutting off that same dot depends on its
        // size — a circular dependency a single fitBounds call can't solve.
        // Pass 1 establishes a baseline zoom with a small fixed margin;
        // pass 2 measures the dot size THAT zoom actually produces and
        // re-fits with padding sized to match exactly. This can't be fooled
        // by any grid density / container size combination, unlike a single
        // guessed padding value (flat, or scaled to container size alone).
        map.fitBounds(bounds,{maxZoom:zoomCap,animate:false,padding:[20,20]});
        const provisionalIcon=Math.round(clamp(measureSpacing()*0.95,8,46));
        const iconPad=Math.ceil(provisionalIcon/2+provisionalIcon/3.5+6);
        map.invalidateSize();
        map.fitBounds(bounds,{maxZoom:zoomCap,animate:false,padding:[iconPad,iconPad]});
      }else{
        map.setView([boundsPoints[0]?.lat??centerLat,boundsPoints[0]?.lng??centerLng],15,{animate:false});
      }
    };
    refit();
    // Leaflet reads the container's size at construction time — if this
    // map mounts inside a column/card whose width isn't settled yet
    // (flex/grid layout still resolving, a background image still loading,
    // etc.), that first fit can lock onto a wrong size and never
    // self-correct, leaving the grid off-center or way too zoomed out.
    // Watching for real size changes and re-fitting fixes that without
    // fighting the user's own pan/zoom (which never changes the
    // container's DOM size).
    let resizeObserver;
    if(typeof ResizeObserver!=='undefined'){
      resizeObserver=new ResizeObserver(()=>refit());
      resizeObserver.observe(containerRef.current);
    }

    // Final measurement, taken AFTER refit() has settled at its (pass-2,
    // icon-aware) zoom — scales pin size + glow radius/blur to that spacing.
    const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
    let spacingPx=60;
    if(points.length>1&&gridSize>1){
      const fullBounds=L.latLngBounds(points.map(p=>[p.lat,p.lng]));
      const nw=map.latLngToContainerPoint(fullBounds.getNorthWest());
      const ne=map.latLngToContainerPoint(fullBounds.getNorthEast());
      spacingPx=Math.hypot(ne.x-nw.x,ne.y-nw.y)/(gridSize-1);
    }
    // Floor lowered from 22 to 8 — a fixed minimum bigger than the actual
    // available spacing was FORCING dots to overlap on any dense grid in a
    // short container (e.g. the 260px-tall dashboard header preview with an
    // 11x11+ grid): the real per-point gap there can legitimately be well
    // under 22px, and clamping the icon to be bigger than its own gap
    // guarantees neighboring dots pile on top of each other. Letting it
    // shrink further (still never below 8px, so it stays visible) means the
    // shown size always actually fits the space, on any container/grid
    // combination — not just the ones this was tuned against.
    const iconSize=Math.round(clamp(spacingPx*0.95,8,46));
    const heatRadius=clamp(spacingPx*0.55,12,45);
    const heatBlur=clamp(spacingPx*0.42,9,35);

    // Soft colored glow underneath the numbered pins, blending nearby points together.
    // A genuinely 0-sized container (mount mid-layout, display:none, etc.)
    // makes leaflet.heat's canvas draw throw (getImageData on 0 width) —
    // harmless to skip it here since refit()'s later invalidateSize()/
    // fitBounds() will fire Leaflet's own moveend event once the container
    // has a real size, which leaflet.heat listens for to redraw itself.
    if(typeof L.heatLayer==='function'){
      try{
        const heatPoints=points.map(p=>[p.lat,p.lng,heatIntensity(p.rank)]);
        L.heatLayer(heatPoints,{radius:heatRadius,blur:heatBlur,maxZoom:17,minOpacity:0.16,
          gradient:{0.0:'#4b5563',0.25:'#ef4444',0.5:'#fb923c',0.7:'#facc15',0.85:'#22c55e',1.0:'#22c55e'}}).addTo(map);
      }catch(e){/* container had zero size at this instant — refit() below corrects it */}
    }

    // Zooming tight to the green cluster only guarantees green dots stay
    // fully on-screen — it says nothing about the other colors, which can
    // end up sliced in half right at the container edge (visually reads as
    // broken regardless of which color it happens to be). Rather than
    // trying to out-guess every possible padding scenario, just don't draw
    // a dot at all if its full circle wouldn't fit on screen — a marker
    // that's cleanly absent looks intentional; a marker sliced in half
    // never does, on any grid/container combination.
    const mapSize=map.getSize();
    points.forEach(p=>{
      // A stuck point (task submitted but never came back with a result) is
      // NOT the same thing as "confirmed not ranking" — the former means we
      // never actually got an answer for that spot, so it shouldn't look
      // identical to a real gray "not found" result.
      const stuck=!!p.taskId&&!p.rank&&!p.resolved;
      const color=stuck?'#374151':heatRankColor(p.rank);
      const screenPt=map.latLngToContainerPoint([p.lat,p.lng]);
      const halfIcon=iconSize/2;
      if(screenPt.x-halfIcon<0||screenPt.x+halfIcon>mapSize.x||screenPt.y-halfIcon<0||screenPt.y+halfIcon>mapSize.y)return;
      // Below ~16px there's no room to render a legible label anyway (a
      // "20+" or "#12" crammed into a tiny circle is just noise) — show a
      // plain colored dot instead. The color pattern still reads fine at a
      // glance; cramped illegible text does not.
      const showLabel=iconSize>=16;
      const label=showLabel?(stuck?'?':(p.rank?('#'+p.rank):'20+')):'';
      const fontSize=Math.max(9,Math.round(iconSize*(label.length>2?0.3:0.38)));
      const borderPx=iconSize<16?1:2;
      const icon=L.divIcon({
        className:'',
        html:`<div style="width:${iconSize}px;height:${iconSize}px;border-radius:50%;background:${color};border:${borderPx}px solid rgba(255,255,255,${stuck?0.4:0.85});box-shadow:0 0 ${Math.round(iconSize/3.5)}px ${color}99;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:${fontSize}px;font-family:system-ui;opacity:${stuck?0.55:1}">${label}</div>`,
        iconSize:[iconSize,iconSize],iconAnchor:[iconSize/2,iconSize/2],
      });
      L.marker([p.lat,p.lng],{icon}).addTo(map).bindPopup(stuck?'No result returned for this point':(p.rank?`Rank #${p.rank}`:'Not found in top 20'));
    });

    L.marker([centerLat,centerLng],{icon:L.divIcon({className:'',html:'<div style="width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #1e293b"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(map).bindPopup(businessName||'Business location');

    return()=>{
      if(resizeObserver)resizeObserver.disconnect();
      if(mapRef.current){mapRef.current.remove();mapRef.current=null}
    };
  },[points,centerLat,centerLng,gridSize,isFullscreen]);

  // isolate: Leaflet assigns its internal panes (tiles/markers/popups) z-index
  // values in the 200-700 range for its OWN internal layering. Without this
  // wrapper establishing its own stacking context, those values are compared
  // at whatever ancestor context they land in instead — which let a
  // still-mounted background map's marker pane (z-index 600) render on top of
  // a modal opened above it (z-50), since 600 > 50 at that shared context.
  return(
    <div ref={wrapperRef} className={`relative isolate overflow-hidden border ${isFullscreen?'flex flex-col h-full w-full':'rounded-xl'}`} style={{background:'#1e293b'}}>
      <div className="flex flex-wrap items-center justify-between gap-2 px-4 py-2.5 text-white flex-shrink-0" style={{background:'#1e293b'}}>
        <div>
          <div className="font-bold text-sm">{businessName}</div>
          {address&&<div className="text-[11px] text-gray-300">{address}</div>}
        </div>
        <div className="flex items-center gap-4 text-[11px] text-gray-300">
          <span>{keyword}</span>
          <span>Size {gridSize}×{gridSize}</span>
          <span title="Distance between adjacent grid points">Spacing {radiusMiles}mi</span>
          <span title="Distance from the center point to the edge of the grid">Covers ~{(Number(radiusMiles)*(gridSize-1)/2).toFixed(2)}mi</span>
          <span>Points {points.length}</span>
          <span className="px-2 py-1 rounded-full font-bold" style={{background:'#22c55e22',color:'#4ade80'}}>SoLV {solv}%</span>
          <button onClick={toggleFullscreen} className="touch-target w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/10 text-white flex-shrink-0" title={isFullscreen?'Exit full screen':'Full screen'}>
            <span className="material-symbols-outlined text-[18px]">{isFullscreen?'fullscreen_exit':'fullscreen'}</span>
          </button>
        </div>
      </div>
      <div ref={containerRef} className={isFullscreen?'flex-1 min-h-0':''} style={isFullscreen?{position:'relative'}:{height:mapHeight,position:'relative'}}/>
    </div>
  );
}

// Every grid point's local_finder response already lists every OTHER
// business ranking there, not just the client's — the backend now keeps
// that (previously discarded) data and aggregates it per map. No extra
// DataForSEO calls, no extra cost — same data already paid for.
// "Visibility" here means the same thing it does everywhere else in this
// app: % of grid points where that business ranks in the top 3.
// Joins a competitor's per-point ranks (keyed by taskId, from the free
// per-point breakdown DataForSEO already returns) onto the SAME grid
// geometry (row/col/lat/lng) the client's own map uses — lets any
// competitor within the stored top-20 render as a full heat map with zero
// additional API calls. Points the competitor didn't appear in (outside
// the top 20 at that GPS point) come back rank:null, same as "not found."
function buildCompetitorGrid(ownGrid,competitor){
  if(!competitor?.grid)return null;
  const rankByTask={};
  competitor.grid.forEach(p=>{rankByTask[p.taskId]=p.rank});
  return (ownGrid||[]).map(p=>({...p,rank:p.taskId in rankByTask?rankByTask[p.taskId]:null}));
}

function CompetitorsPanel({competitors,clientCid,selectedCid,onSelect,onCompare,listHeight=420}){
  if(!competitors||competitors.length===0){
    return(
      <div className="stitch-glass-card rounded-[20px] p-5 text-center">
        <p className="text-sm text-muted-stone">No competitor data captured for this map.</p>
        <p className="text-[11px] text-muted-stone mt-1">Maps generated before this feature shipped won't have it — regenerate to capture competitors.</p>
      </div>
    );
  }
  return(
    <div className="stitch-glass-card rounded-[20px] p-4">
      <div className="flex items-center justify-between mb-2 px-1">
        <h4 className="font-bold text-brand-dark text-sm">Top Competitors</h4>
        <span className="text-xs text-muted-stone">{competitors.length} found</span>
      </div>
      <div className="space-y-0.5 overflow-y-auto" style={{maxHeight:listHeight}}>
        {competitors.map((c,i)=>{
          const isTarget=clientCid&&c.cid===clientCid;
          const hasMap=!!c.grid;
          const canViewMap=hasMap&&!isTarget&&onSelect;
          const canCompare=hasMap&&!isTarget&&onCompare;
          const isSelected=selectedCid===c.cid;
          return(
            <div key={c.cid} onClick={()=>canViewMap&&onSelect(isSelected?null:c.cid)}
              className={`flex items-center justify-between gap-2 py-2 px-2 rounded-lg ${isTarget?'bg-brand/10 border border-brand/30':isSelected?'bg-brand/15 border border-brand/40':'border-b border-glass-border last:border-0'} ${canViewMap?'cursor-pointer hover:bg-black/[0.03]':''}`}>
              <div className="flex items-center gap-2 min-w-0">
                <span className="text-[11px] text-muted-stone w-4 flex-shrink-0 text-right">{i+1}</span>
                <div className="min-w-0">
                  <p className="text-sm font-medium text-deep-obsidian/85 truncate">{c.title}{isTarget&&<span className="text-[10px] text-brand font-bold ml-1">(YOU)</span>}</p>
                  {c.category&&<p className="text-[11px] text-muted-stone truncate">{c.category}</p>}
                </div>
              </div>
              <div className="flex items-center gap-3 flex-shrink-0 text-right">
                <div><p className="text-xs font-bold text-brand-dark">{c.visibilityPct}%</p><p className="text-[9px] text-muted-stone uppercase tracking-wide">Vis</p></div>
                <div><p className="text-xs font-bold text-brand-dark">{c.avgRank}</p><p className="text-[9px] text-muted-stone uppercase tracking-wide">Rank</p></div>
                {!isTarget&&(
                  <button onClick={e=>{e.stopPropagation();canCompare&&onCompare(c.cid)}} disabled={!canCompare} className="material-symbols-outlined text-[16px] disabled:cursor-default" style={{color:canCompare?undefined:'rgba(0,0,0,0.15)'}} title={canCompare?'Compare side-by-side':'Not available for this scan — re-run it to enable'}>compare_arrows</button>
                )}
                {!isTarget&&(
                  <span className={`material-symbols-outlined text-[16px] ${canViewMap?'text-muted-stone':'text-black/15'}`} title={canViewMap?'View their map':'Map not available for this scan — re-run it to enable'}>{isSelected?'visibility':'map'}</span>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}
