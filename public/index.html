// Shared detail view for a completed rank map + its competitor leaderboard —
// used by both LiveHeatMapGenerator's expanded row and the Local Keywords
// history panel so "view a competitor's map" behaves identically everywhere.
// Clicking a competitor swaps the main map to THEIR ranks at the exact same
// grid points (buildCompetitorGrid above) — no new DataForSEO calls.
function RankMapDetail({snapshot,client}){
  const [selectedCid,setSelectedCid]=useState(null);
  const [compareCid,setCompareCid]=useState(null);
  const competitors=snapshot.competitors||[];
  const selectedCompetitor=selectedCid?competitors.find(c=>c.cid===selectedCid):null;
  const compareCompetitor=compareCid?competitors.find(c=>c.cid===compareCid):null;
  const displayGrid=selectedCompetitor?buildCompetitorGrid(snapshot.grid,selectedCompetitor):snapshot.grid;
  const displayName=selectedCompetitor?selectedCompetitor.title:snapshot.businessName;
  return(
    <div className="grid grid-cols-1 lg:grid-cols-[1fr_360px] gap-3 items-start">
      <div>
        {selectedCompetitor&&(
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <button onClick={()=>setSelectedCid(null)} className="text-xs font-medium px-2 py-1 rounded-lg bg-brand/10 text-brand-dark hover:bg-brand/20">← Back to your map</button>
            <span className="text-xs text-muted-stone">Viewing: <span className="font-bold text-brand-dark">{displayName}</span></span>
          </div>
        )}
        <LeafletHeatMap points={displayGrid} centerLat={snapshot.centerLat} centerLng={snapshot.centerLng} businessName={displayName} address={selectedCompetitor?undefined:client.address} keyword={snapshot.keyword} gridSize={snapshot.gridSize} radiusMiles={snapshot.radiusMiles} mapHeight={640}/>
      </div>
      <CompetitorsPanel competitors={competitors} clientCid={snapshot.mapsCid||client.mapsCid} selectedCid={selectedCid} onSelect={setSelectedCid} onCompare={setCompareCid} listHeight={640}/>
      <CompetitorMatchupModal open={!!compareCompetitor} onClose={()=>setCompareCid(null)} snapshot={snapshot} client={client} competitor={compareCompetitor}/>
    </div>
  );
}

function LiveHeatMapGenerator({client,setData}){
  const [placeLoading,setPlaceLoading]=useState(false);
  const [placeError,setPlaceError]=useState('');
  const [keyword,setKeyword]=useState('');
  const [gridSize,setGridSize]=useState(5);
  const [radiusMiles,setRadiusMiles]=useState('');
  const [device,setDevice]=useState('mobile');
  const [genError,setGenError]=useState('');
  const [generating,setGenerating]=useState(false);
  const [expanded,setExpanded]=useState(null);
  const [frequency,setFrequency]=useState('weekly');
  const [dayOfWeek,setDayOfWeek]=useState(1);
  const [onceDate,setOnceDate]=useState('');
  const [timeOfDay,setTimeOfDay]=useState('09:00');
  const [timezone,setTimezone]=useState('America/Chicago');
  const [schedError,setSchedError]=useState('');
  const schedules=client.scheduledHeatMaps||[];
  const liveMaps=useMemo(()=>(client.rankMaps||[]).filter(m=>m.generatedBy==='live'),[client.rankMaps]);
  const pendingMaps=useMemo(()=>liveMaps.filter(m=>m.status==='pending'),[liveMaps]);

  const updateClient=(fields)=>{
    setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>c.id===client.id?{...c,...fields}:c)};saveData(nd);return nd});
  };
  const updateRankMap=(id,fields)=>{
    setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>{
      if(c.id!==client.id)return c;
      return{...c,rankMaps:(c.rankMaps||[]).map(m=>m.id===id?{...m,...fields}:m)};
    })};saveData(nd);return nd});
  };

  const findPlace=async()=>{
    setPlaceLoading(true);setPlaceError('');
    try{
      const r=await fetch('/api/lookup-place',{method:'POST',headers:await authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({name:client.name,address:[client.address,client.city,client.state].filter(Boolean).join(', ')})});
      const j=await r.json();
      if(!r.ok||j.error)setPlaceError(j.error||'Lookup failed');
      else updateClient({placeId:j.placeId,geo:{lat:j.lat,lng:j.lng},placeMatchedName:j.name,placeMatchedAddress:j.address});
    }catch(e){setPlaceError('Network error looking up business.')}
    setPlaceLoading(false);
  };

  const checkStatus=(entry)=>checkLiveHeatMapStatus({client,setData,entry});

  // Auto-poll every 30s for every live heat map that's still pending (not just one at a time).
  useEffect(()=>{
    if(pendingMaps.length===0)return;
    const iv=setInterval(()=>pendingMaps.forEach(m=>checkStatus(m)),30000);
    return()=>clearInterval(iv);
  },[pendingMaps.map(m=>m.id).join(',')]); // eslint-disable-line

  const generate=async()=>{
    setGenerating(true);setGenError('');
    const res=await generateLiveHeatMap({client,setData,keyword,gridSize,radiusMiles,device});
    if(!res.ok){setGenError(res.error);setGenerating(false);return}
    setKeyword('');
    setGenerating(false);
  };

  const addSchedule=()=>{
    if(!client.placeId||!client.geo){setSchedError('Look up the business location first.');return}
    if(!keyword.trim()){setSchedError('Enter a keyword to track.');return}
    if(!radiusMiles||Number(radiusMiles)<=0){setSchedError('Enter a radius in miles.');return}
    let nextRunAt;
    if(frequency==='once'){
      if(!onceDate){setSchedError('Pick a date to run this on.');return}
      nextRunAt=computeOnceRunAt(onceDate,timeOfDay,timezone);
      if(nextRunAt<=Date.now()){setSchedError('That date/time is in the past — pick a future time.');return}
    }
    setSchedError('');
    const timing={frequency,dayOfWeek:frequency==='once'?undefined:Number(dayOfWeek),timeOfDay,timezone};
    if(frequency!=='once')nextRunAt=computeInitialNextRunAt(Date.now(),timing);
    const entry={id:uid(),keyword:keyword.trim(),gridSize,radiusMiles:Number(radiusMiles),device,centerLat:client.geo.lat,centerLng:client.geo.lng,...timing,active:true,createdAt:Date.now(),lastRunAt:null,nextRunAt};
    updateClient({scheduledHeatMaps:[entry,...schedules]});
  };
  const cancelSchedule=(id)=>{
    updateClient({scheduledHeatMaps:schedules.filter(s=>s.id!==id)});
  };
  const deleteLiveMap=(id)=>{
    if(!confirm('Delete this heat map?'))return;
    setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>c.id===client.id?{...c,rankMaps:(c.rankMaps||[]).filter(m=>m.id!==id)}:c)};saveData(nd);return nd});
  };

  const estCost=(circularGridCount(gridSize)*0.0019).toFixed(3); // observed real rate: ~$0.0019/pt, not DataForSEO's advertised $0.0006 — point count is the circular-clipped count, not gridSize²

  return(
    <div className="stitch-glass-card rounded-[24px] p-6 space-y-4 font-manrope">
      <div>
        <h4 className="text-lg font-bold text-brand-dark">Generate Heat Map (Live)</h4>
        <p className="text-xs text-muted-stone mt-1">Real Google Search results (not the Maps app) from a grid of exact GPS points, ranked 1-20 and matched by Google's own business ID. Ranks 1-3 are exactly what shows in the visible 3-pack.</p>
      </div>

      {!client.placeId?(
        <div>
          <button onClick={findPlace} disabled={placeLoading} className="touch-target px-4 py-2 bg-brand text-white rounded-xl text-sm font-medium hover:bg-brand-hover disabled:opacity-50 shadow-lg shadow-brand/20">{placeLoading?'Looking up...':'Find Business on Google'}</button>
          <p className="text-[11px] text-muted-stone mt-1">One-time — finds the exact business location. First generation also auto-discovers its Google business ID for unambiguous matching afterward. Needs Name/Address filled in Settings.</p>
          {placeError&&<div className="bg-red-50 text-red-700 rounded-xl p-2 text-xs mt-2">{placeError}</div>}
        </div>
      ):(
        <>
          <div className="bg-green-50 text-green-700 rounded-xl p-2 text-xs flex items-center gap-1.5"><span className="material-symbols-outlined text-[16px]">check_circle</span>Matched: {client.placeMatchedName} — {client.placeMatchedAddress} <button onClick={findPlace} className="underline ml-2">Re-lookup</button></div>

          {client.mapsCid&&(
            <div className="bg-black/5 text-muted-stone rounded-xl p-2 text-[11px] flex items-center justify-between flex-wrap gap-2">
              <span>Ranking matches confirmed by Google CID <code className="text-deep-obsidian/70">{client.mapsCid}</code></span>
              <button onClick={()=>{if(confirm('Clear the confirmed business match? Ranking data will re-verify (by phone/website, not just name) on the next scan before matching resumes.'))updateClient({mapsCid:null,mapsCidCandidates:null})}} className="text-red-500 hover:underline flex-shrink-0">Change match</button>
            </div>
          )}

          {!client.mapsCid&&client.mapsCidCandidates?.length>0&&(
            <div className="bg-yellow-50 text-yellow-800 rounded-xl p-3 text-xs space-y-2">
              <p className="font-medium">Couldn't confirm which business this is automatically — either none matched your phone/website on file, or none closely matched the name on file. Pick the correct one from what showed up most often in these searches:</p>
              {client.mapsCidCandidates.map(c=>(
                <div key={c.cid} className="flex items-center justify-between flex-wrap gap-2 bg-white rounded-xl p-2 border border-yellow-200">
                  <div>
                    <div className="font-medium text-deep-obsidian/80">{c.title}</div>
                    <div className="text-muted-stone">{c.phone||'no phone listed'} {c.domain?`· ${c.domain}`:''} {c.rating?`· ${c.rating}★ (${c.votes||0})`:''}</div>
                  </div>
                  <button onClick={()=>updateClient({mapsCid:c.cid,mapsCidCandidates:null})} className="touch-target px-3 py-1.5 bg-brand text-white rounded-lg text-xs font-medium hover:bg-brand-hover flex-shrink-0">This is my business</button>
                </div>
              ))}
              <p className="text-[11px] text-yellow-700">If none of these are correct, add/verify the client's phone number and website in Settings, then generate again — matching will re-check automatically.</p>
            </div>
          )}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div className="col-span-2 sm:col-span-1">
              <label className="text-xs text-muted-stone">Keyword</label>
              <input value={keyword} onChange={e=>setKeyword(e.target.value)} placeholder="e.g. tree removal prosper tx" className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none"/>
            </div>
            <div>
              <label className="text-xs text-muted-stone">Grid size</label>
              <select value={gridSize} onChange={e=>setGridSize(Number(e.target.value))} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none">
                {[3,5,7,9,11,13].map(n=><option key={n} value={n}>{n}×{n} ({circularGridCount(n)} pts)</option>)}
              </select>
            </div>
            <div>
              <label className="text-xs text-muted-stone">Radius (miles between points)</label>
              <input type="number" min="0.25" step="0.25" value={radiusMiles} onChange={e=>setRadiusMiles(e.target.value)} placeholder="2" className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none"/>
              {radiusMiles>0&&<p className="text-[11px] text-muted-stone mt-1">Covers ~{(Number(radiusMiles)*(gridSize-1)/2).toFixed(2)}mi out from center at this grid size.</p>}
            </div>
            <div>
              <label className="text-xs text-muted-stone">Device</label>
              <select value={device} onChange={e=>setDevice(e.target.value)} className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none">
                <option value="mobile">Mobile</option>
                <option value="desktop">Desktop</option>
              </select>
            </div>
          </div>
          <div className="flex items-center gap-3">
            <button onClick={generate} disabled={generating} className="touch-target px-4 py-2 bg-brand text-white rounded-xl text-sm font-medium hover:bg-brand-hover disabled:opacity-50 shadow-lg shadow-brand/20">{generating?'Submitting...':`Generate (~$${estCost})`}</button>
            {pendingMaps.length>0&&<span className="text-xs text-muted-stone">{pendingMaps.length} map{pendingMaps.length>1?'s':''} still generating — you can start another one, no need to wait.</span>}
          </div>
          {genError&&<div className="bg-red-50 text-red-700 rounded-xl p-2 text-xs">{genError}</div>}

          <div className="pt-1 border-t border-glass-border mt-2">
            <p className="text-xs text-muted-stone mt-2 mb-1">Schedule this exact search to run automatically:</p>
            <div className="flex items-center flex-wrap gap-2">
              <select value={frequency} onChange={e=>setFrequency(e.target.value)} className="touch-target px-2 py-1 border border-glass-border rounded-lg text-xs focus:ring-1 focus:ring-brand focus:outline-none">
                <option value="once">One time</option>
                <option value="weekly">Weekly</option>
                <option value="biweekly">Every 2 weeks</option>
                <option value="monthly">Monthly</option>
              </select>
              {frequency==='once'?(

}

function RankMapsSection({client,setData}){
  const [uploading,setUploading]=useState(false);
  const [preview,setPreview]=useState(null);
  const [error,setError]=useState('');
  const rankMaps=(client.rankMaps||[]).filter(m=>m.generatedBy!=='live'); // live ones render in LiveHeatMapGenerator above

  // Shared function: process a dataUrl image through Claude
  const processImage=async(dataUrl,mediaType)=>{
    setError('');setUploading(true);setPreview(null);
    const base64=dataUrl.split(',')[1];

    // Create thumbnail for storage (resize to max 800px wide)
    let thumbnail=dataUrl;
    try{
      const img=new Image();
      await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=dataUrl});
      const maxW=800;
      if(img.width>maxW){
        const canvas=document.createElement('canvas');
        const scale=maxW/img.width;
        canvas.width=maxW;canvas.height=img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        thumbnail=canvas.toDataURL('image/jpeg',0.7);
      }
    }catch(err){/* keep original */}

    setPreview(thumbnail);

    try{
      const resp=await fetch('/.netlify/functions/analyze-heatmap',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({image:base64,mediaType})
      });
      const result=await resp.json();

      if(result.error){setError('AI analysis failed: '+result.error);setUploading(false);return}
      if(result.parseError){setError('Could not parse AI response. Please try again.');setUploading(false);return}

      const entry={
        id:uid(),image:thumbnail,
        keyword:result.keyword||'Unknown',businessName:result.businessName||client.name,
        address:result.address||'',gridSize:result.gridSize||'',radius:result.radius||'',
        totalPoints:result.totalPoints||0,avgRank:result.avgRank||0,
        top3:result.top3||0,top4to10:result.top4to10||0,
        top11to20:result.top11to20||0,top21plus:result.top21plus||0,
        solv:result.solv||null,keywords:result.keywords||0,
        snapshotDate:result.snapshotDate||today(),uploadedAt:new Date().toISOString()
      };

      setData(prev=>{
        const nd={...prev,clients:prev.clients.map(c=>{
          if(c.id!==client.id)return c;
          return{...c,rankMaps:[entry,...(c.rankMaps||[])]};
        })};
        saveData(nd);return nd;
      });
      setPreview(null);setUploading(false);
    }catch(err){
      setError('Failed to analyze image. Please try again.');
      setUploading(false);
    }
  };

  // File upload handler
  const handleUpload=async(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>processImage(ev.target.result,file.type||'image/png');
    reader.readAsDataURL(file);
  };

  // Paste handler — Ctrl+V anywhere on the page
  React.useEffect(()=>{
    const onPaste=(e)=>{
      if(uploading)return;
      const items=e.clipboardData?.items;
      if(!items)return;
      for(const item of items){
        if(item.type.startsWith('image/')){
          e.preventDefault();
          const file=item.getAsFile();
          const reader=new FileReader();
          reader.onload=(ev)=>processImage(ev.target.result,file.type||'image/png');
          reader.readAsDataURL(file);
          return;
        }
      }
    };
    document.addEventListener('paste',onPaste);
    return()=>document.removeEventListener('paste',onPaste);
  },[uploading,client.id]);

  const deleteMap=(id)=>{
    if(!confirm('Delete this rank map?'))return;
    setData(prev=>{
      const nd={...prev,clients:prev.clients.map(c=>{
        if(c.id!==client.id)return c;
        return{...c,rankMaps:(c.rankMaps||[]).filter(m=>m.id!==id)};
      })};
      saveData(nd);return nd;
    });
  };

  const getRankColor=(rank)=>{
    if(!rank||rank<=0)return'bg-gray-100 text-gray-500';
    if(rank<=3)return'bg-green-100 text-green-700';
    if(rank<=7)return'bg-yellow-100 text-yellow-700';
    if(rank<=12)return'bg-orange-100 text-orange-700';
    return'bg-red-100 text-red-700';
  };

  return(
    <div className="fade-in font-manrope space-y-6">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h3 className="text-xl font-bold text-brand-dark">Rank Maps</h3>
          <p className="text-sm text-muted-stone mt-1">Screenshot a heat map and <strong>Ctrl+V</strong> to paste, or upload a file</p>
        </div>
        <label className={`touch-target flex items-center gap-1.5 px-5 py-2.5 rounded-xl font-medium text-sm cursor-pointer transition-all shadow-lg shadow-brand/20 ${uploading?'bg-gray-400 text-white cursor-wait':'bg-brand text-white hover:bg-brand-hover'}`}>
          <span className="material-symbols-outlined text-[18px]">{uploading?'hourglass_top':'upload'}</span>{uploading?'Analyzing...':'Upload'}
          <input type="file" accept="image/*" onChange={handleUpload} disabled={uploading} className="sr-only"/>
        </label>
      </div>

      <LiveHeatMapGenerator client={client} setData={setData}/>

      <div className="text-xs text-muted-stone pt-2 border-t border-glass-border">Legacy: screenshot a heat map from another tool (SEO Utils, Local Falcon, etc.) below instead.</div>

      {/* Paste zone hint */}
      {!uploading&&rankMaps.length===0&&(
        <div className="border-2 border-dashed border-brand/30 rounded-[24px] p-6 text-center bg-brand/5">
          <span className="material-symbols-outlined text-3xl text-brand mb-2">content_paste</span>
          <p className="text-sm font-medium text-brand-dark">Take a screenshot and press Ctrl+V to paste it here</p>
          <p className="text-xs text-muted-stone mt-1">Or click Upload to browse for a file</p>
        </div>
      )}

      {error&&<div className="bg-red-50 border border-red-200 rounded-[20px] p-3 text-sm text-red-700">{error}</div>}

      {uploading&&preview&&(
        <div className="stitch-glass-card rounded-[24px] p-4 text-center">
          <div className="animate-pulse mb-3">
            <div className="w-12 h-12 mx-auto bg-brand/20 rounded-full flex items-center justify-center"><span className="material-symbols-outlined text-brand">smart_toy</span></div>
            <p className="text-sm text-deep-obsidian/70 mt-2 font-medium">Claude is reading your heat map...</p>
            <p className="text-xs text-muted-stone mt-1">Extracting keyword, rankings, grid data...</p>
          </div>
          <img src={preview} alt="Uploading..." className="max-h-48 mx-auto rounded-xl opacity-60"/>
        </div>
      )}

      {rankMaps.length===0&&!uploading&&(
        <div className="stitch-glass-card rounded-[24px] p-8 text-center">
          <span className="material-symbols-outlined text-5xl text-brand mb-3">location_on</span>
          <h4 className="font-bold text-brand-dark text-lg">No rank maps yet</h4>
          <p className="text-sm text-muted-stone mt-2 max-w-md mx-auto">Screenshot a heat map from SEO Utils, Local Falcon, or any rank tracker, then <strong>Ctrl+V</strong> to paste it. Claude will automatically extract all the data.</p>
        </div>
      )}

      {rankMaps.length>0&&(
        <div className="space-y-4">
          {rankMaps.map(m=>(
            <div key={m.id} className="stitch-glass-card rounded-[24px] overflow-hidden">
              <div className="p-4">
                <div className="flex flex-col sm:flex-row gap-4">
                  {/* Heat map image */}
                  <div className="sm:w-64 flex-shrink-0">
                    <img src={m.image} alt={m.keyword} className="w-full rounded-xl border border-glass-border cursor-pointer hover:opacity-90 transition-opacity" onClick={()=>{const w=window.open('','_blank');w.document.write(`<img src="${m.image}" style="max-width:100%;height:auto">`);w.document.title=m.keyword}}/>
                  </div>
                  {/* Data */}
                  <div className="flex-1 min-w-0">
                    <div className="flex items-start justify-between gap-2">
                      <div>
                        <h4 className="font-bold text-brand-dark text-lg leading-tight">"{m.keyword}"</h4>
                        {m.address&&<p className="text-xs text-muted-stone mt-0.5">{m.address}</p>}
                        <div className="flex flex-wrap gap-2 mt-2">
                          {m.gridSize&&<span className="text-xs bg-black/5 text-deep-obsidian/70 px-2 py-0.5 rounded-full flex items-center gap-1"><span className="material-symbols-outlined text-[12px]">grid_on</span>{m.gridSize}</span>}
                          {m.radius&&<span className="text-xs bg-black/5 text-deep-obsidian/70 px-2 py-0.5 rounded-full flex items-center gap-1"><span className="material-symbols-outlined text-[12px]">straighten</span>{m.radius}</span>}
                          {m.totalPoints>0&&<span className="text-xs bg-black/5 text-deep-obsidian/70 px-2 py-0.5 rounded-full flex items-center gap-1"><span className="material-symbols-outlined text-[12px]">place</span>{m.totalPoints} pts</span>}
                          {m.keywords>0&&<span className="text-xs bg-black/5 text-deep-obsidian/70 px-2 py-0.5 rounded-full flex items-center gap-1"><span className="material-symbols-outlined text-[12px]">key</span>{m.keywords} keywords</span>}
                        </div>
                      </div>
                      <button onClick={()=>deleteMap(m.id)} className="text-muted-stone hover:text-red-500 flex-shrink-0" title="Delete"><span className="material-symbols-outlined text-[20px]">delete</span></button>
                    </div>

                    {/* Stats grid */}
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-3">
                      <div className={`rounded-lg p-2.5 text-center ${getRankColor(m.avgRank)}`}>
                        <div className="text-xs font-medium opacity-70">Avg Rank</div>
                        <div className="text-xl font-bold">{m.avgRank||'—'}</div>
                      </div>
                      <div className="rounded-lg p-2.5 text-center bg-blue-50 text-blue-700">
                        <div className="text-xs font-medium opacity-70">SoLV</div>
                        <div className="text-xl font-bold">{m.solv||'—'}</div>
                      </div>
                      <div className="rounded-lg p-2.5 text-center bg-green-50 text-green-700">
                        <div className="text-xs font-medium opacity-70">Top 3</div>

                      </div>
                      <div className="rounded-lg p-2.5 text-center bg-yellow-50 text-yellow-700">

                      <div className="rounded-lg p-2.5 text-center bg-orange-50 text-orange-700">

                      <span className="flex items-center gap-1"><span className="material-symbols-outlined text-[14px]">upload</span>Uploaded {new Date(m.uploadedAt).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>

// ─── Content Prompt Templates ───
const SHARED_CONTENT_RULES = `
CONTENT GUIDELINES (APPLY TO ALL CONTENT)

For Google:
- Service name + city in H1 and first paragraph
- Each child service mentioned by exact name where applicable
- Local references woven naturally into content
- Proper heading hierarchy (H1 > H2 > H3, no skipping levels)

For AI Systems:
- Sound like a local expert
- Natural, conversational language
- Genuinely helpful

Language:
- 5th grade reading level
- Short sentences
- Not salesy - confident and helpful

Words to AVOID: embark, look no further, top-notch, comprehensive, delve, crucial, vital, seamless, cutting-edge, leverage, robust, game-changer, nestled, we understand, testament, state-of-the-art

NEVER use em dashes (—) or en dashes (–). Use regular hyphens (-) or rewrite the sentence. Em dashes are a telltale sign of AI-generated text.

Content Principles:
- Focus on the USER's problem, not the company's history
- Lead with proof, not promises
- Use specific numbers when possible
- No generic claims like "Quality Service" or "Experienced Team"
- Every sentence must earn its place - no filler
- Written as flowing paragraphs, NOT bullet lists
`;

// ─── Hierarchy Parser (replaces AI architecture generation) ───
function nameToSlug(name){
  return '/'+name.toLowerCase().replace(/&/g,'and').replace(/'/g,'').replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
}

function parseHierarchy(text,client){
  const lines=text.split('\n');
  const categories=[];
  let currentCat=null;
  let primaryCatName='';
  let extractedServiceAreas=[];

  // Category type labels that appear BELOW a category name in GBP
  const categoryLabels=['primary category','secondary category','additional category'];
  // Lines to completely ignore
  const ignoreLines=['services','add a custom service','edit services','add more services','delete','add service area','business location','location','service areas'];
  // Detect if this is GBP paste format
  const isGBP=/primary category|additional category|secondary category/i.test(text);
  // Detect if this is ONLY service areas (starts with "Service area" but no category labels)
  const isServiceAreaOnly=/^service\s*areas?\s*$/im.test(text)&&!isGBP;

  // Helper: extract just the city name from a GBP service area line like "Axtell, TX 76624, USA"
  const extractCityFromArea=(raw)=>{
    let city=raw.trim();
    // Remove country (USA, US, United States)
    city=city.replace(/,?\s*(USA?|United States)\s*$/i,'').trim();
    // Remove zip code
    city=city.replace(/,?\s*\d{5}(-\d{4})?\s*/g,'').trim();
    // Remove state abbreviation (standalone or after comma)
    city=city.replace(/,?\s*\b(AL|AK|AZ|AR|CA|CO|CT|DE|FL|GA|HI|ID|IL|IN|IA|KS|KY|LA|ME|MD|MA|MI|MN|MS|MO|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PA|RI|SC|SD|TN|TX|UT|VT|VA|WA|WV|WI|WY|DC)\b\s*$/gi,'').trim();
    // Remove trailing comma
    city=city.replace(/,\s*$/,'').trim();
    return city;
  };

  // Extract service areas if present
  const areaMatch=text.match(/service\s*areas?\s*[\n:]([\s\S]*?)(?=\n\s*(?:primary|additional|secondary|services|$))/i);
  if(areaMatch){
    const areaBlock=areaMatch[1];
    // Split by NEWLINE only (not comma) — each line is one full area like "Axtell, TX 76624, USA"
    areaBlock.split(/\n/).map(a=>a.trim()).filter(a=>a&&a.length<80&&!/primary|additional|secondary|category|service/i.test(a)).forEach(a=>{
      const city=extractCityFromArea(a);
      if(city)extractedServiceAreas.push(city);
    });
  }

  // If this is ONLY service areas pasted, extract all lines as areas and skip all other parsing
  if(isServiceAreaOnly){
    for(let i=0;i<lines.length;i++){
      const trimmed=lines[i].trim();
      if(!trimmed)continue;
      const lower=trimmed.toLowerCase();
      if(lower==='service area'||lower==='service areas'||/^add service/i.test(lower))continue;
      const city=extractCityFromArea(trimmed);
      if(city)extractedServiceAreas.push(city);
    }
    extractedServiceAreas=[...new Set(extractedServiceAreas)];
    // Skip all category/service parsing — go straight to building the return object
  }else if(isGBP){
    // ─── GBP Format Parser ───
    // Step 1: Clean lines — tag each as: category-label, ignore, description, or name
    const cleaned=[];
    let inServiceAreaSection=false;
    for(let i=0;i<lines.length;i++){
      const trimmed=lines[i].trim();
      if(!trimmed)continue;
      const lower=trimmed.toLowerCase();

      // Service area section detection — "Service area" or "Service areas"
      if(/^service\s*areas?$/i.test(trimmed)||lower==='service area'||lower==='service areas'){inServiceAreaSection=true;continue}
      if(inServiceAreaSection){
        if(categoryLabels.includes(lower)||lower==='services'||/primary category|additional category/i.test(lower)){inServiceAreaSection=false}
        else if(/^add service/i.test(lower)||lower==='delete'){continue}
        else{const city=extractCityFromArea(trimmed);if(city)extractedServiceAreas.push(city);continue}
      }

      // Check if it's a category label (Primary category, Additional category, etc.)
      if(categoryLabels.includes(lower)){
        cleaned.push({type:'category-label',text:trimmed,lower:lower});
      }
      // Check if it's an ignorable GBP UI element
      else if(ignoreLines.includes(lower)||/^add more/i.test(lower)||/^\+\s*add/i.test(lower)||lower==='delete'){
        continue; // skip entirely
      }
      // Check if it's a description (long text with sentences)
      else if(trimmed.length>80||/\.\s+[A-Z]/.test(trimmed)||(trimmed.split(/[.!]/).length>2&&trimmed.length>50)){
        continue; // skip descriptions
      }
      // It's a name (category name or service name)
      else{
        cleaned.push({type:'name',text:trimmed});
      }
    }

    // Step 2: Walk through cleaned lines
    // Pattern: name → category-label = this name is a CATEGORY
    // Pattern: name (not followed by category-label) = this name is a SERVICE
    for(let i=0;i<cleaned.length;i++){
      const line=cleaned[i];
      if(line.type==='name'){
        // Check if the NEXT line is a category label
        const next=cleaned[i+1];
        if(next&&next.type==='category-label'){
          // This name is a category
          const isPrimary=/primary/i.test(next.lower);
          if(isPrimary)primaryCatName=line.text;
          currentCat={name:line.text,slug:nameToSlug(line.text),children:[],type:'secondaryCategory',isPrimary:isPrimary};
          categories.push(currentCat);
          i++; // skip the label line
        }else{
          // This name is a service under current category
          if(currentCat){
            currentCat.children.push({name:line.text,slug:nameToSlug(line.text)});
          }
        }
      }
      // Skip any stray category-labels not preceded by a name
    }
  }else{
    // ─── Manual Indent Format Parser ───
    for(let i=0;i<lines.length;i++){
      const line=lines[i];
      const trimmed=line.trim();
      if(!trimmed)continue;
      if(/^\s+[-–—•]/.test(line)){
        const serviceName=trimmed.replace(/^[-–—•]\s*/,'').trim();
        if(serviceName&&currentCat){
          currentCat.children.push({name:serviceName,slug:nameToSlug(serviceName)});
        }
      }else{
        const catName=trimmed.replace(/^[-–—•]\s*/,'').trim();
        if(catName){
          currentCat={name:catName,slug:nameToSlug(catName),children:[],type:'secondaryCategory'};
          categories.push(currentCat);
        }
      }
    }
  }

  // Deduplicate extracted service areas
  extractedServiceAreas=[...new Set(extractedServiceAreas)];
  // Build location pages from service areas (use extracted areas if content config is empty)
  const cc=client.contentConfig||{};
  const configAreas=(cc.serviceAreas||'').split(',').map(a=>a.trim()).filter(Boolean);
  const areas=configAreas.length>0?configAreas:extractedServiceAreas;
  const locationPages=areas.map(areaCity=>({
    city:areaCity,slug:'/service-areas/'+areaCity.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,''),
    title:(client.primaryCategory||'Services')+' in '+areaCity+', '+(cc.stateAbbrev||'')+' | '+(client.name||''),
    metaDescription:''
  }));
  // Build architecture object compatible with page writer
  const bizName=client.name||'';
  const city=client.city||'';
  const st=cc.stateAbbrev||'';
  const primaryCat=primaryCatName||client.primaryCategory||'';
  // Separate primary from secondary categories
  const secondaryCats=categories.filter(c=>!c.isPrimary);
  const primaryCats=categories.filter(c=>c.isPrimary);
  // All categories go into secondaryCategories for the page writer (primary category is the top-level business type)
  const allCats=[...primaryCats,...secondaryCats];
  return{
    homepageUrl:'/',
    homepageTitle:primaryCat+' in '+city+', '+st+' | '+bizName,
    secondaryCategories:allCats.map(cat=>({
      name:cat.name,slug:cat.slug,
      title:cat.name+' in '+city+', '+st+' | '+bizName,
      metaDescription:'',
      isPrimary:!!cat.isPrimary,
      coreServices:cat.children.map(ch=>({
        name:ch.name,slug:ch.slug,
        title:ch.name+' in '+city+', '+st+' | '+bizName,
        metaDescription:'',
        childServices:[]
      }))
    })),
    locationPages:locationPages,
    supportPages:[
      {name:'About',slug:'/about',title:'About '+bizName+' | '+city+', '+st,metaDescription:''},
      {name:'Contact',slug:'/contact',title:'Contact '+bizName+' | '+city+', '+st,metaDescription:''}
    ],
    basicInfo:{
      targetKeyword:primaryCat+' '+city+' '+st,
      trustSignals:[],
      localIssues:[]
    },
    homepageAnchorTextOptions:[
      primaryCat+' in '+city,
      city+' '+primaryCat,
      primaryCat+' services in '+city+' '+st
    ],
    // Extra metadata for auto-filling content setup
    _extracted:{
      primaryCategory:primaryCatName,
      secondaryCategories:secondaryCats.map(c=>c.name),
      serviceAreas:extractedServiceAreas.filter(Boolean)
    }
  };
}

    '{business.serviceAreas}': cc.serviceAreas||'',

    '{business.differentiators.avgResponseTime}': diff.avgResponseTime||'',
    '{business.differentiators.freeEstimates}': diff.freeEstimates||'',
    '{business.differentiators.tripFee}': diff.tripFee||'',
    '{business.differentiators.availability}': diff.availability||'',
    '{business.differentiators.yearsServing}': diff.yearsServing||'',
    '{business.differentiators.guarantees}': diff.guarantees||'',
    '{business.differentiators.licenses}': diff.licenses||'',
    '{business.differentiators.locallyOwned}': diff.locallyOwned||'',
    '{business.differentiators.uniqueDifferentiator}': diff.uniqueDifferentiator||''
  };
  // Add architecture vars
  Object.keys(arch).forEach(k=>{
    const val = typeof arch[k]==='object'?JSON.stringify(arch[k]):String(arch[k]||'');
    map[`{architecture.${k}}`] = val;
  });
  let result = template;
  Object.keys(map).forEach(k=>{result = result.split(k).join(map[k])});
  return result;
}

async function callContentAPI(systemPrompt, userPrompt, apiKey){
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-opus-4-20250514',
      max_tokens: 8192,
      system: systemPrompt + '\n\nCRITICAL FORMATTING RULE: NEVER use em dashes (—) or en dashes (–) anywhere in the output. Use regular hyphens (-) or rewrite the sentence to avoid dashes entirely. This is non-negotiable. Every single dash in your output must be a standard hyphen. Em dashes and en dashes make content look AI-generated.',
      messages: [{ role: 'user', content: userPrompt }]
    })
  });
  const data = await resp.json();
  if(data.error) throw new Error(data.error.message);
  return data.content[0].text;
}

    }catch(e){setSvcError(e.message)}
    setSvcLoading(false);
  };

  const findCategories=async()=>{
    if(!apiKey){setCatError('Set your API key in the Content tab first.');return}
    if(!niche){setCatError('Set the client industry/primary category in Content Setup or Settings first.');return}
    setCatLoading(true);setCatError('');
    try{
      const systemPrompt=`You are a local SEO expert specializing in Google Business Profile category optimization and entity authority building. You have memorized the complete official list of all Google Business Profile categories. You understand that additional categories expand the entity's topical footprint in Google's knowledge graph, and the ORDER matters - categories listed first carry more weight. Your goal is to choose categories that maximize entity authority around the primary category. Only suggest categories that actually exist in Google's system. NEVER use em dashes or en dashes - use regular hyphens only.`;
      const userPrompt=`What additional categories should a local ${niche} business in ${city} use for their Google Business Profile?

Their primary category is: ${niche}
${secondaryCats?'Their current additional categories are: '+secondaryCats:'They have no additional categories set yet.'}
${services?'Here are the services they offer: '+services:''}

IMPORTANT: Rank these categories in order of importance for building ENTITY AUTHORITY. The goal is to strengthen Google's understanding that this business is the definitive local entity for "${niche}". Categories that are most closely related to the primary category and reinforce entity authority should come first.

Please choose 3-4 additional relevant categories from Google's official GBP category list, RANKED BY IMPORTANCE (most important first). For each one:
1. Name the exact GBP category
2. Entity authority impact - how this category reinforces the business's identity as a ${niche}
3. What additional services/keywords it helps them rank for
4. Mark as [HIGH], [MEDIUM], or [LOW] priority for entity authority

Only suggest categories that exist in Google's official list. Do not make up categories.`;
      const result=await callContentAPI(systemPrompt,userPrompt,apiKey);
      setCatResult(result);
      saveToClient('gbpSuggestedCategories',result);
    }catch(e){setCatError(e.message)}
    setCatLoading(false);
  };

  const organizeServices=async()=>{
    if(!apiKey){setOrgError('Set your API key in the Content tab first.');return}
    // Build the category list: primary + secondary + any extras typed in
    const allCats=[niche];
    if(secondaryCats)secondaryCats.split(',').map(s=>s.trim()).filter(Boolean).forEach(c=>{if(!allCats.includes(c))allCats.push(c)});
    if(orgCats.trim())orgCats.split(',').map(s=>s.trim()).filter(Boolean).forEach(c=>{if(!allCats.includes(c))allCats.push(c)});
    // Build the services list: existing + any extras typed in
    let allSvcs=services||'';
    if(orgSvcs.trim())allSvcs=allSvcs?(allSvcs+', '+orgSvcs):orgSvcs;
    if(allCats.length<2){setOrgError('You need at least a primary category and one additional category. Run the Categories Finder first or add categories above.');return}
    if(!allSvcs.trim()){setOrgError('No services found. Run the Services Finder first or add services above.');return}
    setOrgLoading(true);setOrgError('');
    try{
      const systemPrompt=`You are a local SEO expert specializing in Google Business Profile optimization. You know exactly how GBP organizes services under categories. Your job is to take a list of categories and services and map each service to the most appropriate category. NEVER use em dashes or en dashes - use regular hyphens only.`;
      const userPrompt=`I need you to organize these services under the correct Google Business Profile categories for a ${niche} business in ${city}.

CATEGORIES (the primary category is listed first):
${allCats.map((c,i)=>i===0?c+' (Primary)':c).join('\n')}

ALL SERVICES TO ORGANIZE:
${allSvcs}

Please organize every service under the most appropriate category. Format it like this:

**[Category Name]** (Primary Category)
- Service 1
- Service 2
- Service 3

**[Category Name]**
- Service 4
- Service 5

Rules:
- MAXIMUM 5 services per category. This is a hard limit. Do not exceed 5 services under any single category.
- Every service must be assigned to exactly one category
- Put each service under the category where it makes the most sense for local search
- If a service could fit multiple categories, choose the one where it would help rankings the most
- If you have more than 5 services that fit a category, pick the 5 most important for local search and list the rest in a "Could not fit (over 5 limit)" section at the end with a note on which category they'd best fit under
- If some services don't clearly fit any category, create a "Recommended to add under [Category]" note explaining your reasoning
- At the end, note if any categories have too few services (less than 3) and suggest additional services to add under those categories`;
      const result=await callContentAPI(systemPrompt,userPrompt,apiKey);
      setOrgResult(result);
      saveToClient('gbpOrganized',result);
    }catch(e){setOrgError(e.message)}
    setOrgLoading(false);
  };

  const US_STATES={'AL':'Alabama','AK':'Alaska','AZ':'Arizona','AR':'Arkansas','CA':'California','CO':'Colorado','CT':'Connecticut','DE':'Delaware','FL':'Florida','GA':'Georgia','HI':'Hawaii','ID':'Idaho','IL':'Illinois','IN':'Indiana','IA':'Iowa','KS':'Kansas','KY':'Kentucky','LA':'Louisiana','ME':'Maine','MD':'Maryland','MA':'Massachusetts','MI':'Michigan','MN':'Minnesota','MS':'Mississippi','MO':'Missouri','MT':'Montana','NE':'Nebraska','NV':'Nevada','NH':'New Hampshire','NJ':'New Jersey','NM':'New Mexico','NY':'New York','NC':'North Carolina','ND':'North Dakota','OH':'Ohio','OK':'Oklahoma','OR':'Oregon','PA':'Pennsylvania','RI':'Rhode Island','SC':'South Carolina','SD':'South Dakota','TN':'Tennessee','TX':'Texas','UT':'Utah','VT':'Vermont','VA':'Virginia','WA':'Washington','WV':'West Virginia','WI':'Wisconsin','WY':'Wyoming'};

  const analyzeCompetitors=async()=>{
    if(!dfsLogin||!dfsPass){setCompError('Enter your DataForSEO credentials below.');setShowDfsCreds(true);return}
    if(!niche||!client.city){setCompError('Set the client industry and city first.');return}
    setCompLoading(true);setCompError('');
    try{
      // DataForSEO needs full state name, not abbreviation
      const stateAbbr=(client.state||'').trim().toUpperCase();
      const fullState=US_STATES[stateAbbr]||client.state||'';
      const searchKeyword=niche+' in '+client.city+(fullState?', '+fullState:'');
      // DataForSEO location_name format: "City,State,United States"
      const locationName=client.city+(fullState?','+fullState:'')+',United States';
      const resp=await fetch('/.netlify/functions/dataforseo-gbp',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({keyword:searchKeyword,locationName,login:dfsLogin,password:dfsPass})
      });
      const data=await resp.json();
      if(data.error){throw new Error(data.error+(data.debug?' (Debug: '+JSON.stringify(data.debug)+')':''))}
      if(!data.results||data.results.length===0){throw new Error('No competitors found for "'+searchKeyword+'" in location "'+locationName+'". Try adjusting the primary category or city.')}

      // Aggregate categories
      const catCounts={};
      const allBizCategories=[];
      data.results.forEach(biz=>{
        const bizCats=[biz.category,...(biz.additionalCategories||[])].filter(Boolean);
        allBizCategories.push({name:biz.title,categories:bizCats,rating:biz.rating,reviewCount:biz.reviewCount});
        bizCats.forEach(cat=>{
          const key=cat.toLowerCase().trim();
          if(!catCounts[key])catCounts[key]={name:cat,count:0,isPrimary:false};
          catCounts[key].count++;
          if(cat.toLowerCase()===niche.toLowerCase())catCounts[key].isPrimary=true;
        });
      });

      // Sort by frequency
      const sortedCats=Object.values(catCounts).sort((a,b)=>b.count-a.count);
      const totalBiz=data.results.length;

      // Find categories the client doesn't have yet
      const clientCats=[niche.toLowerCase(),...(secondaryCats?secondaryCats.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean):[])];
      const missingCats=sortedCats.filter(c=>!clientCats.includes(c.name.toLowerCase()));

      const analysis={

        allCategories:sortedCats,
        missingCategories:missingCats,
        competitors:allBizCategories.slice(0,10),
        searchQuery:searchKeyword

      setCompData(analysis);
      saveToClient('gbpCompetitorData',analysis);
    }catch(e){setCompError(e.message)}
    setCompLoading(false);
  };

  const copyToClipboard=(text)=>{navigator.clipboard.writeText(text)};

  return(
    <div className="fade-in font-manrope space-y-6">
      <h3 className="text-xl font-bold text-brand-dark">Google Business Profile</h3>

      {/* GBP Stats */}
      {(()=>{
        const catList=[niche].concat(secondaryCats?secondaryCats.split(',').map(s=>s.trim()).filter(Boolean):[]);
        const svcList=services?services.split(',').map(s=>s.trim()).filter(Boolean):[];

        return(

              <p className="text-xs text-muted-stone mt-1">Total Categories</p>
            </div>
            <div className="stitch-glass-card stitch-hover-lift rounded-[20px] p-5 text-center">
              <p className="text-3xl font-bold text-brand">{totalSvcs}</p>
              <p className="text-xs text-muted-stone mt-1">Total Services</p>
            </div>
            <div className="stitch-glass-card stitch-hover-lift rounded-[20px] p-5 text-center">
              <p className="text-3xl font-bold text-brand">{niche?'1':'0'}</p>
              <p className="text-xs text-muted-stone mt-1">Primary Category</p>
            </div>
            <div className="stitch-glass-card stitch-hover-lift rounded-[20px] p-5 text-center">
              <p className="text-3xl font-bold text-brand">{totalCats>1?totalCats-1:0}</p>
              <p className="text-xs text-muted-stone mt-1">Secondary Categories</p>
            </div>
          </div>
        );
      })()}

      {/* Primary & categories detail */}
      <div className="stitch-glass-card rounded-[24px] p-6">
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
          <div><span className="text-muted-stone font-medium">Primary Category:</span> <span className="font-semibold text-brand-dark">{niche||<span className="text-red-400">Not set</span>}</span></div>
          <div><span className="text-muted-stone font-medium">City:</span> <span className="font-semibold text-brand-dark">{client.city||<span className="text-red-400">Not set</span>}</span></div>
          <div className="sm:col-span-2"><span className="text-muted-stone font-medium">Secondary Categories:</span> <span className="font-semibold text-brand-dark">{secondaryCats||'None yet'}</span></div>
          {services&&<div className="sm:col-span-2"><span className="text-muted-stone font-medium">Services:</span> <span className="text-deep-obsidian/70">{services.length>150?services.slice(0,150)+'...':services}</span></div>}
        </div>
        {(!niche||!client.city)&&<p className="text-xs text-red-500 mt-2">Fill in the client's industry and city in Settings or Content Setup before using these tools.</p>}
      </div>

      {/* GBP Services Finder */}
      <div className="stitch-glass-card rounded-[24px] p-6">
        <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
          <div>
            <h4 className="text-lg font-bold text-brand-dark">GBP Services Finder</h4>

          </div>
          <button onClick={findServices} disabled={svcLoading}
            className={`touch-target px-5 py-2 rounded-xl text-sm font-medium transition-all ${svcLoading?'bg-gray-300 text-gray-500 cursor-wait':'bg-brand text-white hover:bg-brand-hover shadow-lg shadow-brand/20'}`}>
            {svcLoading?'Finding Services...':'Find Services'}

        </div>
        {svcError&&<div className="bg-red-50 text-red-700 rounded-xl p-3 text-sm mb-3">{svcError}</div>}
        {svcLoading&&<div className="text-center py-8"><div className="inline-block w-8 h-8 border-4 border-brand border-t-transparent rounded-full animate-spin mb-2"/><p className="text-sm text-muted-stone">Analyzing best services for {niche} in {city}...</p></div>}
        {svcResult&&!svcLoading&&(
          <div>
            <div className="flex justify-end mb-2"><button onClick={()=>copyToClipboard(svcResult)} className="text-xs text-brand hover:underline">Copy to clipboard</button></div>
            <div className="bg-white rounded-xl border border-glass-border p-4 max-h-96 overflow-y-auto text-sm whitespace-pre-wrap">{svcResult}</div>

      {/* GBP Categories Finder */}
      <div className="stitch-glass-card rounded-[24px] p-6">

          <div>
            <h4 className="text-lg font-bold text-brand-dark">GBP Categories Finder</h4>

          </div>
          <button onClick={findCategories} disabled={catLoading}
            className={`touch-target px-5 py-2 rounded-xl text-sm font-medium transition-all ${catLoading?'bg-gray-300 text-gray-500 cursor-wait':'bg-brand text-white hover:bg-brand-hover shadow-lg shadow-brand/20'}`}>
            {catLoading?'Finding Categories...':'Find Categories'}

        </div>
        {catError&&<div className="bg-red-50 text-red-700 rounded-xl p-3 text-sm mb-3">{catError}</div>}
        {catLoading&&<div className="text-center py-8"><div className="inline-block w-8 h-8 border-4 border-brand border-t-transparent rounded-full animate-spin mb-2"/><p className="text-sm text-muted-stone">Finding best categories for {niche}...</p></div>}
        {catResult&&!catLoading&&(
          <div>
            <div className="flex justify-end mb-2"><button onClick={()=>copyToClipboard(catResult)} className="text-xs text-brand hover:underline">Copy to clipboard</button></div>
            <div className="bg-white rounded-xl border border-glass-border p-4 max-h-96 overflow-y-auto text-sm whitespace-pre-wrap">{catResult}</div>
          </div>
        )}
      </div>

      {/* GBP Service Organizer */}
      <div className="stitch-glass-card rounded-[24px] p-6">
        <div className="mb-3">
          <h4 className="text-lg font-bold text-brand-dark">GBP Service Organizer</h4>
          <p className="text-xs text-muted-stone mt-0.5">Organize all services under the correct GBP categories</p>
        </div>
        <p className="text-xs text-deep-obsidian/60 mb-3">Your existing categories and services are included automatically. If you found new ones above, paste them in the boxes below so they get organized too.</p>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
          <div>
            <label className="text-xs font-medium text-deep-obsidian/60">Additional Categories <span className="text-muted-stone">(comma-separated, optional)</span></label>

              className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="e.g. Arborist, Landscaper"/>

            <label className="text-xs font-medium text-deep-obsidian/60">Additional Services <span className="text-muted-stone">(comma-separated, optional)</span></label>
            <input value={orgSvcs} onChange={e=>setOrgSvcs(e.target.value)}
              className="touch-target w-full mt-1 px-3 py-2 border border-glass-border rounded-xl text-sm focus:ring-1 focus:ring-brand focus:outline-none" placeholder="e.g. Deep Root Fertilization, Cable Bracing"/>
          </div>
        </div>
        <button onClick={organizeServices} disabled={orgLoading}
          className={`touch-target px-5 py-2 rounded-xl text-sm font-medium transition-all ${orgLoading?'bg-gray-300 text-gray-500 cursor-wait':'bg-brand text-white hover:bg-brand-hover shadow-lg shadow-brand/20'}`}>

        {orgError&&<div className="bg-red-50 text-red-700 rounded-xl p-3 text-sm mt-3">{orgError}</div>}
        {orgLoading&&<div className="text-center py-8"><div className="inline-block w-8 h-8 border-4 border-brand border-t-transparent rounded-full animate-spin mb-2"/><p className="text-sm text-muted-stone">Organizing services under categories...</p></div>}
        {orgResult&&!orgLoading&&(
          <div className="mt-3">
            <div className="flex justify-end mb-2"><button onClick={()=>copyToClipboard(orgResult)} className="text-xs text-brand hover:underline">Copy to clipboard</button></div>

            </div>
          )}
        </div>

        {compError&&<div className="bg-red-50 text-red-700 rounded-xl p-3 text-sm mb-3">{compError}</div>}
        {compLoading&&<div className="text-center py-8"><div className="inline-block w-8 h-8 border-4 border-tertiary border-t-transparent rounded-full animate-spin mb-2"/><p className="text-sm text-muted-stone">Scanning competitors for {niche} in {client.city}...</p></div>}

        {compData&&!compLoading&&(
          <div className="space-y-4">
            {/* Summary stats */}
            <div className="grid grid-cols-3 gap-3">
              <div className="bg-tertiary/10 rounded-xl p-3 text-center">
                <p className="text-2xl font-bold text-tertiary">{compData.totalCompetitors}</p>
                <p className="text-xs text-deep-obsidian/60">Competitors Found</p>
              </div>
              <div className="bg-tertiary/10 rounded-xl p-3 text-center">
                <p className="text-2xl font-bold text-tertiary">{compData.allCategories.length}</p>
                <p className="text-xs text-deep-obsidian/60">Unique Categories</p>
              </div>
              <div className="bg-green-50 rounded-xl p-3 text-center">
                <p className="text-2xl font-bold text-green-700">{compData.missingCategories.length}</p>
                <p className="text-xs text-deep-obsidian/60">You're Missing</p>
              </div>
            </div>

            {/* Categories ranked by usage */}
            <div>
              <h5 className="font-semibold text-brand-dark text-sm mb-2">Categories Ranked by Competitor Usage</h5>
              <div className="bg-white rounded-xl border border-glass-border divide-y divide-glass-border max-h-72 overflow-y-auto">
                {compData.allCategories.map((cat,i)=>{
                  const pct=Math.round(cat.count/compData.totalCompetitors*100);
                  const clientHas=[niche.toLowerCase(),...(secondaryCats?secondaryCats.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean):[])].includes(cat.name.toLowerCase());
                  return(
                    <div key={i} className="flex items-center gap-3 px-3 py-2">
                      <span className="text-xs font-bold text-muted-stone w-6 text-right">#{i+1}</span>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2">
                          <span className="text-sm font-medium truncate">{cat.name}</span>
                          {clientHas&&<span className="text-[10px] px-1.5 py-0.5 bg-green-100 text-green-700 rounded-full font-medium">You have this</span>}
                          {!clientHas&&<span className="text-[10px] px-1.5 py-0.5 bg-yellow-100 text-yellow-700 rounded-full font-medium">Missing</span>}
                        </div>
                        <div className="w-full h-1.5 bg-black/5 rounded-full mt-1 overflow-hidden">
                          <div className="h-full bg-tertiary rounded-full" style={{width:pct+'%'}}/>
                        </div>
                      </div>
                      <div className="text-right flex-shrink-0">
                        <span className="text-sm font-bold text-tertiary">{cat.count}/{compData.totalCompetitors}</span>
                        <p className="text-[10px] text-muted-stone">{pct}%</p>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Categories you're missing */}
            {compData.missingCategories.length>0&&(
              <div>
                <h5 className="font-semibold text-brand-dark text-sm mb-2">Categories You Should Consider Adding</h5>
                <div className="bg-yellow-50 rounded-xl border border-yellow-200 p-3">
                  <div className="space-y-2">
                    {compData.missingCategories.slice(0,8).map((cat,i)=>{
                      const pct=Math.round(cat.count/compData.totalCompetitors*100);
                      return(
                        <div key={i} className="flex items-center justify-between">
                          <span className="text-sm font-medium">{cat.name}</span>
                          <span className="text-xs text-deep-obsidian/60">{cat.count} competitors ({pct}%) use this</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* Top competitors */}
            {compData.competitors.length>0&&(
              <div>
                <h5 className="font-semibold text-brand-dark text-sm mb-2">Top Competitors & Their Categories</h5>
                <div className="bg-white rounded-xl border border-glass-border divide-y divide-glass-border max-h-72 overflow-y-auto">
                  {compData.competitors.map((biz,i)=>(
                    <div key={i} className="px-3 py-2">
                      <div className="flex items-center justify-between">
                        <span className="text-sm font-medium">{biz.name}</span>
                        <span className="text-xs text-muted-stone">{biz.rating?'★ '+biz.rating:''} {biz.reviewCount?'('+biz.reviewCount+')':''}</span>
                      </div>
                      <div className="flex flex-wrap gap-1 mt-1">
                        {biz.categories.map((c,j)=>(
                          <span key={j} className={`text-[10px] px-1.5 py-0.5 rounded-full ${j===0?'bg-tertiary/10 text-tertiary font-medium':'bg-black/5 text-deep-obsidian/60'}`}>{c}</span>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <p className="text-[10px] text-muted-stone text-right">Searched: "{compData.searchQuery}"</p>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── ContentTab Component ───
function ContentTab({client,setData,data}){
  const [subTab,setSubTab]=useState('generator');
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem('kf_content_apikey')||'');
  const [showKey,setShowKey]=useState(false);
  const [keyLoaded,setKeyLoaded]=useState(false);

  const saveApiKey=(val)=>{setApiKey(val);localStorage.setItem('kf_content_apikey',val)};

  // Auto-fetch API key from server on mount
  useEffect(()=>{
    if(!apiKey){
      fetch('/.netlify/functions/get-config').then(r=>r.json()).then(d=>{
        if(d.key){saveApiKey(d.key);setKeyLoaded(true)}
      }).catch(()=>{});
    }else{setKeyLoaded(true)}
  },[]);

  const cc=client.contentConfig||{};

  const [localCC,setLocalCC]=useState(()=>JSON.parse(JSON.stringify(cc)));

  const prevClientId=useRef(client.id);

  const debounceRef=useRef(null);
  const updateCC=(field,value)=>{
    // Update local state immediately for instant typing

    if(debounceRef.current)clearTimeout(debounceRef.current);

      setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>{

  const updateClient=(field,value)=>{

  // Architecture state
  const [archError,setArchError]=useState('');

  const [pageParent,setPageParent]=useState('');

  const [gapManualUrls,setGapManualUrls]=useState('');

  const gapLastCrawl=(client.contentGap||{}).lastCrawl||'';

  // Build expected pages from architecture
  const buildExpectedPages=()=>{
    const arch=client.architecture;
    if(!arch)return[];
    const expected=[];
    // Required pages
    expected.push({name:'Homepage',slug:'/',type:'homepage',category:''});
    expected.push({name:'About',slug:'/about',type:'about',category:''});
    expected.push({name:'Contact',slug:'/contact',type:'contact',category:''});
    // From hierarchy
    (arch.secondaryCategories||[]).forEach(cat=>{
      expected.push({name:cat.name,slug:cat.slug,type:'secondaryCategory',category:'',isPrimary:cat.isPrimary});
      (cat.coreServices||[]).forEach(svc=>{
        expected.push({name:svc.name,slug:svc.slug,type:'coreService',category:cat.name});
        (svc.childServices||[]).forEach(ch=>{

  const buildExpectedLocations=()=>{
    const arch=client.architecture;

  // Normalize a URL slug for matching
  const normalizeSlug=(url)=>{
    return(url||'').toLowerCase().replace(/^https?:\/\/[^/]+/,'').replace(/\/$/,'').replace(/^\/?(services?|service-areas?)\//,'/')
      .replace(/[-_]/g,' ').replace(/\//g,' ').trim();
  };

  // Auto-match crawled pages to expected pages
  const autoMatch=(crawledPages,expectedPages)=>{
    const matches={};
    // Track which crawled pages are already claimed (1-to-1 matching)
    const claimed=new Set();
    // Sort expected: homepage first, then about/contact, then rest
    const sorted=[...expectedPages].sort((a,b)=>{
      const order={homepage:0,about:1,contact:2};
      return(order[a.type]??3)-(order[b.type]??3);
    });
    sorted.forEach(exp=>{
      const expSlug=(exp.slug||'').replace(/\/$/,'').toLowerCase();
      const expNameNorm=exp.name.toLowerCase().replace(/[&]/g,'and').replace(/[^a-z0-9\s]/g,'').trim();
      const expWords=expNameNorm.split(/\s+/).filter(w=>w.length>2);
      let bestMatch=null;let bestScore=0;
      crawledPages.forEach(cp=>{
        if(claimed.has(cp.url))return; // already matched to something else
        const cpPath=(cp.url||'').replace(/\/$/,'').toLowerCase();
        const cpSlugWords=cpPath.replace(/^\/+/,'').replace(/[-_]/g,' ').trim();
        let score=0;

        // Homepage special case — only match if URL is exactly "/"
        if(exp.type==='homepage'){
          if(cpPath==='/'||cpPath===''||/^https?:\/\/[^/]+\/?$/.test(cp.url))score=100;
          // Don't match homepage to anything else
        }
        // About/Contact — must have the word in the URL
        else if(exp.type==='about'){
          if(cpPath==='/about'||cpPath.includes('/about'))score=95;
        }
        else if(exp.type==='contact'){
          if(cpPath==='/contact'||cpPath.includes('/contact'))score=95;
        }
        else{
          // Guard: skip empty slugs to prevent false matches
          if(!cpSlugWords)return;
          // Exact slug match (compare path segments)
          const expPath=expSlug.replace(/^\/+/,'');
          const cpPathClean=cpPath.replace(/^\/+/,'');
          if(cpPathClean&&expPath&&cpPathClean===expPath)score=100;
          // Slug contains the service name or vice versa (both must be non-empty)
          else if(cpSlugWords.length>2&&expNameNorm.length>2){
            if(cpSlugWords.includes(expNameNorm)||expNameNorm.includes(cpSlugWords))score=80;
          }
          // Word overlap — need meaningful overlap
          if(score===0&&cpSlugWords.length>2){
            const cpWords=cpSlugWords.split(/\s+/).filter(w=>w.length>2);
            if(cpWords.length>0&&expWords.length>0){
              const overlap=expWords.filter(w=>cpWords.some(cw=>cw===w||(cw.length>4&&w.length>4&&(cw.includes(w)||w.includes(cw))))).length;
              const needed=Math.max(2,Math.ceil(expWords.length*0.6));
              if(overlap>=needed)score=65;
              else if(overlap>=2)score=55;
            }
          }
          // Title or H1 match (only if title/h1 are meaningful)
          if(score<80){
            const titleLower=(cp.title||'').toLowerCase();
            const h1Lower=(cp.h1||'').toLowerCase();
            if(titleLower.length>10&&titleLower.includes(expNameNorm))score=Math.max(score,75);
            else if(h1Lower.length>5&&h1Lower.includes(expNameNorm))score=Math.max(score,75);
          }
        }
        if(score>bestScore){bestScore=score;bestMatch={url:cp.url,confidence:score>=80?'high':score>=60?'medium':'low'}}
      });
      if(bestMatch&&bestScore>=55){
        matches[exp.name]=bestMatch;
        claimed.add(bestMatch.url);
      }else{
        matches[exp.name]=null;
      }
    });
    return matches;
  };

  // Save gap data to client
  const saveGapData=(pages,matches,method)=>{
    const gapData={lastCrawl:new Date().toISOString(),crawlMethod:method,pages:pages,matches:matches};
    setData(prev=>{const nd={...prev,clients:prev.clients.map(c=>c.id===client.id?{...c,contentGap:gapData}:c)};saveData(nd);return nd});
  };

  // Update a single match override
  const updateMatch=(serviceName,url)=>{
    const newMatches={...gapMatches};
    if(url==='__none__')newMatches[serviceName]=null;
    else newMatches[serviceName]={url:url,confidence:'manual'};
    setGapMatches(newMatches);
    saveGapData(gapPages,newMatches,gapMethod);
  };

  // Crawl website
  // Fetch a single page and extract metadata
  const fetchPageData=async(url,domain,domainHost)=>{
    try{
      const resp=await fetch('/.netlify/functions/fetch-page',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url})});
      const result=await resp.json();
      if(result.error)return null;
      const html=result.html||'';
      const parser=new DOMParser();
      const doc=parser.parseFromString(html,'text/html');
      const title=(doc.querySelector('title')||{}).textContent||'';
      const h1=(doc.querySelector('h1')||{}).textContent||'';
      const bodyText=(doc.body||{}).textContent||'';
      const wordCount=bodyText.split(/\s+/).filter(Boolean).length;
      const schemas=doc.querySelectorAll('script[type="application/ld+json"]');
      const allLinks=[...doc.querySelectorAll('a[href]')];
      const internalLinks=allLinks.filter(a=>{try{const h=new URL(a.href,url);return h.hostname===domainHost}catch(e){const hr=a.getAttribute('href');return hr&&hr.startsWith('/')}});
      const urlPath=new URL(url).pathname;
      // Extract internal link hrefs for crawling
      const foundLinks=[];
      internalLinks.forEach(a=>{
        try{
          let href=a.getAttribute('href')||'';
          if(href.startsWith('#')||href.startsWith('mailto:')||href.startsWith('tel:')||href.startsWith('javascript:'))return;
          let full;
          if(href.startsWith('http'))full=href;
          else if(href.startsWith('/'))full=domain+href;
          else full=domain+'/'+href;
          const parsed=new URL(full);
          if(parsed.hostname===domainHost)foundLinks.push(parsed.origin+parsed.pathname);
        }catch(e){}
      });
      return{page:{url:urlPath,fullUrl:url,title:title.trim(),h1:h1.trim(),wordCount:wordCount,hasSchema:schemas.length>0,internalLinks:internalLinks.length},links:foundLinks};
    }catch(e){return null}
  };

  const crawlWebsite=async()=>{
    const baseUrl=client.website;
    if(!baseUrl){setGapError('Set the client website URL in Settings first.');return}
    setGapCrawling(true);setGapError('');setGapProgress('Checking for sitemap...');
    const domain=(baseUrl.startsWith('http')?baseUrl:'https://'+baseUrl).replace(/\/$/,'');
    const domainHost=new URL(domain).hostname;
    const results=[];
    const maxPages=200;
    try{
      // ── Step 1: Try sitemap.xml first ──
      let sitemapUrls=[];
      const sitemapLocations=[domain+'/sitemap.xml',domain+'/sitemap_index.xml',domain+'/sitemap-index.xml'];
      for(const smUrl of sitemapLocations){
        if(sitemapUrls.length>0)break;
        try{
          setGapProgress('Checking '+smUrl.replace(domain,'')+'...');
          const resp=await fetch('/.netlify/functions/fetch-page',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:smUrl})});
          const result=await resp.json();
          if(result.error||!result.html)continue;
          const xml=result.html;
          // Check if it's a sitemap index (contains other sitemaps)
          const subSitemaps=[...xml.matchAll(/<loc>\s*(https?:\/\/[^<]+sitemap[^<]*)\s*<\/loc>/gi)].map(m=>m[1]);
          if(subSitemaps.length>0){
            // Fetch each sub-sitemap
            for(const subUrl of subSitemaps.slice(0,5)){
              try{
                const subResp=await fetch('/.netlify/functions/fetch-page',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:subUrl})});
                const subResult=await subResp.json();
                if(subResult.html){
                  [...subResult.html.matchAll(/<loc>\s*(https?:\/\/[^<]+)\s*<\/loc>/gi)].forEach(m=>{
                    if(!m[1].includes('sitemap'))sitemapUrls.push(m[1]);
                  });
                }
              }catch(e){}
            }
          }
          // Also extract direct URLs from this sitemap
          [...xml.matchAll(/<loc>\s*(https?:\/\/[^<]+)\s*<\/loc>/gi)].forEach(m=>{
            if(!m[1].includes('sitemap'))sitemapUrls.push(m[1]);
          });
        }catch(e){}
      }
      // Deduplicate
      sitemapUrls=[...new Set(sitemapUrls)].filter(u=>{try{return new URL(u).hostname===domainHost}catch(e){return false}});

      if(sitemapUrls.length>0){
        // ── Sitemap-based crawl: fetch each URL for metadata ──
        setGapProgress(`Found sitemap with ${sitemapUrls.length} URLs. Fetching page data...`);
        let fetched=0;
        for(const url of sitemapUrls.slice(0,maxPages)){
          fetched++;
          if(fetched%3===0)setGapProgress(`Fetching page ${fetched} of ${Math.min(sitemapUrls.length,maxPages)}...`);
          const data=await fetchPageData(url,domain,domainHost);
          if(data&&data.page)results.push(data.page);
        }
      }else{
        // ── Fallback: Link-following crawl ──
        setGapProgress('No sitemap found. Crawling links...');
        const visited=new Set();
        const queue=[domain+'/'];
        while(queue.length>0&&results.length<maxPages){
          const url=queue.shift();
          const normalized=url.replace(/\/$/,'').replace(/#.*$/,'').replace(/\?.*$/,'');
          if(visited.has(normalized))continue;
          visited.add(normalized);
          setGapProgress(`Crawling... ${results.length} pages found, ${queue.length} in queue`);
          const data=await fetchPageData(url,domain,domainHost);
          if(!data)continue;
          results.push(data.page);
          data.links.forEach(link=>{
            const norm=link.replace(/\/$/,'');
            if(!visited.has(norm)&&!queue.includes(link))queue.push(link);
          });
        }
      }

      if(results.length===0){
        setGapError('Could not find any pages. This site may block server requests. Try uploading a Screaming Frog CSV or pasting URLs manually.');
        setGapCrawling(false);setGapProgress('');return;

      const expected=buildExpectedPages();
      const matches=autoMatch(results,expected);
      setGapMatches(matches);
      setGapMethod('auto');
      saveGapData(results,matches,'auto');
      setGapProgress(`Done! Found ${results.length} pages.`);
    }catch(e){setGapError('Crawl failed: '+e.message)}
    setGapCrawling(false);
  };

  // Parse CSV (Screaming Frog format)
  const parseCSV=(csvText)=>{
    const lines=csvText.split('\n');
    if(lines.length<2){setGapError('CSV appears empty.');return}
    const headerLine=lines[0];
    const headers=headerLine.split(',').map(h=>h.replace(/"/g,'').trim().toLowerCase());
    const urlIdx=headers.findIndex(h=>h==='address'||h==='url');
    const titleIdx=headers.findIndex(h=>h==='title 1'||h==='title');
    const h1Idx=headers.findIndex(h=>h==='h1-1'||h==='h1');
    const wcIdx=headers.findIndex(h=>h==='word count'||h==='wordcount');
    const statusIdx=headers.findIndex(h=>h==='status code'||h==='status');
    const linksIdx=headers.findIndex(h=>h==='inlinks'||h==='internal links');
    const contentIdx=headers.findIndex(h=>h==='content type'||h==='content');
    if(urlIdx===-1){setGapError('Could not find URL/Address column in CSV. Make sure it\'s a Screaming Frog export.');return}
    const results=[];
    for(let i=1;i<lines.length;i++){
      if(!lines[i].trim())continue;
      // Simple CSV parse (handle quoted fields)
      const fields=[];let field='';let inQuote=false;
      for(let c=0;c<lines[i].length;c++){
        const ch=lines[i][c];
        if(ch==='"')inQuote=!inQuote;
        else if(ch===','&&!inQuote){fields.push(field.trim());field=''}
        else field+=ch;
      }
      fields.push(field.trim());
      const status=statusIdx>=0?parseInt(fields[statusIdx]):200;
      const content=contentIdx>=0?fields[contentIdx]:'text/html';
      if(status!==200)continue;
      if(content&&!content.includes('html')&&!content.includes('text'))continue;
      const fullUrl=fields[urlIdx]||'';
      let urlPath;
      try{urlPath=new URL(fullUrl).pathname}catch(e){urlPath=fullUrl}
      results.push({
        url:urlPath,fullUrl:fullUrl,
        title:titleIdx>=0?(fields[titleIdx]||''):'',
        h1:h1Idx>=0?(fields[h1Idx]||''):'',
        wordCount:wcIdx>=0?parseInt(fields[wcIdx])||0:0,
        hasSchema:false,
        internalLinks:linksIdx>=0?parseInt(fields[linksIdx])||0:0
      });
    }
    if(results.length===0){setGapError('No valid pages found in CSV (looked for status 200 HTML pages).');return}
    setGapPages(results);
    const expected=buildExpectedPages();
    const matches=autoMatch(results,expected);
    setGapMatches(matches);
    setGapMethod('csv');
    saveGapData(results,matches,'csv');
    setGapProgress(`Imported ${results.length} pages from CSV.`);
  };

  const pageOptions=getPageOptions();

  // Parse hierarchy from plain text input
  const parseAndBuildArch=()=>{
    if(!hierarchyInput.trim()){setArchError('Paste your GBP data first.');return}
    setArchError('');
    try{
      const parsed=parseHierarchy(hierarchyInput,client);

      if(!hasCategories&&hasServiceAreas){

        // Update location pages on existing architecture if it exists

          updatedArch.locationPages=ext.serviceAreas.map(areaCity=>{
            // Extract just the city name (strip state, zip, country)
            const cityOnly=areaCity.replace(/,?\s*(TX|CA|CO|FL|NY|OH|PA|IL|GA|NC|MI|NJ|VA|WA|AZ|MA|TN|IN|MO|MD|WI|MN|SC|AL|LA|KY|OR|OK|CT|UT|IA|NV|AR|MS|KS|NM|NE|WV|ID|HI|NH|ME|MT|RI|DE|SD|ND|AK|VT|WY|DC)\b/gi,'').replace(/,?\s*\d{5}/g,'').replace(/,?\s*USA?\s*$/i,'').trim();
            return{
              city:cityOnly,
              slug:'/service-areas/'+cityOnly.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,''),
              title:(client.primaryCategory||'Services')+' in '+cityOnly+', '+st+' | '+(client.name||''),

            };
          });
          setArchText(JSON.stringify(updatedArch,null,2));
