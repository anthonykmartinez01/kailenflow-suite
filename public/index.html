// LOGIN SCREEN
// ═══════════════════════════════════════════
function LoginScreen({onLogin}){
  const [email,setEmail]=useState('');
  const [password,setPassword]=useState('');
  const [error,setError]=useState('');
  const [loading,setLoading]=useState(false);
  const [showReset,setShowReset]=useState(false);
  const [resetEmail,setResetEmail]=useState('');
  const [resetMsg,setResetMsg]=useState('');

  const handleLogin=async(e)=>{
    e.preventDefault();
    if(!email.trim()||!password.trim()){setError('Please enter your email and password.');return}
    setLoading(true);setError('');
    try{
      await firebase.auth().signInWithEmailAndPassword(email.trim(),password);
      onLogin&&onLogin();
    }catch(err){
      if(err.code==='auth/user-not-found'||err.code==='auth/wrong-password'||err.code==='auth/invalid-credential'){
        setError('Invalid email or password.');
      }else if(err.code==='auth/too-many-requests'){
        setError('Too many failed attempts. Please try again later.');
      }else if(err.code==='auth/invalid-email'){
        setError('Please enter a valid email address.');
      }else{
        setError('Login failed. Please try again.');
      }
    }
    setLoading(false);
  };

  const handleReset=async()=>{
    if(!resetEmail.trim()){setResetMsg('Please enter your email.');return}
    try{
      await firebase.auth().sendPasswordResetEmail(resetEmail.trim());
      setResetMsg('Password reset email sent! Check your inbox.');
    }catch(err){
      setResetMsg('Could not send reset email. Check the address and try again.');
    }
  };

  return(
    <div className="min-h-screen bg-warm-sand font-manrope flex items-center justify-center p-4">
      <div className="w-full max-w-sm">
        <div className="text-center mb-8">
          <div className="w-16 h-16 bg-brand rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-brand/20">
            <span className="material-symbols-outlined text-white text-4xl" style={{fontVariationSettings:"'FILL' 1"}}>layers</span>
          </div>
          <h1 className="text-2xl font-bold text-brand">KailenFlow Suite</h1>
          <p className="text-sm text-muted-stone mt-1">Local SEO Client Management</p>
        </div>

        {!showReset?(
          <form onSubmit={handleLogin} className="stitch-glass-card !bg-white/80 rounded-[24px] shadow-lg p-6 space-y-4">
            <div>
              <label className="text-sm font-medium text-deep-obsidian/70">Email</label>
              <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
                className="touch-target w-full mt-1 px-3 py-2.5 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:border-brand outline-none"
                placeholder="you@email.com" autoFocus autoComplete="email"/>
            </div>
            <div>
              <label className="text-sm font-medium text-deep-obsidian/70">Password</label>
              <input type="password" value={password} onChange={e=>setPassword(e.target.value)}
                className="touch-target w-full mt-1 px-3 py-2.5 border border-glass-border rounded-xl focus:ring-1 focus:ring-brand focus:border-brand outline-none"
                placeholder="Your password" autoComplete="current-password"/>
            </div>
            {error&&<div className="bg-red-50 text-red-700 rounded-xl p-3 text-sm">{error}</div>}
            <button type="submit" disabled={loading}

function AuthenticatedApp(){
  const [data,setData]=useState(loadData);
  const [activeClient,setActiveClient]=useState(data.clients[0]?.id||'');
  const [view,setView]=useState('today');
  const [tab,setTab]=useState('dashboard');
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [addModalOpen,setAddModalOpen]=useState(false);
  const [newClientName,setNewClientName]=useState('');

  // ═══════════════════════════════════════════════════════════
  // CLOUD-FIRST SYNC: Firestore is the ONLY source of truth
  // No localStorage dependency — the cloud has everything
  // ═══════════════════════════════════════════════════════════

  const [cloudLoaded,setCloudLoaded]=useState(false);
  const cloudLoadedRef=React.useRef(false);

  // Helper: count how much real data is in an object
  const countData=(d)=>{
    let c=0;
    c+=(d.prospects||[]).length;
    c+=(d.transcripts||[]).length;
    c+=(d.personalTasks||[]).length;
    c+=(d.prospecting||[]).length;
    if(d.clients)d.clients.forEach(cl=>{c+=(cl.tasks||[]).length;c+=(cl.activities||[]).length});
    return c;
  };

  useEffect(()=>{
    _onFirestoreData=(newData)=>{
      const cloudData=migrateData(newData);

      if(!cloudLoadedRef.current){
        // First-time sync: check if localStorage has MORE data than cloud (old bug migration)
        const cloudCount=countData(cloudData);
        try{
          const localRaw=localStorage.getItem(STORAGE_KEY);
          if(localRaw){
            const localData=migrateData(JSON.parse(localRaw));
            const localCount=countData(localData);
            if(localCount>cloudCount){
              console.log('MIGRATION: localStorage has more data ('+localCount+') than cloud ('+cloudCount+') — pushing local to cloud');
              cloudLoadedRef.current=true;
              _currentDataSnapshot=localData;
              setData(localData);
              setCloudLoaded(true);
              saveData(localData);
              return;
            }
          }
        }catch(e){}
        cloudLoadedRef.current=true;
        _currentDataSnapshot=cloudData;
        setData(cloudData);
        setCloudLoaded(true);
      }else{
        // Real-time update (from another device or legitimate new data)
        _currentDataSnapshot=cloudData;
        setData(cloudData);
      }
    };

    // One-time .get() as a safety net if onSnapshot hasn't fired yet
    FIRESTORE_DOC.get().then(snap=>{
      if(cloudLoadedRef.current){
        console.log('.get() skipped — onSnapshot already loaded cloud data');
        return;
      }
      if(snap.exists){
        try{
          const rawJson=snap.data().json;
          const cloudData=migrateData(JSON.parse(rawJson));
          const cloudCount=countData(cloudData);

          // Check if localStorage has richer data (migration from old sync engine)
          try{
            const localRaw=localStorage.getItem(STORAGE_KEY);
            if(localRaw){
              const localData=migrateData(JSON.parse(localRaw));
              const localCount=countData(localData);
              if(localCount>cloudCount){
                console.log('MIGRATION via .get(): localStorage has more ('+localCount+') than cloud ('+cloudCount+') — pushing local to cloud');
                cloudLoadedRef.current=true;
                _currentDataSnapshot=localData;
                setData(localData);
                setCloudLoaded(true);
                saveData(localData);
                return;
              }
            }
          }catch(e){}

          cloudLoadedRef.current=true;
          _currentDataSnapshot=cloudData;
          setData(cloudData);
          setCloudLoaded(true);
          try{localStorage.setItem(STORAGE_KEY,rawJson)}catch(e){}
          console.log('Cloud data loaded via .get()');
        }catch(e){console.error('Failed to parse cloud data:',e)}
      }else{
        // No cloud data exists — initialize the cloud from localStorage
        console.log('No cloud data — initializing cloud from localStorage');
        try{
          const currentData=migrateData(JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')||defaultData());
          _currentDataSnapshot=currentData;
          setData(currentData);
          saveData(currentData);
        }catch(e){saveData(defaultData())}
        cloudLoadedRef.current=true;
        setCloudLoaded(true);
      }
    }).catch(err=>{
      console.error('Cloud .get() failed:',err);
      cloudLoadedRef.current=true;
      setCloudLoaded(true);
    });

    return()=>{_onFirestoreData=null};
  },[]);

  // Keep _currentDataSnapshot in sync with React state so the safety net can protect it
  useEffect(()=>{
    _currentDataSnapshot=data;
  },[data]);

  const client=data.clients.find(c=>c.id===activeClient);
  const addClient=()=>{if(!newClientName.trim())return;const nc={id:uid(),name:newClientName.trim(),website:'',gbpUrl:'',phone:'',address:'',city:'',state:'',primaryCategory:'',notes:'',createdAt:new Date().toISOString(),scores:{gbpHealth:{current:0,projected:0},landingPage:{current:0},core30:{current:0,total:0}},rankData:[],activities:[],tasks:[],onboarding:{},setupChecklist:{},contentConfig:{industry:'',stateAbbrev:'',zipCode:'',email:'',secondaryCategories:'',servicesOffered:'',serviceAreas:'',differentiators:{reviewCount:'',avgResponseTime:'',freeEstimates:'',tripFee:'',availability:'',yearsServing:'',guarantees:'',licenses:'',locallyOwned:'',uniqueDifferentiator:''}},architecture:null,generatedPages:[]};setData(prev=>{const nd={...prev,clients:[...prev.clients,nc]};saveData(nd);return nd});setActiveClient(nc.id);setView('dashboard');setTab('settings');setAddModalOpen(false);setNewClientName('')};

  // 'content' tab hidden from nav (2026-07-13) — Anthony's using a different tool for
  // this now. Component + data + render line below are left intact so it's a one-line
  // re-add (just put {key:'content',label:'Content',icon:'✏'} back in this array) if

  useEffect(()=>{if(!data.clients.find(c=>c.id===activeClient)&&data.clients.length>0)setActiveClient(data.clients[0].id)},[data.clients,activeClient]);

  // Check for pending onboards notification
  const pendingCount=(JSON.parse(localStorage.getItem(STORAGE_KEY+'_pendingOnboards')||'[]')).length;

  return(
    <div className="flex min-h-screen">
      <Sidebar clients={data.clients} activeClient={activeClient} setActiveClient={setActiveClient}
        view={view} setView={setView} onAddClient={()=>setAddModalOpen(true)}
        data={data} setData={setData} sidebarOpen={sidebarOpen} setSidebarOpen={setSidebarOpen}/>

      <main className="flex-1 lg:ml-[260px] min-h-screen pb-20 lg:pb-6">
        <div className="no-print font-manrope sticky top-0 z-30 lg:hidden bg-glass-surface backdrop-blur-xl border-b border-glass-border px-4 py-3 flex items-center gap-3">
          <button onClick={()=>setSidebarOpen(true)} className="touch-target w-10 h-10 flex items-center justify-center rounded-lg hover:bg-black/5">
            <span className="material-symbols-outlined text-deep-obsidian">menu</span>
          </button>
          <h1 className="text-lg font-bold text-brand truncate">KailenFlow Suite</h1>
          {pendingCount>0&&<span className="bg-red-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center">{pendingCount}</span>}
        </div>

        <div className="p-4 sm:p-6 max-w-[1600px] mx-auto">
          {view==='today'&&<TodaysTasks data={data} setData={setData}/>}
          {view==='onboarding'&&<OnboardingView data={data} setData={setData} activeClient={activeClient} setView={setView}/>}

          {view==='dashboard'&&client&&(
            <>
              <div className="no-print font-manrope flex gap-2 mb-6 overflow-x-auto pb-1 -mx-4 px-4 sm:mx-0 sm:px-0">
                {tabs.map(t=>(<button key={t.key} onClick={()=>setTab(t.key)} className={`touch-target flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all ${tab===t.key?'bg-brand text-white shadow-lg shadow-brand/20':'stitch-glass-card text-deep-obsidian/70 hover:bg-black/5'}`}><span className="material-symbols-outlined text-[18px] hidden sm:inline">{t.icon}</span>{t.label}</button>))}

// Attach the signed-in user's Firebase token so the API functions can verify
// the caller is a real suite user. Merges with any extra headers (e.g. content-type).
async function authHeaders(extra){
  const h=Object.assign({},extra||{});
  try{const u=firebase.auth().currentUser;if(u){const t=await u.getIdToken();if(t)h['Authorization']='Bearer '+t;}}catch(e){}
  return h;
}

          <p className="text-sm text-muted-stone mt-1">GoHighLevel · Calendly · Stripe{updated?(' · updated '+updated):''}{loading&&d?<span className="text-muted-stone"> · updating…</span>:null}</p>

      </div>

      {loading&&!d&&<div className="text-muted-stone text-sm">Pulling your live numbers…</div>}
      {error&&<div className="text-sm text-red-600 font-medium bg-red-50 rounded-xl p-3">{error}</div>}

      {t&&<div className="space-y-7">

function LeadFinder({data,setData}){
  const TRADES=['roofers','painters','plumbers','HVAC','electricians','landscapers','lawn care','tree service','general contractors','remodelers','kitchen remodeling','bathroom remodeling','handyman','concrete','masonry','fencing','deck builders','garage doors','flooring','tile installers','carpet cleaning','drywall','insulation','siding','gutters','window cleaning','pressure washing','house cleaning','junk removal','dumpster rental','movers','pest control','pool builders','pool service','irrigation','sod installation','artificial turf','hardscaping','paving','asphalt','foundation repair','waterproofing','water damage restoration','mold remediation','fire damage restoration','chimney sweep','fireplace','appliance repair','locksmith','security systems','home automation','solar installers','generator installation','EV charger installation','water heater','water treatment','drain cleaning','septic service','well drilling','duct cleaning','window replacement','door installation','blinds & shades','awnings','cabinets','countertops','demolition','excavation','snow removal','stucco','metal roofing','epoxy flooring','home inspection','window tinting','garage flooring'];
  const [query,setQuery]=useState('');
  const [mobileOnly,setMobileOnly]=useState(false);
  const [deep,setDeep]=useState(false);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState('');
  const [res,setRes]=useState(null);
  const [toast,setToast]=useState(null);
  const [sending,setSending]=useState({});
  const [hidden,setHidden]=useState(()=>{try{return new Set(JSON.parse(localStorage.getItem('kf_lf_hidden')||'[]'))}catch(e){return new Set()}});

  const keyOf=l=>{const p=(l.phoneRaw||l.phone||'').replace(/[^\d]/g,'');return p?('p:'+p):('n:'+(l.name||''))};
  const persist=s=>{try{localStorage.setItem('kf_lf_hidden',JSON.stringify([...s]))}catch(e){}};
  const hide=l=>{const s=new Set(hidden);s.add(keyOf(l));setHidden(s);persist(s)};
  const showToast=(msg,err)=>{setToast({msg,err});setTimeout(()=>setToast(null),3500)};

  async function runSearch(q){
    const term=(q!==undefined?q:query).trim();
    if(!term){setError('Type a search like "roofers in Prosper TX"');return}
    setLoading(true);setError('');setRes(null);
    try{
      const r=await fetch('/api/leads',{method:'POST',headers:await authHeaders({'content-type':'application/json'}),body:JSON.stringify({query:term,mobileOnly,deep})});
      const d=await r.json();
      if(!r.ok||d.error){setError(d.error||'Search failed');setLoading(false);return}
      setRes(d);
    }catch(e){setError('Network error — try again')}
    setLoading(false);
  }

  async function sendToGHL(l){
    const k=keyOf(l);
    setSending(s=>({...s,[k]:true}));
    // Hard client-side timeout so the button can never get stuck on "Sending…".
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),45000);
    try{
      const r=await fetch('/api/send-to-ghl',{method:'POST',headers:await authHeaders({'content-type':'application/json'}),body:JSON.stringify(l),signal:ctrl.signal});
      const d=await r.json();
      if(!r.ok||!d.ok){showToast(d.error||"Couldn't send to GHL",true);return}
      hide(l);
      showToast(d.alreadyExisted?'Already in GHL — left it untouched':('✓ Sent to GHL — '+l.name));
    }catch(e){
      showToast(e.name==='AbortError'?'GHL is taking too long — give it a moment and hit Send again.':'Network error sending to GHL',true);
    }finally{
      clearTimeout(timer);
      setSending(s=>{const n={...s};delete n[k];return n});
    }
  }

  const copyPhone=l=>{if(!l.phone)return;navigator.clipboard.writeText(l.phone).then(()=>showToast('📋 Copied '+l.phone)).catch(()=>{})};

  // Dedupe defensively by phone/name so the same business can never render twice,
  // then drop any the user has skipped.
  const leads=res?(()=>{const seen=new Set();return (res.leads||[]).filter(l=>{const k=keyOf(l);if(seen.has(k))return false;seen.add(k);return !hidden.has(k);});})():[];
  const scoreBg=s=>s>=80?'bg-brand':s>=60?'bg-amber-500':'bg-gray-400';
  const marketBg=s=>s>=75?'bg-emerald-600':s>=60?'bg-brand':s>=45?'bg-amber-500':'bg-gray-500';

  const ownerEl=l=>{
    if(!l.ownerName)return null;
    const low=l.ownerConfidence==='low';
    return <div className={"text-sm mt-1 "+(low?'text-muted-stone':'text-brand-dark')}>👤 {l.ownerConfidence==='high'?'🟢 ':low?'🟡 ':''}{low?'Possible owner: ':'Likely owner: '}<b className={low?'text-deep-obsidian/60':'text-brand'}>{l.ownerName}</b>{l.ownerSource?<span className="text-muted-stone font-normal text-xs"> ({l.ownerSource})</span>:null}</div>;
  };
  const lineEl=l=>{
    if(!l.lineType||l.lineType==='unknown')return null;
    if(l.lineType==='mobile')return <span className="text-[11px] font-semibold px-2 py-0.5 rounded bg-green-100 text-green-700">📱 Mobile{l.carrierName?' · '+l.carrierName:''}</span>;
    if(l.lineType==='voip')return <span className="text-[11px] font-semibold px-2 py-0.5 rounded bg-blue-100 text-blue-700">🔀 VoIP · may ring owner</span>;
    return <span className="text-[11px] font-semibold px-2 py-0.5 rounded bg-red-100 text-red-700">☎ Landline</span>;
  };

  return (
    <div className="fade-in font-manrope space-y-5">
      <div>
        <h2 className="text-2xl font-bold text-brand-dark">Lead Finder</h2>
        <p className="text-sm text-muted-stone mt-1">Pulls active home-service businesses, filters for the ones worth calling, ranks mobiles first, and sends them to Go High Level.</p>
      </div>

      <div className="flex flex-col sm:flex-row gap-2">
        <input value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')runSearch()}} placeholder="e.g. roofers in Prosper TX" className="flex-1 px-4 py-3 border border-glass-border rounded-xl text-sm bg-white focus:outline-none focus:ring-1 focus:ring-brand"/>
        <button onClick={()=>runSearch()} disabled={loading} className="touch-target px-6 py-3 bg-brand text-white rounded-xl text-sm font-semibold hover:bg-brand-hover disabled:opacity-50 shadow-lg shadow-brand/20">{loading?(deep?'Deep searching… (~20s)':'Finding…'):'Find leads'}</button>
      </div>

      <label className="flex items-center gap-2 cursor-pointer select-none w-fit">
        <button type="button" role="switch" aria-checked={mobileOnly} onClick={()=>setMobileOnly(v=>!v)} className={`relative inline-flex h-6 w-11 flex-shrink-0 rounded-full transition-colors ${mobileOnly?'bg-brand':'bg-gray-300'}`}>
          <span className={`inline-block h-5 w-5 transform rounded-full bg-white shadow transition-transform mt-0.5 ${mobileOnly?'translate-x-5':'translate-x-0.5'}`}/>
        </button>
        <span className="text-sm text-deep-obsidian/70">📱 Mobile numbers only <span className="text-muted-stone">(also hides VoIP; landlines always excluded)</span></span>
      </label>

      <label className="flex items-center gap-2 cursor-pointer select-none w-fit">
        <button type="button" role="switch" aria-checked={deep} onClick={()=>setDeep(v=>!v)} className={`relative inline-flex h-6 w-11 flex-shrink-0 rounded-full transition-colors ${deep?'bg-brand':'bg-gray-300'}`}>
          <span className={`inline-block h-5 w-5 transform rounded-full bg-white shadow transition-transform mt-0.5 ${deep?'translate-x-5':'translate-x-0.5'}`}/>
        </button>
        <span className="text-sm text-deep-obsidian/70">🔎 Deep search <span className="text-muted-stone">(scans the whole area for way more leads — slower, uses more credit)</span></span>
      </label>

      <div className="flex flex-wrap gap-1.5">
        {TRADES.map(t=>(<button key={t} onClick={()=>setQuery(t+' in ')} className="text-xs px-3 py-1.5 rounded-full bg-brand-light text-brand font-medium hover:bg-brand hover:text-white transition-colors">{t}</button>))}
      </div>

      {error&&<div className="text-sm text-red-600 font-medium">{error}</div>}

      {res&&<div className="text-xs text-muted-stone">{res.deep?'🔎 Deep search · ':''}{res.fromCache?'💾 from cache (no Google credit used) · ':''}Scanned {res.scanned} · {leads.length} shown{res.landlineHidden>0?(' · '+res.landlineHidden+' landline-only dropped'):''}{res.nonMobileHidden>0?(' · '+res.nonMobileHidden+' non-mobile (VoIP) dropped'):''}{res.farHidden>0?(' · '+res.farHidden+' too-far dropped'):''}{(res.phoneCached>0||res.phoneFresh>0)?(' · 📞 '+(res.phoneFresh||0)+' new lookups, '+(res.phoneCached||0)+' cached (free)'):''}{res.partial?' · partial (hit the time limit — run again for the rest)':''}</div>}

      {res&&res.market&&<div className={"rounded-[20px] p-4 text-white flex items-center gap-4 "+marketBg(res.market.score)}>
        <div className="text-3xl font-bold leading-none">{res.market.score}</div>
        <div><div className="font-bold">{res.market.label}{/market$/i.test(res.market.label)?'':' market'}</div><div className="text-sm opacity-90">{res.market.reason}</div></div>
      </div>}

      <div className="space-y-3">
        {leads.map(l=>{
          const k=keyOf(l);
          return (
          <div key={k} className="stitch-glass-card stitch-hover-lift rounded-[20px] p-4">
            <div className="flex justify-between gap-3">
              <div className="min-w-0">
                <div className="font-bold text-brand-dark text-lg truncate">{l.name}</div>
                <div className="text-xs text-muted-stone">{l.address}</div>
                {ownerEl(l)}
              </div>
              <div className={"flex-shrink-0 text-center text-white rounded-xl px-3 py-1.5 "+scoreBg(l.score)}>
                <div className="text-xl font-bold leading-none">{l.score}</div>
                <div className="text-[9px] uppercase tracking-wide opacity-90">{l.score>=80?'Hot':l.score>=60?'Warm':'Mild'}</div>
              </div>
            </div>
            <div className="flex gap-4 flex-wrap my-3 text-sm">
              <div><b>{(l.rating||0).toFixed(1)}★</b> <span className="text-muted-stone text-xs">Rating</span></div>
              <div><b>{l.reviews}</b> <span className="text-muted-stone text-xs">Reviews</span></div>
              <div><b>{l.maturity}</b> <span className="text-muted-stone text-xs">Maturity</span></div>
            </div>
            <div className="flex flex-wrap gap-1.5 mb-3">
              {lineEl(l)}
              {(l.scoreReasons||[]).slice(0,3).map((r,i)=>(<span key={i} className="text-[11px] px-2 py-0.5 rounded-full bg-black/5 text-deep-obsidian/60 font-medium">{r}</span>))}
            </div>
            <div className="flex flex-wrap gap-2 items-center">
              <button onClick={()=>copyPhone(l)} className="touch-target px-4 py-2 bg-brand text-white rounded-xl text-sm font-semibold hover:bg-brand-hover shadow-lg shadow-brand/20">📋 {l.phone||'No phone'}</button>
              <button onClick={()=>sendToGHL(l)} disabled={sending[k]} className="touch-target px-4 py-2 bg-emerald-600 text-white rounded-xl text-sm font-semibold hover:bg-emerald-700 disabled:opacity-50">{sending[k]?'Sending…':'→ Send to GHL'}</button>
              {l.mapsUrl&&<a href={l.mapsUrl} target="_blank" rel="noopener" className="px-3 py-2 border border-glass-border rounded-xl text-sm text-deep-obsidian/70 hover:bg-black/5">Google</a>}
              {l.website&&<a href={l.website} target="_blank" rel="noopener" className="px-3 py-2 border border-glass-border rounded-xl text-sm text-deep-obsidian/70 hover:bg-black/5">Website</a>}
              <button onClick={()=>hide(l)} className="ml-auto px-3 py-2 text-sm text-muted-stone hover:text-red-600">✕ Skip</button>
            </div>
          </div>);
        })}
      </div>

      {res&&!leads.length&&!loading&&<div className="text-center text-muted-stone py-10 text-sm">No leads to show for this search.</div>}

      {toast&&<div className={"fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-3 rounded-xl text-white text-sm font-semibold shadow-lg z-50 "+(toast.err?'bg-red-600':'bg-brand-dark')}>{toast.msg}</div>}
    </div>
  );
}

function CallCoach({data,setData}){
  // Cache the call list so the tab opens instantly with known calls, then we
  // refresh new ones in the background (the GHL scan takes a while).
  const [calls,setCalls]=useState(()=>{try{return JSON.parse(localStorage.getItem('kf_callcoach_list')||'[]')}catch(e){return []}});
  const [loading,setLoading]=useState(true);
  const [refreshing,setRefreshing]=useState(false);
  const [error,setError]=useState('');
  const [busy,setBusy]=useState({});
  // Persist analyses so reopening the tab keeps them — no re-analyzing (or re-paying).
  const [results,setResults]=useState(()=>{try{return JSON.parse(localStorage.getItem('kf_callcoach_results')||'{}')}catch(e){return {}}});
  const persistResults=(map)=>{try{localStorage.setItem('kf_callcoach_results',JSON.stringify(Object.fromEntries(Object.entries(map).filter(([k,v])=>v&&!v.error))))}catch(e){}};
  const [openTx,setOpenTx]=useState({});
  const [copiedTx,setCopiedTx]=useState({});
  const copyTx=(id,text)=>{navigator.clipboard.writeText(text||'').then(()=>{setCopiedTx(c=>({...c,[id]:true}));setTimeout(()=>setCopiedTx(c=>{const n={...c};delete n[id];return n}),2000)}).catch(()=>{})};
  // Dismissed calls — hidden from the list and kept hidden across refreshes/reopens.
  const [hidden,setHidden]=useState(()=>{try{return new Set(JSON.parse(localStorage.getItem('kf_callcoach_hidden')||'[]'))}catch(e){return new Set()}});
  const dismiss=(id)=>{setHidden(prev=>{const n=new Set(prev);n.add(id);try{localStorage.setItem('kf_callcoach_hidden',JSON.stringify([...n]))}catch(e){}return n;});};
  const restoreAll=()=>{setHidden(()=>{try{localStorage.removeItem('kf_callcoach_hidden')}catch(e){}return new Set();});};

  const refresh=async(cached)=>{
    const hasCache=(cached||[]).length>0;
    setLoading(!hasCache); setRefreshing(hasCache); setError('');
    // Pulling from GHL can be slow on a busy day; auto-retry a few times before
    // ever showing an error, so a one-off slow load never leaves an empty screen.
    const tries=hasCache?1:3;
    for(let attempt=1;attempt<=tries;attempt++){
      try{
        const r=await fetch('/api/call-coach',{headers:await authHeaders()});
        const d=await r.json();
        if(!r.ok||d.error){ if(attempt>=tries&&!hasCache) setError(d.error||'Could not load calls'); }
        else{
          const map=new Map();
          for(const c of (cached||[])) map.set(c.messageId,c);
          for(const c of (d.calls||[])) map.set(c.messageId,c); // fresh wins
          const merged=[...map.values()].sort((a,b)=>(new Date(a.date)<new Date(b.date)?1:-1)).slice(0,80);
          setCalls(merged);
          try{localStorage.setItem('kf_callcoach_list',JSON.stringify(merged))}catch(e){}
          break;
        }
      }catch(e){ if(attempt>=tries&&!hasCache) setError('Couldn’t reach the call server — tap Refresh to try again.'); }
      if(attempt<tries) await new Promise(res=>setTimeout(res,1500));
    }
    setLoading(false); setRefreshing(false);
  };
  useEffect(()=>{refresh(calls)},[]);

  const fmtDur=s=>{if(s==null)return 'length unknown';const m=Math.floor(s/60);const x=s%60;return m+'m '+(x<10?'0':'')+x+'s';};
  const fmtDate=d=>{if(!d)return '';try{const dt=new Date(d);return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+dt.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}catch(e){return ''}};

  async function analyze(c){
    const id=c.messageId;
    setBusy(b=>({...b,[id]:true}));
    const finish=(val)=>setResults(p=>{const nr={...p,[id]:val};persistResults(nr);return nr;});
    try{
      // Kick off the analysis (runs in a background job server-side, so a long
      // recording can never hit the request time limit), then poll for the result.
      const r=await fetch('/api/call-coach',{method:'POST',headers:await authHeaders({'content-type':'application/json'}),body:JSON.stringify({messageId:id})});
      const d=await r.json();
      if(!r.ok||(d.error&&!d.started)){finish({error:d.error||'Could not start analysis'});setBusy(b=>({...b,[id]:false}));return;}
      if(d.status==='done'&&d.result){finish(d.result);setBusy(b=>({...b,[id]:false}));return;}
      // Poll up to ~5 min (long recordings take a while, but this never blocks a request).
      const deadline=Date.now()+300000; let settled=false;
      while(Date.now()<deadline){
        await new Promise(res=>setTimeout(res,3000));
        let pr; try{const rr=await fetch('/api/call-coach?result='+encodeURIComponent(id)+'&t='+Date.now(),{headers:await authHeaders(),cache:'no-store'});pr=await rr.json();}catch(e){continue;}
        if(pr.status==='done'){finish(pr.result);settled=true;break;}
        if(pr.status==='error'){finish({error:pr.error||'Analysis failed'});settled=true;break;}
        // 'pending' / 'none' → keep waiting
      }
      if(!settled)finish({error:'Still working on this one — long calls can take a few minutes. Tap Try again to check on it.'});
    }catch(e){finish({error:'Network error analyzing call'});}
    setBusy(b=>({...b,[id]:false}));
  }

  const Bullets=({items})=>items&&items.length?<ul className="list-disc ml-5 space-y-1 text-sm text-deep-obsidian/70">{items.map((x,i)=><li key={i}>{x}</li>)}</ul>:null;

  return (
    <div className="fade-in font-manrope space-y-5">
      <div className="flex items-start justify-between gap-3">
        <div>
          <h2 className="text-2xl font-bold text-brand-dark">Call Coach</h2>
          <p className="text-sm text-muted-stone mt-1">Your real (60s+) cold calls from GHL, transcribed and AI-coached.</p>
        </div>
        <div className="flex items-center gap-3 mt-1">
          {refreshing&&<span className="text-xs text-muted-stone whitespace-nowrap">↻ checking for new calls…</span>}
          {hidden.size>0&&<button onClick={restoreAll} className="text-xs text-brand underline whitespace-nowrap">Restore {hidden.size} dismissed</button>}
          <button onClick={()=>refresh(calls)} disabled={loading||refreshing} className="touch-target px-3 py-2 stitch-glass-card rounded-xl text-sm text-deep-obsidian/70 hover:bg-black/5 disabled:opacity-50 whitespace-nowrap">{(loading||refreshing)?'…':'↻ Refresh'}</button>
        </div>
      </div>
      {loading&&<div className="text-muted-stone text-sm">Pulling your recent calls… (first load takes ~20–30s)</div>}
      {error&&<div className="text-sm text-red-600 font-medium bg-red-50 rounded-xl p-3">{error}</div>}
      {!loading&&!error&&!calls.filter(c=>!hidden.has(c.messageId)).length&&<div className="text-muted-stone text-sm">No calls to show{hidden.size>0?' — all dismissed. ':' '}{hidden.size>0?<button onClick={restoreAll} className="text-brand underline">Restore them</button>:'(no real 60s+ calls found in your recent GHL conversations).'}</div>}

      <div className="space-y-3">
        {calls.filter(c=>!hidden.has(c.messageId)).map(c=>{
          const id=c.messageId; const res=results[id]; const a=res&&res.analysis;
          return (
          <div key={id} className="stitch-glass-card rounded-[20px] p-4">
            <div className="flex justify-between gap-3 items-start flex-wrap">
              <div>
                <div className="font-bold text-brand-dark">{c.contact}</div>
                <div className="text-xs text-muted-stone">{fmtDate(c.date)} · {c.estimated?'~':''}{fmtDur(c.durationSec)}{c.direction?(' · '+c.direction):''}</div>
              </div>
              <div className="flex items-center gap-2 flex-shrink-0">
                {(!res||res.error)&&<button onClick={()=>analyze(c)} disabled={busy[id]} className="touch-target px-4 py-2 bg-brand text-white rounded-xl text-sm font-semibold hover:bg-brand-hover disabled:opacity-50 shadow-lg shadow-brand/20">{busy[id]?'Analyzing…':(res&&res.error?'🎧 Try again':'🎧 Analyze call')}</button>}
                {a&&a.score!=null&&<div className="flex-shrink-0 text-center text-white rounded-xl px-3 py-1.5 bg-brand"><div className="text-xl font-bold leading-none">{a.score}<span className="text-xs">/10</span></div><div className="text-[9px] uppercase tracking-wide opacity-90">Score</div></div>}
                <button onClick={()=>dismiss(id)} disabled={busy[id]} title="Remove this call from the list" aria-label="Remove this call from the list" className="touch-target w-9 h-9 flex items-center justify-center rounded-xl bg-black/5 hover:bg-red-100 text-muted-stone hover:text-red-600 disabled:opacity-50">✕</button>
              </div>
            </div>

            {res&&res.error&&<div className="text-sm text-red-600 mt-3 bg-red-50 rounded-xl p-2">{res.error}</div>}

            {res&&res.notConversation&&<div className="mt-3 text-sm text-amber-800 bg-amber-50 border border-amber-200 rounded-xl p-3">📭 Not a real conversation — looks like a <b>{res.callType||'voicemail / no-answer'}</b>.{res.summary?(' '+res.summary):''}{res.transcript?<div className="mt-2"><div className="flex items-center gap-3"><button onClick={()=>setOpenTx(o=>({...o,[id]:!o[id]}))} className="text-xs text-brand underline">{openTx[id]?'Hide transcript':'Show transcript'}</button><button onClick={()=>copyTx(id,res.transcript)} className="text-xs text-brand underline">{copiedTx[id]?'✓ Copied':'Copy transcript'}</button></div>{openTx[id]&&<pre className="mt-2 text-xs text-deep-obsidian/70 whitespace-pre-wrap bg-white/60 rounded-xl p-3 max-h-72 overflow-auto">{res.transcript}</pre>}</div>:null}</div>}

            {a&&<div className="mt-4 space-y-3">
              {a.summary&&<div className="text-sm text-brand-dark">{a.summary}</div>}
              {a.wentWell&&a.wentWell.length>0&&<div><div className="text-xs font-semibold text-green-700 uppercase tracking-wide mb-1">✅ What went well</div><Bullets items={a.wentWell}/></div>}
              {a.mistakes&&a.mistakes.length>0&&<div><div className="text-xs font-semibold text-red-700 uppercase tracking-wide mb-1">⚠️ Mistakes</div><Bullets items={a.mistakes}/></div>}
              {a.missedOpportunities&&a.missedOpportunities.length>0&&<div><div className="text-xs font-semibold text-amber-700 uppercase tracking-wide mb-1">🔎 Missed opportunities</div><Bullets items={a.missedOpportunities}/></div>}
              {a.nextTime&&a.nextTime.length>0&&<div><div className="text-xs font-semibold text-brand uppercase tracking-wide mb-1">🎯 Do this next time</div><Bullets items={a.nextTime}/></div>}
              {res.transcript&&<div><div className="flex items-center gap-3"><button onClick={()=>setOpenTx(o=>({...o,[id]:!o[id]}))} className="text-xs text-brand underline">{openTx[id]?'Hide transcript':'Show transcript'}</button><button onClick={()=>copyTx(id,res.transcript)} className="text-xs text-brand underline">{copiedTx[id]?'✓ Copied':'Copy transcript'}</button></div>{openTx[id]&&<pre className="mt-2 text-xs text-deep-obsidian/70 whitespace-pre-wrap bg-white/60 rounded-xl p-3 max-h-72 overflow-auto">{res.transcript}</pre>}</div>}
            </div>}
          </div>);
        })}
      </div>
    </div>
  );
}

function App(){
  // Public onboarding form - no login needed
  const isOnboardForm=window.location.search.includes('onboard=true');
  if(isOnboardForm)return <ClientOnboardForm/>;

  const [authUser,setAuthUser]=useState(undefined);
  const [authReady,setAuthReady]=useState(false);

  useEffect(()=>{
    const unsub=firebase.auth().onAuthStateChanged(user=>{
      setAuthUser(user);
      setAuthReady(true);
    });
    return ()=>unsub();
  },[]);

  if(!authReady){
    return(
      <div className="min-h-screen bg-warm-sand font-manrope flex items-center justify-center">
        <div className="text-center">
          <div className="inline-block w-10 h-10 border-4 border-brand border-t-transparent rounded-full animate-spin mb-3"/>
          <p className="text-sm text-muted-stone">Loading...</p>
        </div>
      </div>
    );
  }

  if(!authUser) return <LoginScreen/>;

  return <AuthenticatedApp/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
